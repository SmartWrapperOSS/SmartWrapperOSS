  label: Amazon Q3 2026 Earnings Release, October 29, 2026
  text: "AMAZON.COM ANNOUNCES THIRD QUARTER RESULTS\nOperating income was $28.1 billion\
    \ and operating margin was 13.9%—Amazon’s highest operating margin ever\nAWS net\
    \ sales increased 39.3%—its fastest growth in nearly five years—to a $184 billion\
    \ annualized revenue run rate\nSEATTLE—(BUSINESS WIRE) October 29, 2026—Amazon.com,\
    \ Inc. (NASDAQ: AMZN) today announced financial\nresults for its third quarter\
    \ ended September 30, 2026.\n•\n\n•\n\nNet sales increased 12% to $201.9 billion\
    \ in the third quarter, compared with $180.2 billion in third quarter 2025.\n\
    Excluding the $0.9 billion unfavorable impact from year-over-year changes in foreign\
    \ exchange rates throughout the\nquarter, net sales increased 13% compared with\
    \ third quarter 2025. As a reminder, Prime Day timing shifted this year,\nwith\
    \ the event occurring in Q2 for most large countries. In 2025, Prime Day occurred\
    \ entirely in Q3. Excluding this\nshift, third quarter year-over-year growth would\
    \ have been approximately 400 basis points higher.\n•\n\nNorth America segment\
    \ sales increased 6% year-over-year to $112.9 billion.\n\n•\n\nInternational segment\
    \ sales increased 5% year-over-year to $43.1 billion, or increased 8% excluding\
    \ changes\nin foreign exchange rates.\n\n•\n\nAWS segment sales increased 39%\
    \ year-over-year to $46.0 billion.\n\nOperating income increased to $28.1 billion\
    \ in the third quarter, compared with $17.4 billion in third quarter 2025.\n•\n\
    \nNorth America segment operating income was $8.7 billion, compared with $4.8\
    \ billion in third quarter 2025.\n\n•\n\nInternational segment operating income\
    \ was $1.6 billion, compared with $1.2 billion in third quarter 2025.\n\n•\n\n\
    AWS segment operating income was $17.8 billion, compared with $11.4 billion in\
    \ third quarter 2025.\n\n•\n\nNet income decreased to $20.7 billion in the third\
    \ quarter, or $1.89 per diluted share, compared with $21.2 billion, or\n$1.95\
    \ per diluted share, in third quarter 2025. This decrease is driven primarily\
    \ by pre-tax gains of $9.5 billion in third\nquarter 2025 included in non-operating\
    \ income (expense) from our investments in Anthropic.\n\n•\n\nOperating cash flow\
    \ increased 29% to $168.3 billion for the trailing twelve months, compared with\
    \ $130.7 billion for\nthe trailing twelve months ended September 30, 2025.\n\n\
    •\n\nFree cash flow decreased to an outflow of $42.4 billion for the trailing\
    \ twelve months, driven primarily by a yearover-year increase of $94.8 billion\
    \ in purchases of property and equipment, net of proceeds from sales and incentives.\n\
    This increase primarily reflects investments in artificial intelligence. This\
    \ compares to free cash flow inflow of $14.8\nbillion for the trailing twelve\
    \ months ended September 30, 2025.\n\n“Our AWS investment in functionality and\
    \ infrastructure is working, with over 39% year-over-year revenue growth in Q3\n\
    ($184 billion revenue run rate) and projected revenue growth rates of over 40%\
    \ both in 2027 and in 2028,” said Andy Jassy,\nPresident and CEO, Amazon. “Our\
    \ broader selection and speedier delivery are helping us capture more retail market\
    \ segment\nshare with improving margins, and our newer businesses, ranging from\
    \ Grocery to Pharmacy to Amazon Leo to Zoox are\nprogressing encouragingly. There\
    \ has never been a trillion dollar revenue business, and we may have two of them\
    \ in the next\n5-10 years.”\n\n\fSome other highlights since the company’s last\
    \ earnings announcement include that Amazon:\n•\n\nSigned new AWS agreements with\
    \ Meta, NVIDIA, OpenAI, Salesforce, Oracle, Qualcomm, Verizon, ADP, Stripe,\n\
    Accenture Edge, Novo, Fanatics, Zoom, Raymond James, Prometheus AI, AppFolio,\
    \ Instructure, Cognition, Sigma,\nLila Sciences, The Biological Computing Co.,\
    \ NATO, Columbia University Irving Medical Center, and more.\n\n•\n\nDrove continued\
    \ rapid growth for Amazon Bedrock, AWS’s inference service, with Fortune 500 companies\
    \ spending\nnearly 7x more year-over-year and total Bedrock token volume growing\
    \ nearly 17x year-over-year.\n\n•\n\nExpanded Bedrock’s leading selection of frontier\
    \ and open weight models, adding OpenAI’s GPT-6 Astra, GPT-6 Sol,\nGPT-6 Luna,\
    \ and GPT-6.1 Sol; Anthropic’s Claude Fable 5.1, Opus 5.5, Sonnet 5.5, and Haiku\
    \ 5.5; Moonshot AI’s\nKimi K3; SpaceXAI’s Grok 4.7; Z.ai’s GLM 5.3; and two purpose-built\
    \ cybersecurity models from OpenAI.\n\n•\n\nLaunched built-in web search for OpenAI\
    \ models on Bedrock so customers can ground responses in current\ninformation—while\
    \ keeping data secure and answers accurate for time-sensitive questions without\
    \ building and\nmaintaining their own web-retrieval pipelines.\n\n•\n\nLaunched\
    \ public preview of Bedrock Managed Agents, which is a managed service powered\
    \ by OpenAI that makes it\nfaster for enterprises to build and deploy production-ready\
    \ AI agents.\n\n•\n\nAdded to AWS’s leadership position in open source agent-building:\n\
    •\n\nReleased Strands harness, a fully assembled, state-of-the-art agent harness\
    \ that developers can get working\nwith a single line of code and build custom\
    \ agents that can run locally, on Bedrock AgentCore, or on a\nprovider of their\
    \ choice. Strands harness lowers the cost of agent tasks by 32% through greater\
    \ token\nefficiency than other harnesses when using the same frontier models,\
    \ while achieving equal or better\naccuracy.\n\n•\n\nPreviewed Strands Box, an\
    \ open source sandbox that gives developers the ability to define rules for agent\n\
    behavior and access, helping to prevent autonomous agents from causing unintended\
    \ harm. Strands Box is\ndesigned to enforce rules, no matter where your agent\
    \ runs, whether that’s on your desktop, in agents built\nusing AgentCore on AWS,\
    \ or elsewhere.\n\n•\n\nDrove continued rapid adoption of Amazon Bedrock AgentCore,\
    \ AWS’s fully managed service for building,\nconnecting, and optimizing agents\
    \ securely at scale using any model and open source framework, including Strands.\n\
    AgentCore is built for developers and enterprises that need the robust infrastructure,\
    \ controls, and tools necessary to\nrun agents at production scale. Tens of thousands\
    \ of customers currently use AgentCore, and they deployed 2x more\nagents in Q3\
    \ than the prior three quarters combined.\n\n•\n\nRecently topped a $1 billion\
    \ annualized revenue run rate for Lambda, AWS’s flagship serverless offering,\
    \ which is\nused by enterprises like Samsung, Volkswagen, United Airlines, Mercedes-Benz,\
    \ and Booking.com.\n\n•\n\nLaunched Lambda Web Functions to allow developers to\
    \ run scalable, responsive web applications that serve global\naudiences on Lambda.\
    \ Web Functions gives developers the flexibility to use a variety of popular web\
    \ frameworks and\niterate quickly, while Lambda handles scaling, multi-region\
    \ distribution, and active CPU billing.\n\n•\n\nMade AWS Continuum—an AI-powered\
    \ security service that automatically discovers, prioritizes, validates, and\n\
    remediates software vulnerabilities at machine speed—generally available. Also\
    \ announced that it’s bringing\nContinuum into Anthropic’s Claude Code, OpenAI’s\
    \ Codex, and AWS’s Kiro. Continuum is already being used by\ncompanies like Capital\
    \ One, IBM, Infor, Luminate, and Robinhood.\n\n•\n\nExpanded Amazon Quick, an\
    \ intelligent AI work companion, into Outlook, Word, PowerPoint, and Excel. It\
    \ can also\nnow keep running when your laptop is closed. Companies like Principal\
    \ Financial Group, GoDaddy, Autodesk, BMW,\nMondelēz, 3M, Southwest Airlines,\
    \ EchoStar, and DXC are choosing Quick because it’s built for work, connects to\n\
    their company data, and keeps that data secure.\n\n•\n\nOpen-sourced Kiro Crew,\
    \ a persistent workspace that remembers a developer’s context, learns how they\
    \ work, and\ncoordinates multiple agents to work in parallel and run scheduled\
    \ and long-running tasks unattended.\n\n•\n\nAcquired DuckLabs, the company behind\
    \ the open source data analysis tool DuckDB. With DuckDB, AWS customers\nwill\
    \ be able to write their SQL analytics query once and then execute using any AWS\
    \ analytics service, so for the first\ntime in analytics, customers will have\
    \ zero migration or portability costs between query engines.\n\n•\n\nMade it even\
    \ easier to adopt its custom AI accelerator, Trainium, with TorchNeuron. TorchNeuron\
    \ lets developers run\nexisting PyTorch code (which most already use) on Trainium\
    \ without rewriting a thing.\n\n•\n\nIncreased selection from notable brands like\
    \ Banana Republic, Jean Paul Gaultier fragrances, Carolina Herrera\nfragrances,\
    \ La-Z-Boy, The Farmer’s Dog, and FAO Schwarz by more than 20% year-over-year.\n\
    \n\f•\n\nAnnounced that Amazon helped U.S. customers save billions—averaging over\
    \ $1,000 per customer each year for 100\nmillion+ customers—through everyday low\
    \ prices, deals, free delivery, fuel savings, and prescription savings.\n\n•\n\
    \nDelivered its fastest Q3 speeds ever for Prime members, with more than 1.5 billion\
    \ items arriving same-day or\novernight in the quarter.\n\n•\n\nContinued expanding\
    \ its ultra-fast delivery service, Amazon Now, which is now available in over\
    \ 450 towns and cities\naround the world. The number of items ordered through\
    \ Amazon Now is up 10x year-over-year.\n\n•\n\nContinued growing its global Grocery\
    \ business, with fresh groceries and everyday essentials growing about 3x faster\n\
    than the rest of the store and representing about half of all units sold in Q3.\n\
    \n•\n\nMade it even easier for independent sellers to grow their businesses with\
    \ new tools like Seller Assistant workflows\n(handles routine tasks like restocking\
    \ and pricing around the clock), a plugin that integrates Seller Assistant into\n\
    Amazon Quick and Anthropic’s Claude, and the ability to manage listings, orders,\
    \ and profitability across multiple\nchannels directly from Seller Central.\n\n\
    •\n\nContinued to drive rapid adoption of Alexa for Shopping, its agentic shopping\
    \ assistant, which was used by 400\nmillion+ customers in the last 12 months,\
    \ with customer interactions up 570% year-over-year.\n\n•\n\nAdded 100+ new capabilities\
    \ to Alexa for Shopping so tasks that used to require multiple clicks—like building\
    \ gift\nlists, adjusting Subscribe & Save deliveries, managing payments and memberships,\
    \ and adding new delivery addresses\n—can now be completed with simple conversations.\n\
    \n•\n\nMade Amazon Pharmacy even faster with 3-hour prescription delivery now\
    \ available in more than 350 cities. The\nnumber of customers using Amazon Pharmacy\
    \ is up over 60% year-over-year, and repeat customers are up more than\n50% year-over-year.\n\
    \n•\n\nIntroduced Amazon Ads Agent for advertisers, bringing together Amazon’s\
    \ full offering under a single, AI-first\nplatform. Backed by trillions of shopping,\
    \ browsing, and streaming signals, Amazon Ads Agent supports advertisers at\n\
    every step with insights, answers, and the ability to take action on their behalf.\n\
    \n•\n\nLaunched Full-Funnel Campaigns in Amazon Ads Agent for all U.S. advertisers,\
    \ bringing sponsored ads, display,\nvideo, and streaming TV into a single campaign.\
    \ Advertisers provide initial inputs, then Amazon’s AI plans, executes,\nand continuously\
    \ optimizes the rest.\n\n•\n\nKicked off the fifth season of Thursday Night Football\
    \ on Prime Video, averaging 17.7 million viewers through six\ngames according\
    \ to Nielsen, its best start ever and a 16% increase over last year’s full-season\
    \ average.\n\n•\n\nDebuted the second season of NBA on Prime in more than 200\
    \ countries, attracting more than two million viewers in\nthe U.S. during its\
    \ season-opening doubleheader, more than doubling last year’s full-season average,\
    \ according to\nNielsen.\n\n•\n\nDrew 66 million viewers globally for Season Four\
    \ of Reacher on Prime Video in its first 28 days.\n\n•\n\nExceeded $1.2 billion\
    \ in global box office so far in 2026 for Amazon MGM Studios, as audiences flocked\
    \ to movies\nlike Project Hail Mary and Verity.\n\n•\n\nDrove strong early demand\
    \ for the launch of its most powerful devices lineup yet, with 34 new products\
    \ across Echo,\nKindle, Amazon Alexa Tablets, Fire TV, Ring, Blink, and Bee.\n\
    \n•\n\nExpanded Alexa+ to Australia, India, and Japan, and made Alexa+ available\
    \ for free to U.S. customers with\ncompatible Fire TV devices.\n\n•\n\nRemains\
    \ on track to begin initial service of its Amazon Leo low Earth orbit satellite\
    \ service later this year, and signed\na strategic agreement with AT&T, which\
    \ will be the first major U.S. telecom provider to offer Leo connectivity to\n\
    enterprise and public-sector customers.\n\n•\n\nBegan offering paid rides to customers\
    \ in Zoox autonomous robotaxis in Las Vegas and started testing in San Diego\n\
    and Houston. Zoox is now operating in 12 U.S. cities.\n\n•\n\nIntroduced Built\
    \ Together, a new $1 billion community investment in U.S. data center communities\
    \ to provide\nincreased support for priorities communities value most, including\
    \ free community college and trades training, energy\nand water efficiency upgrades\
    \ for schools, community buildings and homes, and flexible annual funding for\
    \ local\npriorities like roads, fire equipment, affordable housing, and food security.\n\
    \n•\n\nUsed its logistics network to donate and deliver 450,000+ emergency supplies\
    \ to recovery efforts from flash floods in\nNepal, wildfires in Washington, and\
    \ a magnitude 7.4 earthquake in Colombia through its Disaster Relief Program.\n\
    \n\f•\n\nAnnounced plans to hire more than 300,000 seasonal, part-time, and full-time\
    \ employees across its U.S. operations this\nholiday season.\n\n•\n\nAnnounced\
    \ $1.5 billion+ investment to raise minimum starting pay for U.S. full-time operations\
    \ employees to $20 an\nhour, and added a new grocery discount and lifetime banking\
    \ benefit for its teammates.\n\nFinancial Guidance\nThe following forward-looking\
    \ statements reflect Amazon.com’s expectations as of October 29, 2026, and are\
    \ subject to\nsubstantial uncertainty. Our results are inherently unpredictable\
    \ and may be materially affected by many factors, such as\nfluctuations in foreign\
    \ exchange rates and energy prices, changes in global economic and geopolitical\
    \ conditions, tariff and\ntrade policies, resource and supply volatility, including\
    \ for memory chips, and customer demand and spending (including the\nimpact of\
    \ recessionary fears), inflation, interest rates, regional labor market constraints,\
    \ world events, the rate of growth of the\ninternet, online commerce, cloud services,\
    \ and new and emerging technologies, and the various factors detailed below.\n\
    Fourth Quarter 2026 Guidance\n•\n\nNet sales are expected to be between $240.0\
    \ billion and $247.0 billion, or to grow between 12% and 16% compared\nwith fourth\
    \ quarter 2025. This guidance anticipates an unfavorable impact of approximately\
    \ 60 basis points from\nforeign exchange rates. Advertising revenue grew 12% year-over-year\
    \ excluding changes in foreign exchange rates in\nthe third quarter 2026 impacted\
    \ by timing anomalies primarily related to Prime Day (and a couple other timing\n\
    factors). We expect year-over-year advertising revenue to grow in the high teens\
    \ in fourth quarter 2026.\n\n•\n\nOperating income is expected to be between $28.5\
    \ billion and $33.5 billion, compared with $25.0 billion in fourth\nquarter 2025.\n\
    \n•\n\nWe continue to expect 2026 cash capital expenditures to be approximately\
    \ $220 billion.\n\n•\n\nThis guidance assumes, among other things, no impact from\
    \ energy derivative contract remeasurements, and that no\nadditional business\
    \ acquisitions, restructurings, or legal settlements are concluded.\n\nConference\
    \ Call Information\nA conference call will be webcast live today at 2:00 p.m.\
    \ PT/5:00 p.m. ET, and will be available for at least three months at\namazon.com/ir.\
    \ This call will contain forward-looking statements and other material information\
    \ regarding the Company’s\nfinancial and operating results.\nForward-Looking Statements\n\
    These forward-looking statements are inherently difficult to predict. Actual results\
    \ and outcomes could differ materially for a\nvariety of reasons, including, in\
    \ addition to the factors discussed above, the amount that Amazon.com invests\
    \ in new business\nopportunities and the timing of those investments, the mix\
    \ of products and services sold to customers, the mix of net sales\nderived from\
    \ products as compared with services, the extent to which we owe income or other\
    \ taxes, competition, management\nof growth, potential fluctuations in operating\
    \ results, international growth and expansion, the outcomes of claims, litigation,\n\
    government investigations, and other proceedings, fulfillment, sortation, delivery,\
    \ and data center optimization, risks of\ninventory management, variability in\
    \ demand, the degree to which the Company enters into, maintains, and develops\n\
    commercial agreements, proposed and completed acquisitions and strategic transactions,\
    \ payments risks, and risks of\nfulfillment throughput and productivity. Other\
    \ risks and uncertainties include, among others, risks related to new products,\n\
    services, and technologies, security incidents, system interruptions, government\
    \ regulation and taxation, and fraud. In addition,\nglobal economic and geopolitical\
    \ conditions and additional or unforeseen circumstances, developments, or events\
    \ may give\nrise to or amplify many of these risks. More information about factors\
    \ that potentially could affect Amazon.com’s financial\nresults is included in\
    \ Amazon.com’s filings with the Securities and Exchange Commission (“SEC”), including\
    \ its most recent\nAnnual Report on Form 10-K and subsequent filings.\nAdditional\
    \ Information\nOur investor relations website is amazon.com/ir and we encourage\
    \ investors to use it as a way of easily finding information\nabout us. We promptly\
    \ make available on this website, free of charge, the reports that we file or\
    \ furnish with the SEC, corporate\ngovernance information (including our Code\
    \ of Business Conduct and Ethics), and select press releases, which may contain\n\
    material information about us, and you may subscribe to be notified of new information\
    \ posted to this site.\n\n\fAbout Amazon\nAmazon is guided by four principles:\
    \ customer obsession rather than competitor focus, passion for invention, commitment\
    \ to\noperational excellence, and long-term thinking. Amazon strives to be Earth’s\
    \ Most Customer-Centric Company, Earth’s Best\nEmployer, and Earth’s Safest Place\
    \ to Work. Customer reviews, 1-Click shopping, personalized recommendations, Prime,\n\
    Fulfillment by Amazon, AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire\
    \ tablets, Fire TV, Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios,\
    \ and The Climate Pledge are some of the things pioneered by Amazon. For more\n\
    information, visit amazon.com/about and follow @AmazonNews."
