  label: Amazon Q4 2020 Earnings Release, February 2, 2021
  text: "AMAZON.COM ANNOUNCES FINANCIAL RESULTS AND CEO TRANSITION\nFounder and CEO\
    \ Jeff Bezos will transition to role of Executive Chair in Q3,\nAndy Jassy to\
    \ become Chief Executive Officer of Amazon at that time\nSEATTLE—(BUSINESS WIRE)\
    \ February 2, 2021—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its fourth quarter ended December 31, 2020.\n•\n\nOperating cash flow increased\
    \ 72% to $66.1 billion for the trailing twelve months, compared with $38.5 billion\
    \ for\nthe trailing twelve months ended December 31, 2019.\n\n•\n\nFree cash flow\
    \ increased to $31.0 billion for the trailing twelve months, compared with $25.8\
    \ billion for the trailing\ntwelve months ended December 31, 2019.\n\n•\n\nFree\
    \ cash flow less principal repayments of finance leases and financing obligations\
    \ increased to $20.3 billion for\nthe trailing twelve months, compared with $16.2\
    \ billion for the trailing twelve months ended December 31, 2019.\n\n•\n\nFree\
    \ cash flow less equipment finance leases and principal repayments of all other\
    \ finance leases and financing\nobligations increased to $21.4 billion for the\
    \ trailing twelve months, compared with $12.5 billion for the trailing\ntwelve\
    \ months ended December 31, 2019.\n\n•\n\nCommon shares outstanding plus shares\
    \ underlying stock-based awards totaled 518 million on December 31,\n2020, compared\
    \ with 512 million one year ago.\n\nFourth Quarter 2020\n•\n\nNet sales increased\
    \ 44% to $125.6 billion in the fourth quarter, compared with $87.4 billion in\
    \ fourth quarter 2019.\nExcluding the $1.7 billion favorable impact from year-over-year\
    \ changes in foreign exchange rates throughout the\nquarter, net sales increased\
    \ 42% compared with fourth quarter 2019.\n\n•\n\nOperating income increased to\
    \ $6.9 billion in the fourth quarter, compared with operating income of $3.9 billion\
    \ in\nfourth quarter 2019.\n\n•\n\nNet income increased to $7.2 billion in the\
    \ fourth quarter, or $14.09 per diluted share, compared with net income of\n$3.3\
    \ billion, or $6.47 per diluted share, in fourth quarter 2019.\n\nFull Year 2020\n\
    •\n\nNet sales increased 38% to $386.1 billion, compared with $280.5 billion in\
    \ 2019. Excluding the $1.4 billion favorable\nimpact from year-over-year changes\
    \ in foreign exchange rates throughout the year, net sales increased 37% compared\n\
    with 2019.\n\n•\n\nOperating income increased to $22.9 billion, compared with\
    \ operating income of $14.5 billion in 2019.\n\n•\n\nNet income increased to $21.3\
    \ billion, or $41.83 per diluted share, compared with net income of $11.6 billion,\
    \ or\n$23.01 per diluted share, in 2019.\n\nAmazon is also announcing today that\
    \ Jeff Bezos will transition to the role of Executive Chair in the third quarter\
    \ of 2021 and\nAndy Jassy will become Chief Executive Officer at that time.\n\n\
    \f“Amazon is what it is because of invention. We do crazy things together and\
    \ then make them normal. We pioneered customer\nreviews, 1-Click, personalized\
    \ recommendations, Prime’s insanely-fast shipping, Just Walk Out shopping, the\
    \ Climate Pledge,\nKindle, Alexa, marketplace, infrastructure cloud computing,\
    \ Career Choice, and much more,” said Jeff Bezos, Amazon founder\nand CEO. “If\
    \ you do it right, a few years after a surprising invention, the new thing has\
    \ become normal. People yawn. That\nyawn is the greatest compliment an inventor\
    \ can receive. When you look at our financial results, what you’re actually seeing\
    \ are\nthe long-run cumulative results of invention. Right now I see Amazon at\
    \ its most inventive ever, making it an optimal time for\nthis transition.”\n\
    Highlights\nInvesting in Employee Safety and Providing Good Jobs\n•\n\nAmazon\
    \ is working to ensure that its front-line employees receive vaccines as soon\
    \ as possible. The company is\nclosely monitoring the availability of COVID-19\
    \ vaccines worldwide, advocating on behalf of its employees, and\nworking in partnership\
    \ with global medical experts, governments, and health providers to accelerate\
    \ vaccination\nprograms.\n\n•\n\nAmazon continues to ramp up its in-house COVID-19\
    \ testing program as part of its investments to keep front-line\nemployees safe.\
    \ More than 700 employees are now tested every hour, and Amazon’s dedicated COVID-19\
    \ labs have\nprocessed more than one million tests globally.\n\n•\n\nAmazon recognized\
    \ front-line employees by investing $2.5 billion in additional pay in 2020. This\
    \ is on top of the\ncompany’s industry-leading starting wage of at least $15 an\
    \ hour, which is double the federal minimum wage. All fulltime employees also\
    \ receive healthcare and full benefits from their first day on the job.\n\n•\n\
    \nAmazon received the Lee Anderson Veteran and Military Spouse Employment Award\
    \ for excellence in hiring, training,\nand retaining veterans, transitioning service\
    \ members, and military spouses. Amazon employs more than 40,000\nveterans and\
    \ military spouses across the U.S.\n\nSupporting Communities\n•\n\nAmazon announced\
    \ a new Housing Equity Fund, a $2 billion commitment to preserve and create over\
    \ 20,000\naffordable housing units in Washington State’s Puget Sound region; Arlington,\
    \ Virginia; and Nashville, Tennessee. The\nFund provides below-market loans and\
    \ grants to housing partners, public agencies, and minority-led organizations.\
    \ It\nstarted with initial investments totaling $567 million for 2,300 affordable\
    \ apartment homes.\n\n•\n\nAmazon announced plans to provide free cloud skills\
    \ training to 29 million people around the world by 2025, as it\ncontinues to\
    \ invest in upskilling and career development for its customers and employees.\
    \ The AWS-designed\nprograms range from self-paced online courses to intensive\
    \ upskilling programs that help participants build new\ncareers in the technology\
    \ industry. This expands on Amazon’s Upskilling 2025 initiative, a $700 million\
    \ commitment\nto upskill 100,000 U.S. employees by helping them transition into\
    \ high-demand, high-paying jobs, as well as Career\nChoice, a program that pre-pays\
    \ tuition for employees looking to earn degrees in in-demand fields.\n\n•\n\n\
    Amazon unveiled plans for the second phase of construction for its headquarters\
    \ in Arlington, Virginia. Amazon plans\nto build 2.8 million square feet of office\
    \ space as part of its commitment to create 25,000 jobs and invest $2.5 billion\n\
    in the community over the next decade. The project will create more than 2.5 acres\
    \ of open space for the local\ncommunity, run on renewable energy, and bring retail\
    \ and other services to local residents.\n\n•\n\nAmazon in the UK expanded its\
    \ long-standing partnership with nonprofit Magic Breakfast to reach more children\
    \ at\nrisk of hunger. In addition to being a significant financial donor, Amazon\
    \ distributed more than two million free,\nhealthy breakfasts to children studying\
    \ at home due to COVID-19 who would normally receive these meals at school.\n\n\
    •\n\nIn the UK, Amazon delivered more than six million COVID-19 testing kits free\
    \ of charge, in support of the\ngovernment’s COVID-19 testing program.\n\n\f•\n\
    \nGlobally, Amazon has donated over 65,000 Echo devices, Fire Tablets, and other\
    \ devices throughout the COVID-19\ncrisis to organizations that support frontline\
    \ workers and first responders, and to help keep patients, students, and\ncommunities\
    \ impacted by the pandemic connected.\n\n•\n\nIn support of World AIDS Day and\
    \ Giving Tuesday, Amazon announced the limited-edition (echo) RED. Available in\
    \ the\nall-new spherical design, (echo)RED offers premium sound and a built-in\
    \ smart home hub. Amazon will donate $10 of\nevery (echo)RED sale to support (RED)’s\
    \ fight against AIDS and COVID-19 in sub-Saharan Africa. Customers can also\n\
    donate to (RED)’s fight against the COVID-19 and HIV/AIDS pandemics on any Alexa-enabled\
    \ device by simply\nsaying, “Alexa, donate to RED.”\n\n•\n\nRing announced a new\
    \ program with Habitat for Humanity, a global nonprofit that shares Ring’s commitment\
    \ to help\nmake homes and neighborhoods safer, including a donation of $1 million\
    \ worth of Ring Video Doorbells to provide\nHabitat homeowners with added peace\
    \ of mind.\n\nProtecting the Planet\n•\n\nAmazon became the world’s largest corporate\
    \ purchaser of renewable energy, taking another step in its journey to be\nnet-zero\
    \ carbon by 2040. The company is investing in the building of 26 new utility-scale\
    \ wind and solar projects in\nAustralia, France, Germany, Italy, South Africa,\
    \ Sweden, the UK, and the U.S., bringing Amazon’s total number of\nrenewable energy\
    \ projects to 127. Amazon’s investments will supply its operations with more than\
    \ 18,000 gigawatt\nhours (GWh) of renewable energy annually, helping put the company\
    \ on a path to achieve 100% renewable energy by\n2025, five years ahead of the\
    \ initial 2030 target.\n\n•\n\nThirty-one organizations have signed The Climate\
    \ Pledge, a commitment co-founded by Amazon and Global\nOptimism to achieve net-zero\
    \ carbon by 2040. Twenty of those companies signed The Climate Pledge last quarter:\n\
    Atos, Boom Supersonic, Brooks, Cabify, Canary Wharf Group, Coca-Cola European\
    \ Partners, ERM, Groupe SEB\nFrance, Harbour Air, Henkel, ITV, JetBlue, Microsoft,\
    \ Neste, Rivian, Rubicon, Signify, Uber, Unilever, and Vaude.\n\n•\n\nAmazon joined\
    \ the Food Loss and Waste 2030 Champions group, an effort by the U.S. Environmental\
    \ Protection\nAgency and Department of Agriculture to reduce food loss and waste\
    \ within U.S. company operations by 50% by\n2030.\n\n•\n\nAmazon expanded Climate\
    \ Pledge Friendly, a program to help customers discover and shop for more sustainable\n\
    products, in five countries across Europe. The program launched with over 40,000\
    \ Climate Pledge Friendly products in\nFrance, Germany, Italy, Spain, and the\
    \ UK.\n\nEmpowering Small and Medium-Sized Businesses\n•\n\nThe 2020 holiday season\
    \ was the best ever for independent businesses selling on Amazon—nearly all of\
    \ which are\nsmall and medium-sized businesses—with worldwide sales growing over\
    \ 50% compared to the same period in 2019.\nSellers surpassed $4.8 billion in\
    \ worldwide sales from Black Friday through Cyber Monday, growing about 60% from\n\
    the previous year. During the holiday season as a whole, small and medium-sized\
    \ businesses in the U.S. sold nearly\none billion products in Amazon’s store.\n\
    \n•\n\nSince the start of the COVID-19 pandemic, Amazon has incurred more than\
    \ $5 billion in operational costs on behalf of\nindependent businesses selling\
    \ in Amazon’s store, and expects to invest billions more through 2021. In 2020,\
    \ Amazon\nincreased square footage across its fulfillment and logistics network\
    \ by 50%, dedicated 60% of fulfillment center\ncapacity to seller products, and\
    \ postponed annual selling fee adjustments until June 2021.\n\n•\n\nAs part of\
    \ the AWS Activate program, Amazon provided more than $1 billion in AWS credits\
    \ during 2020 to help early\nstage startups launch their businesses and accelerate\
    \ their growth. With this help, startups are using scalable, reliable,\nand secure\
    \ cloud services like compute, storage, database, analytics, Internet of Things,\
    \ machine learning, and many\nothers from AWS to scale their businesses.\n\n•\n\
    \nAmazon launched small business accelerator programs across Europe to help entrepreneurs\
    \ and small businesses\nsucceed in the digital world. These programs offer free\
    \ access to online training, expert advice, live events, and\nservices, and they\
    \ include the Amazon Small Business Accelerator in the UK, Quickstart-Online in\
    \ Germany, Despega\n\n\fin Spain, Accelera con Amazon in Italy, and Accelerateur\
    \ du Numerique in France. The programs are delivered in\ncollaboration with associations\
    \ and universities, and they have already supported tens of thousands of small\n\
    businesses.\n•\n\nIn December, Amazon India hosted Small Business Day, an event\
    \ to increase visibility and sales for entrepreneurs and\nsmall businesses selling\
    \ in Amazon’s store. Over 55,000 sellers from over 4,000 Postal Index Codes benefitted\
    \ from\nSmall Business Day, and over 1,500 sellers had their highest ever day\
    \ of sales on Amazon.\n\n•\n\nIn 2020, thousands of independent authors earned\
    \ more than $50,000 through Kindle Direct Publishing, with more\nthan 1,000 authors\
    \ surpassing $100,000 in royalties.\n\n•\n\nIn 2020, authors using Amazon’s self-publishing\
    \ service Kindle Direct Publishing (KDP) earned more than $370\nmillion in royalties\
    \ from their participation in Kindle Unlimited. KDP authors have earned more than\
    \ $1.5 billion from\nparticipation in Kindle Unlimited since 2014.\n\nShopping\
    \ and Entertainment\n•\n\nThanks to customers, employees, and selling partners,\
    \ Amazon had a record-breaking holiday season, delivering more\nthan a billion\
    \ toys, home, fashion, electronics, beauty, and personal care products to customers\
    \ worldwide.\n\n•\n\nAmazon Pharmacy launched in the U.S., bringing prescription\
    \ medications to customers’ doorsteps. Customers can\nnow browse medications,\
    \ create a secure pharmacy profile, and request or manage prescriptions on Amazon.com.\n\
    Prime members receive unlimited, free two-day delivery on Amazon Pharmacy orders\
    \ with their membership.\n\n•\n\nAmazon launched a new Amazon Prime prescription\
    \ savings benefit, which brings pharmacy savings to customers\nwho pay without\
    \ insurance and can be used at 50,000 participating pharmacies nationwide.\n\n\
    •\n\nAmazon Fashion introduced Made For You, a way for customers to design custom\
    \ T-shirts to their exact measurements\nand style preferences. For just $25, U.S.\
    \ shoppers can customize a T-shirt’s fit, fabric, color, sleeve length, shirt\
    \ length,\nneckline, and back-neck label.\n\n•\n\nAmazon India’s Great Indian\
    \ Festival shopping event focused on enabling the revival of small and medium-sized\n\
    businesses and helping customers, even in remote areas of the country, shop safely\
    \ and conveniently from their homes.\nDuring the month-long event, customers purchased\
    \ items from over 110,000 sellers, the majority of whom were from\nrural towns.\n\
    \n•\n\nHudson, a travel experience leader with over 1,000 stores across North\
    \ America, announced it will use Amazon’s Just\nWalk Out technology in select\
    \ travel convenience stores. Just Walk Out technology enables shoppers to enter\
    \ a store,\ngrab what they want, and just go. The first Hudson store with Just\
    \ Walk Out technology is planned to open in early\n2021 at Dallas Love Field Airport,\
    \ with additional stores coming later this year.\n\n•\n\nAmazon Fresh grocery\
    \ stores expanded into seven new communities in the U.S.: Irvine, CA; Ladera Heights,\
    \ CA;\nNaperville, IL; North Hollywood, CA; Northridge, CA; Schaumburg, IL; and\
    \ Whittier, CA. To support the continued\ngrowth, Amazon is hiring thousands of\
    \ grocery associates across Chicagoland, the greater Los Angeles area, and\nSeattle.\n\
    \n•\n\nAmazon was identified as the best overall grocery retailer by dunnhumby\
    \ Retailer Preference Index that ranks the top\n57 grocery retailers in the U.S.\
    \ based on an annual survey of 10,000 U.S. households. The survey also placed\
    \ Amazon\nat the top of the list for customer safety ratings.\n\n•\n\nAmazon Music\
    \ signed an agreement to acquire innovative podcast publisher, Wondery. Through\
    \ this acquisition,\nAmazon Music aims to accelerate the growth and evolution\
    \ of podcasts by bringing creators, hosts, and immersive\nexperiences to even\
    \ more listeners across the globe. Wondery will be able to provide more high-quality,\
    \ innovative\ncontent, continuing their mission of bringing a world of entertainment\
    \ and knowledge to their audiences, wherever\nthey listen. The acquisition is\
    \ not yet closed and is subject to customary closing conditions.\n\n•\n\nPrime\
    \ Video continues to launch Amazon Original series and movies globally. Amazon\
    \ Original movie Borat\nSubsequent Moviefilm, starring Sacha Baron Cohen, generated\
    \ tens of millions of customer streams globally on\nopening weekend. Other popular\
    \ Amazon Original movies include Uncle Frank, Sylvie’s Love, Sound of Metal, and\n\
    \n\fI’m Your Woman. Prime Video members also enjoyed new and returning Amazon\
    \ Original series and specials such as\nWhat the Constitution Means to Me, Utopia,\
    \ Truth Seekers, The Pack, Small Axe, The Wilds, The Expanse, Yearly\nDeparted,\
    \ and the final season of Vikings. Internationally, locally produced Amazon Originals\
    \ debuting included\nFERRO (Italy), El Cid (Spain), The Challenge: ETA (Spain),\
    \ BILD.Macht.Deutschland? (Germany), Binge Reloaded\n(Germany), Truth Seekers\
    \ (UK), The Grand Tour: A Massive Hunt (UK), All or Nothing: Tottenham Hotspur\
    \ (UK),\nThe Bachelorette (Japan), Mirzapur (India), and Locas por el Cambio (Mexico).\n\
    •\n\nThe fourth quarter marked Prime Video’s strongest viewership for live sports\
    \ globally. In the U.S., Prime Video’s\nexclusive coverage of the San Francisco\
    \ 49ers vs. Arizona Cardinals game on December 26 drew an estimated 11.2\nmillion\
    \ total viewers and delivered the highest digital average-minute-audience ever\
    \ for an NFL regular season game.\nIn the UK, the number of customers tuning into\
    \ live Premier League football grew for the second season as millions\nwatched\
    \ 22 live and exclusive matches on Prime Video. In addition, millions of Prime\
    \ members streamed live,\ninternational rugby for the first-ever Autumn Nations\
    \ Cup tournament; and in India, Prime Video announced its first\nforay into live\
    \ sports, with the acquisition of India territory rights for New Zealand Cricket\
    \ through 2025-26.\n\n•\n\nAmazon Studios announced deals for upcoming Prime Video\
    \ series and movies, including the Eddie Murphy comedy\nComing 2 America, which\
    \ premieres in March on Prime Video globally and an unscripted docuseries and\
    \ new comingof-age series based on Jessica Simpson’s best-selling memoir Open\
    \ Book.\n\nAmazon Devices and Services\n•\n\nAmazon announced that Fire TV now\
    \ reaches more than 50 million monthly active users around the world. Amazon\n\
    also secured new content deals with premium streaming providers, including HBO\
    \ Max, discovery+, and Xfinity in the\nU.S.; Disney+ in Mexico and Brazil; NOW\
    \ TV in the UK; and CANAL+ in France. The new Fire TV Experience\nreleased globally\
    \ includes a redesigned Home Screen, Profiles, and a new voice-first experience\
    \ with Alexa to easily\ndiscover content.\n\n•\n\nZoox revealed the first look\
    \ at their fully functional, electric, autonomous vehicle, which features bi-directional\n\
    driving and is capable of speeds up to 75 miles per hour.\n\n•\n\nAmazon announced\
    \ Alexa Custom Assistant, a new service that lets device makers, auto makers,\
    \ and service providers\ncreate custom-branded voice assistants that are powered\
    \ by and work in cooperation with Alexa. The Alexa Custom\nAssistant can be built\
    \ into automobiles and consumer electronics, including smart displays, speakers,\
    \ set top boxes,\nfitness devices, and more, providing a complete, managed voice\
    \ solution that substantially reduces cost, complexity,\nand time to market.\n\
    \n•\n\nAmazon continued to make progress on Project Kuiper, a low earth orbit\
    \ satellite constellation that will increase\nbroadband access for unserved and\
    \ underserved communities around the world. In December, the team revealed\ndesigns\
    \ for the Ka-band phased array antenna that will be used in its customer terminal.\
    \ The antenna is smaller and\nlighter than legacy designs, allowing Amazon to\
    \ produce a customer terminal that is more affordable and easier to\ninstall.\n\
    \n•\n\nRing introduced general availability of its new Mailbox Sensor to customers,\
    \ launched Customizable Motion Zones\nfor all battery-powered Ring Video Doorbells\
    \ and Security Cameras, and became the first major smart home security\ncompany\
    \ to offer Video End-to-End Encryption. Additionally, Ring announced Ring Video\
    \ Doorbell Wired, its\nsmallest doorbell yet, and availability of the Ring Alarm\
    \ in Spain.\n\n•\n\nAmazon took another step toward making interactions with Alexa\
    \ more natural, and skills more discoverable, by\nintroducing a new capability\
    \ that infers customers’ latent goals—goals that are implicit in customer requests\
    \ but not\ndirectly expressed—and seamlessly transitions to a relevant skill without\
    \ requiring the name of the skill, or repeating\nthe same information across skills.\n\
    \n•\n\nKey by Amazon’s In-Garage Delivery service expanded to tens of millions\
    \ of Prime members in over 4,000 cities in\nthe U.S., enabling them to enjoy free,\
    \ contactless, and secure package delivery conveniently inside their garage to\
    \ keep\npackages safe.\n\n\f•\n\nAmazon announced the first Alexa built-in commercial\
    \ trucking integration in Volvo Trucks in the EU; the first\nintegration in Brazil\
    \ with BMW’s BMWi and MINI cars; and new vehicle launches with Dodge Durango,\
    \ Chrysler\nPacifica, Fiat 500 electric, and Acura MDX. Additionally, new Alexa\
    \ integrations were announced at the Consumer\nElectronics Show (CES), including\
    \ Harman, Intel, Lenovo, TP-Link, Rise Gardens, and more.\n\n•\n\nAlexa added\
    \ Netflix to its global roster of streaming service providers for Echo Show customers,\
    \ giving them more athome entertainment options. Amazon also added podcast support\
    \ to Alexa from services like Amazon Music, Apple,\nand Spotify in more countries\
    \ around the world.\n\n•\n\nAlexa became more multilingual, allowing members of\
    \ a household to interact with Alexa in two different languages\nwithout needing\
    \ to change the settings. In the U.S., multilingual mode allows bilingual customers\
    \ to code-switch from\nEnglish to Spanish, and vice versa. Amazon also launched\
    \ multilingual mode in new languages and countries\nincluding Germany, Spain,\
    \ France, Italy, and Japan.\n\n•\n\nAmazon added new Alexa features that make\
    \ customers’ daily lives more convenient, including the ability to share a\nshopping\
    \ list with Alexa contacts by voice, video calling on Fire TV, and new Alexa Routines\
    \ on Fire TV.\n\nAmazon Web Services\n•\n\nAWS announced significant customer\
    \ momentum during the quarter with new commitments and migrations spanning\nmajor\
    \ industries, including financial services with JPMorgan Chase, Itaú Unibanco\
    \ (Latin America’s largest bank),\nStandard Chartered Bank, and Nationwide; media\
    \ and entertainment with Metro-Goldwyn-Mayer (MGM), Thomson\nReuters, and ViacomCBS;\
    \ technology with Arm and Twitter; travel with Boom Technology, Inc. (Boom Supersonic)\n\
    and Star Alliance (the world’s largest airline alliance); retail and e-commerce\
    \ with Mercado Libre (Latin America’s\nlargest online commerce and payments provider)\
    \ and Zalando (Europe’s largest online fashion and lifestyle platform);\npower\
    \ and utilities with Siemens Smart Infrastructure (a Siemens AG business group\
    \ that focuses on energy\ndistribution and intelligent buildings); and automotive\
    \ with The BMW Group, as well as a multi-year, global\nagreement to develop and\
    \ market BlackBerry’s Intelligent Vehicle Data Platform, IVY.\n\n•\n\nAt AWS re:Invent,\
    \ Amazon’s ninth-annual learning conference for the global cloud computing and\
    \ information\ntechnology communities, AWS attracted over 570,000 registered attendees\
    \ and announced 180 new services and\nfeatures, including:\n•\n\nThe industry’s\
    \ first cloud-based Mac instances (EC2 Mac instances for Amazon Elastic Compute\
    \ Cloud) that\nenable customers to develop, scale, and run macOS workloads in\
    \ AWS.\n\n•\n\nFive new services that push the envelope on price performance and\
    \ extend Amazon EC2’s lead as the\nbroadest and deepest portfolio of compute instances\
    \ in the cloud, including Graviton2-powered C6gn\ninstances that provide 40% better\
    \ price performance for networking and compute-intensive workloads over\ncomparable\
    \ current generation x86-based instances, AMD-powered G4ad Graphics Processing\
    \ Unit (GPU)\ninstances that offer the industry’s best price performance for graphics-intensive\
    \ applications, M5zn instances\nthat deliver the fastest Intel Xeon Scalable processors\
    \ in the cloud, Intel-powered D3/D3en instances that\noffer the highest storage\
    \ capacity for local HDD storage in the cloud, and memory-optimized R5b instances\n\
    that deliver the fastest block storage performance available for Amazon EC2.\n\
    \n•\n\nNine new capabilities for Amazon SageMaker that make it even easier for\
    \ developers and data scientists to\nprepare, build, train, deploy, and manage\
    \ machine learning models.\n\n•\n\nFive new services for industrial customers\
    \ that use machine learning to improve operational efficiency,\nquality control,\
    \ security, and workplace safety. Amazon Monitron and Amazon Lookout for Equipment\
    \ use\nsensor data to enable predictive maintenance. The AWS Panorama Appliance\
    \ and SDK use computer vision\nto improve product quality and workplace safety.\
    \ And, Amazon Lookout for Vision uses computer vision to\nspot anomalies and flaws\
    \ in products and processes.\n\n•\n\nAmazon HealthLake, a HIPAA-eligible service,\
    \ enables healthcare organizations to aggregate all their data\nfrom disparate\
    \ locations in various formats, transform that data into a consistent format,\
    \ store it, and provide\neasy ways to analyze that data in AWS.\n\n\f•\n\nFive\
    \ new capabilities for AWS’s rapidly-growing contact center service, Amazon Connect,\
    \ that significantly\nimprove contact center agents’ productivity and customers’\
    \ experiences.\n\n•\n\nAQUA (Advanced Query Accelerator) for Amazon Redshift provides\
    \ an innovative new hardwareaccelerated cache that delivers up to 10x better query\
    \ performance than any other cloud data warehouse.\n\n•\n\nAWS Glue Elastic Views\
    \ lets developers easily build materialized views that automatically combine and\n\
    replicate data across storage, data warehouses, and databases.\n\n•\n\nAmazon\
    \ QuickSight Q delivers a machine learning-powered capability for Amazon QuickSight\
    \ that lets users\ntype questions about their business data in natural language\
    \ and receive highly accurate answers in seconds.\n\n•\n\nAmazon EBS io2 Block\
    \ Express volumes deliver the first storage area network (SAN) built for the cloud,\n\
    with up to 256,000 input/output operations per second (IOPS), 4,000 MB/second\
    \ throughput, and 64 TB of\ncapacity.\n\n•\n\nAmazon EBS Gp3 volumes give customers\
    \ the ability to provision additional IOPS and throughput\nperformance independent\
    \ of storage capacity, provide up to 4x peak throughput, and are priced 20% lower\
    \ per\nGB than the previous general purpose EBS volumes.\n\n•\n\nFour new container\
    \ services to help customers develop, deploy, and scale modern applications in\
    \ the cloud\nand on-premises: Amazon Elastic Container Service (ECS) Anywhere\
    \ and Amazon Elastic Kubernetes\nService (EKS) Anywhere enable customers to run\
    \ Amazon ECS and Amazon EKS in their own data centers,\nAWS Proton automates container\
    \ and serverless application development and deployment, and Amazon\nElastic Container\
    \ Registry (Amazon ECR) Public provides developers an easy and highly available\
    \ way to\nshare and deploy container software publicly.\n\n•\n\nThe next version\
    \ of Aurora Serverless, Aurora Serverless v2, scales to hundreds of thousands\
    \ of database\ntransactions in a fraction of a second, delivering up to 90% cost\
    \ savings compared to provisioning\ninfrastructure for peak capacity.\n\n•\n\n\
    Babelfish for Aurora PostgreSQL provides a new capability for Amazon Aurora that\
    \ allows database\ncustomers to run SQL Server applications directly on Amazon\
    \ Aurora PostgreSQL with little to no code\nchanges (also, a new open source Babelfish\
    \ for PostgreSQL will be available for all PostgreSQL database\nusers in 2021).\n\
    \n•\n\nTwo new observability services for containers, IoT, and operational data,\
    \ Amazon Managed Service for\nPrometheus and Amazon Managed Service for Grafana,\
    \ built on popular open source projects to help\ncustomers monitor and visualize\
    \ modern applications at scale.\n\n•\n\nAWS continued to expand its infrastructure\
    \ footprint around the world, announcing the AWS Asia Pacific (Hyderabad)\nRegion,\
    \ available by mid-2022, and the AWS Europe (Zurich) Region and AWS Asia Pacific\
    \ (Melbourne) Regions,\navailable in the second half of 2022. AWS provides 77\
    \ Availability Zones (AZs) within 24 geographic regions, with\nannounced plans\
    \ for 18 more Availability Zones in six more AWS Regions, including regions in\
    \ Indonesia, Japan, and\nSpain, as well as the recently pre-announced regions\
    \ in India, Switzerland, and Australia.\n\n•\n\nNew AWS Local Zones in Boston,\
    \ Houston, and Miami place AWS infrastructure close to end users in metropolitan\n\
    centers, so customers can access low-latency compute, storage, and database services\
    \ without needing to provision or\nmaintain datacenter space. AWS also announced\
    \ the availability of AWS Local Zones in 12 additional cities (Atlanta,\nChicago,\
    \ Dallas, Denver, Kansas City, Las Vegas, Minneapolis, New York, Philadelphia,\
    \ Phoenix, Portland, and\nSeattle) coming in 2021.\n\n•\n\nAWS announced two new\
    \ smaller AWS Outposts form factors (1U and 2U servers) that give customers access\
    \ to AWS\non-premises in space-constrained locations, such as branch offices,\
    \ factories, hospitals, cell towers, or retail stores.\n\n•\n\nAWS announced the\
    \ general availability of Amazon EC2 P4d instances, the next generation of accelerated\
    \ computing\ninstances powered by NVIDIA A100 Tensor Core GPUs and AWS petabit-scale\
    \ networking. P4d instances provide up\nto 3x faster time to train and 60% lower\
    \ cost than previous generation instances for machine learning training and\n\n\
    \fhigh-performance computing in the cloud. EC2 P4d instances are also the only\
    \ instances in the cloud to feature\nUltraCluster capability, enabling customers\
    \ to scale to 2x the computing power as any other cloud provider.\n•\n\nAWS announced\
    \ AWS Trainium, an AWS-designed machine learning training chip that will deliver\
    \ the most costeffective training in the cloud. AWS Trainium will deliver the\
    \ most teraflops of any machine learning training instance\nin the cloud, support\
    \ all major frameworks (including TensorFlow, PytTorch, and MXnet), and use the\
    \ same Neuron\nSDK used by AWS Inferentia (an AWS-designed chip for machine learning\
    \ inference acceleration), making it easy for\ncustomers to get started training\
    \ quickly with AWS Trainium. AWS Trainium is coming to Amazon EC2 and Amazon\n\
    SageMaker in the second half of 2021.\n\n\fFinancial Guidance\nThe following forward-looking\
    \ statements reflect Amazon.com’s expectations as of February 2, 2021, and are\
    \ subject to\nsubstantial uncertainty. Our results are inherently unpredictable\
    \ and may be materially affected by many factors, such as\nfluctuations in foreign\
    \ exchange rates, changes in global economic conditions and customer spending,\
    \ world events, the rate of\ngrowth of the Internet, online commerce, and cloud\
    \ services, and the various factors detailed below. This guidance reflects our\n\
    estimates as of February 2, 2021 regarding the impact of the COVID-19 pandemic\
    \ on our operations, including those discussed\nabove, and is highly dependent\
    \ on numerous factors that we may not be able to predict or control, including:\
    \ the duration and\nscope of the pandemic, including any recurrence; actions taken\
    \ by governments, businesses, and individuals in response to the\npandemic; the\
    \ impact of the pandemic on global and regional economies and economic activity,\
    \ workforce staffing and\nproductivity, and our significant and continuing spending\
    \ on employee safety measures; our ability to continue operations in\naffected\
    \ areas; and consumer demand and spending patterns, as well as the effects on\
    \ suppliers, creditors, and third-party\nsellers, all of which are uncertain.\
    \ This guidance also assumes the impacts on consumer demand and spending patterns,\n\
    including impacts due to concerns over the current economic outlook, will be in\
    \ line with those experienced during the first\nquarter of 2021 to date, and the\
    \ additional assumptions set forth below. However, it is not possible to determine\
    \ the ultimate\nimpact on our operations for the first quarter of 2021, or whether\
    \ other currently unanticipated direct or indirect consequences\nof the pandemic\
    \ are reasonably likely to materially affect our operations.\nFirst Quarter 2021\
    \ Guidance\n•\n\n•\n•\n\nNet sales are expected to be between $100.0 billion and\
    \ $106.0 billion, or to grow between 33% and 40% compared\nwith first quarter\
    \ 2020. This guidance anticipates a favorable impact of approximately 300 basis\
    \ points from foreign\nexchange rates.\nOperating income is expected to be between\
    \ $3.0 billion and $6.5 billion, compared with $4.0 billion in first quarter\n\
    2020. This guidance assumes approximately $2.0 billion of costs related to COVID-19.\n\
    This guidance assumes, among other things, that no additional business acquisitions,\
    \ investments, restructurings, or\nlegal settlements are concluded.\n\nA conference\
    \ call will be webcast live today at 2:30 p.m. PT/5:30 p.m. ET, and will be available\
    \ for at least three months at\namazon.com/ir. This call will contain forward-looking\
    \ statements and other material information regarding the Company’s\nfinancial\
    \ and operating results.\nThese forward-looking statements are inherently difficult\
    \ to predict. Actual results could differ materially for a variety of\nreasons,\
    \ including, in addition to the factors discussed above, the amount that Amazon.com\
    \ invests in new business\nopportunities and the timing of those investments,\
    \ the mix of products and services sold to customers, the mix of net sales\nderived\
    \ from products as compared with services, the extent to which we owe income or\
    \ other taxes, competition, management\nof growth, potential fluctuations in operating\
    \ results, international growth and expansion, the outcomes of claims, litigation,\n\
    government investigations, and other proceedings, fulfillment, sortation, delivery,\
    \ and data center optimization, risks of\ninventory management, variability in\
    \ demand, the degree to which the Company enters into, maintains, and develops\n\
    commercial agreements, proposed and completed acquisitions and strategic transactions,\
    \ payments risks, and risks of\nfulfillment throughput and productivity. Other\
    \ risks and uncertainties include, among others, risks related to new products,\n\
    services, and technologies, system interruptions, government regulation and taxation,\
    \ and fraud. In addition, additional or\nunforeseen effects from the COVID-19\
    \ pandemic and the global economic climate may give rise to or amplify many of\
    \ these\nrisks. More information about factors that potentially could affect Amazon.com’s\
    \ financial results is included in Amazon.com’s\nfilings with the Securities and\
    \ Exchange Commission (“SEC”), including its most recent Annual Report on Form\
    \ 10-K and\nsubsequent filings.\nOur investor relations website is amazon.com/ir\
    \ and we encourage investors to use it as a way of easily finding information\n\
    about us. We promptly make available on this website, free of charge, the reports\
    \ that we file or furnish with the SEC, corporate\ngovernance information (including\
    \ our Code of Business Conduct and Ethics), and select press releases, which may\
    \ contain\nmaterial information about us, and you may subscribe to be notified\
    \ of new information posted to this site.\n\n\fAbout Amazon\nAmazon is guided\
    \ by four principles: customer obsession rather than competitor focus, passion\
    \ for invention, commitment to\noperational excellence, and long-term thinking.\
    \ Customer reviews, 1-Click shopping, personalized recommendations, Prime,\nFulfillment\
    \ by Amazon, AWS, Kindle Direct Publishing, Kindle, Fire tablets, Fire TV, Amazon\
    \ Echo, and Alexa are some of the\nproducts and services pioneered by Amazon.\
    \ For more information, visit amazon.com/about and follow @AmazonNews."
