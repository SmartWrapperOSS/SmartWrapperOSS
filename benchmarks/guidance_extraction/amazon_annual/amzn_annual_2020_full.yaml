  label: Amazon Q3 2020 Earnings Release, October 29, 2020
  text: "AMAZON.COM ANNOUNCES THIRD QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) October\
    \ 29, 2020—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial\nresults\
    \ for its third quarter ended September 30, 2020.\n•\n\nOperating cash flow increased\
    \ 56% to $55.3 billion for the trailing twelve months, compared with $35.3 billion\
    \ for\nthe trailing twelve months ended September 30, 2019.\n\n•\n\nFree cash\
    \ flow increased to $29.5 billion for the trailing twelve months, compared with\
    \ $23.5 billion for the trailing\ntwelve months ended September 30, 2019.\n\n\
    •\n\nFree cash flow less principal repayments of finance leases and financing\
    \ obligations increased to $18.4 billion for\nthe trailing twelve months, compared\
    \ with $14.6 billion for the trailing twelve months ended September 30, 2019.\n\
    \n•\n\nFree cash flow less equipment finance leases and principal repayments of\
    \ all other finance leases and financing\nobligations increased to $17.9 billion\
    \ for the trailing twelve months, compared with $10.5 billion for the trailing\n\
    twelve months ended September 30, 2019.\n\n•\n\nCommon shares outstanding plus\
    \ shares underlying stock-based awards totaled 518 million on September 30,\n\
    2020, compared with 511 million one year ago.\n\n•\n\nNet sales increased 37%\
    \ to $96.1 billion in the third quarter, compared with $70.0 billion in third\
    \ quarter 2019.\nExcluding the $691 million favorable impact from year-over-year\
    \ changes in foreign exchange rates throughout the\nquarter, net sales increased\
    \ 36% compared with third quarter 2019.\n\n•\n\nOperating income increased to\
    \ $6.2 billion in the third quarter, compared with operating income of $3.2 billion\
    \ in\nthird quarter 2019.\n\n•\n\nNet income increased to $6.3 billion in the\
    \ third quarter, or $12.37 per diluted share, compared with net income of\n$2.1\
    \ billion, or $4.23 per diluted share, in third quarter 2019.\n\n“Two years ago,\
    \ we increased Amazon’s minimum wage to $15 for all full-time, part-time, temporary,\
    \ and seasonal employees\nacross the U.S. and challenged other large employers\
    \ to do the same. Best Buy and Target have stepped up, and we hope other\nlarge\
    \ employers will also make the jump to $15. Now would be a great time,” said Jeff\
    \ Bezos, Amazon founder and CEO.\n“Offering jobs with industry-leading pay and\
    \ great healthcare, including to entry-level and front-line employees, is even\
    \ more\nmeaningful in a time like this, and we’re proud to have created over 400,000\
    \ jobs this year alone. We’re seeing more customers\nthan ever shopping early\
    \ for their holiday gifts, which is just one of the signs that this is going to\
    \ be an unprecedented holiday\nseason. Big thank you to our employees and selling\
    \ partners around the world who’ve been busy getting ready to deliver for\ncustomers\
    \ this holiday.”\nHighlights\nInvesting in Jobs and Employees\n•\n\nAmazon announced\
    \ that it is creating hundreds of thousands of new jobs around the world for people\
    \ at all skill levels\nand stages of their careers, including:\n•\n\n100,000 new\
    \ permanent jobs with industry-leading pay of at least $15 per hour, benefits\
    \ starting on day one,\nsign-on bonuses of up to $1,000 in select U.S. cities,\
    \ and access to company-subsidized upskilling programs\nlike Career Choice. This\
    \ hiring was part of Amazon opening 100 new operations buildings across North\n\
    America.\n\n•\n\n100,000 new seasonal jobs with Amazon Air, logistics, fulfillment\
    \ centers, sortation centers, and global\nspecialty fulfillment teams in the U.S.\
    \ and Canada.\n\n\f•\n\n10,000 corporate and technology jobs in Bellevue, WA as\
    \ part of the continued expansion of Amazon’s Puget\nSound headquarters, and 7,000\
    \ new jobs at Tech Hubs in Dallas, Detroit, Denver, New York, Phoenix, San\nDiego,\
    \ Toronto, and Vancouver.\n\n•\n\n10,000 new permanent jobs in the UK, bringing\
    \ the total in the country to 40,000; and thousands of new\npermanent jobs in\
    \ Germany, bringing the total in the country to 16,000.\n\n•\n\nIn India, Amazon\
    \ announced the expansion of its operations network with 10 new fulfillment centers,\
    \ 5 new\nsortation centers, nearly 200 delivery stations, and over 100,000 seasonal\
    \ jobs to help meet customer demand\nduring the festive season. The company also\
    \ launched an all-women delivery station in the state of Gujarat –\nthe second\
    \ of its kind in the country and part of the company’s ongoing efforts to provide\
    \ more opportunities\nfor women to build careers at Amazon.\n\n•\n\nMore than\
    \ 320,000 people attended Amazon’s Career Day, a virtual event that provided insights,\
    \ tips, and advice to\njob seekers on how to build their career and apply for\
    \ more than 130,000 corporate, technology, and operations\npositions available\
    \ at Amazon in North America. Amazon received a record 384,000 applications for\
    \ roles in Canada\nand the U.S. within a week of announcing the event.\n\n•\n\n\
    Amazon has promoted more than 35,000 people across its U.S. operations network\
    \ this year, and more than 30,000\npeople have participated in Career Choice,\
    \ an innovative program to upskill employees interested in pursuing a future\n\
    outside Amazon. Over half of the tens of thousands of program participants this\
    \ year are from underrepresented\nminority groups.\n\n•\n\nAmazon Studios and\
    \ Howard University announced they will partner for a second year of the Howard\
    \ Entertainment\nProgram, which aims to further diversify the entertainment industry\
    \ by creating a pipeline of underrepresented talent,\nincluding Black students,\
    \ through internships and other educational opportunities.\n\n•\n\nAmazon continues\
    \ to ramp up its in-house COVID-19 testing program to keep front-line employees\
    \ safe, with capacity\nreaching 50,000 tests a day across 650 sites by November.\n\
    \n•\n\nAmazon was named to multiple leading rankings and awards, including: #2\
    \ on the Forbes World’s Best Employers, a\nsurvey of workers on satisfaction with\
    \ their employers’ COVID-19 response, talent development, gender equality,\nsocial\
    \ responsibility, and more; #3 on the Axios Harris Poll 100, Amazon’s eighth year\
    \ in a row in the top 3 of this\nbrand reputation survey; and #4 on Morning Consult’s\
    \ Most Loved Brands in America, a measure of favorability,\ntrust, and community\
    \ impact.\n\nSupporting Communities\n•\n\nAmazon announced plans to add more than\
    \ 3,000 new schools to Amazon Future Engineer, a four-part program that\nfunds\
    \ high-quality, age-appropriate computer science curriculum for students and professional\
    \ development for\nteachers. With the addition of these new schools, Amazon Future\
    \ Engineer will expand to reach over 550,000 K-12\nstudents across more than 5,000\
    \ elementary, middle, and high schools in underserved communities.\n\n•\n\nAmazon\
    \ donated more than one million emergency aid items, including water, generators,\
    \ air filters, food, KN95\nmasks, and cleaning supplies, to community partners\
    \ providing disaster relief to people affected by wildfires in\nCalifornia, Oregon,\
    \ and Washington, as well as Hurricane Laura along the Gulf Coast.\n\n•\n\nAmid\
    \ the COVID-19 pandemic, Amazon expanded its Right Now Needs Fund in the Puget\
    \ Sound region and\nlaunched a new fund focused on Northern Virginia. The $3.5\
    \ million donation will provide students located near\nAmazon’s two headquarters\
    \ with immediate access to food, shelter, clothing, school supplies, and more\
    \ to help\neliminate barriers to learning and ensure students can focus on education\
    \ throughout the school year.\n\n•\n\nTo support communities disproportionately\
    \ impacted by COVID-19, Amazon announced it will make millions of\ndollars in\
    \ product and monetary donations to more than a thousand charities this holiday\
    \ season in Australia, Canada,\nChina, France, Germany, India, Italy, Japan, Singapore,\
    \ Spain, the UK, the U.S., and more.\n\nProtecting the Planet\n•\n\nMercedes-Benz,\
    \ Best Buy, McKinstry, Real Betis, Schneider Electric, and Siemens signed The\
    \ Climate Pledge, a\ncommitment co-founded by Amazon and Global Optimism to achieve\
    \ net-zero carbon by 2040, a decade ahead of the\nParis Agreement.\n\n•\n\nCarbonCure,\
    \ Pachama, Redwood Materials, Rivian, and Turntide Technologies were the first\
    \ companies to receive\ninvestments from Amazon as part of The Climate Pledge\
    \ Fund, a $2 billion fund that invests in visionary companies\nwhose product and\
    \ service solutions will facilitate the transition to a zero-carbon economy.\n\
    \n\f•\n\nIn Europe, Amazon announced it will add 1,800 electric delivery vehicles\
    \ from Mercedes-Benz Vans to its delivery\nfleet—the largest order of electric\
    \ vehicles from Mercedes-Benz Vans to date.\n\n•\n\nAmazon unveiled its first\
    \ custom electric delivery vehicle, designed and built in partnership with Rivian.\
    \ The new\nvehicles will make their first deliveries to Amazon customers in 2021.\
    \ As early as 2022, there will be 10,000 of these\nvehicles on roads in the U.S.\
    \ and EU, and all 100,000 vehicles are expected to be on the road by 2030.\n\n\
    •\n\nIn the U.S. and EU, Amazon launched Climate Pledge Friendly, a new program\
    \ that identifies products with one or\nmore of 19 different sustainability certifications,\
    \ making it easy for customers to discover and shop for more\nsustainable products\
    \ in Amazon’s store. Products identified as Climate Pledge Friendly meet standards\
    \ that help\npreserve the natural world, such as reducing the carbon footprint\
    \ of shipments to customers. Amazon also announced\nCompact by Design, a new sustainability\
    \ certification for products with a more efficient design that leads to carbon\n\
    emission reductions by requiring less packaging or less frequent purchases by\
    \ customers.\n\n•\n\nAmazon announced its most sustainable devices ever. The new\
    \ Echo and Fire TV devices include 100% postconsumer recycled fabric, 100% recycled\
    \ die-cast aluminum, and 30-50% post-consumer recycled plastic, and new\nfeatures\
    \ like Low Power Mode and an energy dashboard will enable customers to understand\
    \ and reduce the energy\nconsumption of their devices.\n\n•\n\nAmazon is building\
    \ new wind and solar farms to produce clean energy equivalent to the electricity\
    \ used by every\ncustomer’s Echo device. The company has said it will continue\
    \ building new renewable energy projects until it\naccounts for the energy consumption\
    \ of all Amazon devices.\n\n•\n\nAmazon announced its first operational wind farm\
    \ outside the U.S. in Bäckhammar, Sweden. The wind farm is\nexpected to deliver\
    \ 280,000-megawatt hours of clean energy annually into the Swedish grid.\n\nEmpowering\
    \ Small and Medium-Sized Businesses\n•\n\nAmazon hosted Amazon Accelerate, its\
    \ largest-ever U.S. event to share best practices with small businesses on how\
    \ to\nserve customers in Amazon’s store and grow their businesses. At the virtual\
    \ event, Amazon also announced plans to\ninvest billions of dollars to help small\
    \ and medium-sized businesses succeed, and it outlined plans to onboard an\nadditional\
    \ 100,000 small and medium-sized businesses in the next year.\n\n•\n\nAmazon hosted\
    \ its second annual Ignite Digital Festival for more than 1,500 Delivery Service\
    \ Partners (DSP). The\nvirtual event showcased product and technology innovations\
    \ to help them succeed, including over 250 logistics\nprogram and product changes,\
    \ from routing updates and navigation improvements on the drivers’ delivery app\
    \ to stateof-the-art safety technology adjustments. Since the DSP program launched\
    \ over two years ago, there are now more\nthan 1,700 owners across Canada, Germany,\
    \ Spain, the UK, and the U.S. who have created over 100,000 jobs in their\ncommunities,\
    \ delivered more than 2.2 billion packages worldwide, and generated over $5 billion\
    \ in revenue for their\nsmall businesses.\n\n•\n\nAmazon India hosted Stand for\
    \ Handmade, a 10-week program to help boost sales for Indian artisans, weavers,\
    \ and\nwomen entrepreneurs by waiving selling fees and promoting local, handmade\
    \ products to customers. Participating\nKarigar (artisans) and Saheli (women)\
    \ sellers more than doubled their sales during this period, and more than 200\
    \ new\nsellers joined the Karigar program.\n\n•\n\nAmazon Australia launched Amazon\
    \ Launchpad Innovation Grants, an initiative to celebrate innovation by Australian\n\
    start-ups, entrepreneurs, and small and medium-sized businesses. The program will\
    \ offer grant packages to\norganizations with innovative products that support\
    \ Australians through the pandemic.\n\nShopping and Entertainment\n•\n\nIn 19\
    \ countries, Amazon’s Prime Day kicked-off the holiday shopping season on October\
    \ 13-14 with the two biggest\ndays ever for small and medium businesses in Amazon’s\
    \ stores. Third-party sellers—most of which are small and\nmedium-sized businesses—surpassed\
    \ $3.5 billion in sales on Prime Day—a nearly 60% year-over-year increase,\ngrowing\
    \ even more than Amazon’s retail business. Prime members saved more than $1.4\
    \ billion, taking advantage of\ndeep discounts and incredible deals over the two-day\
    \ event.\n\n•\n\nAmazon India kicked off the Great Indian Festival on October\
    \ 17, a month-long celebration with deals across popular\ncategories such as smartphones,\
    \ appliances, televisions, and consumer electronics. Sellers and brand partners\n\
    experienced the biggest two days of sales in the festival’s history. Amazon India\
    \ also hosted Prime Day on August 6-7,\nduring which twice as many customers became\
    \ Prime members compared to the previous year.\n\n•\n\nAmazon launched Prime in\
    \ Turkey, bringing the total number of countries with Prime to 20. Prime in Turkey\
    \ includes\nfree, fast delivery on thousands of items across 20 categories, as\
    \ well as access to Prime Video, Prime Gaming, and\nexclusive deals on Prime Day\
    \ and throughout the year.\n\n\f•\n\nAmazon.se launched in Sweden, offering customers\
    \ more than 150 million products to choose from with everyday low\nprices and\
    \ free delivery for eligible orders above SEK 229.\n\n•\n\nAmazon announced that\
    \ Project Zero—a tool enabling brands to remove potential counterfeit products\
    \ in Amazon’s\nstore—is available in 17 countries around the world, with Australia,\
    \ Brazil, the Netherlands, Saudi Arabia, Singapore,\nTurkey, and the UAE recently\
    \ added to the program. Project Zero combines Amazon’s advanced technology and\n\
    machine learning with the sophisticated knowledge that brands have of their own\
    \ intellectual property to drive\ncounterfeits to zero.\n\n•\n\nAmazon launched\
    \ Amazon One, a fast, convenient, contactless way for people to use their palm\
    \ to enter, identify, and\npay. The highly-secure service uses custom-built algorithms\
    \ and hardware to create a person’s unique palm signature.\nAmazon One is currently\
    \ available in two Amazon Go stores in Seattle, with plans to expand to additional\
    \ Amazon\nstores.\n\n•\n\nThe first Amazon Fresh grocery stores opened in Woodland\
    \ Hills and Irvine, CA. Amazon Fresh offers a seamless\ngrocery shopping experience\
    \ whether customers are shopping in-store or online, consistently low prices,\
    \ a wide\nassortment of national brands and freshly prepared foods made daily,\
    \ and free same-day delivery and pick-up for\nPrime members. The stores also offer\
    \ new ways to make grocery shopping more convenient, including the Amazon\nDash\
    \ Cart, which enables customers to skip the checkout line, and new Alexa features\
    \ to help customers manage their\nshopping lists and better navigate aisles.\n\
    \n•\n\nAmazon Fashion announced the launch of Luxury Stores, a new shopping experience\
    \ for eligible U.S. Prime members,\noffering established and emerging luxury fashion\
    \ and beauty brands.\n\n•\n\nThe Amazon Studios global original movies slate continues\
    \ to grow, with additions such as Sacha Baron Cohen’s\npolitical satire Borat\
    \ Subsequent Moviefilm, which recently launched globally on Prime Video, as well\
    \ as Tom\nClancy’s Without Remorse, starring Michael B. Jordan, slated to launch\
    \ in 2021.\n\n•\n\nAmazon premiered several new and returning Amazon Original\
    \ series, including The Boys, Breathe into the Shadows,\nBandish Bandits, Mirzapur,\
    \ and Putham Pudhu Kaalai in India, Peep Time and Documental S8 in Japan, Pan\
    \ y Circo\nin Mexico, and All or Nothing: Tottenham Hotspur in the UK.\n\n•\n\n\
    Amazon Prime Video announced that live international rugby games will be exclusively\
    \ available to UK Prime\ncustomers this winter with a brand new tournament called\
    \ the Autumn Nations Cup. The tournament will feature the\nSix Nations (England,\
    \ France, Ireland, Italy, Scotland, and Wales) as well as two guest teams from\
    \ Fiji and Georgia.\n\n•\n\nAmazon Music announced multiple new services and features,\
    \ including partnering with Twitch to add livestreaming\nto the Amazon Music app,\
    \ enabling fans to engage with artists in brand-new ways and move seamlessly between\n\
    livestreams and recorded music; launching podcasts for customers in Germany, Japan,\
    \ the UK, and the U.S., across all\ntiers of service at no additional cost; and\
    \ expanding its HD streaming tier to Canada, France, Italy, and Spain.\n\n•\n\n\
    Amazon announced the launch of Prime Gaming, a new service that lets Prime members\
    \ enjoy free, exclusive content\nfor their favorite PC, console, and mobile games,\
    \ plus a collection of PC games for free every month. Prime Gaming is\nincluded\
    \ with Prime memberships and Prime Video subscriptions in over 200 countries and\
    \ territories.\n\nAmazon Devices and Alexa\n•\n\nAmazon introduced a reimagined\
    \ family of Echo devices. The new Echo combines the best of Echo and Echo Plus\n\
    into a single device with an all-new design, built-in smart home hub, and more\
    \ powerful speakers; Echo Dot and Echo\nDot with Clock feature a powerful speaker\
    \ packed into a compact design; Echo Dot Kids Edition comes in Panda and\nTiger\
    \ designs with even more features for kids to enjoy; and the all-new Echo Show\
    \ 10 now features a brilliant 10inch, adaptive HD display that automatically moves\
    \ to stay in view as you interact with Alexa.\n\n•\n\nAmazon announced the new\
    \ Fire TV Stick and Fire TV Stick Lite. Customers have purchased over 100 million\
    \ Fire\nTV devices globally, and Fire TV customers are streaming billions of hours\
    \ each month. The new Fire TV devices are\n50% more powerful while using 50% less\
    \ power than the previous Fire TV Stick. Amazon also introduced a\nredesigned\
    \ Fire TV experience that provides new content-discovery features, enhanced Alexa\
    \ voice integration, and\nuser profiles for personalized recommendations.\n\n\
    •\n\nAmazon announced new ways for customers to connect their devices with Amazon\
    \ Sidewalk, a shared network that\nhelps devices like Amazon Echo, Ring Security\
    \ Cams, outdoor lights, and motion sensors work better at home and\nbeyond the\
    \ front door.\n\n•\n\nAmazon announced the latest AI advancements that make Alexa\
    \ more natural, conversational, and useful. These\nadvancements include a new\
    \ teaching capability that helps Alexa get smarter by asking questions to fill\
    \ gaps in her\n\n\funderstanding, and natural turn-taking that will allow customers\
    \ to interact with Alexa at their own pace without using\na wake word, even when\
    \ multiple people are talking.\n•\n\nAmazon introduced new features and services\
    \ that continue to make Alexa smarter, like Guard Plus and the Care Hub,\nthat\
    \ help customers keep their homes and loved ones safe. Amazon also announced new\
    \ Alexa privacy controls\nincluding the option for customers to not save voice\
    \ recordings or simply say, “Alexa, delete everything I’ve said” to\ndelete their\
    \ voice history. Amazon expanded Alexa Calling and Messaging capabilities to help\
    \ customers stay\nconnected with the addition of group calling and integrations\
    \ with Zoom and Amazon Chime. AT&T customers can\nalso link eligible mobile numbers\
    \ to make and receive hands-free calls with Alexa.\n\n•\n\nAmazon announced customers\
    \ have connected more than 100 million smart home devices to Alexa, and introduced\n\
    smart home features like additional Hunches, that let customers choose to have\
    \ Alexa proactively act on their behalf.\n\n•\n\nAmazon introduced new devices\
    \ and features to help kids and families learn, stay connected, and have fun together.\n\
    Kids can now make Alexa Announcements with their Fire Kids Edition Tablets, help\
    \ build reading fluency with\nReading Sidekick, and enjoy a custom-built kids\
    \ experience with the new Echo Dot Kids Edition.\n\n•\n\nAmazon announced Amazon\
    \ Halo, a new service dedicated to helping customers improve their health and\
    \ wellness.\nAmazon Halo combines a suite of AI-powered health features that provide\
    \ actionable insights into overall wellness via\nthe new Amazon Halo app with\
    \ the Amazon Halo Band, which uses multiple advanced sensors to provide the\n\
    information necessary to power Halo insights.\n\n•\n\nAmazon announced Luna, a\
    \ new cloud gaming service that allows customers to play high-quality games on\
    \ devices\nthey already own. As part of early access, players will have access\
    \ to more than 100 games through the Luna+ game\nchannel and Ubisoft channel,\
    \ with more games to come. Luna is built on AWS and harnesses the power of the\n\
    industry’s broadest and deepest cloud platform. Amazon also announced Luna Controller,\
    \ which is Alexa-enabled and\nconnects directly to the cloud for lower latency\
    \ gaming. Luna will be available on Fire TV, PC, and Mac as well as on\nweb apps\
    \ for iPhone and iPad, with Android coming soon.\n\n•\n\nRing announced several\
    \ new products and features, including a new category of devices for the car (Ring\
    \ Car Alarm,\nRing Car Cam, Ring Car Connect API, and Ring Car Connect for Tesla),\
    \ the autonomous flying indoor security\ncamera Ring Always Home Cam, and a new\
    \ Mailbox Sensor.\n\n•\n\nAmazon announced new eero Pro 6 and eero 6 mesh wifi\
    \ systems that feature Wi-Fi 6 support for faster speeds, higher\nperformance,\
    \ and better support for simultaneous connected devices.\n\n•\n\nAmazon continues\
    \ to support developers and startups with new Alexa tools and features, investments,\
    \ and programs.\nAmazon announced that Dolby, Facebook, Garmin, and Xiaomi have\
    \ joined the Voice Interoperability Initiative, a\nprogram to ensure voice-enabled\
    \ products provide customers with choice and flexibility through multiple,\ninteroperable\
    \ voice services. The Alexa Fund invested in health and fitness companies Tonal\
    \ and Zwift; enterprise AI\ncompany Fiddler Labs; maker of smart sensor chips\
    \ Aspinity; and creators of personalized sound environments Endel.\nThe investments\
    \ are in addition to the launch of two new programs in collaboration with Blavity’s\
    \ AfroTech World\nand All Raise to support underrepresented founders.\n\n•\n\n\
    The Federal Communications Commission voted unanimously to approve Project Kuiper,\
    \ a low earth orbit satellite\nconstellation capable of providing reliable, affordable\
    \ broadband to unserved and underserved communities around the\nworld. Amazon\
    \ will invest more than $10 billion in the initiative, creating jobs and infrastructure\
    \ around the U.S. that\nwill enable the team to deliver on its vision for the\
    \ project.\n\n•\n\nBlink launched Blink Indoor and Outdoor, two new wireless smart\
    \ home security cameras that offer two-year battery\nlife, HD video, new privacy\
    \ zones features, and local or cloud storage options for saved clips. Cameras\
    \ are available\nfor purchase in Canada, France, Germany, Italy, Netherlands,\
    \ Spain, the UK, and the U.S.\n\nAmazon Web Services\n•\n\nAWS announced significant\
    \ customer momentum with new commitments and migrations, including: leading payments\n\
    technology company Global Payments, to manage issuer processing and handling of\
    \ their approximately 27 billion\ntransactions processed annually; biotechnology\
    \ company Moderna, to accelerate the development of messenger RNA\nmedicines to\
    \ prevent and fight diseases, including a vaccine candidate against COVID-19;\
    \ restaurant chain Jack in the\nBox to enhance digital ordering, dining, and customer\
    \ service experiences for its guests and to drive operational\nefficiency across\
    \ its more than 2,200 restaurants; premier visual effects company Weta Digital\
    \ to accelerate rendering\nof graphical visual effects, free up talent and resources,\
    \ and deliver on its multi-year movie slate; leading job site\nIndeed to migrate\
    \ more than 30 petabytes of data to AWS, reducing its global data center footprint\
    \ by 40% while\nstreamlining its IT operations; household appliance manufacturer\
    \ Arçelik to use analytics, IoT, and machine learning\nservices to build smart\
    \ factories, automated production lines, and cloud connected appliances; IT services\
    \ company\n\n\fand AWS Partner Network (APN) Premier Consulting Partner DXC Technology\
    \ to replace its legacy contact center\ntechnology and drive automation, cutting\
    \ operational costs by 40%, reducing volume of common calls by up to 60%,\nand\
    \ migrating 1,000 service desk seats; hotel franchise Best Western International\
    \ to migrate largest contact center\nwithin one month and move all agents to remote\
    \ within one week, enabling seamless support for 14 languages in over\n35 countries\
    \ while reducing costs by 40%; and cold chain provider Carrier to transform how\
    \ temperature-sensitive\ngoods such as food, medicines, and vaccines are moved\
    \ around the world by enhancing safety, reliability, and\nefficiency.\n•\n\nAWS\
    \ and The National Football League (NFL) announced the first six new advanced\
    \ stats for the 2020 season\nthrough the NFL’s Next Gen Stats platform powered\
    \ by AWS. One of the new stats, “Expected Rush Yards,” is born\nout of the NFL’s\
    \ Big Data Bowl competition that AWS sponsored during the NFL Combine. The new\
    \ advanced stats\ncombine player tracking and machine learning to bring new insights\
    \ to game play in the 2020 season.\n\n•\n\nAWS announced the general availability\
    \ of Amazon Braket, a fully managed service that provides a development\nenvironment\
    \ to help customers explore and design quantum algorithms. Quantum computing has\
    \ the potential to solve\ncomputational problems that are beyond the reach of\
    \ classical computers by harnessing the laws of quantum\nmechanics to build more\
    \ powerful tools for processing information. Customers can use Amazon Braket to\
    \ experiment\nwith quantum algorithms through simulated quantum computers running\
    \ on computing resources in AWS to help them\nverify their implementations. When\
    \ ready, customers can use Amazon Braket to run their quantum algorithms on their\n\
    choice of quantum processors based on different technologies, including systems\
    \ from D-Wave, IonQ, and Rigetti.\n\n•\n\nAWS announced the general availability\
    \ of Amazon Timestream, a new time series database for IoT and operational\napplications\
    \ that can scale to process trillions of time series events per day up to 1,000\
    \ times faster than relational\ndatabases, and at as low as 1/10th the cost. Amazon\
    \ Timestream provides a serverless database service that is purposebuilt to manage\
    \ the scale and complexity of time series – such as data collected from industrial\
    \ equipment, website\nclickstream logs, and data center infrastructure – so customers\
    \ can analyze more data more easily and cost effectively,\ngiving them the ability\
    \ to derive additional insights and drive better business decisions from their\
    \ IoT and operational\nmonitoring applications.\n\n•\n\nAWS announced the general\
    \ availability of five AWS Wavelength Zones in Atlanta, Boston, New York City,\
    \ the San\nFrancisco Bay Area, and Washington D.C., enabling developers to build\
    \ applications that deliver ultra-low latency to\nmobile devices and users by\
    \ deploying AWS compute and storage at the edge of Verizon’s 5G network. With\
    \ AWS\nWavelength, developers can serve use cases that require ultra-low latency\
    \ like machine learning inference at the edge,\nautonomous industrial equipment,\
    \ smart cars and cities, Internet of Things (IoT), and Augmented and Virtual Reality.\n\
    AWS is partnering with Verizon to bring AWS Wavelength to additional customers\
    \ across the United States, and with\nother leading telecommunications providers,\
    \ including Vodafone, SK Telecom, and KDDI, to launch Wavelength\nZones across\
    \ Europe, South Korea, and Japan in 2020 and beyond.\n\n•\n\nFor the tenth consecutive\
    \ year, AWS is positioned in the Leader’s quadrant in Gartner’s Magic Quadrant\
    \ for Cloud\nInfrastructure & Platform Service (IaaS & PaaS, or “CIPS”), and once\
    \ again placed highest in Ability to Execute and\nfurthest in Completeness of\
    \ Vision.\n\n•\n\nAWS announced the general availability of Amazon EBS io2 volume,\
    \ the next generation Provisioned IOPS SSD\nvolumes for Amazon Elastic Block Store\
    \ (Amazon EBS). The new io2 volume is designed for 100x higher volume\ndurability\
    \ (99.999%) when compared to the 99.9% durability offered by io1 Amazon EBS volumes.\
    \ Higher volume\ndurability reduces the likelihood of storage failures and makes\
    \ the primary copy of customers’ data more resilient,\nresulting in better application\
    \ availability. With io2, customers can drive 10x higher input/output operations\
    \ per second\n(IOPS) from their provisioned storage at the same price as io1,\
    \ so performance improves significantly without\nincreasing storage cost.\n\n\
    •\n\nAWS announced the general availability of AWS Nitro Enclaves, a new capability\
    \ that makes it easier for customers\nto create isolated compute environments\
    \ within Amazon Elastic Compute Cloud (EC2) instances to securely process\nand\
    \ protect highly sensitive data. AWS Nitro Enclaves helps customers reduce the\
    \ attack surface for their applications\nby providing a trusted, highly isolated,\
    \ and hardened environment for data processing. Each Enclave is a virtual\nmachine\
    \ created using the same Nitro Hypervisor technology that provides CPU and memory\
    \ isolation for Amazon\nEC2 instances, but with no persistent storage, no administrator\
    \ or operator access, and no external networking.\n\n\fFinancial Guidance\nThe\
    \ following forward-looking statements reflect Amazon.com’s expectations as of\
    \ October 29, 2020, and are subject to\nsubstantial uncertainty. Our results are\
    \ inherently unpredictable and may be materially affected by many factors, such\
    \ as\nfluctuations in foreign exchange rates, changes in global economic conditions\
    \ and customer spending, world events, the rate of\ngrowth of the Internet, online\
    \ commerce, and cloud services, and the various factors detailed below. This guidance\
    \ reflects our\nestimates as of October 29, 2020 regarding the impact of the COVID-19\
    \ pandemic on our operations, including those discussed\nabove, and is highly\
    \ dependent on numerous factors that we may not be able to predict or control,\
    \ including: the duration and\nscope of the pandemic, including any recurrence;\
    \ actions taken by governments, businesses, and individuals in response to the\n\
    pandemic; the impact of the pandemic on global and regional economies and economic\
    \ activity, workforce staffing and\nproductivity, and our significant and continuing\
    \ spending on employee safety measures; our ability to continue operations in\n\
    affected areas; and consumer demand and spending patterns, as well as the effects\
    \ on suppliers, creditors, and third-party\nsellers, all of which are uncertain.\
    \ This guidance also assumes the impacts on consumer demand and spending patterns,\n\
    including impacts due to concerns over the current economic outlook, will be in\
    \ line with those experienced during the fourth\nquarter to date, and the additional\
    \ assumptions set forth below. However, it is not possible to determine the ultimate\
    \ impact on\nour operations for the fourth quarter, or whether other currently\
    \ unanticipated direct or indirect consequences of the pandemic\nare reasonably\
    \ likely to materially affect our operations.\nFourth Quarter 2020 Guidance\n\
    •\n•\n•\n\nNet sales are expected to be between $112.0 billion and $121.0 billion,\
    \ or to grow between 28% and 38% compared\nwith fourth quarter 2019. This guidance\
    \ anticipates a favorable impact of approximately 90 basis points from foreign\n\
    exchange rates.\nOperating income is expected to be between $1.0 billion and $4.5\
    \ billion, compared with $3.9 billion in fourth quarter\n2019. This guidance assumes\
    \ approximately $4.0 billion of costs related to COVID-19.\nThis guidance assumes,\
    \ among other things, that no additional business acquisitions, investments, restructurings,\
    \ or\nlegal settlements are concluded.\n\nA conference call will be webcast live\
    \ today at 2:30 p.m. PT/5:30 p.m. ET, and will be available for at least three\
    \ months at\namazon.com/ir. This call will contain forward-looking statements\
    \ and other material information regarding the Company’s\nfinancial and operating\
    \ results.\nThese forward-looking statements are inherently difficult to predict.\
    \ Actual results could differ materially for a variety of\nreasons, including,\
    \ in addition to the factors discussed above, the amount that Amazon.com invests\
    \ in new business\nopportunities and the timing of those investments, the mix\
    \ of products and services sold to customers, the mix of net sales\nderived from\
    \ products as compared with services, the extent to which we owe income or other\
    \ taxes, competition, management\nof growth, potential fluctuations in operating\
    \ results, international growth and expansion, the outcomes of claims, litigation,\n\
    government investigations, and other proceedings, fulfillment, sortation, delivery,\
    \ and data center optimization, risks of\ninventory management, seasonality, the\
    \ degree to which the Company enters into, maintains, and develops commercial\n\
    agreements, proposed and completed acquisitions and strategic transactions, payments\
    \ risks, and risks of fulfillment\nthroughput and productivity. Other risks and\
    \ uncertainties include, among others, risks related to new products, services,\
    \ and\ntechnologies, system interruptions, government regulation and taxation,\
    \ and fraud. In addition, additional or unforeseen effects\nfrom the COVID-19\
    \ pandemic and the global economic climate may give rise to or amplify many of\
    \ these risks. More\ninformation about factors that potentially could affect Amazon.com’s\
    \ financial results is included in Amazon.com’s filings with\nthe Securities and\
    \ Exchange Commission (“SEC”), including its most recent Annual Report on Form\
    \ 10-K and subsequent\nfilings.\nOur investor relations website is amazon.com/ir\
    \ and we encourage investors to use it as a way of easily finding information\n\
    about us. We promptly make available on this website, free of charge, the reports\
    \ that we file or furnish with the SEC, corporate\ngovernance information (including\
    \ our Code of Business Conduct and Ethics), and select press releases, which may\
    \ contain\nmaterial information about us, and you may subscribe to be notified\
    \ of new information posted to this site.\nAbout Amazon\nAmazon is guided by four\
    \ principles: customer obsession rather than competitor focus, passion for invention,\
    \ commitment to\noperational excellence, and long-term thinking. Customer reviews,\
    \ 1-Click shopping, personalized recommendations, Prime,\nFulfillment by Amazon,\
    \ AWS, Kindle Direct Publishing, Kindle, Fire tablets, Fire TV, Amazon Echo, and\
    \ Alexa are some of\nthe products and services pioneered by Amazon. For more information,\
    \ visit amazon.com/about and follow @AmazonNews."
