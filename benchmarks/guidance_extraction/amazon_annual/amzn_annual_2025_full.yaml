  label: Amazon Q4 2025 Earnings Release, February 5, 2026
  text: "AMAZON.COM ANNOUNCES FOURTH QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) February\
    \ 5, 2026—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its fourth quarter ended December 31, 2025.\nFourth Quarter 2025\n•\n\n•\n\
    \n•\n\nNet sales increased 14% to $213.4 billion in the fourth quarter, compared\
    \ with $187.8 billion in fourth quarter 2024.\nExcluding the $2.8 billion favorable\
    \ impact from year-over-year changes in foreign exchange rates throughout the\n\
    quarter, net sales increased 12% compared with fourth quarter 2024.\n•\n\nNorth\
    \ America segment sales increased 10% year-over-year to $127.1 billion.\n\n•\n\
    \nInternational segment sales increased 17% year-over-year to $50.7 billion, or\
    \ increased 11% excluding\nchanges in foreign exchange rates.\n\n•\n\nAWS segment\
    \ sales increased 24% year-over-year to $35.6 billion.\n\nOperating income increased\
    \ to $25.0 billion in the fourth quarter, compared with $21.2 billion in fourth\
    \ quarter 2024.\nFourth quarter 2025 operating income includes three special charges—$1.1\
    \ billion for the resolution of tax disputes\nassociated with our stores business\
    \ in Italy, and the settlement of a lawsuit, $730 million in estimated severance\
    \ costs,\nand $610 million in asset impairments primarily related to physical\
    \ stores. Without these charges, operating income\nwould have been $27.4 billion.\n\
    •\n\nNorth America segment operating income was $11.5 billion, compared with $9.3\
    \ billion in fourth quarter\n2024.\n\n•\n\nInternational segment operating income\
    \ was $1.0 billion, compared with $1.3 billion in fourth quarter 2024.\n\n•\n\n\
    AWS segment operating income was $12.5 billion, compared with $10.6 billion in\
    \ fourth quarter 2024.\n\nNet income increased to $21.2 billion in the fourth\
    \ quarter, or $1.95 per diluted share, compared with $20.0 billion, or\n$1.86\
    \ per diluted share, in fourth quarter 2024.\n\nFull Year 2025\n•\n\n•\n\nNet\
    \ sales increased 12% to $716.9 billion in 2025, compared with $638.0 billion\
    \ in 2024. Excluding the $4.4 billion\nfavorable impact from year-over-year changes\
    \ in foreign exchange rates throughout the year, net sales increased 12%\ncompared\
    \ with 2024.\n•\n\nNorth America segment sales increased 10% year-over-year to\
    \ $426.3 billion.\n\n•\n\nInternational segment sales increased 13% year-over-year\
    \ to $161.9 billion, or increased 10% excluding\nchanges in foreign exchange rates.\n\
    \n•\n\nAWS segment sales increased 20% year-over-year to $128.7 billion.\n\nOperating\
    \ income increased to $80.0 billion in 2025, compared with $68.6 billion in 2024.\n\
    •\n\nNorth America segment operating income was $29.6 billion, compared with operating\
    \ income of $25.0 billion\nin 2024.\n\n•\n\nInternational segment operating income\
    \ was $4.7 billion, compared with an operating income of $3.8 billion\nin 2024.\n\
    \n•\n\nAWS segment operating income was $45.6 billion, compared with operating\
    \ income of $39.8 billion in 2024.\n\n\f•\n\nNet income increased to $77.7 billion\
    \ in 2025, or $7.17 per diluted share, compared with $59.2 billion, or $5.53 per\n\
    diluted share, in 2024.\n\n•\n\nOperating cash flow increased 20% to $139.5 billion\
    \ for the trailing twelve months, compared with $115.9 billion for\nthe trailing\
    \ twelve months ended December 31, 2024.\n\n•\n\nFree cash flow decreased to $11.2\
    \ billion for the trailing twelve months, driven primarily by a year-over-year\
    \ increase\nof $50.7 billion in purchases of property and equipment, net of proceeds\
    \ from sales and incentives. This increase\nprimarily reflects investments in\
    \ artificial intelligence. This compares to free cash flow of $38.2 billion for\
    \ the trailing\ntwelve months ended December 31, 2024.\n\n“AWS growing 24% (our\
    \ fastest growth in 13 quarters), Advertising growing 22%, Stores growing briskly\
    \ across North\nAmerica and International, our chips business growing triple digit\
    \ percentages year-over-year—this growth is happening\nbecause we’re continuing\
    \ to innovate at a rapid rate, and identify and knock down customer problems,”\
    \ said Andy Jassy,\nPresident and CEO, Amazon. “With such strong demand for our\
    \ existing offerings and seminal opportunities like AI, chips,\nrobotics, and\
    \ low earth orbit satellites, we expect to invest about $200 billion in capital\
    \ expenditures across Amazon in 2026,\nand anticipate strong long-term return\
    \ on invested capital.”\nSome other highlights since the company’s last earnings\
    \ announcement include that Amazon:\n•\n\nAnnounced new AWS agreements with OpenAI,\
    \ Visa, the NBA, BlackRock, Perplexity, Lyft, United Airlines,\nDoorDash, Salesforce,\
    \ U.S. Air Force, Adobe, Thomson Reuters, AT&T, S&P Global, National Bank of Canada,\n\
    London Stock Exchange Group, Choice Hotels, Accenture, Indeed, HSBC, CrowdStrike,\
    \ and more.\n\n•\n\nContinued gaining significant momentum with AWS custom chips:\n\
    •\n\nTrainium and Graviton now have a combined annual revenue run rate of over\
    \ $10 billion and growing at a\ntriple digit percentage year-over-year.\n\n•\n\
    \nTrainium2 is fully subscribed with 1.4 million chips landed, and powers the\
    \ majority of inference on Bedrock,\na service used by 100,000+ companies.\n\n\
    •\n\nTrainium2 powers Project Rainier, the world’s largest operational AI compute\
    \ cluster with 500,000+\nTrainium2 chips, which Anthropic is using to train its\
    \ industry-leading AI model, Claude.\n\n•\n\nTrainium3 is now delivering production\
    \ workloads and seeing strong demand, with nearly all Trainium3\nsupply of chips\
    \ expected to be committed by mid-2026.\n\n•\n\nTrainium4 is expected to start\
    \ delivering in 2027, with 6 times the FP4 compute performance, 4 times more\n\
    memory bandwidth, and 2 times more high memory bandwidth capacity than Trainium3.\n\
    \n•\n\nIntroduced Graviton5, AWS’s most powerful and advanced CPU for a broad\
    \ set of cloud workloads. Used by\nover 90% of the top 1,000 AWS customers, Graviton\
    \ is up to 40% more price-performant than leading x86\nprocessors, and enables\
    \ applications to run faster, reduce costs, and meet sustainability goals.\n\n\
    •\n\nAdded 20+ fully-managed models on Amazon Bedrock, including from Amazon Nova\
    \ as well as Anthropic, Google,\nOpenAI, NVIDIA, Qwen, Mistral AI, Stability AI,\
    \ Cohere, MiniMax AI, and Moonshot AI—enabling customers to\ntest and switch between\
    \ models without rewriting code while accessing breakthrough capabilities in coding,\
    \ reasoning,\nand agentic workflows.\n\n•\n\nExpanded its family of Nova models,\
    \ including Nova 2 Lite and Nova 2 Pro for frontier intelligence with lower costs\n\
    and latency, and Nova 2 Sonic for multilingual conversational AI.\n\n•\n\nIntroduced\
    \ Nova Forge, a first-of-its-kind service that empowers organizations to build\
    \ their own optimized variants of\nNova by pre-training the model with their own\
    \ proprietary data early in the process.\n\n•\n\nIntroduced Nova Act for building\
    \ and managing reliable AI agents for UI-based workflows.\n\n•\n\nIntroduced new\
    \ capabilities for Amazon Bedrock AgentCore, AWS’s pioneering set of infrastructure\
    \ building blocks\nfor developers and companies to build secure, scalable agents,\
    \ including:\n•\n\nAgentCore Policy to help block unauthorized agent actions that\
    \ operate outside the agent code and check\nagent actions against policies in\
    \ milliseconds.\n\n•\n\nAgentCore Evaluations to trigger immediate alerts if a\
    \ customer service agent’s satisfaction scores drop\nrapidly, helping enable swift\
    \ response.\n\n•\n\nAgentCore Memory to help agents learn from experiences and\
    \ improve decision-making, reducing processing\ntime and the need for extensive\
    \ custom instructions.\n\n\f•\n\nLaunched a new class of AI agents, called frontier\
    \ agents, to solve tasks more autonomously and over longer\ndurations, including:\n\
    •\n\nKiro agent that can autonomously handle a range of tasks—from triaging bugs\
    \ to improving code coverage.\nCustomers can ask it questions, describe a task,\
    \ and assign tasks in their backlog, and the agent will\nindependently figure\
    \ it out and get the work done.\n\n•\n\nAWS Security Agent that embeds deep security\
    \ expertise throughout the development lifecycle, proactively\nreviewing design\
    \ documents and scanning pull requests against organizational security requirements\
    \ and\ncommon vulnerabilities. It also transforms penetration testing from a slow,\
    \ manual process into an on-demand\ncapability, matching the team’s development\
    \ velocity.\n\n•\n\nAWS DevOps Agent that helps resolve and proactively prevent\
    \ incidents.\n\n•\n\nAnnounced new agentic capabilities in AWS Transform to accelerate\
    \ organization-wide code and application\nmodernization across any code, API,\
    \ framework, runtime, architecture, language, and even company-specific\nprogramming\
    \ languages and frameworks. AWS Transform has also helped customers analyze 1.8\
    \ billion lines of\nmainframe code since launch.\n\n•\n\nLaunched new agentic\
    \ AI capabilities for Amazon Connect—an AI tool that enables contact centers to\
    \ provide\nconsistent, personalized customer experiences—including advanced speech\
    \ models, agentic assistance, AI-powered\nrecommendations, and AI agent observability.\
    \ Connect is a $1 billion annualized revenue run rate business growing\nover 30%,\
    \ and has an average of 20 million+ interactions happening on it each day.\n\n\
    •\n\nIntroduced AWS AI Factories to transform customers’ existing data centers\
    \ into high-performance AI environments,\nwhich accelerates AI buildouts by months\
    \ or years compared to building independently.\n\n•\n\nDelivered at fastest speeds\
    \ ever for Prime members globally in 2025.\n\n•\n\nContinued increasing speed\
    \ for rural customers in the U.S., with the average number of monthly customers\
    \ receiving\nsame-day delivery in rural areas nearly doubling year-over-year.\n\
    \n•\n\nDelivered nearly 70% more items same day in the U.S. than the year before,\
    \ with Same-Day Delivery used by nearly\n100 million customers.\n\n•\n\nExpanded\
    \ Amazon Now ultra-fast delivery, which offers delivery on thousands of items\
    \ in 30 minutes or less. Amazon\nNow is now available in various cities in India,\
    \ Mexico, and the UAE, and is being tested in several communities in\nthe U.S.\
    \ and UK.\n\n•\n\nExpanded Same-Day grocery delivery to 2,300+ cities and towns\
    \ across the U.S., making fresh groceries more\naccessible and transforming how\
    \ customers shop for food, with perishables making up 9 of the top 10 most-ordered\n\
    items in areas where the service is available.\n\n•\n\nExpanded Amazon Pharmacy\
    \ Same-Day Delivery, with same-day delivery of prescriptions now available in\
    \ 3,000+\nU.S. cities and towns.\n\n•\n\nMade Rufus—Amazon’s agentic AI shopping\
    \ assistant—smarter, more capable, and more helpful. Rufus can shop\ntens of millions\
    \ of items in other online stores directly and make purchases on behalf of customers\
    \ using its agentic\nBuy For Me feature. Rufus was used by 300 million+ customers\
    \ and saw an even stronger response than anticipated,\nhelping deliver nearly\
    \ $12 billion in incremental annualized sales last year.\n\n•\n\nSaw strong adoption\
    \ of Lens—an AI tool that helps customers find products with a phone camera, screen\
    \ shot, or bar\ncode—with customers using it 45% more year-over-year.\n\n•\n\n\
    Was named the lowest-priced U.S. retailer by Profitero for the ninth year in a\
    \ row, with online prices on average 14%\nlower than other major U.S. retailers.\n\
    \n•\n\nIncreased selection on Amazon Haul in the U.S. to 1 million+ items under\
    \ $10, with many under $5, and expanded to\nserve customers in 25+ countries and\
    \ regions.\n\n•\n\nBroke several records with the fourth season of Thursday Night\
    \ Football on Prime Video, the most-watched season of\nThursday Night Football\
    \ ever, averaging 15 million+ viewers—a 16% increase year-over-year and third\
    \ consecutive\nyear of double-digit growth.\n\n•\n\nHad the most-streamed NFL\
    \ game in history with 31 million+ viewers watching the Packers vs. Bears Wild\
    \ Card\nPlayoff game, clearing the prior record by 4 million+.\n\n•\n\nDebuted\
    \ NBA on Prime in more than 200 countries, including streaming exclusive coverage\
    \ of the Emirates NBA\nCup, culminating with the Spurs vs. Knicks Championship,\
    \ which averaged 3 million+ viewers and attracted the\nyoungest-ever audience\
    \ for a Cup Championship, according to Nielsen.\n\n\f•\n\nExtended broadcast rights\
    \ for UEFA Champions League in Germany, Ireland, Italy, and the UK through 2030/31\n\
    season. This follows continued strong viewership, including a record-breaking\
    \ 10 million+ viewers streaming League\nPhase matches on Prime Video in Germany,\
    \ Ireland, and the UK in a single evening.\n\n•\n\nAnnounced that Alexa+ is available\
    \ to all customers in the U.S. for $19.99 per month as a standalone subscription,\
    \ and\nfree for Prime members. Customers without Prime can try the Alexa+ chat\
    \ experience for free at Alexa.com.\n\n•\n\nAdded new capabilities to Alexa+,\
    \ including answering a Ring doorbell, more ways to shop, and more ways to manage\n\
    a home.\n\n•\n\nIntroduced new ways for customers to interact with Alexa+, including\
    \ Alexa.com, a new mobile app, and third-party\ndevices like Samsung TVs and BMW\
    \ cars.\n\n•\n\nUnveiled Leo Ultra, an enterprise-grade customer terminal for\
    \ Amazon Leo and the fastest satellite internet antenna\never built, delivering\
    \ simultaneous download speeds up to 1 Gbps and upload speeds up to 400 Mbps,\
    \ powered by\ncustom Leo silicon.\n\n•\n\nLaunched redesigned Kindle Scribe lineup\
    \ with first-ever color Scribe. Lineup is thinner, lighter, and faster with new\n\
    productivity features, including AI-powered notebook search.\n\n•\n\nRolled out\
    \ Ring’s AI-powered Search Party for Dogs across the U.S. to help communities\
    \ more quickly find and bring\nhome lost dogs, already helping reunite more than\
    \ one dog per day with their families.\n\n•\n\nRanked No. 3 on Fortune magazine’s\
    \ World’s Most Admired Companies list, the tenth consecutive year in top three.\n\
    \nFinancial Guidance\nThe following forward-looking statements reflect Amazon.com’s\
    \ expectations as of February 5, 2026, and are subject to\nsubstantial uncertainty.\
    \ Our results are inherently unpredictable and may be materially affected by many\
    \ factors, such as\nfluctuations in foreign exchange rates and energy prices,\
    \ changes in global economic and geopolitical conditions, tariff and\ntrade policies,\
    \ resource and supply volatility, including for memory chips, and customer demand\
    \ and spending (including the\nimpact of recessionary fears), inflation, interest\
    \ rates, regional labor market constraints, world events, the rate of growth of\
    \ the\ninternet, online commerce, cloud services, and new and emerging technologies,\
    \ and the various factors detailed below.\nFirst Quarter 2026 Guidance\n•\n\n\
    Net sales are expected to be between $173.5 billion and $178.5 billion, or to\
    \ grow between 11% and 15% compared\nwith first quarter 2025. This guidance anticipates\
    \ a favorable impact of approximately 180 basis points from foreign\nexchange\
    \ rates.\n\n•\n\nOperating income is expected to be between $16.5 billion and\
    \ $21.5 billion, compared with $18.4 billion in first\nquarter 2025. This guidance\
    \ includes approximately $1 billion of higher year-over-year Amazon Leo costs\
    \ as we scale\nin 2026, as well as investment in quick commerce and even sharper\
    \ prices in our international stores business.\n\n•\n\nThis guidance assumes,\
    \ among other things, that no additional business acquisitions, restructurings,\
    \ or legal\nsettlements are concluded.\n\nConference Call Information\nA conference\
    \ call will be webcast live today at 2:00 p.m. PT/5:00 p.m. ET, and will be available\
    \ for at least three months at\namazon.com/ir. This call will contain forward-looking\
    \ statements and other material information regarding the Company’s\nfinancial\
    \ and operating results.\nForward-Looking Statements\nThese forward-looking statements\
    \ are inherently difficult to predict. Actual results and outcomes could differ\
    \ materially for a\nvariety of reasons, including, in addition to the factors\
    \ discussed above, the amount that Amazon.com invests in new business\nopportunities\
    \ and the timing of those investments, the mix of products and services sold to\
    \ customers, the mix of net sales\nderived from products as compared with services,\
    \ the extent to which we owe income or other taxes, competition, management\n\
    of growth, potential fluctuations in operating results, international growth and\
    \ expansion, the outcomes of claims, litigation,\ngovernment investigations, and\
    \ other proceedings, fulfillment, sortation, delivery, and data center optimization,\
    \ risks of\ninventory management, variability in demand, the degree to which the\
    \ Company enters into, maintains, and develops\ncommercial agreements, proposed\
    \ and completed acquisitions and strategic transactions, payments risks, and risks\
    \ of\nfulfillment throughput and productivity. Other risks and uncertainties include,\
    \ among others, risks related to new products,\nservices, and technologies, security\
    \ incidents, system interruptions, government regulation and taxation, and fraud.\
    \ In addition,\nglobal economic and geopolitical conditions and additional or\
    \ unforeseen circumstances, developments, or events may give\nrise to or amplify\
    \ many of these risks. More information about factors that potentially could affect\
    \ Amazon.com’s financial\n\n\fresults is included in Amazon.com’s filings with\
    \ the Securities and Exchange Commission (“SEC”), including its most recent\n\
    Annual Report on Form 10-K and subsequent filings.\nAdditional Information\nOur\
    \ investor relations website is amazon.com/ir and we encourage investors to use\
    \ it as a way of easily finding information\nabout us. We promptly make available\
    \ on this website, free of charge, the reports that we file or furnish with the\
    \ SEC, corporate\ngovernance information (including our Code of Business Conduct\
    \ and Ethics), and select press releases, which may contain\nmaterial information\
    \ about us, and you may subscribe to be notified of new information posted to\
    \ this site.\nAbout Amazon\nAmazon is guided by four principles: customer obsession\
    \ rather than competitor focus, passion for invention, commitment to\noperational\
    \ excellence, and long-term thinking. Amazon strives to be Earth’s Most Customer-Centric\
    \ Company, Earth’s Best\nEmployer, and Earth’s Safest Place to Work. Customer\
    \ reviews, 1-Click shopping, personalized recommendations, Prime,\nFulfillment\
    \ by Amazon, AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire tablets,\
    \ Fire TV, Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios, and\
    \ The Climate Pledge are some of the things pioneered by Amazon. For more\ninformation,\
    \ visit amazon.com/about and follow @AmazonNews."
