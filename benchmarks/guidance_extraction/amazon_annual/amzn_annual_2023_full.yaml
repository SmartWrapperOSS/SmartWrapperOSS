  label: Amazon Q4 2023 Earnings Release, February 1, 2024
  text: "AMAZON.COM ANNOUNCES FOURTH QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) February\
    \ 1, 2024—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its fourth quarter ended December 31, 2023.\nFourth Quarter 2023\n•\n\n•\n\
    \n•\n\nNet sales increased 14% to $170.0 billion in the fourth quarter, compared\
    \ with $149.2 billion in fourth quarter 2022.\nExcluding the $1.3 billion favorable\
    \ impact from year-over-year changes in foreign exchange rates throughout the\n\
    quarter, net sales increased 13% compared with fourth quarter 2022.\n•\n\nNorth\
    \ America segment sales increased 13% year-over-year to $105.5 billion.\n\n•\n\
    \nInternational segment sales increased 17% year-over-year to $40.2 billion, or\
    \ increased 13% excluding\nchanges in foreign exchange rates.\n\n•\n\nAWS segment\
    \ sales increased 13% year-over-year to $24.2 billion.\n\nOperating income increased\
    \ to $13.2 billion in the fourth quarter, compared with $2.7 billion in fourth\
