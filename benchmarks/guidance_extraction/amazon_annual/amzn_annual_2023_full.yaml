    \ starting pay by £1 per hour\nand bringing the minimum starting hourly wage for\
    \ frontline operations employees in the UK to between £12.30 and\n£13.00 by April\
    \ 2024. The increase means Amazon’s minimum starting pay in the UK will have increased\
    \ 20% over\ntwo years, and 50% since 2018.\n\n\f•\n\nGave Amazon customers a way\
    \ to show appreciation for delivery drivers during the holiday season with the\
    \ “Alexa,\nThank My Driver” promotion. Over a two-day period, customers thanked\
    \ their drivers 2 million times, with drivers\nreceiving $5 per thank you at no\
    \ cost to the customer.\n\nSupporting communities and protecting the environment\n\
    Amazon believes that success and scale bring broad responsibility to help the\
    \ planet, future generations, and communities.\nAmazon employees have passion\
    \ for investing in these areas, and a sampling of the efforts from this past quarter\
    \ are that\nAmazon:\n•\n\nReleased the company’s U.S. Community Impact Report,\
    \ which shows Amazon has delivered more than 33 million\nmeals directly to underserved\
    \ families from 2020 to 2023; donated over 88 million pounds of food from 2020\
    \ to 2023;\nprovided STEM education, literacy, and career exploration courses\
    \ to 6,000 schools and 560,000 students during the\n2022-2023 academic year; and\
    \ provided free training in cloud computing and technology to more than 13 million\n\
    adults in the last year.\n\n•\n\nProvided more than 75,000 relief items to communities\
    \ impacted by Hurricane Otis near Acapulco, Mexico, using\nAmazon’s global logistics\
    \ capabilities. AWS also supported nonprofit Help.NGO to build an emergency connectivity\n\
    network in Mexico to allow first responders to map the impacted area, and offered\
    \ cloud computing resources to\nprocess mapping data collected on-site to assess\
    \ storm damage.\n\n•\n\nAnnounced new renewable energy projects, including Amazon’s\
    \ first brownfield solar project, which will repurpose a\npreviously polluted\
    \ Maryland coal mine site into a solar farm; 11 renewable energy projects across\
    \ Texas; Amazon’s\nfirst renewable energy project in South Korea; and a 198-megawatt\
    \ wind farm in India. In 2023, Amazon added 100\nnew solar and wind projects.\n\
    \n•\n\nAnnounced Amazon’s first U.S. fulfillment center to eliminate plastic delivery\
    \ packaging and replace it with paper\npackaging that is curbside recyclable,\
    \ part of a multi-year plan to convert U.S. fulfillment centers to paper packaging.\n\
    In addition, Amazon announced that delivery packaging is now fully recyclable\
    \ in Europe.\n\n•\n\nAnnounced that AWS more than doubled the amount of lower-carbon\
    \ concrete and steel used to build its data centers\nin 2023 compared to 2022.\
    \ AWS collaborates with local suppliers to increase the availability of these\
    \ materials across\nthe construction industry. Emissions released during building\
    \ materials’ life cycle accounts for around 11% of global\ncarbon emissions.\n\
    \n•\n\nPublished the AWS Economic Impact Study, which highlights that AWS invested\
    \ more than $108 billion in U.S. cloud\ninfrastructure from 2011 through 2022,\
    \ contributed nearly $38 billion in estimated gross domestic product to the U.S.\n\
    economy, and supported an estimated annual average of nearly 30,000 jobs in local\
    \ communities where AWS operates.\n\n•\n\nLaunched AI Ready to provide free AI\
    \ skills training to 2 million people globally by 2025. The program includes eight\n\
    free AWS-designed AI courses and a new generative AI scholarship program to help\
    \ more than 50,000 high school\nand university students from underserved and underrepresented\
    \ communities gain AI skills.\n\nFinancial Guidance\nThe following forward-looking\
    \ statements reflect Amazon.com’s expectations as of February 1, 2024, and are\
    \ subject to\nsubstantial uncertainty. Our results are inherently unpredictable\
    \ and may be materially affected by many factors, such as\nfluctuations in foreign\
    \ exchange rates, changes in global economic and geopolitical conditions and customer\
    \ demand and\nspending (including the impact of recessionary fears), inflation,\
    \ interest rates, regional labor market constraints, world events,\nthe rate of\
    \ growth of the internet, online commerce, cloud services, and new and emerging\
    \ technologies, and the various factors\ndetailed below.\nFirst Quarter 2024 Guidance\n\
    •\n•\n•\n\nNet sales are expected to be between $138.0 billion and $143.5 billion,\
    \ or to grow between 8% and 13% compared\nwith first quarter 2023. This guidance\
    \ anticipates a favorable impact of approximately 40 basis points from foreign\n\
    exchange rates.\nOperating income is expected to be between $8.0 billion and $12.0\
    \ billion, compared with $4.8 billion in first quarter\n2023. This guidance includes\
    \ approximately $0.9 billion lower depreciation expense due to an increase in\
    \ the\nestimated useful life of our servers beginning on January 1, 2024.\nThis\
    \ guidance assumes, among other things, that no additional business acquisitions,\
    \ restructurings, or legal\nsettlements are concluded.\n\n\fA conference call\
    \ will be webcast live today at 2:30 p.m. PT/5:30 p.m. ET, and will be available\
    \ for at least three months at\namazon.com/ir. This call will contain forward-looking\
    \ statements and other material information regarding the Company’s\nfinancial\
    \ and operating results.\nThese forward-looking statements are inherently difficult\
    \ to predict. Actual results and outcomes could differ materially for a\nvariety\
    \ of reasons, including, in addition to the factors discussed above, the amount\
    \ that Amazon.com invests in new business\nopportunities and the timing of those\
    \ investments, the mix of products and services sold to customers, the mix of\
    \ net sales\nderived from products as compared with services, the extent to which\
    \ we owe income or other taxes, competition, management\nof growth, potential\
    \ fluctuations in operating results, international growth and expansion, the outcomes\
    \ of claims, litigation,\ngovernment investigations, and other proceedings, fulfillment,\
    \ sortation, delivery, and data center optimization, risks of\ninventory management,\
    \ variability in demand, the degree to which the Company enters into, maintains,\
    \ and develops\ncommercial agreements, proposed and completed acquisitions and\
    \ strategic transactions, payments risks, and risks of\nfulfillment throughput\
    \ and productivity. Other risks and uncertainties include, among others, risks\
    \ related to new products,\nservices, and technologies, security breaches, system\
    \ interruptions, government regulation and taxation, and fraud. In addition,\n\
    global economic and geopolitical conditions and additional or unforeseen circumstances,\
    \ developments, or events may give\nrise to or amplify many of these risks. More\
    \ information about factors that potentially could affect Amazon.com’s financial\n\
    results is included in Amazon.com’s filings with the Securities and Exchange Commission\
    \ (“SEC”), including its most recent\nAnnual Report on Form 10-K and subsequent\
    \ filings.\nOur investor relations website is amazon.com/ir and we encourage investors\
    \ to use it as a way of easily finding information\nabout us. We promptly make\
    \ available on this website, free of charge, the reports that we file or furnish\
    \ with the SEC, corporate\ngovernance information (including our Code of Business\
    \ Conduct and Ethics), and select press releases, which may contain\nmaterial\
    \ information about us, and you may subscribe to be notified of new information\
    \ posted to this site.\nAbout Amazon\nAmazon is guided by four principles: customer\
    \ obsession rather than competitor focus, passion for invention, commitment to\n\
    operational excellence, and long-term thinking. Amazon strives to be Earth’s Most\
    \ Customer-Centric Company, Earth’s Best\nEmployer, and Earth’s Safest Place to\
    \ Work. Customer reviews, 1-Click shopping, personalized recommendations, Prime,\n\
    Fulfillment by Amazon, AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire\
    \ tablets, Fire TV, Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios,\
    \ and The Climate Pledge are some of the things pioneered by Amazon. For more\n\
    information, visit amazon.com/about and follow @AmazonNews."
