  label: Amazon Q3 2022 Earnings Release, October 27, 2022
  text: "AMAZON.COM ANNOUNCES THIRD QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) October\
    \ 27, 2022—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial\nresults\
    \ for its third quarter ended September 30, 2022.\n•\n\n•\n\n•\n\nNet sales increased\
    \ 15% to $127.1 billion in the third quarter, compared with $110.8 billion in\
    \ third quarter 2021.\nExcluding the $5.0 billion unfavorable impact from year-over-year\
    \ changes in foreign exchange rates throughout the\nquarter, net sales increased\
    \ 19% compared with third quarter 2021.\n•\n\nNorth America segment sales increased\
    \ 20% year-over-year to $78.8 billion.\n\n•\n\nInternational segment sales decreased\
    \ 5% year-over-year to $27.7 billion, but increased 12% excluding\nchanges in\
    \ foreign exchange rates.\n\n•\n\nAWS segment sales increased 27% year-over-year\
    \ to $20.5 billion, or increased 28% excluding changes in\nforeign exchange rates.\n\
    \nOperating income decreased to $2.5 billion in the third quarter, compared with\
    \ $4.9 billion in third quarter 2021.\n•\n\nNorth America segment operating loss\
    \ was $0.4 billion, compared with operating income of $0.9 billion in\nthird quarter\
    \ 2021.\n\n•\n\nInternational segment operating loss was $2.5 billion, compared\
    \ with operating loss of $0.9 billion in third\nquarter 2021.\n\n•\n\nAWS segment\
    \ operating income was $5.4 billion, compared with operating income of $4.9 billion\
    \ in third\nquarter 2021.\n\nNet income decreased to $2.9 billion in the third\
    \ quarter, or $0.28 per diluted share, compared with $3.2 billion, or\n$0.31 per\
    \ diluted share, in third quarter 2021.\n•\n\nThird quarter 2022 net income includes\
    \ a pre-tax valuation gain of $1.1 billion included in non-operating\nincome from\
    \ the common stock investment in Rivian Automotive, Inc.\n\n•\n\nOperating cash\
    \ flow decreased 27% to $39.7 billion for the trailing twelve months, compared\
    \ with $54.7 billion for\nthe trailing twelve months ended September 30, 2021.\n\
    \n•\n\nFree cash flow decreased to an outflow of $19.7 billion for the trailing\
    \ twelve months, compared with an inflow of\n$2.6 billion for the trailing twelve\
    \ months ended September 30, 2021.\n\n•\n\nFree cash flow less principal repayments\
    \ of finance leases and financing obligations decreased to an outflow of\n$28.5\
    \ billion for the trailing twelve months, compared with an outflow of $8.8 billion\
    \ for the trailing twelve months\nended September 30, 2021.\n\n•\n\nFree cash\
    \ flow less equipment finance leases and principal repayments of all other finance\
    \ leases and financing\nobligations decreased to an outflow of $21.5 billion for\
    \ the trailing twelve months, compared with an outflow of $3.9\nbillion for the\
    \ trailing twelve months ended September 30, 2021.\n\n\f“In the past four months,\
    \ employees across our consumer businesses have worked relentlessly to put together\
    \ compelling Prime\nMember Deal Events with our eighth annual Prime Day and the\
    \ brand new Prime Early Access Sale in early October. The\ncustomer response to\
    \ both events was quite positive, and it’s clear that particularly during these\
    \ uncertain economic times,\ncustomers appreciate Amazon’s continued focus on\
    \ value and convenience,” said Andy Jassy, Amazon CEO. “We’re also\nencouraged\
    \ by the steady progress we’re making on lowering costs in our stores fulfillment\
    \ network, and have a set of\ninitiatives that we’re methodically working through\
    \ that we believe will yield a stronger cost structure for the business moving\n\
    forward. There is obviously a lot happening in the macroeconomic environment,\
    \ and we’ll balance our investments to be more\nstreamlined without compromising\
    \ our key long-term, strategic bets. What won’t change is our maniacal focus on\
    \ the customer\nexperience, and we feel confident that we’re ready to deliver\
    \ a great experience for customers this holiday shopping season.”\nHighlights\n\
    Obsessing over the customer experience\nAmazon obsesses over how to make customers’\
    \ lives better and easier every day. This is true for consumers, sellers, brands,\n\
    developers, enterprises, and creators. For example, in the past quarter, Amazon:\n\
    •\n\nPremiered several new entertainment series, including The Lord of the Rings:\
    \ The Rings of Power, which attracted\nmore than 25 million global viewers on\
    \ its first day, the biggest debut in Prime Video history, and closing in on 100\n\
    million viewers to date. The company also premiered three new Original and three\
    \ returning series, including Heidi\nKlum and Tim Gunn’s Making the Cut; The Outlaws,\
    \ starring Christopher Walken and Stephen Merchant; and thriller\nThe Peripheral,\
    \ starring Chloë Grace Moretz.\n\n•\n\nKicked off the inaugural season of Prime\
    \ Video as the exclusive home of NFL Thursday Night Football with more\nthan 15\
    \ million viewers for its first game. Live sports also returned to Prime Video\
    \ across Europe with new seasons of\nUEFA Champions League soccer in Germany and\
    \ Italy, Ligue 1 soccer in France, and exclusive coverage of US Open\ntennis in\
    \ the UK.\n\n•\n\nIntroduced the first-ever Prime Early Access Sale, a two-day\
    \ shopping event on October 11-12 exclusively for Prime\nmembers in 15 countries.\
    \ Customers could choose from hundreds of thousands of deals across all best-selling\n\
    categories, such as apparel, home, toys and Amazon devices. Amazon’s selling partners,\
    \ most of which are small and\nmedium-sized businesses, also took part in the\
    \ event, and customers responded by ordering more than 100 million\nitems from\
    \ these businesses.\n\n•\n\nOpened a dozen new fulfillment centers globally in\
    \ order to serve more customers even more quickly. New sites were\nopened in the\
    \ U.S., Mexico, Canada, Ireland, and Turkey.\n\n•\n\nExpanded to Belgium with\
    \ the launch of Amazon.com.be and a Prime program for local customers, providing\
    \ faster\naccess to more than 180 million products across more than 30 product\
    \ categories. As part of the launch, Amazon\nintroduced the “Brands of Belgium”\
    \ storefront to showcase products from Belgian entrepreneurs.\n\n•\n\nPartnered\
    \ with new brands and retailers to make their products available on Amazon with\
    \ same-day delivery for Prime\nmembers in select ZIP codes across over 10 U.S.\
    \ cities. Examples of these partners include GNC, PacSun, SuperDry,\nSur La Table,\
    \ and 100% Pure.\n\n•\n\nContinued working to protect customers from fake reviews\
    \ through legal action against fake review brokers, filing its\nfirst criminal\
    \ complaint in Italy and its first lawsuit in Spain. These two legal proceedings,\
    \ plus 10 other new lawsuits\nrecently launched in the U.S., target bad actors\
    \ that operate more than 11,000 websites and social media groups that\nattempt\
    \ to orchestrate fake reviews on Amazon and other stores. Amazon stops millions\
    \ of suspicious reviews before\ncustomers ever see them, and these legal actions\
    \ help uncover perpetrators and stop the abuse where it starts.\n\n•\n\nRolled\
    \ out Venmo as a new payment option in the U.S., giving customers more choice\
    \ during the checkout experience.\n\n•\n\nHosted Amazon Accelerate, an annual\
    \ conference dedicated to seller success where numerous new tools were\nintroduced,\
    \ including new email marketing capabilities, free-to-use shipping software that\
    \ offers discounted shipping\nrates, and new features and analytics on conversion-driving\
    \ content.\n\n•\n\nAnnounced new commitments and migrations from AWS customers\
    \ across many industries and geographies, such as\nBMW Group, which extended its\
    \ work to help BMW’s developers derive insights from the data their vehicles produce;\n\
    grocery delivery service Schwan’s Home Delivery, which is optimizing delivery\
    \ times across its routes, building and\nscaling its technology infrastructure\
    \ to support evolving consumer preferences, and personalizing product\nrecommendations;\
    \ online grocery platform Pick n Pay, which migrated its entire on-premises SAP\
    \ environment to\nAWS to automate operations and deliver real-time insights; German\
    \ national football league Bundesliga, which\ndebuted two new Bundesliga Match\
    \ Facts powered by AWS to help fans better understand team performance and\n\n\
    \fgame strategy; and South Korea-based wireless telecommunications operator SK\
    \ Telecom (SKT), which is making it\neasier and more cost-effective for customers\
    \ to build, use, and scale computer vision applications.\n•\n\nContinued to expand\
    \ AWS’s infrastructure footprint to support customers, announcing plans to launch\
    \ the AWS Asia\nPacific (Bangkok) Region in Thailand and opening the second Region\
    \ in the Middle East, the AWS Middle East\n(UAE) Region.\n\n•\n\nReceived CrowdStrike’s\
    \ 2022 Ecosystem Partner of the year award for AWS. Together, CrowdStrike and\
    \ AWS\ndelivered end-to-end comprehensive protection that enables AWS customers\
    \ to build, run, and secure applications with\nspeed and confidence.\n\nInventing\
    \ on behalf of customers\nAmazon is driven by a passion for invention across all\
    \ of its business areas. The company builds new products and services that\ncustomers\
    \ ask for, and also invents new ones that customers didn’t know they wanted but\
    \ make their lives or businesses better\nin some meaningful way. For example,\
    \ this past quarter, Amazon:\n•\n\nIntroduced a range of new Fire TV devices and\
    \ entertainment experiences, including the Omni QLED Series smart TV\nwith hands-free\
    \ Alexa controls and new ambient features that turn the TV into an always-smart\
    \ device when not\nstreaming; and the all-new Fire TV Cube streaming media player\
    \ with a faster processor for increased app launch\nspeeds, an industry-first\
    \ HDMI input port, and Wi-Fi 6E support for smoother 4K streaming.\n\n•\n\nIntroduced\
    \ the next generation of Echo Dot and Echo Auto, as well as upgrades to Echo Studio.\
    \ The all-new Echo Dot\nand Echo Dot with Clock feature a redesigned audio architecture,\
    \ and the Echo Dot Kids now comes in Owl and\nDragon designs. The next generation\
    \ Echo Auto is designed to hear requests over music, the air conditioner, and\
    \ road\nnoise, and the new Echo Studio features bass extension and custom-built\
    \ spatial audio processing technology.\n\n•\n\nLaunched three new Kindle devices:\
    \ Kindle Scribe, the first Kindle that makes it possible for customers to both\
    \ read\nand write as naturally as they do on paper but with the convenience of\
    \ Kindle’s glare-free Paperwhite display; the\nnext-generation Kindle, Amazon’s\
    \ lightest and most compact Kindle yet; and the next-generation Kindle Kids.\n\
    \n•\n\nExpanded the Ring lineup with new security devices and features: Ring Intercom\
    \ allows customers living in apartment\nbuildings to use their phone to talk to\
    \ and buzz in visitors; Spotlight Cam Pro and Spotlight Cam Plus use radar\nsensors\
    \ to detect motion and send more precise alerts; Ring Alarm Panic Button enables\
    \ customers to get help at the\npush of a button in an emergency; and a new integration\
    \ of Ring Virtual Security Guard and the Amazon Astro robot\nfor businesses offers\
    \ expanded security options.\n\n•\n\nAnnounced the Blink Wired Floodlight Camera,\
    \ which features person detection for the first time in a Blink device,\nand Blink\
    \ Mini Pan Tilt accessory, which extends the functionality of the popular Blink\
    \ Mini with additional\nviewpoint capabilities.\n\n•\n\nLaunched a new Alexa feature\
    \ called Customers ask Alexa that enables brands and selling partners to answer\
    \ common\ncustomer questions through Alexa and better inform purchase decisions.\n\
    \n•\n\nContinued to collaborate with leading retailers and stadiums to equip their\
    \ locations with Just Walk Out technology for\ncheckout-free shopping and Amazon\
    \ One for palm recognition and payment. One or both of these technologies are\n\
    now available at Texas A&M’s Kyle Field, Lumen Field in Seattle, Crypto.com Arena\
    \ in Los Angeles, and a Hudson\nNonstop at Dallas Fort Worth International Airport.\
    \ Amazon also continued to roll out Amazon One at Whole Foods\nMarket stores with\
    \ the technology now available at over 65 stores in California.\n\n•\n\nAnnounced\
    \ the general availability of new AWS EC2 machine learning training instances\
    \ (Trn1), which make it\npossible to build more accurate machine learning models\
    \ and reduce training times. AWS-designed Trainium chips are\npurpose-built for\
    \ high-performance machine learning training in the cloud. With Trainium-powered\
    \ Trn1 instances,\nAWS customers can save up to 50% on deep learning training\
    \ costs over equivalent GPU-based instances.\n\n•\n\nAnnounced the general availability\
    \ of AWS IoT FleetWise, which makes it easier to collect, transform, and transfer\n\
    vehicle data to the cloud in near real time. Automakers, suppliers, fleet operators,\
    \ and technology solution vendors can\nuse the data to analyze vehicle fleet health\
    \ and more quickly identify potential recalls or safety issues, make in-vehicle\n\
    infotainment systems smarter, and improve advanced technologies like autonomous\
    \ driving and advanced driverassistance systems with analytics and machine learning.\n\
    \n•\n\nAnnounced a new alliance and investment with Harvard University to advance\
    \ fundamental research and innovation in\nquantum networking, which will explore\
    \ applications to combat privacy and security threats. AWS also announced the\n\
    AWS Generation Q Fund at the Harvard Quantum Initiative to train the next-generation\
    \ of quantum scientists and\nengineers.\n\n\fEmpowering employees and delivery\
    \ service partners\nIn addition to its focus on customers, Amazon strives to make\
    \ every day better for its employees and delivery service providers.\nThere is\
    \ a long list of initiatives the company continues to pursue. For example, in\
    \ the third quarter, the company:\n•\n\nAnnounced it is investing nearly $1 billion\
    \ in pay increases for its fulfillment network employees over the next year in\n\
    the U.S., bringing average pay to more than $19 per hour.\n\n•\n\nExpanded Anytime\
    \ Pay to provide hourly employees with instant access to up to 70% of their pay\
    \ at any time during\nthe month.\n\n•\n\nCelebrated the 10-year anniversary of\
    \ Career Choice, an education benefit that empowers employees to learn new\nskills\
    \ for career success and has seen over 90,000 employees participate so far.\n\n\
    •\n\nAnnounced it is investing more than $450 million over the next year to help\
    \ Delivery Service Partners (DSPs) support\ntheir teams with access to new and\
    \ improved benefits, and additional rate increases. One new benefits provider,\
    \ Next\nMile, offers drivers employed by participating DSPs access to more than\
    \ 1,700 academic programs with tuition\nassistance from their DSP. Participating\
    \ DSPs are eligible to receive up to $5,250 per driver per year from Amazon to\n\
    help cover the costs of tuition assistance.\n\n•\n\nExpanded career advancement\
    \ and development programs for front-line employees, such as offering the Amazon\n\
    Intelligence Initiative to enhance technical skills and place employees in engineering\
    \ roles within AWS.\n\n•\n\nAnnounced plans to hire 150,000 people for open seasonal,\
    \ full-time, and part-time roles across its operations network\nin the U.S. to\
    \ help deliver for customers during the holidays.\n\n•\n\nIntroduced an additional,\
    \ free mental wellness program for employees and their families in the U.S., the\
    \ UK, and\nBrazil. Offered through Twill Therapeutics, the tools and services\
    \ to improve mental health are available 24/7 and can\nbe used to address in-the-moment\
    \ concerns or as part of a daily mental health and well-being routine.\n\nSupporting\
    \ communities and protecting the environment\nAmazon believes that success and\
    \ scale bring broad responsibility to help the planet, future generations, and\
    \ local communities\nin which the company has a significant presence. Amazon employees\
    \ have passion for investing in these areas, and a small\nsampling of the many\
    \ efforts from this past quarter include Amazon:\n•\n\nSupporting people affected\
    \ by Hurricane Fiona in Puerto Rico and Hurricane Ian in Florida by providing\
    \ hundreds of\nthousands of essential products such as water filters and medical\
    \ supplies; sending more than 320,000 bottles of water\nto residents of Jackson,\
    \ Mississippi, suffering from a shortage of clean water; and donating items such\
    \ as blankets and\nflashlights after the magnitude 6.8 earthquake in Sichuan Luding,\
    \ China.\n\n•\n\nContinuing to support people impacted by the war in Ukraine with\
    \ product donations to refugees, financial support to\nmore than 150 nonprofits\
    \ on the ground in Eastern Europe, and cloud credits and technological assistance\
    \ through\nAWS. As part of the support for the Ukrainian government, AWS sent\
    \ Snowball devices—ruggedized compute and\nstorage hardware—into Ukraine to help\
    \ secure, store, and transfer over 10 petabytes (10 million gigabytes) of essential\n\
    data to the cloud. These Snowball devices were the foundation for the effort to\
    \ preserve Ukraine’s data—including\nstate registries, education records, and\
    \ other essential databases—which are critical in rebuilding the country. Amazon\n\
    has donated more than $45 million in assistance since the start of the war and\
    \ waived the referral fee for all Ukrainian\nsmall and medium-sized businesses\
    \ selling in Amazon’s European stores. In addition, AWS launched IT Skills 4U,\
    \ a\nfree workforce-development initiative to provide Ukrainians around the world\
    \ with access to skills training.\n\n•\n\nCommitting to hire at least 5,000 refugees\
    \ in the U.S. by the end of 2024. The company is also providing support and\n\
    resources through its Welcome Door program, which launched in April 2022 to help\
    \ refugee employees navigate the\nimmigration process.\n\n•\n\nCommitting $147\
    \ million to create and preserve 1,260 affordable homes across the Washington,\
    \ D.C., metro area in\npartnership with minority-led organizations. This investment\
    \ is the latest initiative by the Amazon Housing Equity\nFund, a $2 billion commitment\
    \ to create and preserve affordable homes in Amazon’s hometown communities.\n\n\
    •\n\nAnnouncing plans to invest more than €1 billion over the next five years\
    \ to further electrify and decarbonize its\ntransportation network across Europe.\
    \ This includes investments in electric trucks, vans, and micro mobility solutions\n\
    like e-cargo bikes, as well as charging infrastructure.\n\n•\n\nAnnouncing agreements\
    \ with Plug Power to supply 10,950 tons of green hydrogen per year for Amazon’s\n\
    transportation and building operations, and with Infinium to bring clean-burning\
    \ electrofuels to Amazon’s middle mile\ntransportation fleet starting next year.\n\
    \n\f•\n\nAnnouncing 71 new renewable energy projects globally, including its first\
    \ project in Brazil and its first solar farms in\nIndia and Poland, building on\
    \ Amazon’s position as the leading corporate buyer of renewable energy in the\
    \ world.\n\n•\n\nExtending its partnership with Water.org, donating $10 million\
    \ to help launch the Water.org Water & Climate Fund.\nThe fund is focused on climate-resilient\
    \ water and sanitation solutions that will result in lasting access for 100 million\n\
    people across Asia, Africa, and Latin America. In addition, Amazon’s funding will\
    \ help provide 1 million people with\naccess to clean water by 2025.\n\n•\n\n\
    Launching Amazon Catalytic Capital to invest $150 million in venture capital funds,\
    \ accelerators, incubators, and\nventure studios that provide funding to entrepreneurs\
    \ from underrepresented backgrounds.\n\n•\n\nAnnouncing AWS has now helped more\
    \ than 13 million people globally gain access to free cloud computing skills\n\
    training since 2020 as part of Amazon’s commitment to provide free training to\
    \ 29 million people around the world by\n2025.\n\nFinancial Guidance\nThe following\
    \ forward-looking statements reflect Amazon.com’s expectations as of October 27,\
    \ 2022, and are subject to\nsubstantial uncertainty. Our results are inherently\
    \ unpredictable and may be materially affected by many factors, such as\nuncertainty\
    \ regarding the impacts of the COVID-19 pandemic, fluctuations in foreign exchange\
    \ rates, changes in global\neconomic and geopolitical conditions and customer\
    \ demand and spending (including the impact of recessionary fears),\ninflation,\
    \ interest rates, regional labor market and global supply chain constraints, world\
    \ events, the rate of growth of the\nInternet, online commerce, and cloud services,\
    \ and the various factors detailed below. This guidance reflects our estimates\
    \ as of\nOctober 27, 2022 regarding the impacts of the COVID-19 pandemic on our\
    \ operations as well as the effect of other factors\ndiscussed above.\nFourth\
    \ Quarter 2022 Guidance\n•\n•\n•\n\nNet sales are expected to be between $140.0\
    \ billion and $148.0 billion, or to grow between 2% and 8% compared with\nfourth\
    \ quarter 2021. This guidance anticipates an unfavorable impact of approximately\
    \ 460 basis points from foreign\nexchange rates.\nOperating income is expected\
    \ to be between $0 and $4.0 billion, compared with $3.5 billion in fourth quarter\
    \ 2021.\nThis guidance assumes, among other things, that no additional business\
    \ acquisitions, restructurings, or legal\nsettlements are concluded.\n\nA conference\
    \ call will be webcast live today at 2:30 p.m. PT/5:30 p.m. ET, and will be available\
    \ for at least three months at\namazon.com/ir. This call will contain forward-looking\
    \ statements and other material information regarding the Company’s\nfinancial\
    \ and operating results.\nThese forward-looking statements are inherently difficult\
    \ to predict. Actual results and outcomes could differ materially for a\nvariety\
    \ of reasons, including, in addition to the factors discussed above, the amount\
    \ that Amazon.com invests in new business\nopportunities and the timing of those\
    \ investments, the mix of products and services sold to customers, the mix of\
    \ net sales\nderived from products as compared with services, the extent to which\
    \ we owe income or other taxes, competition, management\nof growth, potential\
    \ fluctuations in operating results, international growth and expansion, the outcomes\
    \ of claims, litigation,\ngovernment investigations, and other proceedings, fulfillment,\
    \ sortation, delivery, and data center optimization, risks of\ninventory management,\
    \ variability in demand, the degree to which the Company enters into, maintains,\
    \ and develops\ncommercial agreements, proposed and completed acquisitions and\
    \ strategic transactions, payments risks, and risks of\nfulfillment throughput\
    \ and productivity. Other risks and uncertainties include, among others, risks\
    \ related to new products,\nservices, and technologies, system interruptions,\
    \ government regulation and taxation, and fraud. In addition, global economic\n\
    and geopolitical conditions and additional or unforeseen effects from the COVID-19\
    \ pandemic amplify many of these risks.\nMore information about factors that potentially\
    \ could affect Amazon.com’s financial results is included in Amazon.com’s filings\n\
    with the Securities and Exchange Commission (“SEC”), including its most recent\
    \ Annual Report on Form 10-K and subsequent\nfilings.\nOur investor relations\
    \ website is amazon.com/ir and we encourage investors to use it as a way of easily\
    \ finding information\nabout us. We promptly make available on this website, free\
    \ of charge, the reports that we file or furnish with the SEC, corporate\ngovernance\
    \ information (including our Code of Business Conduct and Ethics), and select\
    \ press releases, which may contain\nmaterial information about us, and you may\
    \ subscribe to be notified of new information posted to this site.\n\n\fAbout\
    \ Amazon\nAmazon is guided by four principles: customer obsession rather than\
    \ competitor focus, passion for invention, commitment to\noperational excellence,\
    \ and long-term thinking. Amazon strives to be Earth’s Most Customer-Centric Company,\
    \ Earth’s Best\nEmployer, and Earth’s Safest Place to Work. Customer reviews,\
    \ 1-Click shopping, personalized recommendations, Prime,\nFulfillment by Amazon,\
    \ AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire tablets, Fire TV,\
    \ Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios, and The Climate\
    \ Pledge are some of the things pioneered by Amazon. For more\ninformation, visit\
    \ amazon.com/about and follow @AmazonNews."
