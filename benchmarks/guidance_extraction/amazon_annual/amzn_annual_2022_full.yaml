  label: Amazon Q1 2022 Earnings Release, April 28, 2022
  text: "AMAZON.COM ANNOUNCES FIRST QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) April\
    \ 28, 2022—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its first quarter ended March 31, 2022.\n•\n\nOperating cash flow decreased\
    \ 41% to $39.3 billion for the trailing twelve months, compared with $67.2 billion\
    \ for\nthe trailing twelve months ended March 31, 2021.\n\n•\n\nFree cash flow\
    \ decreased to an outflow of $18.6 billion for the trailing twelve months, compared\
    \ with an inflow of\n$26.4 billion for the trailing twelve months ended March\
    \ 31, 2021.\n\n•\n\nFree cash flow less principal repayments of finance leases\
    \ and financing obligations decreased to an outflow of\n$29.3 billion for the\
    \ trailing twelve months, compared with an inflow of $14.9 billion for the trailing\
    \ twelve months\nended March 31, 2021.\n\n•\n\nFree cash flow less equipment finance\
    \ leases and principal repayments of all other finance leases and financing\n\
    obligations decreased to an outflow of $22.3 billion for the trailing twelve months,\
    \ compared with an inflow of $16.8\nbillion for the trailing twelve months ended\
    \ March 31, 2021.\n\n•\n\nCommon shares outstanding plus shares underlying stock-based\
    \ awards totaled 523 million on March 31, 2022,\ncompared with 519 million one\
    \ year ago.\n\n•\n\nNet sales increased 7% to $116.4 billion in the first quarter,\
    \ compared with $108.5 billion in first quarter 2021.\nExcluding the $1.8 billion\
    \ unfavorable impact from year-over-year changes in foreign exchange rates throughout\
    \ the\nquarter, net sales increased 9% compared with first quarter 2021.\n\n•\n\
    \nOperating income decreased to $3.7 billion in the first quarter, compared with\
    \ $8.9 billion in first quarter 2021.\n\n•\n\nNet loss was $3.8 billion in the\
    \ first quarter, or $7.56 per diluted share, compared with net income of $8.1\
    \ billion, or\n$15.79 per diluted share, in first quarter 2021. First quarter\
    \ 2022 net loss includes a pre-tax valuation loss of $7.6\nbillion included in\
    \ non-operating expense from our common stock investment in Rivian Automotive,\
    \ Inc.\n\n“The pandemic and subsequent war in Ukraine have brought unusual growth\
    \ and challenges,” said Andy Jassy, Amazon CEO.\n“With AWS growing 34% annually\
    \ over the last two years, and 37% year-over-year in the first quarter, AWS has\
    \ been integral\nin helping companies weather the pandemic and move more of their\
    \ workloads into the cloud. Our Consumer business has\ngrown 23% annually over\
    \ the past two years, with extraordinary growth in 2020 of 39% year-over-year\
    \ that necessitated\ndoubling the size of our fulfillment network that we’d built\
    \ over Amazon’s first 25 years—and doing so in just 24 months.\nToday, as we’re\
    \ no longer chasing physical or staffing capacity, our teams are squarely focused\
    \ on improving productivity and\ncost efficiencies throughout our fulfillment\
    \ network. We know how to do this and have done it before. This may take some\n\
    time, particularly as we work through ongoing inflationary and supply chain pressures,\
    \ but we see encouraging progress on a\nnumber of customer experience dimensions,\
    \ including delivery speed performance as we’re now approaching levels not seen\n\
    since the months immediately preceding the pandemic in early 2020.”\nHighlights\n\
    Shopping\n•\n\nAmazon announced Buy with Prime, a new benefit for Prime members\
    \ in the U.S. that extends the convenience of\nshopping with Prime to online stores\
    \ beyond Amazon.com. Prime members can shop directly from participating\nmerchants’\
    \ online stores using their Prime member benefits, including fast and free delivery,\
    \ a seamless checkout\nexperience, and free returns on eligible orders.\n\n\f\
    •\n\nThis year, Prime Day will take place in July in more than 20 countries. During\
    \ Amazon’s annual shopping event,\nPrime members will be able to save on products\
    \ from national brands and small businesses across every category.\n\n•\n\nAmazon\
    \ continued to invent and expand ways for customers to discover fashion products.\
    \ For example, View in 3D\nenables customers in the U.S. and Canada to view a\
    \ shoe at any angle, and The Drop provides customers worldwide\nwith access to\
    \ limited-edition, size-inclusive clothing collections by fashion influencers\
    \ globally. Amazon also\nlaunched Style Feed, a shoppable stream of influencer-curated\
    \ content on the Amazon shopping app for customers in\nthe U.S. and India to explore\
    \ fashion, home décor, and beauty items.\n\n•\n\nAmazon launched Amazon Aware,\
    \ a new brand of consciously created everyday products that span apparel, home,\
    \ and\nbeauty, and that are made from materials such as recycled polyester, organic\
    \ cotton, and bio-based ingredients. All\nAmazon Aware products are certified\
    \ as carbon neutral and feature certifications that are part of Amazon’s Climate\n\
    Pledge Friendly program.\n\n•\n\nAmazon opened eight new Amazon Fresh grocery\
    \ stores and now has 46 Amazon Fresh grocery stores around the\nworld. The newest\
    \ Amazon Fresh store in Seattle is the world’s first grocery store seeking Zero\
    \ Carbon certification\nfrom the International Future Living Institute and features\
    \ more than a dozen store design upgrades expected to save\nnearly 185 tons of\
    \ carbon emissions each year when compared to an industry-standard grocery store.\n\
    \n•\n\nAmazon opened a new, larger Amazon Go store format for customers in suburban\
    \ areas in the U.S., with the first\nlocation in Mill Creek, Washington. The new\
    \ format features Amazon’s Just Walk Out technology for a checkout-free\nshopping\
    \ experience, an expanded selection of grab-and-go food and beverage items, and\
    \ a Made-to-Order kitchen\nwith freshly prepared, customizable breakfast and lunch\
    \ items. Amazon has plans to expand this format to the Los\nAngeles area in the\
    \ coming months.\n\n•\n\nFor the first time, Amazon introduced Just Walk Out technology\
    \ at two Whole Foods Market stores in Washington,\nD.C., and Sherman Oaks, California.\
    \ Just Walk Out technology also rolled out at new third-party locations, including\n\
    travel retailer WHSmith in LaGuardia Airport in New York City; UBS Arena in New\
    \ York; and Minute Maid Park in\nHouston, Texas. In addition, a food and beverage\
    \ store equipped with Just Walk Out technology and Amazon One will\nbe opening\
    \ soon at T-Mobile Park in Seattle. The combination of technologies will give\
    \ fans the option to enter the\nstore with their palm or credit card, take what\
    \ they want, and leave without stopping to check out.\n\n•\n\nAmazon Business\
    \ launched Punch-in, an industry-first procurement tool that simplifies the buying\
    \ experience for\nbusinesses. With Punch-in, businesses can start their purchasing\
    \ directly on Amazon Business and submit their cart to\ntheir e-Procurement system\
    \ for purchase order creation and reconciliation.\n\nEntertainment\n•\n\nAmazon\
    \ closed its acquisition of MGM, and MGM employees joined Prime Video and Amazon\
    \ Studios. The storied,\nnearly century-old studio has more than 4,000 film titles,\
    \ 17,000 TV episodes, 180 Academy Awards, and 100 Emmy\nAwards. The catalog includes\
    \ franchise favorites such as James Bond, Rocky, and Legally Blonde, and classic\
    \ movies\nsuch as Thelma & Louise, The Silence of the Lambs, The Magnificent Seven,\
    \ and Raging Bull. The deal complements\nPrime Video and Amazon Studios’ work\
    \ in delivering a diverse slate of original films and TV shows to a global\naudience\
    \ and will create even more opportunities to deliver quality storytelling to customers.\n\
    \n•\n\nThe teaser trailer for The Lord of the Rings: The Rings of Power broke\
    \ a global record for the most-watched\nentertainment trailer to debut during\
    \ a Super Bowl telecast, with 257 million views globally in the first 24 hours\
    \ of its\nrelease. Customers continue to watch the trailer at www.amazon.com/ringsofpower.\
    \ The Lord of the Rings: The Rings\nof Power will debut Friday, September 2, 2022.\n\
    \n•\n\nIconic announcer Al Michaels and Emmy-winning analyst Kirk Herbstreit are\
    \ joining Prime Video as the voices for its\nexclusive coverage of NFL Thursday\
    \ Night Football. Joining them is executive producer Fred Gaudelli, who marks\
    \ his\n33rd season as the lead producer for the NFL in primetime. The inaugural\
    \ season of NFL Thursday Night Football\nunder Prime Video’s historic 11-year\
    \ agreement kicks off Thursday, September 15, 2022.\n\n•\n\nPrime Video became\
    \ the first streaming service to exclusively carry a major awards show live with\
    \ the 57th annual\nAcademy of Country Music Awards, which aired on March 7, 2022.\
    \ Amazon created a 360-degree fan experience for\ncustomers across Prime Video,\
    \ Amazon Live, Amazon Music, Amazon Fashion, IMDb TV, and Twitch.\n\n•\n\nReacher,\
    \ Prime Video’s new drama series starring Alan Ritchson, ranked on Nielsen’s overall\
    \ Streaming Top 10 list\nfor the first three weeks of its premiere, with a No.\
    \ 1 ranking and more than 1.5 billion minutes watched in its first full\nweek\
    \ and six consecutive weeks in the Top 10 Streaming Originals list. The hit series\
    \ has been renewed for a second\nseason. The Marvelous Mrs. Maisel also landed\
    \ on Nielsen’s Streaming Top 10 list, with 499 million minutes viewed\nduring\
    \ the week of its Season Four premiere and six consecutive weeks in the Top 10\
    \ Streaming Originals list.\nAdditional Prime Video series releases included the\
    \ second season of Greg Daniels’ futuristic comedy Upload,\n\n\fmystery series\
    \ Outer Range starring Josh Brolin, and global superstar Lizzo’s first series,\
    \ Lizzo’s Watch Out for the\nBig Grrrls.\n•\n\nPrime Video debuted 30 local originals\
    \ internationally, including new seasons of the unscripted franchise LOL in\n\
    Canada, France, Germany, and Italy, as well as Luxe Listings (Australia), Mahaan\
    \ (India), Bang Bang Baby (Italy),\nand HOMESTAY (Japan). New locally produced\
    \ series and movies launched in Argentina, Australia, Brazil, Canada,\nFrance,\
    \ Germany, India, Italy, Japan, Mexico, the Netherlands, Spain, and the UK.\n\n\
    •\n\nOn April 27, IMDb TV became Freevee. The new name better defines the brand\
    \ and what it offers customers—free,\npremium streaming content.\n\n•\n\nAmazon\
    \ launched a U.S. beta version of Amp, a new live radio app that enables creators\
    \ to DJ their own shows for\nfree, with tens of millions of licensed songs. Early\
    \ traction with emerging creators and established talent is strong—\nwith live\
    \ shows from artists, including Pusha T, Travis Barker, Tinashe, Lil Yachty, and\
    \ Nikita Dragun—and the Amp\ndebut of Nicki Minaj’s Queen Radio is coming soon.\n\
    \n•\n\nAmazon Music and Wondery won six awards—including Podcast of the Year—at\
    \ the premier podcasting event of the\nyear, The Ambies. The awards spanned four\
    \ original podcasts: Suspect (Best True Crime), Business Wars (Best\nBusiness\
    \ Podcast), The Lead (Best Sports Podcast), and 9/12 (Podcast of the Year, Best\
    \ Reporting, and Best Original\nScore and Music Supervision). This was the second\
    \ consecutive year that a Wondery podcast won Podcast of the Year.\n\n•\n\nLost\
    \ Ark, the free-to-play multiplayer online game, exceeded 20 million global users\
    \ and became the second-highest\nplayed title of all time by peak concurrent players\
    \ on the distribution platform Steam. Published by Amazon Games in\nAustralia,\
    \ Europe, Latin America, New Zealand, and North America, the critically acclaimed\
    \ game was developed by\nSmilegate RPG.\n\n•\n\nAmazon announced the general availability\
    \ of its Amazon Luna cloud gaming service, which offers an expanded\nlineup of\
    \ games and new features. Luna includes the Retro Channel, with beloved classic\
    \ games; the Family Channel,\nwith a curated collection of games for families;\
    \ and the Prime Gaming Channel, where Prime members can access a\nrotating selection\
    \ of games on Luna for free.\n\n•\n\nAmazon announced the launch of Mindy’s Book\
    \ Studio, a boutique story studio with best-selling author, actor,\nscreenwriter,\
    \ and producer Mindy Kaling. Amazon Publishing will publish books selected by\
    \ Kaling from emerging\nand established diverse voices under Mindy’s Book Studio.\
    \ Amazon Studios and Kaling will also adapt material\npublished under Mindy’s\
    \ Book Studio as feature motion pictures that will stream exclusively on Prime\
    \ Video.\n\nDevices and Services\n•\n\nAmazon launched new Alexa experiences for\
    \ customers. Customers can now ask Alexa about symptoms for common\nhealth ailments\
    \ and possible causes, and virtually connect to health care professionals through\
    \ a new collaboration\nwith Teladoc. They can also access more live and on-demand\
    \ video content on Echo Show 15 through a new\nintegration with Sling TV. In addition,\
    \ Amazon introduced a new Alexa shopping experience that can notify customers\n\
    about upcoming deals for items on their wish list or in their shopping cart, remind\
    \ them when a deal is available, or\norder an item when it is discounted.\n\n\
    •\n\nAmazon introduced Alexa person and package detection announcements for Ring,\
    \ Abode, and Google devices. With\nthe new feature, customers can receive an announcement\
    \ from Alexa, set up a Routine such as turning on a porch light,\nand automatically\
    \ view live video feeds on Echo Show, Fire TV, and Fire tablet devices when a\
    \ person or package is\ndetected by their smart camera or video doorbell.\n\n\
    •\n\nRing launched in Japan, bringing its lineup of whole-home security devices—including\
    \ video doorbells, indoor and\noutdoor cameras, and accessories—to the country\
    \ for the first time. Ring devices are now available for sale in 30\ncountries\
    \ around the world.\n\n•\n\nAmazon and Yamada Holdings announced the first smart\
    \ TV with Amazon Fire TV built-in, offering a content-driven\nviewing experience,\
    \ a simple and intuitive user interface, Alexa, and hands-free TV control for\
    \ customers in Japan.\n\n•\n\neero announced two new additions to the eero family\
    \ of home mesh wifi systems that will give customers fast\nconnectivity and high\
    \ performance in any room of the house: eero Pro 6E, the first Wi-Fi 6E-enabled\
    \ eero system\ndesigned for gigabit+ internet plans; and eero 6+, the most affordable\
    \ gigabit-capable eero system.\n\nEmerging Businesses\n•\n\nAmazon Care’s virtual\
    \ health services are now available 24/7 across the U.S. Additionally, Amazon\
    \ Care expanded its\nin-person services to Atlanta, Chicago, Los Angeles, Philadelphia,\
    \ and San Francisco, and will add more than 15 other\ncities this year, including\
    \ Houston, Miami, New York City, and Phoenix. The service provides immediate access\
    \ to a\n\n\fwide range of urgent and primary care services, including COVID-19\
    \ and flu testing, vaccinations, treatment of\nillnesses and injuries, preventive\
    \ care, sexual health, and prescription requests and refills.\n•\n\nAmazon announced\
    \ agreements with Arianespace, Blue Origin, and United Launch Alliance to provide\
    \ launch\nservices for Project Kuiper, Amazon’s initiative to increase global\
    \ broadband access using a constellation of satellites\nin low Earth orbit. Amazon\
    \ secured up to 83 launches across the three contracts, providing heavy-lift capacity\
    \ to\nlaunch the majority of Amazon’s 3,236-satellite constellation. The agreements\
    \ comprise the largest commercial\nprocurement of launch vehicles in history and\
    \ will support thousands of suppliers and highly skilled jobs across the\nglobal\
    \ space industry.\n\nAmazon Web Services\n•\n\n•\n\nAWS announced significant\
    \ customer momentum, with new commitments and migrations from customers across\n\
    many major industries.\n•\n\nTelecommunications: T-Systems, a global service provider\
    \ for information technologies and digital\ntransformation, selected AWS to launch\
    \ a managed service in the cloud to provide encryption and implement\ntransparent\
    \ residency controls for customers’ data in the EU. Verizon migrated its fleet\
    \ management software\nplatform, Verizon Connect, to AWS to help businesses of\
    \ all sizes more effectively manage their commercial\ntransportation needs. Spanish\
    \ telecommunications provider Telefónica expanded its strategic collaboration\n\
    with AWS to invest in joint go-to-market activities, develop new cloud solutions,\
    \ and increase AWS Cloud\nskills among the Telefónica workforce. Telefónica will\
    \ use AWS to bring innovation to customers faster and\nhelp them better leverage\
    \ the agility of the cloud by launching value-added solutions such as edge computing\n\
    and built-for-the-cloud private 5G networks that run on AWS Outposts. Commnet\
    \ Broadband, a broadband\ncommunications provider for tribal and rural communities\
    \ in the U.S., is working with AWS to transform its\nnetwork and bring AWS services\
    \ to health care, education, tribal, government, mining, business, and carrier\n\
    customers in the rural, southwest U.S. Etisalat UAE, a telecommunications provider\
    \ based in the United\nArab Emirates, announced a collaboration with AWS to use\
    \ 5G private networks and mobile edge computing\nto build prepackaged solutions\
    \ for industrial use cases including energy, manufacturing, and logistics.\n\n\
    •\n\nAerospace: Boeing, a global manufacturer of airplanes and space systems,\
    \ selected AWS as a strategic cloud\nprovider to deliver tools to support more\
    \ powerful, sustainable, and efficient aerospace design, engineering,\nand management\
    \ solutions. Boeing will run high-performance computing workloads on AWS and plans\
    \ to\nmove many of their most important applications to AWS. Boeing will use AWS\
    \ to streamline its approach to\ncloud computing as Boeing takes on ambitious\
    \ engineering feats, like developing a more sustainable future of\nflight.\n\n\
    •\n\nSports: German national football league Bundesliga announced new Bundesliga\
    \ Match Facts powered by\nAWS to give fans deeper insights into the action on\
    \ the pitch, including Set Piece Threat, which provides\ninformation on a team’s\
    \ scoring ability from plays such as free kicks and corner kicks, and Skill, which\n\
    compares Bundesliga players to visualize the skills they bring to their teams\
    \ and positions. The National\nHockey League (NHL) and AWS announced Face-off\
    \ Probability, a live in-game stat that instantly shows\nthe odds of a player\
    \ winning a face-off and possession of the puck. Maple Leaf Sports and Entertainment,\n\
    the owner of some of Canada’s best-known sports franchises, including the Toronto\
    \ Maple Leafs, Toronto\nRaptors, Toronto Football Club, and Toronto Argonauts,\
    \ selected AWS as its official cloud provider and\nofficial provider of artificial\
    \ intelligence, machine learning, and deep learning cloud services to create and\n\
    deliver extraordinary sports moments and enhanced fan engagement.\n\n•\n\nTechnology:\
    \ Database platform MongoDB expanded its relationship with AWS, making it easier\
    \ for joint\ncustomers to advance their cloud adoption journey. This includes\
    \ integrated go-to-market activities, shared\ndeveloper relations activities,\
    \ and technology integrations to streamline the migration of on-premises\nworkloads\
    \ to MongoDB Atlas on AWS. Amdocs, a provider of software and services to communications\
    \ and\nmedia companies, used AWS to implement a program enabling 12 billion secure,\
    \ real-time online and offline\nbusiness transactions per day in the cloud. Tech\
    \ Mahindra, a provider of digital transformation, consulting,\nand business reengineering\
    \ solutions, selected AWS to power an automation platform designed to accelerate\n\
    the adoption and deployment of 5G networks by telecommunications carriers.\n\n\
    •\n\nHealth care and life sciences: THREAD, a clinical trials technology and service\
    \ provider, is using AWS for\nreal-time access to data and insights that will\
    \ enable faster, more efficient, and less-costly clinical trials that\noptimize\
    \ research and advance precision medicine.\n\nAWS completed the launch of its\
    \ first 16 Local Zones in the U.S. and announced plans for new Local Zones in\
    \ 32\nmetropolitan areas in 26 countries around the world. AWS Local Zones is\
    \ a type of infrastructure deployment that\n\n\fextends AWS Regions to place compute,\
    \ storage, database, and other AWS services at the edge of the cloud near large\n\
    population, industry, and information technology centers. These new Local Zones\
    \ expand AWS’s infrastructure\nfootprint globally beyond its existing 84 Availability\
    \ Zones in 26 geographic regions, enabling AWS customers to\nbuild applications\
    \ that deliver single-digit millisecond latency performance at the edge of the\
    \ cloud to hundreds of\nmillions of people worldwide.\n•\n\nAWS announced the\
    \ general availability of Amazon Aurora Serverless v2, the next generation of\
    \ the Amazon Aurora\ndatabase that automatically scales in fine-grained increments\
    \ in a fraction of a second—providing customers up to\n90% cost savings compared\
    \ to provisioning for peak capacity. Amazon Aurora Serverless v2 also includes\
    \ Amazon\nAurora’s capabilities for high availability, performance, and resiliency,\
    \ with low latency and faster querying.\n\n•\n\nAWS announced the general availability\
    \ of AWS IoT TwinMaker, which makes it significantly faster and easier for\ndevelopers\
    \ to create digital twins of real-world systems like buildings, factories, industrial\
    \ equipment, and production\nlines—helping more customers build applications that\
    \ improve operational efficiency and reduce downtime. Digital\ntwins are virtual\
    \ representations of physical systems that are regularly updated with real-world\
    \ data to mimic the\nstructure, state, and behavior of the objects they represent.\n\
    \n•\n\nAWS announced the general availability of AWS Amplify Studio, a new visual\
    \ development environment for creating\nrich user interfaces that extends the\
    \ benefits of AWS Amplify to make it easier for developers to create fully\ncustomizable\
    \ web applications with minimal coding in days instead of weeks.\n\nInvesting\
    \ in Employees and Our Workplace\n•\n\nFor the second year in a row, Amazon ranked\
    \ No. 1 in the U.S. on LinkedIn’s annual Top Companies list, which\nidentifies\
    \ the best companies for career growth based on their ability to attract and retain\
    \ the best talent, including\nthrough promotions, opportunities for employees\
    \ of all backgrounds to gain new skills, company stability, and gender\ndiversity.\n\
    \n•\n\nFor the sixth year in a row, Amazon ranked No. 2 on Fortune magazine’s\
    \ World’s Most Admired Companies list,\nwhich evaluates corporate reputation based\
    \ on factors such as quality of management and products, commitment to\nsocial\
    \ responsibility, and ability to attract talent.\n\n•\n\nAmazon achieved the Top\
    \ Employer Certification by the Top Employers Institute for 2022 in France, Italy,\
    \ Poland,\nand Spain in recognition of Amazon’s quality work environment, professional\
    \ development opportunities, and\nprograms available to employees. In India, Amazon\
    \ ranked No. 1 in Business Today magazine’s 2022 Best Companies\nto Work list,\
    \ which highlights the company’s growth and learning opportunities, clarity of\
    \ company goals, and\nflexibility at work.\n\n•\n\nAmazon launched the Welcome\
    \ Door program in the U.S., a new initiative to provide additional resources and\
    \ support\nto its refugee and humanitarian-based immigrant employees. Through\
    \ the program, eligible Amazon employees will\nhave access to reimbursement for\
    \ Employment Authorization Document fees, a new citizenship assistance portal,\
    \ free\nlegal resources, English as a Second Language proficiency programs, and\
    \ mentorship. Amazon will expand the\nprogram globally by the end of the year.\n\
    \n•\n\nAmazon expanded its Career Choice program in the U.S. to include partnerships\
    \ with more than 140 national and local\nuniversities and other schools to offer\
    \ fully funded college tuition, high school completion and GED preparation\ncourses,\
    \ English as a Second Language programs, and college preparation courses. Career\
    \ Choice is designed to help\nfront-line employees grow their skills for careers\
    \ at Amazon or elsewhere. This program—which is available to\nAmazon’s more than\
    \ 750,000 hourly employees in the U.S.—helps move the company closer to meeting\
    \ its Upskilling\n2025 pledge, a $1.2 billion commitment to upskill more than\
    \ 300,000 Amazon employees by 2025.\n\n•\n\nAmazon expanded its mental health\
    \ benefits to provide employees, their families, and their household members in\n\
    more than 50 countries worldwide with a single starting point for personalized,\
    \ convenient, and confidential mental\nhealth and daily life support. These mental\
    \ health benefits enhance existing benefits, which include 24/7 access to free,\n\
    one-on-one counseling sessions, suicide prevention resources, and customized support.\n\
    \nSupporting Communities, Selling Partners, and the Economy\n•\n\nAmazon teams\
    \ around the world mobilized to provide humanitarian support to those affected\
    \ by the war in Ukraine.\nAmazon launched two humanitarian aid hubs in Slovakia\
    \ and Poland, with more than 90,000 square feet of dedicated\nlogistics space\
    \ to expedite relief products to Ukrainian refugees. Through the hub, Amazon has\
    \ delivered more than 1\nmillion clothing items, first-aid products, food items,\
    \ hygiene products, and medical supplies. Amazon also donated\nmore than $10 million\
    \ in cash to more than 150 nonprofits working on the ground, committed technological\
    \ assistance\nand more than $15 million in free cloud credits to organizations\
    \ addressing the humanitarian crisis, and provided free\n\n\flegal assistance\
    \ to organizations helping refugees seek resettlement in Europe. Amazon also pledged\
    \ to support the\nimmediate and longer-term needs of Ukrainian refugees by joining\
    \ the Tent Partnership for Refugees, a global\nnonprofit and network of 200 companies\
    \ that helps integrate refugees into new communities.\n•\n\nAmazon announced it\
    \ has allocated more than half of the Housing Equity Fund’s $2 billion commitment\
    \ to create and\npreserve affordable housing for families in Amazon’s hometown\
    \ communities of the Puget Sound region of\nWashington state; the Arlington, Virginia,\
    \ region; and Nashville, Tennessee. The Fund has a strong focus on transitoriented\
    \ affordable housing development and recently awarded funds to create more than\
    \ 1,000 new affordable\nhousing units on land owned by transit agencies or privately\
    \ owned land within a 10-minute walk to quality public\ntransit stations.\n\n\
    •\n\nAmazon launched a $1 billion venture investment program called the Amazon\
    \ Industrial Innovation Fund to empower\ncompanies that are developing emerging\
    \ technologies in customer fulfillment, logistics, and the supply chain. Starting\n\
    with five recipients, the Fund will invest in companies imagining solutions that\
    \ incrementally increase delivery speed\nand further improve the experience of\
    \ employees working in warehousing and logistics fields.\n\n•\n\nAWS launched\
    \ a three-year, $30 million commitment to the AWS Impact Accelerator, a series\
    \ of programs to help\nearly-stage startups led by Black, Latino, LGBTQIA+, and\
    \ women founders build successful companies. Each\nparticipating startup receives\
    \ $225,000 in cash and credits, extensive training, mentoring and technical guidance,\
    \ as\nwell as introductions to Amazon leaders and teams, networking opportunities\
    \ with potential investors, and ongoing\nadvisory support.\n\n•\n\nThe Arlington\
    \ County Board approved Amazon’s final plans for PenPlace, the next phase of the\
    \ company’s second\nheadquarters in Arlington, Virginia. Amazon’s more than $2.5\
    \ billion investment in its Arlington headquarters will\ninclude more than 4.5\
    \ acres of park space, two dog runs, and more than 150,000 square feet of retail\
    \ and retailequivalent space (including two daycare centers), which will be accessible\
    \ to the entire community. HQ2 will be\npowered with 100% renewable energy through\
    \ a combination of off-site and on-site solar projects. Amazon plans to\ncreate\
    \ 25,000 direct jobs in Arlington over the next decade, which together with the\
    \ company’s investment in the\nsurrounding area will help generate thousands of\
    \ indirect jobs across the region.\n\n•\n\nAmazon Future Engineer, the company’s\
    \ global computer science education program for students from underserved\nand\
    \ historically underrepresented communities, awarded $40,000 college scholarships\
    \ to 250 students across the U.S.\nto study computer science. Since launching\
    \ this program four years ago, Amazon has awarded $22 million in\nscholarships\
    \ to 550 students who are also granted paid internships at Amazon.\n\n•\n\nAmazon\
    \ introduced new tools for sellers including New Seller Incentives, a suite of\
    \ benefits (such as bonuses, credits,\nand discounts) worth more than $50,000\
    \ in potential value, and the Perfect Launch playbook, a tool with actionable\n\
    steps for new-to-Amazon selling partners. Both tools help partners grow their\
    \ brand, scale their business, and promote\ntheir products to hundreds of millions\
    \ of Amazon customers worldwide.\n\n•\n\nAmazon launched Road to Ownership, a\
    \ 16-week accelerated training and development program that helps create a\npathway\
    \ for delivery associates and team members of existing Delivery Service Partners\
    \ (DSP) to start their career as\nDSP small business owners. The program provides\
    \ a comprehensive understanding of operating a DSP business and\nfosters business\
    \ acumen. Upon completion, participants receive a $30,000 grant to cover startup\
    \ costs and living\nexpenses while they establish their business.\n\nProtecting\
    \ the Planet\n•\n\nAmazon welcomed nearly 100 new signatories to The Climate Pledge,\
    \ including HARMAN, Maersk, SAP, Sunrun,\nand Weyerhaeuser. The new signatories\
    \ bring the total number of companies that have pledged to achieve net-zero\n\
    carbon emissions by 2040 to more than 300. Pledge signatories in total generate\
    \ over $3.5 trillion in global annual\nrevenues and have more than 8 million employees\
    \ across 51 industries in 29 countries.\n\n•\n\nAmazon is working with the U.S.\
    \ Department of Energy to advance research on reducing plastic pollution through\n\
    innovation in materials and recycling. The effort is led by the National Renewable\
    \ Energy Laboratory, and Amazon’s\nteam of materials scientists and experts is\
    \ working with the laboratory to develop technologies and materials that will\n\
    enable the full life cycle of plastics to be net-zero carbon.\n\n•\n\nAmazon announced\
    \ 37 new renewable energy projects around the world, marking significant progress\
    \ on its ambitious\npath to power 100% of company operations with renewable energy\
    \ by 2025—five years ahead of the original target of\n2030. The new projects increase\
    \ Amazon’s total capacity by nearly 30% and reinforce Amazon’s leadership position\n\
    as the world’s largest corporate buyer of renewable energy, with 310 renewable\
    \ energy projects across 19 countries\nand 15.7 gigawatts of clean energy capacity—enough\
    \ electricity output to power 3.9 million U.S. homes annually.\n\n\f•\n\nIn India,\
    \ Amazon and Sun Mobility, a local provider of energy infrastructure and services\
    \ for electric vehicles (EVs),\nannounced an expanded deployment of EVs with battery-swapping\
    \ technology, which eliminates the need for lengthy\nrecharging. These EVs will\
    \ be part of Amazon’s transportation and logistics services, and contribute to\
    \ Amazon\nIndia’s commitment of adding 10,000 electric vehicles to its delivery\
    \ fleet by 2025.\n\n•\n\nAs part of AWS’s ongoing commitment to help customers\
    \ reduce their environmental impact and reach their\nsustainability goals, AWS\
    \ launched a carbon footprint tool that helps customers quantify their carbon\
    \ usage across\nAWS products. The tool gives AWS customers a view of their historic\
    \ carbon emissions, evaluates emission trends as\ntheir use of AWS evolves, estimates\
    \ the carbon emissions they have avoided by using AWS instead of an on-premises\n\
    solution, and projects forecasted emissions based on current usage.\n\nFinancial\
    \ Guidance\nThe following forward-looking statements reflect Amazon.com’s expectations\
    \ as of April 28, 2022, and are subject to\nsubstantial uncertainty. Our results\
    \ are inherently unpredictable and may be materially affected by many factors,\
    \ such as\nuncertainty regarding the impacts of the COVID-19 pandemic, fluctuations\
    \ in foreign exchange rates, changes in global\neconomic conditions and customer\
    \ demand and spending, inflation, labor market and global supply chain constraints,\
    \ world\nevents, the rate of growth of the Internet, online commerce, and cloud\
    \ services, and the various factors detailed below. This\nguidance reflects our\
    \ estimates as of April 28, 2022 regarding the impacts of the COVID-19 pandemic\
    \ on our operations as well\nas the effect of other factors discussed above.\n\
    Second Quarter 2022 Guidance\n•\n•\n•\n•\n\nNet sales are expected to be between\
    \ $116.0 billion and $121.0 billion, or to grow between 3% and 7% compared with\n\
    second quarter 2021. This guidance anticipates an unfavorable impact of approximately\
    \ 200 basis points from foreign\nexchange rates.\nOperating income (loss) is expected\
    \ to be between $(1.0) billion and $3.0 billion, compared with $7.7 billion in\
    \ second\nquarter 2021.\nThis guidance assumes that Prime Day occurs in third\
    \ quarter 2022.\nThis guidance assumes, among other things, that no additional\
    \ business acquisitions, restructurings, or legal\nsettlements are concluded.\n\
    \nA conference call will be webcast live today at 2:30 p.m. PT/5:30 p.m. ET, and\
    \ will be available for at least three months at\namazon.com/ir. This call will\
    \ contain forward-looking statements and other material information regarding\
    \ the Company’s\nfinancial and operating results.\nThese forward-looking statements\
    \ are inherently difficult to predict. Actual results and outcomes could differ\
    \ materially for a\nvariety of reasons, including, in addition to the factors\
    \ discussed above, the amount that Amazon.com invests in new business\nopportunities\
    \ and the timing of those investments, the mix of products and services sold to\
    \ customers, the mix of net sales\nderived from products as compared with services,\
    \ the extent to which we owe income or other taxes, competition, management\n\
    of growth, potential fluctuations in operating results, international growth and\
    \ expansion, the outcomes of claims, litigation,\ngovernment investigations, and\
    \ other proceedings, fulfillment, sortation, delivery, and data center optimization,\
    \ risks of\ninventory management, variability in demand, the degree to which the\
    \ Company enters into, maintains, and develops\ncommercial agreements, proposed\
    \ and completed acquisitions and strategic transactions, payments risks, and risks\
    \ of\nfulfillment throughput and productivity. Other risks and uncertainties include,\
    \ among others, risks related to new products,\nservices, and technologies, system\
    \ interruptions, government regulation and taxation, and fraud. In addition, global\
    \ economic\nconditions and additional or unforeseen effects from the COVID-19\
    \ pandemic amplify many of these risks. More information\nabout factors that potentially\
    \ could affect Amazon.com’s financial results is included in Amazon.com’s filings\
    \ with the\nSecurities and Exchange Commission (“SEC”), including its most recent\
    \ Annual Report on Form 10-K and subsequent filings.\nOur investor relations website\
    \ is amazon.com/ir and we encourage investors to use it as a way of easily finding\
    \ information\nabout us. We promptly make available on this website, free of charge,\
    \ the reports that we file or furnish with the SEC, corporate\ngovernance information\
    \ (including our Code of Business Conduct and Ethics), and select press releases,\
    \ which may contain\nmaterial information about us, and you may subscribe to be\
    \ notified of new information posted to this site.\n\n\fAbout Amazon\nAmazon is\
    \ guided by four principles: customer obsession rather than competitor focus,\
    \ passion for invention, commitment to\noperational excellence, and long-term\
    \ thinking. Amazon strives to be Earth’s Most Customer-Centric Company, Earth’s\
    \ Best\nEmployer, and Earth’s Safest Place to Work. Customer reviews, 1-Click\
    \ shopping, personalized recommendations, Prime,\nFulfillment by Amazon, AWS,\
    \ Kindle Direct Publishing, Kindle, Career Choice, Fire tablets, Fire TV, Amazon\
    \ Echo, Alexa,\nJust Walk Out technology, Amazon Studios, and The Climate Pledge\
    \ are some of the things pioneered by Amazon. For more\ninformation, visit amazon.com/about\
    \ and follow @AmazonNews."
