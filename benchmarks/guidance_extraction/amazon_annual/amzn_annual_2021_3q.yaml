  label: Amazon Q3 2021 Earnings Release, October 28, 2021
  text: "AMAZON.COM ANNOUNCES THIRD QUARTER RESULTS\n\nSEATTLE—(BUSINESS WIRE) October\
    \ 28, 2021—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial\nresults\
    \ for its third quarter ended September 30, 2021.\n•\n\nOperating cash flow decreased\
    \ 1% to $54.7 billion for the trailing twelve months, compared with $55.3 billion\
    \ for the\ntrailing twelve months ended September 30, 2020.\n\n•\n\nFree cash\
    \ flow decreased to $2.6 billion for the trailing twelve months, compared with\
    \ $29.5 billion for the trailing\ntwelve months ended September 30, 2020.\n\n\
    •\n\nFree cash flow less principal repayments of finance leases and financing\
    \ obligations decreased to an outflow of\n$8.8 billion for the trailing twelve\
    \ months, compared with an inflow of $18.4 billion for the trailing twelve months\n\
    ended September 30, 2020.\n\n•\n\nFree cash flow less equipment finance leases\
    \ and principal repayments of all other finance leases and financing\nobligations\
    \ decreased to an outflow of $3.9 billion for the trailing twelve months, compared\
    \ with an inflow of $17.9\nbillion for the trailing twelve months ended September\
    \ 30, 2020.\n\n•\n\nCommon shares outstanding plus shares underlying stock-based\
    \ awards totaled 523 million on September 30,\n2021, compared with 518 million\
    \ one year ago.\n\n•\n\nNet sales increased 15% to $110.8 billion in the third\
    \ quarter, compared with $96.1 billion in third quarter 2020.\nExcluding the $0.5\
    \ billion favorable impact from year-over-year changes in foreign exchange rates\
    \ throughout the\nquarter, net sales increased 15% compared with third quarter\
    \ 2020.\n\n•\n\nOperating income decreased to $4.9 billion in the third quarter,\
    \ compared with $6.2 billion in third quarter 2020.\n\n•\n\nNet income decreased\
    \ to $3.2 billion in the third quarter, or $6.12 per diluted share, compared with\
    \ $6.3 billion, or\n$12.37 per diluted share, in third quarter 2020.\n\n“We’ve\
    \ always said that when confronted with the choice between optimizing for short-term\
    \ profits versus what’s best for\ncustomers over the long term, we will choose\
    \ the latter—and you can see that during every phase of this pandemic,” said Andy\n\
    Jassy, Amazon CEO. “In the first several months of COVID-19, Amazonians played\
    \ an essential role to help people secure the\nrequisite PPE, food, and other\
    \ in-demand items needed, and we worked closely with businesses and governments\
    \ to leverage\nAWS to maintain business continuity as they responded to the pandemic.\
    \ Customers have appreciated this commitment, which\nis part of what’s driving\
    \ this past quarter’s AWS growth acceleration to 39% year over year; but, it’s\
    \ also driven extraordinary\ninvestments across our businesses to satisfy customer\
    \ needs—just one example is that we’ve nearly doubled the size of our\nfulfillment\
    \ network since the pandemic began. In the fourth quarter, we expect to incur\
    \ several billion dollars of additional costs\nin our Consumer business as we\
    \ manage through labor supply shortages, increased wage costs, global supply chain\
    \ issues, and\nincreased freight and shipping costs—all while doing whatever it\
    \ takes to minimize the impact on customers and selling\npartners this holiday\
    \ season. It’ll be expensive for us in the short term, but it’s the right prioritization\
    \ for our customers and\npartners.”\nHighlights\nInnovating for Our Retail Customers\n\
    •\n\nAmazon kicked off the holidays early this year, announcing Black Friday-worthy\
    \ deals on October 4, including\nthousands of deals from independent sellers and\
    \ handmade artisans and Amazon’s biggest ever selection of gift guides.\nAmazon\
    \ launched new features like the Holiday Gift List to let customers easily create\
    \ and share one list of gift ideas\n\n\ffor everyone in their household, conveniently\
    \ organized by recipients. The company also unveiled its new Holiday\nPrep Shop,\
    \ which expertly curates top products across various categories to help customers\
    \ prepare for seasonal\ncelebrations.\n•\n\nAmazon expanded its faster Same-Day\
    \ Delivery service to Atlanta, Baltimore, Charlotte, Chicago, Detroit, Houston,\n\
    Miami, Minneapolis, and Tampa—bringing the total number of cities with the service,\
    \ which launched in 2020, to 15.\nThe expansion has led to hundreds of new Amazon\
    \ jobs in these cities offering competitive hourly wages and a\nflexible work\
    \ schedule. Prime members can shop up to 3 million items across a dozen categories,\
    \ such as baby, beauty\nand health, and electronics, and receive their order in\
    \ as fast as five hours.\n\n•\n\nAmazon launched a new gift-giving feature that\
    \ enables Prime members in the U.S. to use the Amazon mobile\nshopping app to\
    \ send gifts with just the recipient’s email or mobile phone number. Recipients\
    \ receive a gift message—\nby email or text—that allows them to accept the gift.\
    \ They are then prompted to enter their preferred delivery address\nfrom their\
    \ Amazon account to receive the gift.\n\n•\n\nAmazon’s Great Indian Festival sales\
    \ event, which started on October 3, features more than 75,000 small businesses\n\
    selling on Amazon from 450 cities across India, and provides customers access\
    \ to a unique selection of products. The\nevent also includes more than 1,000\
    \ new product launches from top brands like Apple, Maybelline, and Samsung.\n\
    Plus, Prime members enjoy early access to deals, such as Prime Fridays, where\
    \ members can receive exclusive product\noffers and perks, including exclusive\
    \ entertainment launches on Amazon Prime and free delivery from top restaurants\n\
    through Amazon Food.\n\n•\n\nIn the U.S., Personal Shopper by Prime Try Before\
    \ You Buy is now more convenient with a newly launched\n“automatic deliveries”\
    \ feature, which lets customers receive personalized stylist picks directly at\
    \ their door monthly,\nbi-monthly, or quarterly and only pay for what they keep.\
    \ Prime Try Before You Buy also expanded to France, Italy,\nPortugal, and Spain.\
    \ This Amazon Fashion service allows customers to have their favorite fashion\
    \ items delivered free\nof charge, so they can try on their items in the comfort\
    \ of their own homes, pay for what they keep, and then return the\nrest for free.\n\
    \n•\n\nAmazon launched Amazon.eg in Egypt. The new store, formerly known as Souq.com,\
    \ features millions of items from\nlocal and international brands across a range\
    \ of categories, including apparel, electronics, grocery, home, and kitchen,\n\
    as well as Amazon products and devices like Kindle e-readers.\n\n•\n\nPrime continued\
    \ to expand and provide even more value to members around the world. The program\
    \ is now available\nto customers in Sweden and Poland, offering free and fast\
    \ delivery on millions of items. In the UK and Ireland, Prime\nmembers can now\
    \ receive a free Deliveroo Plus membership for a year, giving them unlimited free\
    \ delivery on orders\nover £25. In the U.S., Prime Student introduced new exclusive\
    \ offers from Calm, Course Hero, Grubhub, and\nStudentUniverse offering exclusive\
    \ discounts to college students. In Saudi Arabia and the United Arab Emirates,\n\
    Prime and Anghami, the Middle East and North Africa’s leading music streaming\
    \ service, announced that Prime\nmembers can enjoy an exclusive six-month free\
    \ offer on Anghami Plus, Anghami’s premium paid tier.\n\n•\n\nAmazon One, which\
    \ lets customers use their palm to enter, identify, and pay at stores and other\
    \ venues, was\nintroduced for the first time at third-party locations. AXS, a\
    \ leading digital ticketing company, integrated Amazon One\ninto their contactless\
    \ ticketing pedestals at Red Rocks Amphitheatre in Denver. The technology was\
    \ also introduced in\nfour venues at the Climate Pledge Arena in Seattle. Amazon\
    \ One is now available at more than 70 Amazon physical\nretail stores and Whole\
    \ Foods Market stores, and third-party locations.\n\n•\n\nFor the first time,\
    \ Amazon’s Just Walk Out technology is being integrated into two new Whole Foods\
    \ Market\nlocations in Sherman Oaks, California and Washington, D.C. that are\
    \ expected to open next year. In addition, three\nnew third-party venues have\
    \ been enabled with Just Walk Out technology: the Javits Center store in New York\
    \ City,\nmarking the first time Amazon’s checkout-free technology is being used\
    \ in a convention center; the Forum store in Los\nAngeles, marking the first time\
    \ a West Coast-based arena has enabled a store with Just Walk Out technology;\
    \ and the\nClimate Pledge Arena in Seattle, marking the first time Just Walk Out\
    \ technology and Amazon One have been used\ntogether in a third-party location.\n\
    \n•\n\nAmazon is now the first and only marketplace to protect customers in third-party\
    \ product liability cases. The company\nexpanded its A-to-z Guarantee to protect\
    \ customers in the rare case that a defective third-party product causes property\n\
    damage or personal injury. Amazon works with sellers and their insurance companies\
    \ to address claims up to $1\nmillion.\n\nEntertainment\n•\n\nAmazon Games launched\
    \ New World, a multiplayer online PC game. New World became the highest-played\
    \ new\ngame this year on Steam, a widely used distribution platform where players\
    \ find, buy, and play games on PC. On\n\n\fTwitch, New World became the most-watched\
    \ game during its launch week by hours watched, and the 12th highestwatched game\
    \ ever by peak concurrent viewers.\n•\n\nPrime Video released the Amazon Original\
    \ movie Cinderella, starring Camila Cabello, which was the No. 1 streamed\nmovie\
    \ across all films on streaming platforms during its opening weekend and the No.\
    \ 1 streamed musical of the year.\n\n•\n\nPrime Video announced that The Lord\
    \ of the Rings series will premiere September 2, 2022 on the streaming service,\n\
    and an untitled spinoff will be produced for the popular series The Boys. In the\
    \ fourth quarter, Amazon Original\nMovies The Tender Bar, starring Ben Affleck\
    \ and directed by George Clooney, and Being the Ricardos, starring\nNicole Kidman\
    \ and directed by Aaron Sorkin, will release in theaters and follow on Prime Video.\n\
    \n•\n\nPrime Video debuted 28 local originals internationally, including in Argentina,\
    \ Australia, Brazil, Canada, France,\nGermany, India, Italy, Japan, Mexico, Spain,\
    \ and the UK. Prime Video also launched Prime Video Channels for\ncustomers in\
    \ India, giving Prime members the option for add-on subscriptions of popular over-the-top\
    \ services, and the\nPrime Video Store in Brazil, giving customers the opportunity\
    \ to rent or buy new movie releases.\n\n•\n\nPrime Video streamed its first-ever\
    \ Union of European Football Associations (UEFA) Champions League soccer\nmatches\
    \ in Germany and Italy, and the first Ligue 1 soccer matches in France. In the\
    \ UK, the U.S. Open final featuring\n18-year-old rising star Emma Raducanu was\
    \ the most-streamed tennis match in Prime Video history, following the\nhistoric\
    \ partnership with Channel 4 to share live broadcast rights. Prime Video’s presentation\
    \ of Thursday Night\nFootball kicked off and introduced player tracking, a new\
    \ feature driven by artificial intelligence (AI).\n\n•\n\nIn its first global\
    \ expansion since launching in the U.S. in 2019, IMDb TV launched in the UK to\
    \ provide free\npremium steaming content to customers via Prime Video. The service\
    \ will soon become available as a standalone app\non Fire TV devices.\n\n•\n\n\
    Amazon Music launched new original podcasts, including: SmartLess, the celebrity-interview\
    \ show from hosts Jason\nBateman, Sean Hayes, and Will Arnett, that recently landed\
    \ on Podtrac’s Top 10 most-listened-to shows in the U.S.;\nSet It Straight, hosted\
    \ by country music band Midland and featuring guests such as Garth Brooks, Sheryl\
    \ Crow, and\nMatthew McConaughey; Badlands: Sportslands, the cult-classic from\
    \ host Jake Brennan; 9/12 from prolific writer and\npodcaster Dan Taberski; and\
    \ Uncommon Ground, hosted by political commentator, author, and lawyer Van Jones.\n\
    Wondery, Amazon Music’s premium podcast studio, celebrated the return of the fan-favorite\
    \ podcast Dr. Death\nSeason 3: Miracle Man, which is now available in eight languages.\n\
    \n•\n\nAmazon Music announced expanded access to spatial and high-quality audio\
    \ for all its Unlimited subscribers\nworldwide, unlocking the highest-quality\
    \ streaming audio for even more music fans. Previously available as a separate\n\
    streaming tier, this level is now available to all subscribers automatically and\
    \ without an upgrade.\n\nAmazon Devices and Services\n•\n\nAmazon introduced the\
    \ Echo Show 15 with a 15.6-inch, 1080p HD display. It can be mounted to a wall\
    \ or placed on\nthe counter and is designed to help customers stay organized,\
    \ connected, and entertained. The Echo Show 15 features a\nredesigned home screen,\
    \ new personalization options with visual ID, and all-new Alexa experiences like\
    \ a household\ncalendar and sticky notes.\n\n•\n\nAmazon introduced an all-new\
    \ lineup of Fire TV devices with its first-ever Amazon-built smart TVs—the Amazon\n\
    Fire TV Omni Series and 4-Series smart TVs—and the all-new Fire TV Stick 4K Max.\
    \ The Omni Series offers handsfree Alexa voice control, and both lineups feature\
    \ 4K UHD resolution. The Fire TV Stick 4K Max is 40% more\npowerful than the Fire\
    \ TV Stick 4K and has a new quad-core 1.8GHz processer, 2GB of RAM, and Wi-Fi\
    \ 6 support\nfor faster app starts and smoother streaming.\n\n•\n\nAmazon announced\
    \ Astro, a new home robot that brings together advancements in AI, computer vision,\
    \ sensor\ntechnology, and voice and edge computing to help customers monitor their\
    \ home, look out for loved ones, and bring\nAlexa with them around the house.\n\
    \n•\n\nAmazon introduced Amazon Glow, an interactive device that combines immersive\
    \ projection, sensing, and video\ntechnologies to make users feel like they are\
    \ in the same room. Designed with children and grandparents in mind, the\ndevice\
    \ allows kids to see loved ones on an 8-inch display while, at the same time,\
    \ reading stories, playing games, or\ncreating art on a 19-inch touch-sensitive\
    \ projected space below. Glow comes with one year of Amazon Kids+,\nbringing hundreds\
    \ of hours of fun designed specifically for Glow.\n\n•\n\nAmazon announced Alexa\
    \ Together, a new subscription service designed to help aging family members feel\
    \ more\ncomfortable and confident when living independently. Alexa Together includes\
    \ 24/7 hands-free access to an Urgent\nResponse emergency helpline, compatibility\
    \ with third-party fall detection devices, and an optional Remote Assist\nfeature\
    \ so caregivers can help without having to be there in person.\n\n\f•\n\nAmazon\
    \ announced three new expansions to the Halo family: Halo View, a health tracker\
    \ with a color display for at-aglance access to Halo health metrics; Halo Fitness,\
    \ a service that gives members hundreds of studio-quality workout\nclasses integrated\
    \ with access to real-time individual health metrics as an on-display overlay;\
    \ and Halo Nutrition, a\nmembership experience to help build healthy eating habits.\n\
    \n•\n\nAmazon and Disney announced ‘Hey, Disney!’, an entirely new kind of voice\
    \ assistant that will work on supported\nEcho devices at home and across Disney\
    \ Resort hotel rooms at Walt Disney World. By saying ‘Hey, Disney!’, users\nget\
    \ access to interactive Disney storytelling experiences and entertainment, as\
    \ well as jokes, fun facts, and special\nsurprises featuring characters from Disney,\
    \ Pixar, Marvel, and Star Wars. It will even make everyday tasks more\nmagical,\
    \ such as setting timers and alarms, and checking the weather or time of day.\
    \ ‘Hey, Disney!’ is expected to be\navailable for purchase in the U.S. in 2022\
    \ in the Alexa Skills Store for use on all supported Echo devices, and will be\n\
    available complimentary for Disney Resort guests at Walt Disney World.\n\n•\n\n\
    Ring and Blink introduced new home security devices and services with the Ring\
    \ Alarm Pro, Virtual Security Guard,\nand Blink Video Doorbell. Ring Alarm Pro\
    \ is a first-of-its-kind home security system that combines protection against\n\
    break-ins, floods, fires, and network threats with a built-in eero Wi-Fi 6 router\
    \ for connectivity. Virtual Security Guard\nis a new subscription service where\
    \ third-party professional monitoring companies will visually monitor outdoor\
    \ Ring\ncameras. The Blink Video Doorbell can be installed wired or wire-free\
    \ and has a long-lasting battery life, 1080p HD\nday-and-night video, two-way\
    \ audio, chime alerts via the Blink app when the doorbell rings, and the ability\
    \ to connect\nthe doorbell to your existing chime.\n\n•\n\nAmazon announced the\
    \ next generation of Kindle Paperwhite with three new models. The new Kindle Paperwhite\n\
    comes with a larger display, adjustable warm light, USB-C charging, and increased\
    \ battery life. The new Signature\nEdition adds an auto-adjusting light sensor,\
    \ 32GB of storage, and is the first-ever Kindle to offer wireless charging.\n\
    The new Kindle Paperwhite Kids comes with one year of Amazon Kids+, a kid-friendly\
    \ case, and a two-year worryfree guarantee.\n\n•\n\nAmazon introduced its AZ2\
    \ Neural Edge processor, a machine learning inference engine capable of processing\
    \ speech\nrecognition on-device, while processing computer vision workloads in\
    \ parallel. Featured in the Echo Show 15, AZ2\nenables the device to recognize\
    \ a person enrolled in visual ID and then process their voice right on the device.\n\
    \nAmazon Web Services\n•\n\nAWS announced significant customer momentum, with\
    \ new commitments and migrations from customers across\nmajor industries.\n•\n\
    \nManufacturing: NXP, a leading European designer and manufacturer of specialized\
    \ semiconductors, selected\nAWS as its preferred cloud provider. NXP is migrating\
    \ the vast majority of its electronic design automation\nworkloads from NXP data\
    \ centers to AWS. Leaders across the automotive industry, including Capgemini\n\
    Engineering, CARIAD, and Continental, joined AWS in a special interest group supporting\
    \ Arm’s Scalable\nOpen Architecture for Embedded Edge to bring cloud-native practices\
    \ and software-defined architectures to\nthe automotive industry.\n\n•\n\nHospitality\
    \ and ecommerce: Wyndham Hotels & Resorts, Inc., the world’s largest hotel franchising\n\
    company, selected AWS to upgrade its technology infrastructure and develop and\
    \ deliver new guest services\nacross its 21 hotel brands—including Ramada, Travelodge,\
    \ and Wyndham. VTEX, a global ecommerce\nsolution provider, is working with AWS\
    \ to create a new direct-to-consumer solution that gives large\nenterprises the\
    \ ability to quickly and easily launch ecommerce sites and experiences to sell\
    \ directly to\nconsumers.\n\n•\n\nTelecom: Boingo Wireless, a leading distributed\
    \ antenna system, Wi-Fi, and private network provider,\nannounced an expanded\
    \ collaboration with AWS to enable airports, stadiums, and large businesses to\
    \ unlock\nnew 5G use cases with advanced multi-access edge computing.\n\n•\n\n\
    Financial services: Sun Life, an international financial services and insurance\
    \ company, selected AWS as its\nlong-term strategic cloud technology provider.\
    \ Black Knight, a software, data, and analytics provider to the\nmortgage, real\
    \ estate, and capital markets verticals, selected AWS to develop mortgage-specific\
    \ AI\napplications.\n\n•\n\nHealthcare and life sciences: Baxter International\
    \ Inc., a global medical products company, is moving from\nits own data centers\
    \ into AWS and has already seen benefits, including increased speed to market\
    \ for new\ntools and solutions, the ability to quickly expand technology solutions\
    \ to new geographies, and significant\ncost savings.\n\n\f•\n\nSecurity operations:\
    \ Arctic Wolf Networks selected AWS as its primary cloud provider to power its\n\
    innovative, cloud-native security operations platform as it expands globally.\
    \ Using AWS, Arctic Wolf is able\nto process more than 1.4 trillion unique security\
    \ events a week to help its customers manage rapidly evolving\ndigital threats.\n\
    \n•\n\nAWS announced plans to open an infrastructure Region in New Zealand in\
    \ 2024 that will consist of three Availability\nZones, giving customers more choice\
    \ and flexibility to leverage advanced technologies. A newly released AWS\neconomic\
    \ impact study estimates that the new infrastructure Region will create 1,000\
    \ new jobs in New Zealand over\nthe next 15 years through the investment of $5.3\
    \ billion (NZ$7.5 billion). Globally, AWS has 81 Availability Zones\nacross 25\
    \ geographic Regions, with plans to launch 24 more Availability Zones and eight\
    \ more AWS Regions.\n\n•\n\nAWS announced three new capabilities for Amazon Connect,\
    \ an easy-to-use, highly scalable, and cost-effective\nomnichannel cloud contact\
    \ center solution that improves contact center agent productivity and provides\
    \ superior\nservice by making customer interactions more effective, personal,\
    \ and natural. The new features give agents the right\ninformation at the right\
    \ time to provide fast and secure caller authentication, the ability to answer\
    \ customer questions\nmore quickly, and the ability to make the overall process\
    \ easier and more efficient. Tens of thousands of AWS\ncustomers are supporting\
    \ more than 10 million contact center interactions a day on Amazon Connect.\n\n\
    •\n\nAWS announced the general availability of Amazon MemoryDB for Redis, a fully\
    \ managed, Redis-compatible, inmemory database that enables customers to achieve\
    \ ultra-fast performance with high availability and durability for\ntheir most\
    \ business-critical applications that require sub-millisecond response times.\
    \ With Amazon MemoryDB for\nRedis, customers can use the same familiar and flexible\
    \ Redis data structures and application programming interface\n(API) they use\
    \ today without having to separately manage a cache and a durable database, or\
    \ the required underlying\ninfrastructure.\n\n•\n\nAWS announced the general availability\
    \ of Amazon Managed Grafana, a fully managed data visualization service that\n\
    enables customers to instantly query, correlate, and visualize operational metrics,\
    \ logs, and traces, as well as Internet\nof Things (IoT) data. Developed in collaboration\
    \ with Grafana Labs, Amazon Managed Grafana manages the\nprovisioning, setup,\
    \ scaling, and maintenance of Grafana so customers can easily create dashboards\
    \ to view\noperational data from multiple data sources without having to worry\
    \ about the underlying Grafana infrastructure.\n\n•\n\nAWS announced the general\
    \ availability of Amazon Managed Service for Prometheus, a scalable, secure, and\
    \ highly\navailable service that makes it easier for customers to monitor containerized\
    \ applications. Amazon Managed Service\nfor Prometheus is fully compatible with\
    \ open-source Prometheus and provides the same familiar time series data\nmodel\
    \ and Prometheus Query Language customers use today to monitor containerized applications.\n\
    \n•\n\nAWS announced the general availability of Amazon QuickSight Q, a new capability\
    \ in Amazon QuickSight that gives\nanyone access to powerful analytics with the\
    \ ability to ask business questions using natural language and receive\naccurate\
    \ answers with relevant visualizations. Amazon QuickSight Q does not depend on\
    \ prebuilt dashboards or\nreports to deliver visualizations, which removes the\
    \ need for business intelligence analysts to update a dashboard every\ntime a\
    \ new business question arises. This allows anyone to ask questions and receive\
    \ visual answers in seconds.\n\n•\n\nAWS announced the general availability of\
    \ Amazon FSx for NetApp ONTAP, a new storage service that provides the\nfirst\
    \ complete, fully managed NetApp ONTAP file system in the cloud, making it easy\
    \ for customers to run their\napplications on AWS without changing their code\
    \ or how they manage data.\n\n•\n\nAWS announced the general availability of Amazon\
    \ Elastic Compute Cloud (Amazon EC2) DL1 instances, a new\ninstance type designed\
    \ for training machine learning models. DL1 instances provide up to 40% better\
    \ price per\nperformance for training machine learning models than the latest\
    \ GPU-powered Amazon EC2 instances.\n\n•\n\nAWS announced the general availability\
    \ of the AWS Panorama Appliance, a new device that customers can install to\n\
    run machine learning applications on multiple video streams from existing on-premises\
    \ cameras. The AWS Panorama\nAppliance enables customers to use machine learning\
    \ to quickly and easily perform visual inspections of production\nlines, monitor\
    \ drive-through queues at quick-service restaurants, or assess the layout of their\
    \ physical locations for\nideal product placement.\n\nInvesting in Employees and\
    \ Our Workplace\n•\n\nAmazon announced it will fund full college tuition, high\
    \ school diplomas, GED diplomas, and English as a Second\nLanguage proficiency\
    \ certifications for its U.S. front-line employees through its Career Choice program.\
    \ More than\n750,000 operations employees will be eligible for this benefit starting\
    \ in January 2022. This expansion of education\nbenefits is part of Upskilling\
    \ 2025, Amazon’s $1.2 billion investment to provide free skills training to the\
    \ company’s\nU.S. employees over the next four years.\n\n\f•\n\nFor jobseekers\
    \ looking for flexible employment opportunities this holiday season, Amazon announced\
    \ it is offering\n150,000 seasonal roles in the U.S., over 50,000 seasonal roles\
    \ in Europe, and over 110,000 seasonal roles in India. Job\nseekers in the U.S.\
    \ can receive an immediate contingent offer for seasonal roles with an average\
    \ starting pay of $18 per\nhour, sign-on bonuses up to $3,000, an additional $3\
    \ per hour depending on shifts in many locations, and the\nopportunity to transition\
    \ to long-term careers.\n\n•\n\nAmazon began operations at its state-of-the-art\
    \ U.S. air cargo hub in Northern Kentucky. The $1.5 billion investment\nat Cincinnati/Northern\
    \ Kentucky International Airport will create more than 2,000 new Amazon jobs over\
    \ the next\nseveral years with industry-leading pay and comprehensive benefits.\
    \ The Amazon Air Hub will serve as the primary\nhub for Amazon Air’s U.S. cargo\
    \ network—enabling Amazon to process millions of customer packages per week.\n\
    \n•\n\nAmazon hosted Career Day, a global event to help current and future employees\
    \ grow their careers. More than 1\nmillion people applied for a job at Amazon\
    \ as part of the event, and over 2,000 Amazon recruiters offered 30,000\nindividual\
    \ career coaching sessions to participants in Canada, France, Germany, India,\
    \ Italy, Japan, Spain, the UK, and\nthe U.S. Recruiters provided job seekers with\
    \ professional advice to start, transition, or grow their careers—whether\nthey\
    \ want to work at Amazon or elsewhere. As part of the event, Amazon announced\
    \ plans to hire 55,000 corporate\nand tech employees globally as well as 125,000\
    \ full- and part-time operations employees in hundreds of cities and\ntowns across\
    \ the U.S., with comprehensive benefits like healthcare and up to 20 weeks of\
    \ paid parental leave, as well\nas access to Amazon’s Career Choice program.\n\
    \n•\n\nForbes ranked Amazon No. 4 on its World’s Best Employers 2021 list. To\
    \ compile this year’s list, Statista surveyed\n150,000 employees from 58 countries\
    \ around the world and asked them to rate their willingness to recommend their\n\
    employers to friends and family. The survey used feedback from Amazon employees\
    \ working both across our logistics\nnetwork and corporate offices.\n\nSupporting\
    \ Local Communities, Small Businesses, and the Economy\n•\n\nAmazon Future Engineer,\
    \ the company’s global computer science education program for students from underserved\n\
    and historically underrepresented communities, launched “Meet an Amazonian” for\
    \ students from 3,000 U.S. schools.\nStudents can learn about careers in technology\
    \ directly from Amazon employees and participate in virtual class chats\nand computer\
    \ science-themed fulfillment center tours. The company also launched Amazon Future\
    \ Engineer in India,\nwhere it aims to reach more than 100,000 students from 900\
    \ schools in the first year of launch. The program is now\navailable in Canada,\
    \ France, India, the UK, and the U.S.\n\n•\n\nAmazon donated more than 1 million\
    \ emergency supplies to communities affected by Hurricane Ida in Louisiana and\n\
    the earthquake in Haiti. Amazon activated its Disaster Relief Hub and teamed up\
    \ with humanitarian aid partners to\nquickly deliver and distribute supplies to\
    \ those in need. The supplies included water, food items, shelter materials,\n\
    medical equipment, power generators, industrial insulated food carriers, solar\
    \ chargers, and water filters.\n\n•\n\nAWS announced it is committing $40 million\
    \ in credits and technical expertise over the next three years to support\norganizations\
    \ around the world that are developing solutions to improve health outcomes and\
    \ health equity for\nunderserved or underrepresented communities. The program\
    \ is focused on increasing access to health services,\naddressing social determinants\
    \ of health, and leveraging data to promote equitable and inclusive systems of\
    \ care.\n\n•\n\nAmazon released its Small Business Empowerment Report, highlighting\
    \ the company’s investments, programs, and\ntools to help small and medium-sized\
    \ businesses thrive while selling in Amazon’s store. Amazon’s global selling\n\
    partners―the majority of which are small and medium-sized businesses―have created\
    \ an estimated 1.8 million U.S.based jobs managing, operating, and supporting\
    \ their Amazon-related businesses. In the 12 months ending August 31,\nU.S. sellers\
    \ sold 3.8 billion products in Amazon’s store―approximately 7,400 products per\
    \ minute.\n\n•\n\nAmazon hosted Amazon Accelerate, its annual U.S. conference\
    \ for selling partners, where the company announced\nnew tools and capabilities\
    \ to help sellers thrive. Among the announcements, Amazon unveiled Local Selling,\
    \ which\nenables sellers to start or expand their multichannel offerings by providing\
    \ both in-store pickup and fast delivery to\nnearby customers, and new Global\
    \ Selling tools to make it easier for U.S. third-party sellers to offer their\
    \ products in\nAmazon’s 21 stores worldwide.\n\n•\n\nAmazon introduced Black Business\
    \ Accelerator Connect, a new yearlong mentorship and networking benefit for\n\
    participants in the Black Business Accelerator, the company’s initiative to provide\
    \ Black entrepreneurs with resources,\nguidance, and support to succeed as Amazon\
    \ sellers.\n\n•\n\nAmazon and Lendistry launched Amazon Community Lending, providing\
    \ U.S.-based Amazon sellers access to shortterm loans of up to $100,000 at competitive\
    \ rates to sustain and grow their businesses. Lendistry is a Community\nDevelopment\
    \ Financial Institution that serves urban and rural small businesses in socially\
    \ and economically distressed\ncommunities.\n\n\fProtecting the Planet\n•\n\n\
    Amazon welcomed 86 new companies to The Climate Pledge, including HP, Procter\
    \ & Gamble, and Salesforce,\nbringing the total number of companies that have\
    \ pledged to achieve net-zero carbon emissions by 2040 to more than\n200. Pledge\
    \ signatories generate over $1.8 trillion in global annual revenue and have more\
    \ than 7 million employees\nacross 26 industries in 21 countries.\n\n•\n\nThe\
    \ Climate Pledge Fund, a $2 billion venture capital fund to support the development\
    \ of sustainable and\ndecarbonizing technologies and services, made new investments\
    \ in three companies: CMC Machinery, a technology\ncompany that designs and manufactures\
    \ custom-sized boxes while eliminating the need for single-use plastic padding;\n\
    Resilient Power, a builder of solid-state power stations for electric vehicles;\
    \ and Infinium, a company working toward\na low-carbon electrofuels solution for\
    \ air transport, marine freight, and heavy truck fleets. In total, the Climate\
    \ Pledge\nFund has invested in 11 companies.\n\n•\n\nAmazon’s Right Now Climate\
    \ Fund, a $100 million fund to restore and conserve forests, wetlands, and grasslands\n\
    around the world, announced an investment in the Agroforestry and Restoration\
    \ Accelerator, a nature-based carbon\nremoval initiative in the Brazilian Amazon,\
    \ and a commitment of approximately $23.5 million (€20 million) for\nprojects\
    \ across Europe to help fight climate change. The first funding recipient is the\
    \ Parco Italia urban forestry\nprogram, which aims to plant 22 million trees—one\
    \ tree per city resident—across 14 metropolitan areas in Italy.\n\n•\n\nAmazon\
    \ co-founded The Cargo Owners for Zero Emission Vessels network alongside the\
    \ Aspen Institute, IKEA,\nInditex, Michelin, Patagonia, Tchibo, and fellow Pledge\
    \ signatories Brooks Running and Unilever. The initiative aims\nto transition\
    \ ocean freight vessels from fossil fuels to zero-carbon fuels by 2040.\n\n•\n\
    \nLast year, Amazon became the first consumer electronics manufacturer to commit\
    \ to addressing, through renewable\nenergy development, the electricity used by\
    \ its devices—starting with Echo devices. Amazon recently announced\nadditional\
    \ investments in wind and solar farm capacity that, by 2025, are expected to produce\
    \ the clean energy\nequivalent of all the electricity used by Fire TV and Ring\
    \ devices worldwide.\n\n\fFinancial Guidance\nThe following forward-looking statements\
    \ reflect Amazon.com’s expectations as of October 28, 2021, and are subject to\n\
    substantial uncertainty. Our results are inherently unpredictable and may be materially\
    \ affected by many factors, such as\nuncertainty regarding the impacts of the\
    \ COVID-19 pandemic, fluctuations in foreign exchange rates, changes in global\n\
    economic conditions and customer demand and spending, labor market and global\
    \ supply chain constraints, world events, the\nrate of growth of the Internet,\
    \ online commerce, and cloud services, and the various factors detailed below.\
    \ This guidance\nreflects our estimates as of October 28, 2021 regarding the impacts\
    \ of the COVID-19 pandemic on our operations as well as the\neffect of other factors\
    \ discussed above.\nFourth Quarter 2021 Guidance\n•\n•\n•\n\nNet sales are expected\
    \ to be between $130.0 billion and $140.0 billion, or to grow between 4% and 12%\
    \ compared\nwith fourth quarter 2020. This guidance anticipates an unfavorable\
    \ impact of approximately 60 basis points from\nforeign exchange rates.\nOperating\
    \ income is expected to be between $0 and $3.0 billion, compared with $6.9 billion\
    \ in fourth quarter 2020.\nThis guidance assumes, among other things, that no\
    \ additional business acquisitions, restructurings, or legal\nsettlements are\
    \ concluded.\n\nA conference call will be webcast live today at 2:30 p.m. PT/5:30\
    \ p.m. ET, and will be available for at least three months at\namazon.com/ir.\
    \ This call will contain forward-looking statements and other material information\
    \ regarding the Company’s\nfinancial and operating results.\nThese forward-looking\
    \ statements are inherently difficult to predict. Actual results could differ\
    \ materially for a variety of\nreasons, including, in addition to the factors\
    \ discussed above, the amount that Amazon.com invests in new business\nopportunities\
    \ and the timing of those investments, the mix of products and services sold to\
    \ customers, the mix of net sales\nderived from products as compared with services,\
    \ the extent to which we owe income or other taxes, competition, management\n\
    of growth, potential fluctuations in operating results, international growth and\
    \ expansion, the outcomes of claims, litigation,\ngovernment investigations, and\
    \ other proceedings, fulfillment, sortation, delivery, and data center optimization,\
    \ risks of\ninventory management, variability in demand, the degree to which the\
    \ Company enters into, maintains, and develops\ncommercial agreements, proposed\
    \ and completed acquisitions and strategic transactions, payments risks, and risks\
    \ of\nfulfillment throughput and productivity. Other risks and uncertainties include,\
    \ among others, risks related to new products,\nservices, and technologies, system\
    \ interruptions, government regulation and taxation, and fraud. In addition, additional\
    \ or\nunforeseen effects from the COVID-19 pandemic and the global economic climate\
    \ may give rise to or amplify many of these\nrisks. More information about factors\
    \ that potentially could affect Amazon.com’s financial results is included in\
    \ Amazon.com’s\nfilings with the Securities and Exchange Commission (“SEC”), including\
    \ its most recent Annual Report on Form 10-K and\nsubsequent filings.\nOur investor\
    \ relations website is amazon.com/ir and we encourage investors to use it as a\
    \ way of easily finding information\nabout us. We promptly make available on this\
    \ website, free of charge, the reports that we file or furnish with the SEC, corporate\n\
    governance information (including our Code of Business Conduct and Ethics), and\
    \ select press releases, which may contain\nmaterial information about us, and\
    \ you may subscribe to be notified of new information posted to this site.\nAbout\
    \ Amazon\nAmazon is guided by four principles: customer obsession rather than\
    \ competitor focus, passion for invention, commitment to\noperational excellence,\
    \ and long-term thinking. Amazon strives to be Earth’s Most Customer-Centric Company,\
    \ Earth’s Best\nEmployer, and Earth’s Safest Place to Work. Customer reviews,\
    \ 1-Click shopping, personalized recommendations, Prime,\nFulfillment by Amazon,\
    \ AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire tablets, Fire TV,\
    \ Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios, and The Climate\
    \ Pledge are some of the things pioneered by Amazon. For more\ninformation, visit\
    \ amazon.com/about and follow @AmazonNews."
