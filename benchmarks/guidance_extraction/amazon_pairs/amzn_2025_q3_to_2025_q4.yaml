    \ and Ethics), and select press releases, which may contain\nmaterial information\
    \ about us, and you may subscribe to be notified of new information posted to\
    \ this site.\nAbout Amazon\nAmazon is guided by four principles: customer obsession\
    \ rather than competitor focus, passion for invention, commitment to\noperational\
    \ excellence, and long-term thinking. Amazon strives to be Earth’s Most Customer-Centric\
    \ Company, Earth’s Best\nEmployer, and Earth’s Safest Place to Work. Customer\
    \ reviews, 1-Click shopping, personalized recommendations, Prime,\nFulfillment\
    \ by Amazon, AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire tablets,\
    \ Fire TV, Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios, and\
    \ The Climate Pledge are some of the things pioneered by Amazon. For more\ninformation,\
    \ visit amazon.com/about and follow @AmazonNews."
