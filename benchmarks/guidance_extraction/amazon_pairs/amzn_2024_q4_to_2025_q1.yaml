  label: Amazon Q4 2024 Earnings Release, February 6, 2025
  text: "AMAZON.COM ANNOUNCES FOURTH QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) February\
    \ 6, 2025—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its fourth quarter ended December 31, 2024.\nFourth Quarter 2024\n•\n\n•\n\
    \n•\n\nNet sales increased 10% to $187.8 billion in the fourth quarter, compared\
    \ with $170.0 billion in fourth quarter 2023.\nExcluding the $0.9 billion unfavorable\
    \ impact from year-over-year changes in foreign exchange rates throughout the\n\
    quarter, net sales increased 11% compared with fourth quarter 2023.\n•\n\nNorth\
    \ America segment sales increased 10% year-over-year to $115.6 billion.\n\n•\n\
    \nInternational segment sales increased 8% year-over-year to $43.4 billion, or\
    \ increased 9% excluding changes\nin foreign exchange rates.\n\n•\n\nAWS segment\
    \ sales increased 19% year-over-year to $28.8 billion.\n\nOperating income increased\
    \ to $21.2 billion in the fourth quarter, compared with $13.2 billion in fourth\
    \ quarter 2023.\n•\n\nNorth America segment operating income was $9.3 billion,\
    \ compared with operating income of $6.5 billion\nin fourth quarter 2023.\n\n\
    •\n\nInternational segment operating income was $1.3 billion, compared with an\
    \ operating loss of $0.4 billion in\nfourth quarter 2023.\n\n•\n\nAWS segment\
    \ operating income was $10.6 billion, compared with operating income of $7.2 billion\
    \ in fourth\nquarter 2023.\n\nNet income increased to $20.0 billion in the fourth\
    \ quarter, or $1.86 per diluted share, compared with $10.6 billion, or\n$1.00\
    \ per diluted share, in fourth quarter 2023.\n\nFull Year 2024\n•\n\n•\n\n•\n\n\
    Net sales increased 11% to $638.0 billion in 2024, compared with $574.8 billion\
    \ in 2023. Excluding the $2.3 billion\nunfavorable impact from year-over-year\
    \ changes in foreign exchange rates throughout the year, net sales increased\n\
    11% compared with 2023.\n•\n\nNorth America segment sales increased 10% year-over-year\
    \ to $387.5 billion.\n\n•\n\nInternational segment sales increased 9% year-over-year\
    \ to $142.9 billion, or increased 10% excluding\nchanges in foreign exchange rates.\n\
    \n•\n\nAWS segment sales increased 19% year-over-year to $107.6 billion.\n\nOperating\
    \ income increased to $68.6 billion in 2024, compared with $36.9 billion in 2023.\n\
    •\n\nNorth America segment operating income was $25.0 billion, compared with operating\
    \ income of $14.9 billion\nin 2023.\n\n•\n\nInternational segment operating income\
    \ was $3.8 billion, compared with an operating loss of $2.7 billion in\n2023.\n\
    \n•\n\nAWS segment operating income was $39.8 billion, compared with operating\
    \ income of $24.6 billion in 2023.\n\nNet income increased to $59.2 billion in\
    \ 2024, or $5.53 per diluted share, compared with $30.4 billion, or $2.90 per\n\
    diluted share, in 2023.\n\n\f•\n\nOperating cash flow increased 36% to $115.9\
    \ billion for the trailing twelve months, compared with $84.9 billion for\nthe\
    \ trailing twelve months ended December 31, 2023.\n\n•\n\nFree cash flow increased\
    \ to $38.2 billion for the trailing twelve months, compared with $36.8 billion\
    \ for the trailing\ntwelve months ended December 31, 2023.\n\n•\n\nFree cash flow\
    \ less principal repayments of finance leases and financing obligations increased\
    \ to $35.5 billion for\nthe trailing twelve months, compared with $32.2 billion\
    \ for the trailing twelve months ended December 31, 2023.\n\n•\n\nFree cash flow\
    \ less equipment finance leases and principal repayments of all other finance\
    \ leases and financing\nobligations increased to $36.2 billion for the trailing\
    \ twelve months, compared with $35.5 billion for the trailing\ntwelve months ended\
    \ December 31, 2023.\n\n“The holiday shopping season was the most successful yet\
    \ for Amazon and we appreciate the support of our customers, selling\npartners,\
    \ and employees who helped make it so,” said Andy Jassy, President and CEO, Amazon.\
    \ “When we look back on this\nquarter several years from now, I suspect what we’ll\
    \ most remember is the remarkable innovation delivered across all of our\nbusinesses,\
    \ none more so than in AWS where we introduced our new Trainium2 AI chip, our\
    \ own foundation models in\nAmazon Nova, a plethora of new models and features\
    \ in Amazon Bedrock that give customers flexibility and cost savings,\nliberating\
    \ transformations in Amazon Q to migrate from old platforms, and the next edition\
    \ of Amazon SageMaker to pull data,\nanalytics, and AI together more concertedly.\
    \ These benefits are often realized by customers (and the business) several months\n\
    down the road, but these are substantial enablers in this emerging technology\
    \ environment and we’re excited to see what\ncustomers build.”\nSome other highlights\
    \ since the company’s last earnings announcement include that Amazon:\n•\n\nDelivered\
    \ at its fastest speeds ever for Prime members in 2024.\n\n•\n\nDelivered over\
    \ 65% more items to U.S. Prime members the same day or overnight than in Q4 2023.\n\
    \n•\n\nHeld a record-breaking Black Friday Week and Cyber Monday deal event that\
    \ was also the largest ever for\nindependent sellers in Amazon’s store.\n\n•\n\
    \nWas named lowest-priced U.S. retailer by Profitero for the eighth year in a\
    \ row. The study found Amazon’s online\nprices were an average of 14% less than\
    \ other major U.S. retailers.\n\n•\n\nLaunched Amazon Haul, a new shopping experience\
    \ in Amazon’s U.S. shopping app and mobile site, with ultra-low\nprices.\n\n•\n\
    \nDrew 50 million worldwide viewers to Red One in its first four days, making\
    \ it Amazon MGM Studios’ most-watched\nfilm debut ever on Prime Video.\n\n•\n\n\
    Finished third season of Thursday Night Football on Prime Video with a full-season\
    \ average of 13.2 million viewers\naccording to Nielsen—an 11% increase over 2023—and\
    \ a peak of 24.7 million during the Wild Card playoff game\nbetween the Steelers\
    \ and Ravens.\n\n•\n\nHad the biggest Q4 for Kindle device sales in over a decade,\
    \ with a new lineup of Kindles driving a 30% year-overyear increase in devices\
    \ sold.\n\n•\n\nHeld 13th AWS re:Invent, with 55,000+ in-person attendees and\
    \ 1.8 million livestream viewers.\n\n•\n\nAnnounced a plethora of new AWS capabilities,\
    \ including:\n•\n\nAmazon Nova: Amazon’s own family of foundation models that\
    \ compare favorably in intelligence against the\nleading models in the world,\
    \ but offer lower latency, lower price, and integration with key Bedrock features\n\
    like fine-tuning, model distillation, knowledge bases, and agentic capabilities.\
    \ Thousands of customers are\nalready using Nova, including Deloitte, SAP, Robinhood,\
    \ Palantir Technologies, Dentsu Digital, AppFolio,\nFortinet, Trellix, 123RF,\
    \ Envato, Pattern, and Ativion.\n\n•\n\nGeneral Availability of Trainium2: EC2\
    \ Trn2 instances, powered by Trainium2 AI chips, offer 30-40% better\nprice-performance\
    \ than current generations of GPU-based instances.\n\n•\n\nTrainium2 UltraServers:\
    \ A new type of EC2 Trn2 offering using ultra-fast networking to connect four\
    \ Trn2\nservers into an extra large server, enabling even faster training and\
    \ inference on AWS.\n\n•\n\nProject Rainier: A collaboration with Anthropic using\
    \ hundreds of thousands of Trainium2 chips to build the\nworld’s largest AI compute\
    \ cluster.\n\n•\n\nNew leading foundation models in Amazon Bedrock from DeepSeek,\
    \ Luma AI, and poolside.\n\n\f•\n\nAmazon Bedrock Marketplace, where customers\
    \ can choose from over 100 popular models.\n\n•\n\nNew features for Amazon Bedrock,\
    \ including Prompt Caching, Intelligent Prompt Routing, and Model\nDistillation,\
    \ all of which help customers achieve lower cost and latency in their inference.\n\
    \n•\n\nNew Amazon SageMaker AI features, including the ability to manage costs\
    \ and prioritize which workloads\nshould receive capacity when budgets are reached.\n\
    \n•\n\nNew Amazon Q Transformations that make it easy to move from Windows .NET\
    \ applications to Linux,\nVMware to EC2, and accelerates mainframe migrations\
    \ from multi-year to multi-quarter efforts.\n\n•\n\nAmazon Aurora DSQL: The fastest\
    \ distributed database with 99.999% multi-Region availability, virtually\nunlimited\
    \ scalability, strong consistency, zero infrastructure management, PostgreSQL\
    \ compatibility, and 4x\nfaster reads and writes vs. other popular distributed\
    \ SQL databases.\n\n•\n\nS3 Tables, making S3 the first cloud object store with\
    \ fully-managed support for Apache Iceberg.\n\n•\n\nS3 Metadata, automatically\
    \ generating queryable metadata, simplifying data discovery, business analytics,\n\
    and real-time inference to help customers unlock the value of their data in S3.\n\
    \n•\n\nThe next generation of Amazon SageMaker, which brings together all of the\
    \ data, analytics services and AI\nservices into one interface to do analytics\
    \ and AI more easily at scale.\n\n•\n\nSigned new AWS agreements with the U.S.\
    \ Army, Intuit, PayPal, Norwegian Cruise Line Holdings Ltd., Northrop\nGrumman,\
    \ Medtronic, The Guardian Life Insurance Company of America, Reddit, Japan Airlines,\
    \ Baker Hughes, The\nHertz Corporation, Redfin, Chime, and Asana.\n\n•\n\nAnnounced\
    \ GROW with SAP on AWS to help customers rapidly deploy SAP’s enterprise resource\
    \ planning.\n\n•\n\nLaunched AWS Asia Pacific (Thailand) and AWS Mexico (Central)\
    \ Regions.\n\n•\n\nSupported California wildfire relief efforts with over 500,000\
    \ essential items delivered through Disaster Relief by\nAmazon, AWS cloud technology\
    \ to help emergency responders, and $10 million in donations.\n\n•\n\nSupported\
    \ communities hit by flooding in southern Spain by donating and delivering more\
    \ than 265,000 essential\nitems.\n\n•\n\nRanked No. 3 on Fortune magazine’s World’s\
    \ Most Admired Companies list.\n\n•\n\nWon awards for advancement in workplace\
    \ health and safety from Brandon Hall Group, the Network of Employers for\nTraffic\
    \ Safety, and Verdantix.\n\n•\n\nWas named the world’s largest corporate purchaser\
    \ of renewable energy by Bloomberg NEF for the fifth straight year,\nwith more\
    \ than 600 wind and solar projects globally.\n\nVisit aboutamazon.com/news/company-news/amazon-earnings-q4-2024-report.\n\
    Financial Guidance\nThe following forward-looking statements reflect Amazon.com’s\
    \ expectations as of February 6, 2025, and are subject to\nsubstantial uncertainty.\
    \ Our results are inherently unpredictable and may be materially affected by many\
    \ factors, such as\nfluctuations in foreign exchange rates, changes in global\
    \ economic and geopolitical conditions and customer demand and\nspending (including\
    \ the impact of recessionary fears), inflation, interest rates, regional labor\
    \ market constraints, world events,\nthe rate of growth of the internet, online\
    \ commerce, cloud services, and new and emerging technologies, and the various\
    \ factors\ndetailed below.\nFirst Quarter 2025 Guidance\n•\n\nNet sales are expected\
    \ to be between $151.0 billion and $155.5 billion, or to grow between 5% and 9%\
    \ compared with\nfirst quarter 2024. This guidance anticipates an unusually large,\
    \ unfavorable impact of approximately $2.1 billion, or\n150 basis points, from\
    \ foreign exchange rates. Also, as a reminder, in first quarter 2024 the impact\
    \ from Leap Year\nadded approximately $1.5 billion in net sales.\n\n•\n\nOperating\
    \ income is expected to be between $14.0 billion and $18.0 billion, compared with\
    \ $15.3 billion in first\nquarter 2024.\n\n•\n\nThis guidance assumes, among other\
    \ things, that no additional business acquisitions, restructurings, or legal\n\
    settlements are concluded.\n\n\fConference Call Information\nA conference call\
    \ will be webcast live today at 2:00 p.m. PT/5:00 p.m. ET, and will be available\
    \ for at least three months at\namazon.com/ir. This call will contain forward-looking\
    \ statements and other material information regarding the Company’s\nfinancial\
    \ and operating results.\nForward-Looking Statements\nThese forward-looking statements\
    \ are inherently difficult to predict. Actual results and outcomes could differ\
    \ materially for a\nvariety of reasons, including, in addition to the factors\
    \ discussed above, the amount that Amazon.com invests in new business\nopportunities\
    \ and the timing of those investments, the mix of products and services sold to\
    \ customers, the mix of net sales\nderived from products as compared with services,\
    \ the extent to which we owe income or other taxes, competition, management\n\
    of growth, potential fluctuations in operating results, international growth and\
    \ expansion, the outcomes of claims, litigation,\ngovernment investigations, and\
    \ other proceedings, fulfillment, sortation, delivery, and data center optimization,\
    \ risks of\ninventory management, variability in demand, the degree to which the\
    \ Company enters into, maintains, and develops\ncommercial agreements, proposed\
    \ and completed acquisitions and strategic transactions, payments risks, and risks\
    \ of\nfulfillment throughput and productivity. Other risks and uncertainties include,\
    \ among others, risks related to new products,\nservices, and technologies, security\
    \ incidents, system interruptions, government regulation and taxation, and fraud.\
    \ In addition,\nglobal economic and geopolitical conditions and additional or\
    \ unforeseen circumstances, developments, or events may give\nrise to or amplify\
    \ many of these risks. More information about factors that potentially could affect\
    \ Amazon.com’s financial\nresults is included in Amazon.com’s filings with the\
    \ Securities and Exchange Commission (“SEC”), including its most recent\nAnnual\
    \ Report on Form 10-K and subsequent filings.\nAdditional Information\nOur investor\
    \ relations website is amazon.com/ir and we encourage investors to use it as a\
    \ way of easily finding information\nabout us. We promptly make available on this\
    \ website, free of charge, the reports that we file or furnish with the SEC, corporate\n\
    governance information (including our Code of Business Conduct and Ethics), and\
    \ select press releases, which may contain\nmaterial information about us, and\
    \ you may subscribe to be notified of new information posted to this site.\nAbout\
    \ Amazon\nAmazon is guided by four principles: customer obsession rather than\
    \ competitor focus, passion for invention, commitment to\noperational excellence,\
    \ and long-term thinking. Amazon strives to be Earth’s Most Customer-Centric Company,\
    \ Earth’s Best\nEmployer, and Earth’s Safest Place to Work. Customer reviews,\
    \ 1-Click shopping, personalized recommendations, Prime,\nFulfillment by Amazon,\
    \ AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire tablets, Fire TV,\
    \ Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios, and The Climate\
    \ Pledge are some of the things pioneered by Amazon. For more\ninformation, visit\
    \ amazon.com/about and follow @AmazonNews."
- id: q1_2025
  label: Amazon Q1 2025 Earnings Release, May 1, 2025
  text: "AMAZON.COM ANNOUNCES FIRST QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) May 1,\
    \ 2025—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results for\n\
    its first quarter ended March 31, 2025.\n•\n\n•\n\nNet sales increased 9% to $155.7\
    \ billion in the first quarter, compared with $143.3 billion in first quarter\
    \ 2024.\nExcluding the $1.4 billion unfavorable impact from year-over-year changes\
    \ in foreign exchange rates throughout the\nquarter, net sales increased 10% compared\
    \ with first quarter 2024.\n•\n\nNorth America segment sales increased 8% year-over-year\
    \ to $92.9 billion.\n\n•\n\nInternational segment sales increased 5% year-over-year\
    \ to $33.5 billion, or increased 8% excluding changes\nin foreign exchange rates.\n\
    \n•\n\nAWS segment sales increased 17% year-over-year to $29.3 billion.\n\nOperating\
    \ income increased to $18.4 billion in the first quarter, compared with $15.3\
    \ billion in first quarter 2024.\n•\n\nNorth America segment operating income\
    \ was $5.8 billion, compared with $5.0 billion in first quarter 2024.\n\n•\n\n\
    International segment operating income was $1.0 billion, compared with $0.9 billion\
    \ in first quarter 2024.\n\n•\n\nAWS segment operating income was $11.5 billion,\
    \ compared with $9.4 billion in first quarter 2024.\n\n•\n\nNet income increased\
    \ to $17.1 billion in the first quarter, or $1.59 per diluted share, compared\
    \ with $10.4 billion, or\n$0.98 per diluted share, in first quarter 2024.\n\n\
    •\n\nOperating cash flow increased 15% to $113.9 billion for the trailing twelve\
    \ months, compared with $99.1 billion for\nthe trailing twelve months ended March\
    \ 31, 2024.\n\n•\n\nFree cash flow decreased to $25.9 billion for the trailing\
    \ twelve months, compared with $50.1 billion for the trailing\ntwelve months ended\
    \ March 31, 2024.\n\n“We’re pleased with the start to 2025, especially our pace\
    \ of innovation and progress in continuing to improve customer\nexperiences,”\
    \ said Andy Jassy, President and CEO, Amazon. “From Alexa+ (our next generation\
    \ of Alexa that’s meaningfully\nsmarter, more capable, and takes actions for customers),\
    \ to another delivery speed record for our Prime members, to our new\nTrainium2\
    \ chips and Bedrock model expansion that make it easier for AWS customers to train\
    \ models and run inference more\nflexibly and cost-effectively, to our first Project\
    \ Kuiper satellites successfully launching into low earth orbit in our quest to\n\
    provide broadband access to hundreds of millions of households in rural areas\
    \ without it today—we’re continuing to find\nmeaningful ways to make customers’\
    \ lives easier and better every day.”\nSome other highlights since the company’s\
    \ last earnings announcement include that Amazon:\n•\n\nIntroduced Alexa+, our\
    \ next-generation Alexa personal assistant who’s meaningfully smarter and more\
    \ capable than\nher prior self, can both answer virtually any question and take\
    \ actions, and is free with Prime.\n\n•\n\nHeld deal events worldwide to help\
    \ customers save over $500 million across Big Spring Sale in the U.S. and Canada,\n\
    Spring Deal Days in Europe, and Ramadan/Eid Sale events in Egypt, Saudi Arabia,\
    \ Türkiye, and UAE.\n\n•\n\nAnnounced Amazon’s 11th Prime Day will be in July,\
    \ when customers can expect millions of deals globally on vast\nselection.\n\n\
    •\n\nAnnounced $4 billion investment through 2026 to expand Amazon’s rural delivery\
    \ network to bring even faster\ndelivery to customers in less densely populated\
    \ areas across the U.S.\n\n\f•\n\nLaunched Amazon.ie in Ireland, offering over\
    \ 200 million products with low prices, fast delivery, and local Prime\nmembership.\n\
    \n•\n\nExpanded selection with Michael Kors, GAME 7, The Ordinary, Laura Mercier,\
    \ and tarte.\n\n•\n\nIntroduced Saks on Amazon, where customers can shop a refined\
    \ luxury assortment of fashion and beauty items from\nbrands like Dolce&Gabbana,\
    \ Balmain, Giambattista Valli, Erdem, and Fear of God.\n\n•\n\nLaunched ‘Interests’\
    \ to find products for customers’ passions and hobbies using generative AI.\n\n\
    •\n\nIntroduced new ways to shop in the Amazon Shopping app to help customers\
    \ discover and buy products from other\nbrands’ websites even when Amazon doesn’t\
    \ carry the items directly. Amazon now shows customers select products\nfrom other\
    \ brands in search results and either links to their websites so customers can\
    \ purchase the items there or\nenables customers to seamlessly purchase the products\
    \ using Amazon’s new ‘Buy for Me’ feature.\n\n•\n\nBegan full-scale deployment\
    \ of Project Kuiper’s satellite internet network with launch and activation of\
    \ first satellites.\n\n•\n\nBegan testing Zoox in Los Angeles, the sixth location\
    \ for Amazon’s self-driving technology.\n\n•\n\nAnnounced a joint venture to create\
    \ the next generation of the esteemed James Bond film franchise, including naming\n\
    producers Amy Pascal and David Heyman to produce the next film.\n\n•\n\nDrew 54.6\
    \ million viewers for Reacher’s Season 3 debut in first 19 days, Amazon’s biggest\
    \ returning season ever.\n\n•\n\nPremiered Season 2 of LeBron James’s Mind the\
    \ Game podcast, co-hosted by NBA Hall-of-Famer Steve Nash and\ndistributed by\
    \ Wondery.\n\n•\n\nContinued to grow Amazon Nova rapidly with customers such as\
    \ Slack, Siemens, Coinbase, Sumo Logic, FanDuel,\nBlue Origin, Glean, Domo, Stats\
    \ Perform, Bynder, PDI Technologies, Gradial, ASAPP, ezCater, NinjaTech AI,\n\
    Jobcase, Rubbrband, Data Kinetic, Avahi, GuardianGamer, and Lennar, all starting\
    \ to use Nova. Also introduced new\nNova capabilities, including:\n•\n\nAmazon\
    \ Nova Sonic: Speech-to-speech foundation model for developers to build human-like\
    \ voice-based AI\napplications, such as customer service call automation, AI agents,\
    \ and more (available in Amazon Bedrock).\n\n•\n\nAmazon Nova Act SDK: New AI\
    \ model trained to perform actions within a web browser, enabling\ndevelopers\
    \ to build action-oriented agents by breaking down complex workflows into reliable\
    \ atomic\ncommands (like “search,” or “checkout”).\n\n•\n\nAmazon Nova Premier:\
    \ Most capable of Amazon’s multimodal models for complex tasks like coding,\n\
    building multi-step agents, and long-form document and video understanding.\n\n\
    •\n\nGeneral availability of Amazon Nova models in Europe and Asia Pacific.\n\n\
    •\n\nSigned new AWS agreements with Adobe, Uber, Nasdaq, Ericsson, Fujitsu, Cisco,\
    \ Cargill, Mitsubishi Electric\nCorporation, General Dynamics Information Technology,\
    \ GE Vernova, Booz Allen Hamilton, NextEra Energy,\nPublicis Sapient, Elastic,\
    \ KPN, and Netsmart.\n\n•\n\nAnnounced new AWS offerings, including:\n•\n\nAWS\
    \ Outposts racks (for high throughput, network-intensive workloads) and servers\
    \ (for Cloud Radio\nAccess Network workloads) to help telecom customers build\
    \ future-proof cloud infrastructure that supports\n5G and beyond.\n\n•\n\nNew\
    \ foundation models in Amazon Bedrock, including Anthropic’s Claude 3.7 Sonnet,\
    \ DeepSeek’s R1,\nMeta’s Llama 4 family of models, and Mistral AI’s Pixtral Large.\n\
    \n•\n\nGeneral availability of Amazon SageMaker Unified Studio for data engineers\
    \ to easily find and access data to\ncollaborate and build faster.\n\n•\n\nGeneral\
    \ availability of the scenarios capability of Amazon Q in QuickSight, with an\
    \ advanced AI agent to\nhelp customers leverage natural language to perform expert-level\
    \ data analysis.\n\n•\n\nAnnounced Ocelot, Amazon’s first quantum computing chip\
    \ prototype that reduces resources needed for quantum\nerror correction by up\
    \ to 90%.\n\n•\n\nRanked No. 2 on LinkedIn’s U.S. Top Companies list of the best\
    \ workplaces for career growth.\n\n•\n\nContinued making significant progress\
    \ on safety—improving Amazon’s recordable incident rate by 34% and lost-time\n\
    incident rate by 65% across operations over past five years.\n\nVisit aboutamazon.com/news/company-news/amazon-earnings-q1-2025-report.\n\
    \n\fFinancial Guidance\nThe following forward-looking statements reflect Amazon.com’s\
    \ expectations as of May 1, 2025, and are subject to substantial\nuncertainty.\
    \ Our results are inherently unpredictable and may be materially affected by many\
    \ factors, such as fluctuations in\nforeign exchange rates, changes in global\
    \ economic and geopolitical conditions, tariff and trade policies, and customer\
    \ demand\nand spending (including the impact of recessionary fears), inflation,\
    \ interest rates, regional labor market constraints, world\nevents, the rate of\
    \ growth of the internet, online commerce, cloud services, and new and emerging\
    \ technologies, and the various\nfactors detailed below.\nSecond Quarter 2025\
    \ Guidance\n•\n\nNet sales are expected to be between $159.0 billion and $164.0\
    \ billion, or to grow between 7% and 11% compared\nwith second quarter 2024. This\
    \ guidance anticipates an unfavorable impact of approximately 10 basis points\
    \ from\nforeign exchange rates.\n\n•\n\nOperating income is expected to be between\
    \ $13.0 billion and $17.5 billion, compared with $14.7 billion in second\nquarter\
    \ 2024.\n\n•\n\nThis guidance assumes, among other things, that no additional\
    \ business acquisitions, restructurings, or legal\nsettlements are concluded.\n\
    \nConference Call Information\nA conference call will be webcast live today at\
    \ 2:00 p.m. PT/5:00 p.m. ET, and will be available for at least three months at\n\
    amazon.com/ir. This call will contain forward-looking statements and other material\
    \ information regarding the Company’s\nfinancial and operating results.\nForward-Looking\
    \ Statements\nThese forward-looking statements are inherently difficult to predict.\
    \ Actual results and outcomes could differ materially for a\nvariety of reasons,\
    \ including, in addition to the factors discussed above, the amount that Amazon.com\
    \ invests in new business\nopportunities and the timing of those investments,\
    \ the mix of products and services sold to customers, the mix of net sales\nderived\
    \ from products as compared with services, the extent to which we owe income or\
    \ other taxes, competition, management\nof growth, potential fluctuations in operating\
    \ results, international growth and expansion, the outcomes of claims, litigation,\n\
    government investigations, and other proceedings, fulfillment, sortation, delivery,\
    \ and data center optimization, risks of\ninventory management, variability in\
    \ demand, the degree to which the Company enters into, maintains, and develops\n\
    commercial agreements, proposed and completed acquisitions and strategic transactions,\
    \ payments risks, and risks of\nfulfillment throughput and productivity. Other\
    \ risks and uncertainties include, among others, risks related to new products,\n\
    services, and technologies, security incidents, system interruptions, government\
    \ regulation and taxation, and fraud. In addition,\nglobal economic and geopolitical\
    \ conditions and additional or unforeseen circumstances, developments, or events\
    \ may give\nrise to or amplify many of these risks. More information about factors\
    \ that potentially could affect Amazon.com’s financial\nresults is included in\
    \ Amazon.com’s filings with the Securities and Exchange Commission (“SEC”), including\
    \ its most recent\nAnnual Report on Form 10-K and subsequent filings.\nAdditional\
    \ Information\nOur investor relations website is amazon.com/ir and we encourage\
    \ investors to use it as a way of easily finding information\nabout us. We promptly\
    \ make available on this website, free of charge, the reports that we file or\
    \ furnish with the SEC, corporate\ngovernance information (including our Code\
    \ of Business Conduct and Ethics), and select press releases, which may contain\n\
