  label: Amazon Q4 2022 Earnings Release, February 2, 2023
  text: "AMAZON.COM ANNOUNCES FOURTH QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) February\
    \ 2, 2023—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its fourth quarter ended December 31, 2022.\nFourth Quarter 2022\n•\n\n•\n\
    \n•\n\nNet sales increased 9% to $149.2 billion in the fourth quarter, compared\
    \ with $137.4 billion in fourth quarter 2021.\nExcluding the $5.0 billion unfavorable\
    \ impact from year-over-year changes in foreign exchange rates throughout the\n\
    quarter, net sales increased 12% compared with fourth quarter 2021.\n•\n\nNorth\
    \ America segment sales increased 13% year-over-year to $93.4 billion, or increased\
    \ 14% excluding\nchanges in foreign exchange rates.\n\n•\n\nInternational segment\
    \ sales decreased 8% year-over-year to $34.5 billion, or increased 5% excluding\
    \ changes\nin foreign exchange rates.\n\n•\n\nAWS segment sales increased 20%\
    \ year-over-year to $21.4 billion.\n\nOperating income decreased to $2.7 billion\
    \ in the fourth quarter, compared with $3.5 billion in fourth quarter 2021.\n\
    Fourth quarter 2022 operating income includes approximately $2.7 billion of charges\
    \ for changes in estimates related\nto self-insurance liabilities, impairments\
    \ of property and equipment and operating leases, and estimated severance\ncosts.\
    \ These charges primarily impacted the North America segment.\n•\n\nNorth America\
    \ segment operating loss was $0.2 billion, compared with operating loss of $0.2\
    \ billion in fourth\nquarter 2021.\n\n•\n\nInternational segment operating loss\
    \ was $2.2 billion, compared with operating loss of $1.6 billion in fourth\nquarter\
    \ 2021.\n\n•\n\nAWS segment operating income was $5.2 billion, compared with operating\
    \ income of $5.3 billion in fourth\nquarter 2021.\n\nNet income decreased to $0.3\
    \ billion in the fourth quarter, or $0.03 per diluted share, compared with $14.3\
    \ billion, or\n$1.39 per diluted share, in fourth quarter 2021. All share and\
    \ per share information for comparable prior year periods\nthroughout this release\
    \ have been retroactively adjusted to reflect the 20-for-1 stock split effected\
    \ on May 27, 2022.\n•\n\nFourth quarter 2022 net income includes a pre-tax valuation\
    \ loss of $2.3 billion included in non-operating\nincome (expense) from the common\
    \ stock investment in Rivian Automotive, Inc., compared to a pre-tax\nvaluation\
    \ gain of $11.8 billion from the investment in fourth quarter 2021.\n\nFull Year\
    \ 2022\n•\n\nNet sales increased 9% to $514.0 billion in 2022, compared with $469.8\
    \ billion in 2021. Excluding the $15.5 billion\nunfavorable impact from year-over-year\
    \ changes in foreign exchange rates throughout the year, net sales increased\n\
    13% compared with 2021.\n•\n\nNorth America segment sales increased 13% year-over-year\
    \ to $315.9 billion.\n\n•\n\nInternational segment sales decreased 8% year-over-year\
    \ to $118.0 billion, or increased 4% excluding\nchanges in foreign exchange rates.\n\
    \n•\n\nAWS segment sales increased 29% year-over-year to $80.1 billion.\n\n\f\
    •\n\n•\n\nOperating income decreased to $12.2 billion in 2022, compared with $24.9\
    \ billion in 2021.\n•\n\nNorth America segment operating loss was $2.8 billion,\
    \ compared with operating income of $7.3 billion in\n2021.\n\n•\n\nInternational\
    \ segment operating loss was $7.7 billion, compared with operating loss of $0.9\
    \ billion in 2021.\n\n•\n\nAWS segment operating income was $22.8 billion, compared\
    \ with operating income of $18.5 billion in 2021.\n\nNet loss was $2.7 billion\
    \ in 2022, or $0.27 per diluted share, compared with net income of $33.4 billion,\
    \ or $3.24 per\ndiluted share, in 2021.\n•\n\n2022 net loss includes a pre-tax\
    \ valuation loss of $12.7 billion included in non-operating income (expense)\n\
    from the common stock investment in Rivian Automotive, Inc., compared to a pre-tax\
    \ valuation gain of $11.8\nbillion from the investment in 2021.\n\n•\n\nOperating\
    \ cash flow increased 1% to $46.8 billion for the trailing twelve months, compared\
    \ with $46.3 billion for the\ntrailing twelve months ended December 31, 2021.\n\
    \n•\n\nFree cash flow decreased to an outflow of $11.6 billion for the trailing\
    \ twelve months, compared with an outflow of\n$9.1 billion for the trailing twelve\
    \ months ended December 31, 2021.\n\n•\n\nFree cash flow less principal repayments\
    \ of finance leases and financing obligations increased to an outflow of\n$19.8\
    \ billion for the trailing twelve months, compared with an outflow of $20.4 billion\
    \ for the trailing twelve months\nended December 31, 2021.\n\n•\n\nFree cash flow\
    \ less equipment finance leases and principal repayments of all other finance\
    \ leases and financing\nobligations increased to an outflow of $12.8 billion for\
    \ the trailing twelve months, compared with an outflow of $14.3\nbillion for the\
    \ trailing twelve months ended December 31, 2021.\n\n“Our relentless focus on\
    \ providing the broadest selection, exceptional value, and fast delivery drove\
    \ customer demand in our\nStores business during the fourth quarter that exceeded\
    \ our expectations—and we’re appreciative of all our customers who\nturned to\
    \ Amazon this past holiday season,” said Andy Jassy, Amazon CEO. “We’re also encouraged\
    \ by the continued progress\nwe’re making in reducing our cost to serve in the\
    \ operations part of our Stores business. In the short term, we face an uncertain\n\
    economy, but we remain quite optimistic about the long-term opportunities for\
    \ Amazon. The vast majority of total market\nsegment share in both Global Retail\
    \ and IT still reside in physical stores and on-premises datacenters; and as this\
    \ equation\nsteadily flips, we believe our leading customer experiences in these\
    \ areas along with the results of our continued hard work and\ninvention to improve\
    \ every day, will lead to significant growth in the coming years. When you also\
    \ factor in our investments\nand innovation in several other broad customer experiences\
    \ (e.g. streaming entertainment, customer-first healthcare, broadband\nsatellite\
    \ connectivity for more communities globally), there’s additional reason to feel\
    \ optimistic about what the future holds.”\nHighlights\nObsessing over the customer\
    \ experience\nAmazon obsesses over how to make customers’ lives better and easier\
    \ every day. This is true for consumers, sellers, brands,\ndevelopers, enterprises,\
    \ and creators. For example, in the past quarter, Amazon:\n•\n\nHad a record-breaking\
    \ holiday season with customers purchasing nearly half a billion items from small\
    \ businesses in\nthe U.S. During Amazon’s biggest Thanksgiving-through-Cyber-Monday\
    \ holiday shopping weekend ever, customers\naround the world purchased hundreds\
    \ of millions of products, and small businesses in the U.S. generated more than\
    \ $1\nbillion in sales over the five-day period.\n\n•\n\nMade Same-Day Delivery\
    \ even faster in major metropolitan areas in the U.S., such as Los Angeles, San\
    \ Francisco,\nPhoenix, Sacramento, and Portland, Oregon, where customers can now\
    \ receive hundreds of thousands of items within\nhours. Amazon’s new Same-Day\
    \ Delivery site in Sacramento is set to be the world’s first logistics facility\
    \ certified as\nZero Carbon by the International Living Future Institute. In the\
    \ EU, Same-Day Delivery is now available in Belgium.\n\n•\n\nAttracted more than\
    \ 100 million viewers worldwide to the first season of The Lord of the Rings:\
    \ The Rings of Power,\nmaking it the most watched Amazon Original series in every\
    \ region of the world, with more than 24 billion minutes\nstreamed, and driving\
    \ more Prime sign-ups worldwide during its launch window than any previous Prime\
    \ Video\ncontent. Amazon Studios also announced the all-female slate of directors—Charlotte\
    \ Brändström, Sanaa Hamri, and\nLouise Hooper—for Season Two of The Lord of the\
    \ Rings: The Rings of Power, which is currently in production in the\nUK.\n\n\f\
    •\n\nFinished the Thursday Night Football (TNF) season with the youngest median\
    \ age of any NFL broadcast package\nsince 2013 and viewership up 11% from last\
    \ season among hard-to-reach 18- to 34-year-olds, according to Nielsen\nMedia\
    \ Research. TNF featured the most streamed NFL games ever, with an average audience\
    \ of 11.3 million viewers,\naccording to combined data from Amazon’s first-party\
    \ measurement metrics and Nielsen Media Research. Prime\nVideo also made history\
    \ as the first streamer to place on Variety’s Top 100 Primetime Telecasts of 2022,\
    \ with four of\nits TNF telecasts making the list.\n\n•\n\nPremiered several Original\
    \ series and films, including Western drama The English, with Emily Blunt; family-friendly\n\
    competition show Dr. Seuss Baking Challenge; My Policeman, starring Harry Styles;\
    \ and documentary Good Night\nOppy. Prime Video also released new seasons of existing\
    \ series, including the fourth volume of Rihanna’s annual\nfashion experience\
    \ Savage X Fenty and the third season of Tom Clancy’s Jack Ryan, starring John\
    \ Krasinski.\nWednesday, an MGM-produced series on Netflix, debuted at No. 1 on\
    \ Nielsen’s weekly streaming charts and earned\nGolden Globe nominations for Best\
    \ Musical or Comedy Series and Best Actress in a Musical or Comedy Series (Jenna\n\
    Ortega).\n\n•\n\nBrought HBO back to Prime Video Channels in the U.S., after reaching\
    \ an agreement with Warner Bros. Discovery.\nFor $15.99 per month, customers who\
    \ subscribe to HBO Max have access to approximately 15,000 hours of curated\n\
    premium content.\n\n•\n\nAnnounced new commitments and migrations from AWS customers.\n\
    •\n\nNasdaq completed the migration of its MRX core trading system to the cloud,\
    \ delivering a 10% performance\nimprovement for market participants and marking\
    \ a major milestone in Nasdaq’s journey to deliver the first\ncloud-based U.S.\
    \ options exchange.\n\n•\n\nNFL and AWS announced the NFL Contact Detection Challenge,\
    \ which invites experts to use machine\nlearning (ML) and computer vision to predict\
    \ and prevent injuries.\n\n•\n\nYahoo Ad Tech selected AWS as its preferred cloud\
    \ provider to develop tailored and immersive solutions for\nbrands to better connect\
    \ with their audiences.\n\n•\n\nStability AI selected AWS as its preferred cloud\
    \ provider to build and train artificial intelligence (AI) models\nfor the best\
    \ performance at the lowest cost.\n\n•\n\nDescartes Labs is going all-in on AWS\
    \ to give customers timely, actionable insights to tackle challenges like\nenhancing\
    \ food security and mitigating climate change.\n\n•\n\nBrookfield Asset Management\
    \ selected AWS as a preferred cloud provider to advance renewable energy use\n\
    globally.\n\n•\n\nDuke Energy is working with AWS on smart grid solutions to improve\
    \ reliability and resiliency in\npreparation for rapid electric vehicle adoption.\n\
    \n•\n\nWallbox migrated to AWS, enabling customers to return excess energy to\
    \ the grid and reducing the\ncompany’s IT costs by 70%.\n\n•\n\nAmerican Family\
    \ Insurance named AWS as its preferred cloud provider to unlock personalized service\
    \ and\nsecurity for its 13.1 million policyholders.\n\n•\n\nLaunched AWS Regions\
    \ in Spain and Switzerland as well as a second Region in India to continue expanding\
    \ AWS’s\ninfrastructure footprint, delivering the most secure, extensive, and\
    \ reliable cloud technology to millions of customers\naround the world. As of\
    \ the end of 2022, AWS has 96 Availability Zones within 30 geographic Regions\
    \ globally, with\nannounced plans to launch 15 more Availability Zones and five\
    \ more AWS Regions.\n\n•\n\nExpanded the AWS Partner Network to help customers\
    \ accelerate innovation in their organizations and speed their\njourney to the\
    \ cloud. Professional services company Accenture launched a platform that helps\
    \ customers drive\nbusiness outcomes up to 50% faster on AWS. Atos, a provider\
    \ of managed infrastructure services, will collaborate\nwith AWS to enable customers\
    \ with large-scale infrastructure outsourcing contracts to accelerate digital\
    \ transformation\nand workload migrations to the cloud. Global business and technology\
    \ consulting company Slalom will develop\nvertical solutions and accelerators\
    \ on AWS for joint customers.\n\nInventing on behalf of customers\nAmazon is driven\
    \ by a passion for invention across all of its business areas. The company builds\
    \ new products and services that\ncustomers ask for, and also invents new ones\
    \ that customers didn’t know they wanted but make their lives or businesses better\n\
    in some meaningful way. For example, this past quarter, Amazon:\n\n\f•\n\nExpanded\
    \ Buy with Prime to all eligible U.S. merchants, letting more merchants offer\
    \ Prime customers fast, free\ndelivery, a seamless checkout experience, and easy\
    \ returns on their websites. Data shows that shopper conversion\nincreases an\
    \ average of 25% when merchants use Buy with Prime. Amazon also introduced a capability\
    \ for Buy with\nPrime merchants to display customer reviews from Amazon.com within\
    \ their own online stores and announced an\nintegration with BigCommerce, an ecommerce\
    \ platform, that will help merchants easily enable Buy with Prime on\ntheir storefronts\
    \ with no coding required.\n\n•\n\nIntroduced Sparrow into the company’s first\
    \ fulfillment center. Sparrow is a robotic system that can detect, select, and\n\
    handle individual products in Amazon’s inventory—a major technological advancement\
    \ that allows employees to shift\ntheir time and energy to other tasks. Sparrow\
    \ also improves health and safety by reducing the repetitive tasks done by\nemployees.\n\
    \n•\n\nDelivered the 10 millionth package using electric delivery vehicles from\
    \ Rivian, custom-designed from the ground up\nwith input from delivery services\
    \ providers and their drivers. With thousands of miles driven, drivers have said\
    \ the\nvehicle design and features make their jobs easier and more comfortable,\
    \ the driving experience is improved, and they\nfeel safe while driving. Amazon\
    \ plans to have 100,000 electric delivery vehicles from Rivian on the road by\
    \ 2030,\nsaving millions of metric tons of carbon per year.\n\n•\n\nLaunched Amazon\
    \ Clinic, a message-based virtual health service that delivers convenient, personalized,\
    \ affordable\ncare for more than 20 common conditions. Amazon Clinic lets customers\
    \ choose from a network of leading telehealth\nproviders based on their preferences.\
    \ Amazon also recently launched RxPass, a new Prime membership benefit from\n\
    Amazon Pharmacy that offers access to unlimited eligible prescription medications\
    \ for only $5 per month including\nfree shipping. Amazon’s mission in healthcare\
    \ is to make it dramatically easier for anyone to find, choose, and afford\nwhat\
    \ they need to get and stay healthy.\n\n•\n\nAnnounced AWS Graviton3E chips, which\
    \ deliver the best price performance for high performance computing\nworkloads\
    \ on AWS; new AWS Nitro Cards, which deliver the highest network bandwidth, the\
    \ highest packet rate\nperformance, and the best price performance for network-intensive\
    \ workloads; and Inf2 instances, powered by AWS\nInferentia2 chips, which deliver\
    \ the lowest latency at the lowest cost for ML inference on Amazon EC2.\n\n•\n\
    \nAnnounced Amazon Security Lake, a service that automatically centralizes an\
    \ organization’s security data from cloud\nand on-premises sources into a purpose-built\
    \ data lake in a customer’s AWS account so customers can act on security\ndata\
    \ faster.\n\n•\n\nAnnounced Amazon DataZone, a new data management service that\
    \ unlocks customer data across organizational\nboundaries, including the cloud,\
    \ on-premises infrastructure, and third-party SaaS applications. With AWS DataZone,\n\
    customers can catalog, discover, and share data with governance and access controls.\n\
    \n•\n\nAnnounced AWS Supply Chain, an application that helps businesses increase\
    \ supply chain visibility to make faster,\nmore-informed decisions that mitigate\
    \ risks, lower costs, and improve customer experiences.\n\n•\n\nAnnounced AWS\
    \ SimSpace Weaver, a fully managed simulation service that helps customers build,\
    \ operate, and run\nlarge-scale spatial simulations. With AWS SimSpace Weaver,\
    \ customers can deploy spatial simulations to model\ndynamic systems with many\
    \ data points, like traffic patterns across an entire city, crowd flows in a venue,\
    \ or factory\nfloor layouts, and use the simulations to visualize physical spaces,\
    \ perform immersive training, and garner insights on\ndifferent scenarios to make\
    \ informed decisions.\n\n•\n\nAnnounced AWS Clean Rooms, which helps companies\
    \ across industries easily and securely analyze and collaborate\non combined datasets\
    \ without sharing or revealing underlying data. AWS Clean Rooms provide a broad\
    \ set of built-in\ndata access controls to protect sensitive data, while allowing\
    \ customers to create secure data clean rooms to generate\nunique insights about\
    \ advertising campaigns, investment decisions, clinical research, and more.\n\n\
    •\n\nLaunched Inspire, a feed in the U.S. Amazon shopping app with content from\
    \ customers, influencers, and brands to\nhelp customers discover products personalized\
    \ for their selected interests.\n\n•\n\nPartnered with Snapchat to launch an augmented\
    \ reality shopping experience that allows millions of Snapchatters to\ndigitally\
    \ try-on thousands of Amazon eyewear styles via Snapchat and seamlessly purchase\
    \ those items in the Amazon\nstore. This experience is enabled by Amazon’s 3D\
    \ Asset technology, which easily integrates with third-party apps like\nSnapchat,\
    \ to provide 3D assets for augmented reality-based shopping and dynamically supply\
    \ up-to-date product\ndetails, pricing, and availability.\n\nEmpowering employees\
    \ and delivery service partners\nIn addition to its focus on customers, Amazon\
    \ strives to make every day better for its employees and delivery service providers.\n\
    For example, in the fourth quarter, the company:\n\n\f•\n\nSurpassed 100,000 participants\
    \ in Career Choice, an education benefit that empowers employees to learn new\
    \ skills for\ncareer success through a range of options, including prepaid college\
    \ tuition, foundational skills training, and industry\ncertifications. In 2022\
    \ in the U.S., the company celebrated 3,000 graduates of its new English language\
    \ proficiency\nprogram.\n\n•\n\nContinued to make its workplace more accessible\
    \ and inclusive for employees who are deaf and hard of hearing. For\nexample,\
    \ Amazon rolled out new video stations over the past year at more than 200 sites\
    \ across eight countries in\nNorth America and Europe to help employees learn\
    \ the basics of sign language for their region and improve\ncommunication with\
    \ colleagues who are deaf and hard of hearing.\n\n•\n\nExpanded the Amazon Mentoring\
    \ Program to support new people managers with opportunities to receive mentoring\n\
    from experienced Amazon people managers and develop the foundational skills to\
    \ be an effective people leader. Since\nits launch, the program grew from 18,800\
    \ employees in 2016 to over 159,000 employees in 2022.\n\n•\n\nLaunched a new\
    \ Alexa feature where customers can say “Alexa, thank my driver” to an Alexa-enabled\
    \ device, the\nAlexa app, or the Amazon mobile shopping app, and the driver who\
    \ delivered their most recent package would be\nnotified. Nearly 8 million “thank\
    \ yous” have been received.\n\nSupporting communities and protecting the environment\n\
    Amazon believes that success and scale bring broad responsibility to help the\
    \ planet, future generations, and local communities\nin which the company has\
    \ a significant presence. Amazon employees have passion for investing in these\
    \ areas, and a sampling\nof the efforts from this past quarter are that Amazon:\n\
    •\n\nAdvanced its goal to decarbonize its transportation network globally. For\
    \ example, Amazon partnered with TVS Motor\nCompany to deploy a fleet of electric\
    \ two-wheelers and three-wheelers for last mile deliveries in India. The agreement\n\
    is part of Amazon’s plan to bring 10,000 electric delivery vehicles to India by\
    \ 2025.\n\n•\n\nReleased a report detailing Amazon’s progress and methods to reduce\
    \ packaging, including through the use of\ninnovative technologies, processes,\
    \ and materials. Since 2015, these efforts have helped reduce the weight of\n\
    packaging per shipment by 38% and eliminated the use of more than 1.5 million\
    \ tons of packaging materials. Amazon\ncontinues to take steps to reduce single-use\
    \ plastics in outbound packaging, recently announcing that it reduced\naverage\
    \ plastic packaging weight per shipment by over 7% in 2021 across its global operations\
    \ network.\n\n•\n\nUnveiled its largest on-site solar energy installation in Europe\
    \ at a fulfillment center in Seville, Spain that is fitted with\nmore than 13,300\
    \ solar panels and is expected to produce more than 6 million kilowatt hours per\
    \ year—enough energy\nto power the equivalent of more than 1,500 Spanish homes\
    \ annually.\n\n•\n\nSet a goal for AWS to be water positive by 2030, returning\
    \ more water to communities than it uses in its direct\noperations, and announced\
    \ that it achieved an industry-leading 2021 global water use efficiency metric\
    \ of 0.25 liters of\nwater per kilowatt-hour.\n\n•\n\nSigned a memorandum of understanding\
    \ confirming AWS’s continued cooperation in 2023 with the Ukraine\ngovernment.\
    \ Since the start of the war, AWS has played a crucial role in helping the Ukraine\
    \ government maintain\ncontinuity and provide critical services to its citizens.\
    \ To date, Amazon has committed more than $75 million in\nsupport to help the\
    \ people of Ukraine address immediate and long-term needs.\n\n•\n\nReleased its\
    \ latest Community Impact Report, which detailed program milestones, including\
    \ 85 million pounds of food\ndonated through a partnership with Feeding America;\
    \ 20 million relief items donated to date; $1.6 billion invested to\ncreate or\
    \ preserve more than 11,000 affordable homes through Amazon’s Housing Equity Fund;\
    \ computer science\neducation provided to 600,000 students across 5,000 schools\
    \ through Amazon Future Engineer; and $96 million\ndonated to more than 190 nonprofits\
    \ in the Puget Sound, Washington region in 2021, making it the Seattle area’s\
    \ top\ncorporate philanthropist that year.\n\nFinancial Guidance\nThe following\
    \ forward-looking statements reflect Amazon.com’s expectations as of February\
    \ 2, 2023, and are subject to\nsubstantial uncertainty. Our results are inherently\
    \ unpredictable and may be materially affected by many factors, such as\nuncertainty\
    \ regarding the impacts of the COVID-19 pandemic, fluctuations in foreign exchange\
    \ rates, changes in global\neconomic and geopolitical conditions and customer\
    \ demand and spending (including the impact of recessionary fears),\ninflation,\
    \ interest rates, regional labor market and global supply chain constraints, world\
    \ events, the rate of growth of the\nInternet, online commerce, and cloud services,\
    \ and the various factors detailed below.\n\n\fFirst Quarter 2023 Guidance\n•\n\
    •\n•\n\nNet sales are expected to be between $121.0 billion and $126.0 billion,\
    \ or to grow between 4% and 8% compared with\nfirst quarter 2022. This guidance\
    \ anticipates an unfavorable impact of approximately 210 basis points from foreign\n\
    exchange rates.\nOperating income is expected to be between $0 and $4.0 billion,\
    \ compared with $3.7 billion in first quarter 2022.\nThis guidance assumes, among\
    \ other things, that no additional business acquisitions, restructurings, or legal\n\
    settlements are concluded.\n\nA conference call will be webcast live today at\
    \ 2:30 p.m. PT/5:30 p.m. ET, and will be available for at least three months at\n\
    amazon.com/ir. This call will contain forward-looking statements and other material\
    \ information regarding the Company’s\nfinancial and operating results.\nThese\
    \ forward-looking statements are inherently difficult to predict. Actual results\
    \ and outcomes could differ materially for a\nvariety of reasons, including, in\
    \ addition to the factors discussed above, the amount that Amazon.com invests\
    \ in new business\nopportunities and the timing of those investments, the mix\
    \ of products and services sold to customers, the mix of net sales\nderived from\
    \ products as compared with services, the extent to which we owe income or other\
    \ taxes, competition, management\nof growth, potential fluctuations in operating\
    \ results, international growth and expansion, the outcomes of claims, litigation,\n\
    government investigations, and other proceedings, fulfillment, sortation, delivery,\
    \ and data center optimization, risks of\ninventory management, variability in\
    \ demand, the degree to which the Company enters into, maintains, and develops\n\
    commercial agreements, proposed and completed acquisitions and strategic transactions,\
    \ payments risks, and risks of\nfulfillment throughput and productivity. Other\
    \ risks and uncertainties include, among others, risks related to new products,\n\
    services, and technologies, system interruptions, government regulation and taxation,\
    \ and fraud. In addition, global economic\nand geopolitical conditions and additional\
    \ or unforeseen circumstances, developments, or events may give rise to or amplify\n\
    many of these risks. More information about factors that potentially could affect\
    \ Amazon.com’s financial results is included in\nAmazon.com’s filings with the\
    \ Securities and Exchange Commission (“SEC”), including its most recent Annual\
    \ Report on\nForm 10-K and subsequent filings.\nOur investor relations website\
    \ is amazon.com/ir and we encourage investors to use it as a way of easily finding\
    \ information\nabout us. We promptly make available on this website, free of charge,\
    \ the reports that we file or furnish with the SEC, corporate\ngovernance information\
    \ (including our Code of Business Conduct and Ethics), and select press releases,\
    \ which may contain\nmaterial information about us, and you may subscribe to be\
    \ notified of new information posted to this site.\nAbout Amazon\nAmazon is guided\
    \ by four principles: customer obsession rather than competitor focus, passion\
    \ for invention, commitment to\noperational excellence, and long-term thinking.\
    \ Amazon strives to be Earth’s Most Customer-Centric Company, Earth’s Best\nEmployer,\
    \ and Earth’s Safest Place to Work. Customer reviews, 1-Click shopping, personalized\
    \ recommendations, Prime,\nFulfillment by Amazon, AWS, Kindle Direct Publishing,\
    \ Kindle, Career Choice, Fire tablets, Fire TV, Amazon Echo, Alexa,\nJust Walk\
    \ Out technology, Amazon Studios, and The Climate Pledge are some of the things\
    \ pioneered by Amazon. For more\ninformation, visit amazon.com/about and follow\
    \ @AmazonNews."
- id: q1_2023
  label: Amazon Q1 2023 Earnings Release, April 27, 2023
  text: "AMAZON.COM ANNOUNCES FIRST QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) April\
    \ 27, 2023—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its first quarter ended March 31, 2023.\n•\n\n•\n\n•\n\nNet sales increased\
    \ 9% to $127.4 billion in the first quarter, compared with $116.4 billion in first\
    \ quarter 2022.\nExcluding the $2.4 billion unfavorable impact from year-over-year\
    \ changes in foreign exchange rates throughout the\nquarter, net sales increased\
    \ 11% compared with first quarter 2022.\n•\n\nNorth America segment sales increased\
    \ 11% year-over-year to $76.9 billion.\n\n•\n\nInternational segment sales increased\
    \ 1% year-over-year to $29.1 billion, or increased 9% excluding changes\nin foreign\
    \ exchange rates.\n\n•\n\nAWS segment sales increased 16% year-over-year to $21.4\
    \ billion.\n\nOperating income increased to $4.8 billion in the first quarter,\
    \ compared with $3.7 billion in first quarter 2022. First\nquarter 2023 operating\
    \ income includes approximately $0.5 billion of charges related to estimated severance\
    \ costs.\n•\n\nNorth America segment operating income was $0.9 billion, compared\
    \ with operating loss of $1.6 billion in\nfirst quarter 2022.\n\n•\n\nInternational\
    \ segment operating loss was $1.2 billion, compared with operating loss of $1.3\
    \ billion in first\nquarter 2022.\n\n•\n\nAWS segment operating income was $5.1\
    \ billion, compared with operating income of $6.5 billion in first\nquarter 2022.\n\
    \nNet income was $3.2 billion in the first quarter, or $0.31 per diluted share,\
    \ compared with net loss of $3.8 billion, or\n$0.38 per diluted share, in first\
    \ quarter 2022. All share and per share information for comparable prior year\
    \ periods\nthroughout this release have been retroactively adjusted to reflect\
    \ the 20-for-1 stock split effected on May 27, 2022.\n•\n\nFirst quarter 2023\
    \ net income includes a pre-tax valuation loss of $0.5 billion included in non-operating\n\
    expense from the common stock investment in Rivian Automotive, Inc., compared\
    \ to a pre-tax valuation loss\nof $7.6 billion from the investment in first quarter\
    \ 2022.\n\n•\n\nOperating cash flow increased 38% to $54.3 billion for the trailing\
    \ twelve months, compared with $39.3 billion for\nthe trailing twelve months ended\
    \ March 31, 2022.\n\n•\n\nFree cash flow improved to an outflow of $3.3 billion\
    \ for the trailing twelve months, compared with an outflow of\n$18.6 billion for\
    \ the trailing twelve months ended March 31, 2022.\n\n•\n\nFree cash flow less\
    \ principal repayments of finance leases and financing obligations improved to\
    \ an outflow of\n$10.1 billion for the trailing twelve months, compared with an\
    \ outflow of $29.3 billion for the trailing twelve months\nended March 31, 2022.\n\
    \n•\n\nFree cash flow less equipment finance leases and principal repayments of\
    \ all other finance leases and financing\nobligations improved to an outflow of\
    \ $4.5 billion for the trailing twelve months, compared with an outflow of $22.3\n\
    billion for the trailing twelve months ended March 31, 2022.\n\n\f“There’s a lot\
    \ to like about how our teams are delivering for customers, particularly amidst\
    \ an uncertain economy,” said Andy\nJassy, Amazon CEO. “Our Stores business is\
    \ continuing to improve the cost to serve in our fulfillment network while\nincreasing\
    \ the speed with which we get products into the hands of customers (we expect\
    \ to have our fastest Prime delivery\nspeeds ever in 2023). Our Advertising business\
    \ continues to deliver robust growth, largely due to our ongoing machine learning\n\
    investments that help customers see relevant information when they engage with\
    \ us, which in turn delivers unusually strong\nresults for brands. And, while\
    \ our AWS business navigates companies spending more cautiously in this macro\
    \ environment, we\ncontinue to prioritize building long-term customer relationships\
    \ both by helping customers save money and enabling them to\nmore easily leverage\
    \ technologies like Large Language Models and Generative AI with our uniquely\
    \ cost-effective machine\nlearning chips (“Trainium” and “Inferentia”), managed\
    \ Large Language Models (“Bedrock”), and AI code companion\nCodeWhisperer. We\
    \ like the fundamentals we’re seeing in AWS, and believe there’s much growth ahead.”\n\
    Highlights\nObsessing over the customer experience\nAmazon obsesses over how to\
    \ make customers’ lives better and easier every day. This is true for consumers,\
    \ sellers, brands,\ndevelopers, enterprises, and creators. For example, in the\
    \ past quarter, Amazon:\n•\n\nContinued to delight customers with convenient delivery\
    \ options and broad selection. Nearly 26 million customers\nordered items with\
    \ Same-Day Delivery in the quarter, an increase of 50% compared to last year.\n\
    \n•\n\nIncreased selection in its U.S. online store with the addition of new marquee\
    \ beauty, home, and fashion brands,\nincluding Lancôme, Shiseido, World of Martha\
    \ by Martha Stewart, Rent the Runway, KNOW Beauty by Vanessa\nHudgens, as well\
    \ as new The Drop collections from Harlem Fashion Row and Coco & Breezy. The Drop\
    \ offers\ncustomers access to limited-edition, made-on-demand clothing collections\
    \ by fashion influencers.\n\n•\n\nLaunched a new Fulfillment by Amazon (FBA) capacity\
    \ management system to help sellers who use Amazon’s\nstorage, packing, and shipping\
    \ fulfillment service to manage their inventory and capacity more efficiently\
    \ as they scale\ntheir businesses. The management system provides sellers with\
    \ more insight, predictability, visibility, and control to\nbetter plan and manage\
    \ their inventory and supply chains, as well as increase capacity limits when\
    \ needed.\n\n•\n\nReleased the third annual Brand Protection Report highlighting\
    \ the company’s efforts to protect customers, brands, and\nselling partners from\
    \ counterfeit products in 2022. The efforts resulted in more seized products,\
    \ criminal referrals, and\nindustry partnerships than ever before. The report\
    \ demonstrates how Amazon is stopping bad actors and making an\nimpact beyond\
    \ Amazon’s store, including by identifying, seizing, and appropriately disposing\
    \ of more than 6 million\ncounterfeit products, preventing them from reaching\
    \ customers and being resold elsewhere in the global supply chain.\n\n•\n\nLaunched\
    \ Reviews from Amazon, a new capability that enables Buy with Prime merchants\
    \ to display customer ratings\nand reviews from Amazon.com within their own online\
    \ stores at no additional cost. Nearly 20% of Buy with Prime\nmerchants are already\
    \ using this feature, and the early feedback is that it’s helping merchants drive\
    \ higher shopper\nconversion.\n\n•\n\nAcquired One Medical, a primary care organization\
    \ offering both 24/7 virtual care services and in-office visits across\nthe U.S.\
    \ for preventive and everyday health, chronic care management, pediatric care,\
    \ and mental health services. For\na limited time, One Medical is offering annual\
    \ memberships to new customers at the discounted price of $144 for the\nfirst\
    \ year (regularly $199/year), the equivalent of $12 per month.\n\n•\n\nAnnounced\
    \ that Prime Video will exclusively present the first-ever “Black Friday” National\
    \ Football League game on\nNovember 24. The game will be available for all fans\
    \ to stream for free in the U.S. without a Prime membership.\n\n•\n\nSet box-office\
    \ records with MGM’s premiere of Creed III, directed by and starring Michael B.\
    \ Jordan. The movie\ngrossed $100.4 million globally in its opening weekend—the\
    \ best U.S. debut for any sports film in history. It also had\nthe biggest global\
    \ box office gross of any of the Creed titles, at over $250 million to date, and\
    \ is still opening in\nterritories around the world. In addition, filmmaker Sarah\
    \ Polley won the Academy Award for Best Adapted\nScreenplay for MGM’s Women Talking.\n\
    \n•\n\nPremiered Amazon Original limited series Daisy Jones & The Six, based on\
    \ the New York Times best-selling novel,\nwhich debuted at No. 1 on Prime Video\
    \ globally. Within 24 hours of release, the show’s soundtrack was the No. 1\n\
    selling vinyl on Amazon, and the novel the series is based on also reached No.\
    \ 1 on the Amazon Best Sellers List for\nall books. The company debuted additional\
    \ Amazon Original films and series, including action comedy Shotgun\nWedding,\
    \ starring Jennifer Lopez and Josh Duhamel; romantic comedy Somebody I Used to\
    \ Know, directed by Dave\nFranco; comedic thriller The Consultant, starring Christoph\
    \ Waltz; and Swarm, from co-creator and executive\nproducer Donald Glover.\n\n\
    \f•\n\nWon four Ambies, the premier podcasting award, for Amazon Music and Wondery\
    \ podcasts I Hear Fear (Best\nScriptwriting, Fiction), Business Wars (Best Business\
    \ Podcast), The Lead (Best Sports Podcast), and Scamfluencers\n(Best Entertainment\
    \ Podcast).\n\n•\n\nAnnounced new commitments and migrations from AWS customers.\n\
    \n•\n\n•\n\nSouthwest Airlines selected AWS as its preferred cloud provider for\
    \ a large-scale modernization as part of the\nairline’s long-term plan to optimize\
    \ airline operations, streamline infrastructure costs, and provide a more\nseamless\
    \ and enjoyable travel experience to customers.\n\n•\n\nZurich Insurance Group\
    \ is moving its enterprise information technology infrastructure, including 1,000\n\
    applications over the next three years, to AWS to deliver new digital customer\
    \ experiences and drive\nautomation at scale.\n\n•\n\nBBVA is employing AWS’s\
    \ extensive portfolio of cloud services to launch new financial solutions that\
    \ will\nhelp BBVA Corporate and Investment Banking expand its business to accelerate\
    \ innovation, reduce costs,\nscale quickly, and increase flexibility.\n\n•\n\n\
    Broadridge’s LTX electronic trading platform completed a successful migration\
    \ of its corporate bond etrading platform to AWS.\n\n•\n\nS&P Global and AWS announced\
    \ a multiyear strategic collaboration to extend the delivery of advanced,\nsecure,\
    \ cloud-based services to more than 100,000 of S&P Global’s government and enterprise\
    \ customers in\n43 countries around the world.\n\n•\n\nSnowflake and AWS announced\
    \ a new commitment to build joint industry-specific solutions, increase sales\n\
    collaboration, and deepen product integration, including further streamlining\
    \ running Snowflake on Graviton\nprocessors. Approximately 84% of Snowflake’s\
    \ customers run their deployments on AWS to rapidly\ninnovate.\n\n•\n\nStripe\
    \ announced a new global agreement to run virtually all their infrastructure on\
    \ AWS while reliably\nserving millions of internet companies.\n\n•\n\nWestpac,\
    \ one of Australia’s leading banks, expanded its collaboration with AWS through\
    \ a new five-year\nagreement that will tap into advanced AWS capabilities, like\
    \ machine learning, compute, and data analytics,\nto further accelerate the bank’s\
    \ digital transformation, drive cost efficiencies, and personalize its banking\n\
    applications.\n\n•\n\nT-Mobile is integrating its 5G Advanced Network Solutions\
    \ portfolio with AWS to help customers more\neasily discover, customize, and deploy\
    \ 5G edge computing.\n\n•\n\nMarvell selected AWS to rapidly scale its electronic\
    \ design automation in the cloud to address increasingly\ncomplex chip design\
    \ processes and deliver continuous innovation for expanding needs across the automotive,\n\
    carrier, data center, and enterprise infrastructure markets.\n\n•\n\nTELUS, one\
    \ of Canada’s leading telecommunications providers, is collaborating with AWS\
    \ to develop a new\nsmart-living solution that will reduce the need for multiple\
    \ smart-home apps, simplify installation, and enable\nnew multidevice automation.\n\
    \n•\n\nIberdrola, one of the world’s largest clean energy companies, selected\
    \ AWS as its preferred cloud provider to\nsupport the energy company as it embarks\
    \ on further digitalization to enable smarter grids, customer\nengagement, and\
    \ connected clean power.\n\nAnnounced plans to open a new AWS Region in Malaysia\
    \ and launched a second AWS Region in Australia to\ncontinue expanding AWS’s infrastructure\
    \ footprint, delivering the most secure, extensive, and reliable cloud\ntechnology\
    \ to millions of customers around the world.\n\nInventing on behalf of customers\n\
    Amazon is driven by a passion for invention across all of its business areas.\
    \ The company builds new products and services that\ncustomers ask for, and also\
    \ invents new ones that customers didn’t know they wanted but make their lives\
    \ or businesses better\nin some meaningful way. For example, this past quarter,\
    \ Amazon:\n•\n\nAnnounced new AWS tools that make building with generative artificial\
    \ intelligence (AI) easy, practical, and costeffective for organizations of all\
    \ sizes. The tools include:\n•\n\nAmazon Bedrock, a new managed service that offers\
    \ customers the easiest way to build and scale enterpriseready generative AI applications.\
    \ Amazon Bedrock provides easy access to leading foundation models (ultra-\n\n\
    \flarge machine learning models that generative AI relies on) from AI startups\
    \ like AI21 Labs, Anthropic, and\nStability AI, as well as exclusive access to\
    \ the Titan family of foundation models developed by AWS. Broad\naccess to models\
    \ gives customers flexibility and choice to customize and scale to their specific\
    \ needs.\n•\n\nTwo next-generation compute offerings to deliver the lowest cost\
    \ for training models and running inference in\nthe cloud: the general availability\
    \ of instances powered by AWS-designed Inferentia2 chips, AWS’s secondgeneration\
    \ accelerator, purpose-built for deep learning inference, as well as the general\
    \ availability of\nnetwork-optimized Trn1n instances for large, network-intensive\
    \ models. Compared to other EC2 instances,\nInferentia2 provides up to 40% better\
    \ inference price performance, and Trainium delivers up to 50% savings\non training\
    \ costs.\n\n•\n\nGeneral availability of Amazon CodeWhisperer, an AI coding companion\
    \ that improves developer\nproductivity by generating code suggestions in real\
    \ time. Amazon CodeWhisperer is free for individual\ndevelopers. CodeWhisperer\
    \ is the most accurate, fastest, and most secure way to generate code for AWS\n\
    services, including Amazon EC2, AWS Lambda, and Amazon S3. During a productivity\
    \ challenge,\nparticipants who used CodeWhisperer completed tasks 57% faster (on\
    \ average) and were 27% more likely to\ncomplete them successfully than those\
    \ who didn’t use CodeWhisperer.\n\n•\n\nReceived Zoox’s driverless testing permit\
    \ from the California Department of Motor Vehicles, marking a key step to\ncommercializing\
    \ the self-driving robotaxi for the general public. With this permit, Zoox completed\
    \ an initial run of its\nshuttle service for employees at its headquarters in\
    \ Foster City, California, making it the first purpose-built robotaxi to\noperate\
    \ on public roads in California.\n\n•\n\nExpanded the Ring lineup with new devices.\
    \ Ring Battery Doorbell Plus offers improved HD video and energy-saving\nfeatures,\
    \ and Ring Peephole Cam is an apartment and renter-friendly video doorbell that\
    \ easily installs over an existing\ndoor peephole.\n\n•\n\nExpanded the Amazon-built\
    \ TV lineup with the Fire TV 2-Series, which makes getting an Alexa-enabled TV\
    \ more\naffordable than ever, and new sizes of the Omni QLED Series. The Omni\
    \ QLED Series includes features so customers\ncan see their schedule on the screen,\
    \ control smart devices, and turn the TV into an in-home art gallery. Amazon has\n\
    surpassed 200 million Fire TV devices sold globally. Amazon also launched Amazon-built\
    \ TVs in Germany, Mexico,\nand the UK, and collaborated with Cochlear to help\
    \ people with hearing loss stream sound from their Amazon smart\nTVs directly\
    \ to their Cochlear hearing implants.\n\n•\n\nUnveiled three customer terminal\
    \ designs for Project Kuiper, Amazon’s low Earth orbit satellite broadband initiative.\n\
    Kuiper’s mission is to bridge the digital divide by providing fast, affordable\
    \ broadband to communities worldwide that\nare unserved or underserved by traditional\
    \ technologies. To use Kuiper’s broadband, residential and commercial\ncustomers\
    \ will install an outdoor antenna, called a customer terminal, to communicate\
    \ with satellites overhead.\nAmazon is preparing to launch two prototype satellites\
    \ to test the entire end-to-end communications network this year\nand plans to\
    \ be in beta with commercial customers in 2024.\n\n•\n\nOpened Amazon Sidewalk\
    \ to developer testing for the first time as part of the company’s vision to put\
    \ a billion\nInternet of Things (IoT) devices on the network. Amazon Sidewalk\
    \ is a low-bandwidth, long-range community\nnetwork that connects devices across\
    \ long distances where Wi-Fi and Bluetooth signals often cannot reach. With\n\
    Sidewalk coverage extending to 90% of the U.S. population, developers can now\
    \ build and connect a new range of\ndevices for the network.\n\n•\n\nLaunched\
    \ a loyalty linking capability for Amazon One, Amazon’s palm recognition service\
    \ that lets customers enter,\nidentify, and pay. Panera is the first restaurant\
    \ chain to offer the new loyalty linking capability, allowing customers to\neasily\
    \ enroll in and redeem rewards, and pay for their purchases with just their palm.\n\
    \nEmpowering employees and delivery service partners\nIn addition to its focus\
    \ on customers, Amazon strives to make every day better for its employees and\
    \ delivery service partners.\nFor example, in the first quarter, the company:\n\
    •\n\nAnnounced plans to spend $200 million on safety technologies across Amazon’s\
    \ U.S. transportation network in 2023.\nThese innovations include front-collision\
    \ warning, lane-departure warning, speed limiters, and 360-degree camera\ndetection\
    \ systems. They are part of Amazon’s work to ensure that vehicles and delivery\
    \ partners are safe on the road,\nand the innovations are better for the environment.\n\
    \n•\n\nAnnounced that Amazon improved recordable incident rates worldwide by 11%\
    \ from 2021 to 2022 and by almost 24%\nfrom 2019 to 2022. The company shared the\
    \ data in the second edition of its safety report, Delivered With Care, which\n\
    details how Amazon is advancing safety across its operations through investments\
    \ in capital improvements, safety\n\n\ftechnology, vehicle safety controls, and\
    \ engineered ergonomic solutions to reduce risks for employees, partners, and\n\
    communities.\n•\n\nReached 1 billion packages handled by Robin, a robotic system\
    \ used across Amazon’s operations network in the U.S.,\nCanada, and Europe. Robin\
    \ robotic systems use artificial intelligence, computer vision, and machine learning\
    \ to help\nemployees handle and sort customer packages before shipment. For employees,\
    \ this reduces the number of repetitive\ntasks, improving safety and helping them\
    \ focus their time and energy on activities that make better use of their talents.\n\
    \n•\n\nRanked No. 2 on Fortune magazine’s World’s Most Admired Companies list\
    \ for the seventh year in a row. The annual\nranking is determined by a survey\
    \ of top executives and analysts, and companies are evaluated on factors including\
    \ the\nquality of their management and products, commitments to social responsibility,\
    \ and ability to attract talent.\n\n•\n\nIntroduced Leadership Liftoff, an onboarding\
    \ program for operations area managers. New managers enrolled in the\nprogram\
    \ participate in group sessions, on-the-job training, and self-paced learning\
    \ to help them gain skills and\nconfidence to lead successful teams and foster\
    \ connections between new leaders.\n\nSupporting communities and protecting the\
    \ environment\nAmazon believes that success and scale bring broad responsibility\
    \ to help the planet, future generations, and local communities\nin which the\
    \ company has a significant presence. Amazon employees have passion for investing\
    \ in these areas, and a sampling\nof the efforts from this past quarter are that\
    \ Amazon:\n•\n\nActivated the company’s global logistics network to support communities\
    \ impacted by earthquakes in Türkiye and\nSyria. The company turned its fulfillment\
    \ center in Istanbul into a Disaster Relief Hub and partnered with local\norganizations\
    \ to ship hundreds of thousands of relief items to affected regions. Amazon also\
    \ made cash donations to\nnon-governmental organizations and set up donation campaigns\
    \ across 16 Amazon online stores globally to make it\neasy for customers to support\
    \ communities impacted by these earthquakes.\n\n•\n\nSet a record in 2022 for\
    \ the most renewable energy purchased by a single company in one year. Amazon’s\
    \ renewable\nenergy portfolio now includes 164 wind and solar farms and 237 rooftop\
    \ solar projects in 22 countries, totaling over 20\ngigawatts—an amount of energy\
    \ that could power 5.3 million U.S. homes. Amazon has been the largest corporate\n\
    buyer of renewable energy for three years running.\n\n•\n\nExpanded the use of\
    \ electric delivery vehicles from Rivian, as part of the company’s commitment\
    \ to dramatically\nreduce its carbon emissions. These custom vans from Rivian\
    \ have now been used to deliver more than 75 million\npackages in 500 U.S. cities\
    \ and regions. Amazon began rolling out its electric delivery vans in the summer\
    \ of 2022 and\nnow has thousands on the road.\n\n•\n\nAnnounced over $22 million\
    \ in low-rate loans and grants to help build affordable homes in Washington, D.C.,\
    \ and\nCapitol Heights, Maryland. Since creating the Housing Equity Fund in 2021,\
    \ Amazon has committed nearly $1.6\nbillion to help create or preserve affordable\
    \ homes across Amazon’s hometown communities.\n\n•\n\nAnnounced funding for 8,000\
    \ U.S. schools to provide access to computer science education to more than 2\
    \ million\nstudents by the end of the 2022-2023 academic year through Amazon Future\
    \ Engineer. By providing professional\ndevelopment for teachers, curriculum development,\
    \ college scholarships, and internships, Amazon aims to inspire\nmillions of students\
    \ from underserved and historically underrepresented communities to pursue careers\
    \ in science,\ntechnology, engineering, and math (STEM).\n\n•\n\nLaunched the\
    \ Zero Emission Maritime Buyers Alliance (ZEMBA) in partnership with the Aspen\
    \ Institute, Patagonia,\nand Tchibo. ZEMBA will work to reduce the climate impact\
    \ of maritime shipping by helping to create sustainable\neconomic models in renewable\
    \ energy, zero-emission fuel production, infrastructure, and clean maritime services.\n\
    \n•\n\nAnnounced that the Right Now Climate Fund is developing the world’s first\
    \ commercial-scale seaweed farm located\nbetween offshore wind turbines in the\
    \ North Sea to help address climate change by absorbing carbon dioxide as it\n\
    grows. The Fund is also helping to create and restore ecosystems for plants and\
    \ animals as part of its commitment to\nboost biodiversity and currently supports\
    \ 22 rewilding initiatives in London.\n\nFinancial Guidance\nThe following forward-looking\
    \ statements reflect Amazon.com’s expectations as of April 27, 2023, and are subject\
    \ to\nsubstantial uncertainty. Our results are inherently unpredictable and may\
    \ be materially affected by many factors, such as\nfluctuations in foreign exchange\
    \ rates, changes in global economic and geopolitical conditions and customer demand\
    \ and\nspending (including the impact of recessionary fears), inflation, interest\
    \ rates, regional labor market constraints, world events,\nthe rate of growth\
    \ of the Internet, online commerce, and cloud services, and the various factors\
    \ detailed below.\n\n\fSecond Quarter 2023 Guidance\n•\n•\n•\n\nNet sales are\
    \ expected to be between $127.0 billion and $133.0 billion, or to grow between\
    \ 5% and 10% compared\nwith second quarter 2022. This guidance anticipates an\
    \ unfavorable impact of approximately 30 basis points from\nforeign exchange rates.\n\
    Operating income is expected to be between $2.0 billion and $5.5 billion, compared\
    \ with $3.3 billion in second quarter\n2022.\nThis guidance assumes, among other\
    \ things, that no additional business acquisitions, restructurings, or legal\n\
    settlements are concluded.\n\nA conference call will be webcast live today at\
    \ 2:30 p.m. PT/5:30 p.m. ET, and will be available for at least three months at\n\
    amazon.com/ir. This call will contain forward-looking statements and other material\
    \ information regarding the Company’s\nfinancial and operating results.\nThese\
    \ forward-looking statements are inherently difficult to predict. Actual results\
    \ and outcomes could differ materially for a\nvariety of reasons, including, in\
    \ addition to the factors discussed above, the amount that Amazon.com invests\
    \ in new business\nopportunities and the timing of those investments, the mix\
    \ of products and services sold to customers, the mix of net sales\nderived from\
    \ products as compared with services, the extent to which we owe income or other\
    \ taxes, competition, management\nof growth, potential fluctuations in operating\
    \ results, international growth and expansion, the outcomes of claims, litigation,\n\
    government investigations, and other proceedings, fulfillment, sortation, delivery,\
    \ and data center optimization, risks of\ninventory management, variability in\
    \ demand, the degree to which the Company enters into, maintains, and develops\n\
    commercial agreements, proposed and completed acquisitions and strategic transactions,\
    \ payments risks, and risks of\nfulfillment throughput and productivity. Other\
    \ risks and uncertainties include, among others, risks related to new products,\n\
    services, and technologies, system interruptions, government regulation and taxation,\
    \ and fraud. In addition, global economic\nand geopolitical conditions and additional\
    \ or unforeseen circumstances, developments, or events may give rise to or amplify\n\
    many of these risks. More information about factors that potentially could affect\
    \ Amazon.com’s financial results is included in\nAmazon.com’s filings with the\
    \ Securities and Exchange Commission (“SEC”), including its most recent Annual\
    \ Report on\nForm 10-K and subsequent filings.\nOur investor relations website\
    \ is amazon.com/ir and we encourage investors to use it as a way of easily finding\
    \ information\nabout us. We promptly make available on this website, free of charge,\
    \ the reports that we file or furnish with the SEC, corporate\ngovernance information\
    \ (including our Code of Business Conduct and Ethics), and select press releases,\
    \ which may contain\nmaterial information about us, and you may subscribe to be\
    \ notified of new information posted to this site.\nAbout Amazon\nAmazon is guided\
    \ by four principles: customer obsession rather than competitor focus, passion\
    \ for invention, commitment to\noperational excellence, and long-term thinking.\
    \ Amazon strives to be Earth’s Most Customer-Centric Company, Earth’s Best\nEmployer,\
    \ and Earth’s Safest Place to Work. Customer reviews, 1-Click shopping, personalized\
    \ recommendations, Prime,\nFulfillment by Amazon, AWS, Kindle Direct Publishing,\
    \ Kindle, Career Choice, Fire tablets, Fire TV, Amazon Echo, Alexa,\nJust Walk\
    \ Out technology, Amazon Studios, and The Climate Pledge are some of the things\
    \ pioneered by Amazon. For more\ninformation, visit amazon.com/about and follow\
    \ @AmazonNews."
