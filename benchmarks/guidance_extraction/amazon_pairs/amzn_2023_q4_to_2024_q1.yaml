  label: Amazon Q1 2024 Earnings Release, April 30, 2024
  text: "AMAZON.COM ANNOUNCES FIRST QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) April\
    \ 30, 2024—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its first quarter ended March 31, 2024.\n•\n\n•\n\n•\n\nNet sales increased\
    \ 13% to $143.3 billion in the first quarter, compared with $127.4 billion in\
    \ first quarter 2023.\nExcluding the $0.2 billion unfavorable impact from year-over-year\
    \ changes in foreign exchange rates throughout the\nquarter, net sales increased\
    \ 13% compared with first quarter 2023.\n•\n\nNorth America segment sales increased\
    \ 12% year-over-year to $86.3 billion.\n\n•\n\nInternational segment sales increased\
    \ 10% year-over-year to $31.9 billion, or increased 11% excluding\nchanges in\
    \ foreign exchange rates.\n\n•\n\nAWS segment sales increased 17% year-over-year\
    \ to $25.0 billion.\n\nOperating income increased to $15.3 billion in the first\
    \ quarter, compared with $4.8 billion in first quarter 2023.\n•\n\nNorth America\
    \ segment operating income was $5.0 billion, compared with operating income of\
    \ $0.9 billion\nin first quarter 2023.\n\n•\n\nInternational segment operating\
    \ income was $0.9 billion, compared with an operating loss of $1.2 billion in\n\
    first quarter 2023.\n\n•\n\nAWS segment operating income was $9.4 billion, compared\
    \ with operating income of $5.1 billion in first\nquarter 2023.\n\nNet income\
    \ increased to $10.4 billion in the first quarter, or $0.98 per diluted share,\
    \ compared with $3.2 billion, or\n$0.31 per diluted share, in first quarter 2023.\n\
    •\n\nFirst quarter 2024 net income includes a pre-tax valuation loss of $2.0 billion\
    \ included in non-operating\nexpense from the common stock investment in Rivian\
    \ Automotive, Inc., compared to a pre-tax valuation loss\nof $0.5 billion from\
    \ the investment in first quarter 2023.\n\n•\n\nOperating cash flow increased\
    \ 82% to $99.1 billion for the trailing twelve months, compared with $54.3 billion\
    \ for\nthe trailing twelve months ended March 31, 2023.\n\n•\n\nFree cash flow\
    \ improved to an inflow of $50.1 billion for the trailing twelve months, compared\
    \ with an outflow of\n$3.3 billion for the trailing twelve months ended March\
    \ 31, 2023.\n\n•\n\nFree cash flow less principal repayments of finance leases\
    \ and financing obligations improved to an inflow of\n$46.1 billion for the trailing\
    \ twelve months, compared with an outflow of $10.1 billion for the trailing twelve\
    \ months\nended March 31, 2023.\n\n•\n\nFree cash flow less equipment finance\
    \ leases and principal repayments of all other finance leases and financing\n\
    obligations improved to an inflow of $48.8 billion for the trailing twelve months,\
    \ compared with an outflow of $4.5\nbillion for the trailing twelve months ended\
    \ March 31, 2023.\n\n\f“It was a good start to the year across the business, and\
    \ you can see that in both our customer experience improvements and\nfinancial\
    \ results,” said Andy Jassy, Amazon President and CEO. “The combination of companies\
    \ renewing their infrastructure\nmodernization efforts and the appeal of AWS’s\
    \ AI capabilities is reaccelerating AWS’s growth rate (now at a $100 billion\n\
    annual revenue run rate); our Stores business continues to expand selection, provide\
    \ everyday low prices, and accelerate\ndelivery speed (setting another record\
    \ on speed for Prime customers in Q1) while lowering our cost to serve; and, our\n\
    Advertising efforts continue to benefit from the growth of our Stores and Prime\
    \ Video businesses. It’s very early days in all of\nour businesses and we remain\
    \ excited by how much more we can make customers’ lives better and easier moving\
    \ forward.”\nHighlights\nObsessing over the customer experience\nAmazon obsesses\
    \ over how to make customers’ lives better and easier every day with new and improved\
    \ products and services.\nThis is true for consumers, sellers, brands, developers,\
    \ enterprises, and creators. For example, Amazon:\n•\n\nContinued to delight customers\
    \ with fast and convenient delivery. With more than 2 billion global units arriving\
    \ the\nsame or next day in Q1, Amazon delivered to Prime members at its fastest\
    \ speeds ever. In March, across the top 60\nlargest U.S. metro areas, nearly 60%\
    \ of Prime member orders arrived the same or next day, and in London, Tokyo, and\n\
    Toronto, 3 out of 4 items were delivered the same or next day.\n\n•\n\nExpanded\
    \ selection across the company’s stores with the launch of popular brands. In\
    \ the U.S., this included Gen Z\nfavorite Parade; luxury fashion and accessories\
    \ from AREA and HBX Archives by Hypebeast; beauty brands Clinique,\nKeys Soulcare\
    \ by Alicia Keys, and LOVED01 by John Legend; tech brands Oura Ring and Sonos\
    \ speakers; and\nofficially-licensed products from the National Women’s Soccer\
    \ League. In Europe, Luxury Stores at Amazon\nannounced a collaboration with Hardly\
    \ Ever Worn It to offer customers pre-owned items from luxury brands.\n\n•\n\n\
    Helped customers save with shopping events worldwide, including Amazon’s Spring\
    \ Deal Days in Europe and the first\nBig Spring Sale in Canada and the U.S., where\
    \ customers saved on a wide selection of items including fashion,\noutdoor furniture,\
    \ lawn and garden essentials, and cleaning and organizing products. Amazon also\
    \ held a Ramadan\nevent in Egypt, Saudi Arabia, and the UAE, where customers shopped\
    \ hundreds of thousands of deals on local and\ninternational brands. Amazon also\
    \ announced it will hold its 10th Prime Day event in July.\n\n•\n\nExpanded the\
    \ company’s health care offerings to provide customers in the U.S. more convenient\
    \ access to medical\ncare and medications, including adding Amazon Pharmacy home\
    \ delivery of select Lilly diabetes, obesity, and\nmigraine medications to LillyDirect\
    \ patients; launching same-day delivery of prescription medications to Amazon\n\
    Pharmacy customers in two new locations—greater Los Angeles and New York City—with\
    \ plans to expand to more\nthan a dozen cities by the end of year; and introducing\
    \ Health Condition Programs, which makes it easier for\ncustomers to discover\
    \ and enroll in digital health benefits for conditions like prediabetes, diabetes,\
    \ and high blood\npressure in Amazon’s U.S. store.\n\n•\n\nLaunched a grocery\
    \ subscription for unlimited delivery on orders over $35 from Whole Foods Market,\
    \ Amazon Fresh,\nas well as local grocery and specialty retailers. The subscription\
    \ benefit is available to Prime members in more than\n3,500 towns and cities in\
    \ the U.S., as well as customers using a registered Electronic Benefits Transfer\
    \ card.\n\n•\n\nAnnounced that Buy with Prime is available for Salesforce Commerce\
    \ Cloud merchants. By offering new features like\nthe ability for shoppers to\
    \ search and filter for Prime-eligible items, and the ability to purchase Prime-eligible\
    \ and noneligible items in the same order, Buy with Prime provides merchants using\
    \ Salesforce Commerce Cloud more\nflexibility and functionality, while maintaining\
    \ control over their stores’ look and feel.\n\n•\n\nAnnounced that Prime Video\
    \ will stream its first NFL Wild Card playoff game in January 2025. Prime Video,\
    \ which is\nhome to Thursday Night Football, will have exclusive rights to air\
    \ an opening round playoff game.\n\n•\n\nEarned 12 awards for Amazon MGM Studios\
    \ film American Fiction, including nine for Best Adapted Screenplay by\nwriter/director\
    \ Cord Jefferson. These include an Academy Award, BAFTA Film Award, Critics Choice\
    \ Award, two\nIndependent Spirit Awards, and two Writers Guild of America Awards.\n\
    \n•\n\nGrew Prime Video’s international slate of content with more than 30 local\
    \ Amazon Originals, including Operación\nTriunfo (Spain), Prime Video’s first\
    \ weekly live entertainment show, which was watched by more than 3.5 million\n\
    unique viewers in Spain; Indian Police Force (India), which had the most viewers\
    \ complete the entire first season for\nany Amazon India Original in its launch\
    \ week; and Last One Laughing (Mexico) Season Six, which is the longest\nrunning\
    \ edition of the hit global franchise.\n\n•\n\nShared how customers and partners\
    \ are using AWS generative artificial intelligence (generative AI) services to\
    \ deliver\nnew customer experiences, accelerate employee productivity, and transform\
    \ operations.\n\n\f•\n\n•\n\nSiemens is integrating Amazon Bedrock into its low-code\
    \ development platform Mendix to allow thousands\nof companies across multiple\
    \ industries to create and upgrade applications with the power of generative AI.\n\
    \n•\n\nPhilips is using AWS HealthImaging and Amazon Bedrock to scale digital\
    \ pathology, helping labs and\nhealthcare organizations improve diagnostics, increase\
    \ productivity, accelerate research, and address complex\nmedical cases, like\
    \ cancer care.\n\n•\n\nAccenture and Anthropic are collaborating with AWS to help\
    \ organizations—especially those in highlyregulated industries like healthcare,\
    \ public sector, banking, and insurance—responsibly adopt and scale\ngenerative\
    \ AI technology with Amazon Bedrock. This collaboration will help organizations\
    \ like the District\nof Columbia Department of Health speed innovation, improve\
    \ customer service, and improve productivity,\nwhile keeping data private and\
    \ secure.\n\n•\n\nBT Group, a multinational communications company, provided Amazon\
    \ Q Developer to 1,200 of its\nengineers, generating more than 100,000 lines of\
    \ code in its first four months and automating approximately\n12% of the repetitive\
    \ and time-consuming work done by software engineers using the platform.\n\n•\n\
    \nThe Deutsche Fußball Liga (DFL) named AWS the Official Generative AI Provider\
    \ of the DFL, and is using\nAI on AWS to generate metadata that allows the league,\
    \ clubs, and media partners to more efficiently search\nfor content in more than\
    \ 210,000 hours of video footage.\n\n•\n\nAudi used Amazon SageMaker and Amazon\
    \ OpenSearch Service to build a generative AI chatbot to improve\nits enterprise\
    \ search experience and help employees find and navigate internal documentation,\
    \ reducing\nsearch time from hours to a few seconds and improving productivity.\n\
    \n•\n\nKonica Minolta Healthcare, a medical diagnostic imaging and healthcare\
    \ information technology company,\nannounced an enterprise imaging cloud platform\
    \ using AWS HealthImaging to reduce image storage costs,\nenable access from almost\
    \ anywhere, and accelerate data retrieval.\n\n•\n\nDana-Farber Cancer Institute\
    \ built a new research solution on Amazon Bedrock to help clinicians interpret\n\
    complex lab results to help diagnose medical conditions, assess treatment efficacy,\
    \ and determine next steps\nin clinical care.\n\n•\n\nEnterprise healthcare software\
    \ provider symplr announced a generative AI solution that uses Amazon\nBedrock\
    \ and Amazon Q to connect and optimize hospital operations so clinicians and administrators\
    \ can\nquickly access relevant data, simplifying staff scheduling and other administrative\
    \ processes.\n\n•\n\nChoice Hotels became the first hotel company to migrate its\
    \ entire system infrastructure to the cloud. The\nmove to AWS is part of Choice\
    \ Hotels’ long-term technology roadmap and adoption of AI, and involves\ndecommissioning\
    \ more than 3,700 servers, retiring over 300 applications, and migrating more\
    \ than 250\napplications.\n\n•\n\nMobile network operator Tele2 launched an Internet\
    \ of Things customer support solution, powered by\nAmazon Bedrock, to help agents\
    \ provide faster and more detailed conversational responses to customers\nacross\
    \ multiple channels.\n\n•\n\nVonage, a cloud communications provider, announced\
    \ a new anti-fraud solution with AWS generative AI\ncapabilities to enable businesses\
    \ to better protect themselves from mobile fraud while improving customer\nexperiences.\n\
    \n•\n\nGenomics England, a human genome research organization, is using Amazon\
    \ Bedrock to help researchers\nidentify associations between genetic variants\
    \ and medical conditions by quickly processing millions of pages\nof scientific\
    \ literature, with the goal of informing future genetic tests and improving human\
    \ health.\n\n•\n\nAI biotechnology company Owkin selected AWS as its primary cloud\
    \ provider to develop generative AI\napplications and accelerate drug discovery\
    \ and development, empowering scientists and researchers to access,\nanalyze,\
    \ and manage vast amounts of data efficiently and securely in the cloud.\n\n•\n\
    \nParsyl, a data-powered insurer, is using Amazon Bedrock to turn unwieldy customer\
    \ information, like email\nattachments in different formats, into usable data\
    \ to help identify patterns of risk for businesses transporting\ngoods.\n\nContinued\
    \ to expand AWS’s infrastructure footprint to support customers by announcing:\n\
    •\n\nPlans to launch new infrastructure Regions in the Kingdom of Saudi Arabia\
    \ and in Mexico, which will give\ndevelopers, startups, entrepreneurs, and enterprises\
    \ greater choice for running their applications and serving\nend users. As part\
    \ of AWS’s long-term commitment, it is planning to invest more than $5.3 billion\
    \ in the\nKingdom of Saudi Arabia and more than $5 billion in Mexico over the\
    \ next several years.\n\n\f•\n\n•\n\nA planned investment of $10 billion to build\
    \ two data center complexes in Mississippi. This investment,\nwhich is the single\
    \ largest capital investment in the state’s history, will create at least 1,000\
    \ jobs and support\nnew educational trainings in the state.\n\n•\n\nThe general\
    \ availability of new AWS Local Zones in Atlanta, Chicago, and Houston. In Atlanta,\
    \ AWS Local\nZones support EC2 P5 instances, which deliver the highest performance\
    \ for deep learning and highperformance computing applications.\n\nAnnounced that\
    \ AWS began waiving charges for data transfer out to the internet (DTO) to give\
    \ customers choice if\nthey want to migrate their data outside of AWS. The waiver\
    \ on DTO charges is available to all AWS customers around\nthe world and from\
    \ any AWS Region.\n\nInventing on behalf of customers\nAmazon is driven by a passion\
    \ for invention across all of its business areas. The company builds new products\
    \ and services that\ncustomers ask for, and also invents new ones that customers\
    \ didn’t know they wanted but make their lives or businesses better\nin some meaningful\
    \ way. For example, Amazon:\n•\n\n•\n\nAnnounced the general availability of Amazon\
    \ Q, the most capable generative AI-powered assistant for accelerating\nsoftware\
    \ development and leveraging companies’ internal data.\n•\n\nOn the software development\
    \ side, Amazon Q not only generates highly accurate code, but also tests code,\n\
    debugs coding conflicts, and transforms code from one form to another (today,\
    \ developers can save months\nusing Q to move from older versions of Java to newer,\
    \ more secure and capable ones; in the near future, Q\nwill help developers transform\
    \ their .net code as well). Q Developer Agents does multi-step planning and\n\
    reasoning to allow developers to string together multiple requests and have Q\
    \ implement them.\n\n•\n\nOn the internal data side, most companies have large\
    \ troves of data that reside in wikis, intranet pages,\nSalesforce, storage repositories\
    \ like Amazon S3, and many other data stores and SaaS apps that are hard to\n\
    access. It makes answering straightforward questions about company policies, products,\
    \ business results,\ncode, people, and many other topics hard and frustrating.\
    \ Q makes this much simpler. Customers can point Q\nat all of its enterprise data\
    \ repositories, and it’ll search this data, summarize logically, analyze trends,\
    \ and\nengage in dialog with customers about this data. With the launch of a powerful\
    \ new capability called Q Apps,\nemployees can now describe, in natural language,\
    \ what apps they want to build on top of this internal data,\nand Q Apps will\
    \ quickly generate that app. This will make it much easier for internal teams\
    \ to build useful\napps from their own data.\n\nDelivered a number of innovations\
    \ in Amazon Bedrock (AWS’s generative AI service that enables customers to\nleverage\
    \ an existing large language model, customize it with their own data, and have\
    \ the easiest and best features\navailable to deploy secure, high quality, low\
    \ latency, cost-effective production generative AI apps). Tens of thousands\n\
    of organizations worldwide are using Amazon Bedrock. These new Bedrock capabilities\
    \ include:\n•\n\nThe general availability of Anthropic’s Claude 3 family of vision-enabled\
    \ foundation models (FMs)—Opus,\nSonnet, and Haiku—which are the best performing\
    \ models in the world right now and provide industryleading accuracy, performance,\
    \ speed, and cost. Claude 3 Opus has set a new standard, outperforming other\n\
    models available today in the areas of reasoning, math, and coding. Amazon Bedrock\
    \ became the first\nmanaged service to add Claude 3 models, and continues to provide\
    \ customers with the widest choice of highperforming, fully-managed large language\
    \ models (LLMs) and FMs.\n\n•\n\nThe general availability of Meta Llama 3 models,\
    \ a collection of pretrained and instruction fine-tuned LLMs\nthat come in two\
    \ sizes—8B and 70B. The new models demonstrate significant improvements over previous\n\
    versions due to vastly increased training data and scale. This collection of models\
    \ supports a broad range of\nuse cases, like text summarization and classification,\
    \ sentiment analysis, language translation, and code\ngeneration.\n\n•\n\nThe\
    \ addition of FMs from leading AI startup Mistral AI. Mistral Large, the latest\
    \ and most advanced LLM\nfrom Mistral AI, provides top-tier reasoning capabilities\
    \ for complex multilingual reasoning tasks. Mistral\nAI’s Mixtral 8x7B and Mistral\
    \ 7B models can summarize, answer questions, and help organize information\nwith\
    \ their deep understanding of text structure and architecture.\n\n•\n\nThe availability\
    \ of new Cohere models (Command R and Command R+) on Bedrock.\n\n•\n\nNew first\
    \ party Amazon Titan LLMs, including Amazon Titan Text Embeddings V2 and the general\n\
    availability of Amazon Titan Image Generator.\n\n\f•\n\nThe general availability\
    \ of Model Evaluation, which is the fastest way for organizations to analyze,\
    \ compare,\nand select models on Amazon Bedrock, reducing time from weeks to hours\
    \ spent evaluating models so\ncustomers can bring new applications and experiences\
    \ to market faster.\n\n•\n\nThe general availability of Guardrails, which provides\
    \ customers with best-in-class technology to easily\nimplement safeguards to remove\
    \ personal and sensitive information, profanity, specific words, and harmful\n\
    content. Guardrails offers industry-leading safety protection on top of the native\
    \ capabilities of FMs, helping\ncustomers block up to 85% of harmful content.\
    \ Guardrails is the only solution offered by a broad cloud\nprovider that allows\
    \ customers to have built-in and custom safeguards in a single offering, and it\
    \ works with\nall LLMs in Amazon Bedrock, as well as fine-tuned models.\n\n•\n\
    \nThe new Custom Model Import capability that makes it simple for customers to\
    \ import models from\nSageMaker (or elsewhere) into Bedrock before deploying their\
    \ application—enabling customers to take\nadvantage of all the Bedrock features\
    \ that make it so much easier to build high quality production-grade\ngenerative\
    \ AI apps.\n\n•\n\nAnnounced the extension of AWS and NVIDIA’s strategic collaboration\
    \ to make AWS the best place to run NVIDIA\nGPUs, helping customers unlock new\
    \ generative AI capabilities. AWS will bring together NVIDIA’s next-generation\n\
    Blackwell platform with AWS Nitro System and AWS Key Management Service advanced\
    \ security, Elastic Fabric\nAdapter petabit-scale networking, and Amazon EC2 UltraCluster\
    \ hyper-scale clustering, enabling customers to\nsecurely build and run multi-trillion\
    \ parameter LLMs faster, at massive scale, and at a lower cost than previousgeneration\
    \ NVIDIA GPUs on Amazon EC2. In addition, Project Ceiba, an AI supercomputer being\
    \ jointly developed\nby AWS and NVIDIA exclusively on AWS for NVIDIA’s own AI\
    \ research and development, will be built on the\nBlackwell platform.\n\n•\n\n\
    Continued to meet growing demand for AWS Trainium and Inferentia chips, which\
    \ help customers maximize\nperformance and control costs for their machine learning\
    \ (ML) workloads. Customers using these purpose-built AWS\nML AI chips include\
    \ Anthropic, Databricks, Leonardo.ai, Qualtrics, Ricoh, Stockmark, Watashiha,\
    \ and Vyond. In\naddition, Meta's recently-launched Llama 3 model is running on\
    \ Trainium and Inferentia2—delivering the lowest cost\nto train, fine tune, and\
    \ deploy Llama 3 on AWS.\n\n•\n\nUpdated AWS Neuron (software that lets customers\
    \ use popular frameworks like PyTorch to train and deploy models\nwith minimal\
    \ code changes on Amazon EC2 instances, powered by Trainium and Inferentia chips)\
    \ to include features\nthat further reduce costs for LLM inference for both external\
    \ customers and internal teams at Amazon, such as\nAmazon Rufus.\n\n•\n\nContinued\
    \ to rollout Rufus in the Amazon Shopping app to millions of customers in the\
    \ U.S. Rufus, in beta, is a new\ngenerative AI-powered shopping assistant that\
    \ can help customers save time and make more informed purchase\ndecisions by answering\
    \ a variety of shopping-related questions, providing product comparisons, making\n\
    recommendations, and more. Amazon improved Rufus’ answer accuracy and response\
    \ speed, and added new features,\nincluding “My Orders,” which answers questions\
    \ such as “when did I last order coffee?” and “what dog treats did I last\norder?”\n\
    \n•\n\nAdded more generative AI features for independent sellers in the U.S. to\
    \ create product listings, including a new tool\nthat allows sellers to leverage\
    \ product listings on their own websites, simply by providing Amazon with a URL.\n\
    Amazon’s generative AI-based features automatically parse the information to seamlessly\
    \ create high-quality,\nengaging listings for Amazon’s store. This feature further\
    \ enhances and streamlines the process of creating product\nlistings, saving sellers\
    \ time and effort, while also developing product listings that appeal to customers\
    \ and help drive\nsales.\n\n•\n\nReleased 20 films and series from Amazon MGM\
    \ Studios, including the debut season of Fallout, which attracted more\nthan 65\
    \ million viewers worldwide and has become the second most watched title ever\
    \ on Prime Video through its first\n16 days; Road House, which attracted more\
    \ than 50 million viewers worldwide in its first two weekends streaming on\nPrime\
    \ Video, the biggest debut ever for an Amazon MGM Studios-produced film; Hazbin\
    \ Hotel, which had the most\ntotal global viewers on its opening weekend for a\
    \ new animated series on Prime Video; and The Beekeeper, which\nranked in the\
    \ top-10 of theatrical releases by revenue globally in the first quarter.\n\n\
    •\n\nAnnounced plans to create a new series from MrBeast, the world’s most-subscribed\
    \ YouTube creator. Beast Games is\nset to have 1,000 contestants competing for\
    \ $5 million—the biggest single prize in the history of television and\nstreaming.\
    \ The series will premiere on Prime Video in more than 240 countries and territories\
    \ and is based on\nMrBeast’s popular show.\n\n•\n\nAnnounced a global collaboration\
    \ that will bring Fire TV to Panasonic’s new smart TVs. Customers will get the\n\
    benefits of Fire TV’s personalized streaming and access to Alexa, combined with\
    \ Panasonic’s smart TVs. Amazon\n\n\falso announced Matter Casting on Fire TV\
    \ and Echo Show 15—an industry-first implementation of this practice.\nMatter\
    \ Casting lets customers stream and control content on their television or streaming\
    \ stick from their mobile app.\nCustomers can begin watching a movie from Prime\
    \ Video on their phone, and cast it to a compatible Fire TV or Echo\nShow 15 to\
    \ continue watching on a bigger screen.\n•\n\nLaunched Ring Battery Doorbell Pro,\
    \ Ring’s most advanced battery-powered doorbell. It features 3D Motion\nDetection\
    \ to make motion alerts more precise; HD+ Head-to-Toe Video to improve image quality;\
    \ and Audio Toggle\nto turn audio recording on and off.\n\n•\n\nIntroduced Blink\
    \ Mini 2, a compact plug-in camera that works both indoors and outdoors. Blink\
    \ Mini 2 features\nenhanced image quality, a built-in LED spotlight for night\
    \ view in color, and on-device computer vision to support\nsmart notifications,\
    \ including person detection so customers can receive alerts only when a person\
    \ is detected (versus\nan animal or object).\n\n•\n\nAchieved several important\
    \ milestones on the path toward commercializing Zoox, Amazon’s self-driving robotaxi,\n\
    which is expected later this year. Key deliverables included: receiving Zoox’s\
    \ California Public Utilities Commission\nDriverless Autonomous Vehicle Pilot\
    \ permit, which allows Zoox to carry members of the public in Foster City,\nCalifornia,\
    \ without charging a fare; expanding driving capabilities to include higher speeds,\
    \ night driving, and driving\nin light rain in both California and Nevada; and\
    \ expanding the virtual boundary where Zoox can operate its robotaxis\nin Las\
    \ Vegas, helping prepare for the first public riders in the city later this year.\n\
    \n•\n\nAnnounced Whole Foods Market Daily Shop, a new quick-shop store designed\
    \ to provide customers in urban\nneighborhoods a quick, convenient shopping experience.\
    \ The new format will launch on the Upper East Side in\nManhattan, with additional\
    \ locations in New York City to follow.\n\nEmpowering employees and delivery service\
    \ partners\nIn addition to its focus on customers, Amazon strives to make every\
    \ day better for its employees and delivery service partners.\nFor example, the\
    \ company:\n•\n\nAnnounced that Amazon improved recordable incident rates (any\
    \ work-related injury that requires more than basic\nfirst-aid treatment) by 30%\
    \ and lost time incident rates (any work-related injury that requires someone\
    \ to take time\naway from work) by 60% worldwide over the past four years. In\
    \ 2024, Amazon plans to invest over $750 million in\ntechnologies, resources,\
    \ training, and programs to further improve safety across its network.\n\n•\n\n\
    Achieved record-breaking participation in Career Choice, Amazon’s education benefit\
    \ that empowers employees to\nlearn new skills for career success, in the first\
    \ quarter. Since the program launched in 2012, nearly 200,000 employees\nhave\
    \ furthered their education, earned industry certifications, and learned new skills\
    \ through the program.\n\n•\n\nRanked No. 3 on Fortune magazine’s World’s Most\
    \ Admired Companies list— Amazon’s eighth straight year in the\ntop three. The\
    \ annual ranking is determined by a survey of top executives and analysts, and\
    \ companies are evaluated\non factors including the quality of their management\
    \ and products, commitments to social responsibility, and ability to\nattract\
    \ talent.\n\n•\n\nExpanded opportunities for women in India, including awarding\
    \ new scholarships for 500 women students to help\nthem build a career in technology\
    \ as part of the Amazon Future Engineer Scholarship Program. Students will receive\n\
    50,000 Indian Rupees each year to go toward courses in computer science.\n\n•\n\
    \nAnnounced that Amazon will introduce its Delivery Service Partner (DSP) program\
    \ in Brisbane, Melbourne, and\nSydney, Australia this year. The DSP program provides\
    \ access to tools, resources, and Amazon’s logistics expertise to\nhelp entrepreneurs\
    \ start delivery businesses, and has the potential to create hundreds of jobs\
    \ for delivery drivers. The\nprogram will expand Amazon’s last mile network in\
    \ Australia to meet growing customer demand.\n\n•\n\nAnnounced plans to open Amazon\
    \ Robotics fulfillment centers in Asturias, Spain and Sagamihara City, Japan,\
    \ as part\nof Amazon’s commitment to design and deploy advanced technology that\
    \ improves operational safety, employee\nexperience, and customer delivery. The\
    \ company now has Robotics fulfillment centers in 11 countries around the\nworld,\
    \ and they help improve workplace ergonomics, reduce heavy lifting and repetitive\
    \ tasks, and enable employees\nto gain new skills.\n\nSupporting communities and\
    \ protecting the environment\nAmazon believes that success and scale bring broad\
    \ responsibility to help the planet, future generations, and communities.\nAmazon\
    \ employees have passion for investing in these areas, and a sampling of the efforts\
    \ from this past quarter are that\nAmazon:\n\n\f•\n\nLaunched a Disaster Relief\
    \ Hub in Rheinberg, Germany—Amazon’s first Hub in Europe and the company’s 13th\n\
    around the world. The 21,000-square-foot Hub allows Amazon to store and quickly\
    \ pack relief items that are most\nneeded following natural disasters and other\
    \ emergencies. AWS also provided technology to support the nonprofit\nHelp.NGO\
    \ to fight wildfires in Chile and Colombia, including monitoring active fires,\
    \ spotting new fires, and\nevaluating how best to help evacuated residents return\
    \ to their homes. Since 2017, Amazon has used its global\ninventory, logistics\
    \ infrastructure, and cloud technology to respond to more than 145 natural disasters\
    \ and donate more\nthan 24 million relief items globally.\n\n•\n\nIncreased funding\
    \ for the AWS Health Equity Initiative by $20 million, bringing its commitment\
    \ since the program\nlaunched in 2021 to $60 million. This program provides free\
    \ cloud credits and technical expertise to help organizations\nharness the power\
    \ of the cloud to advance global health. It has supported 263 organizations globally\
    \ since 2021.\n\n•\n\nWas named the largest corporate purchaser of renewable energy\
    \ by BloombergNEF for the fourth consecutive year.\nAmazon now has more than 500\
    \ wind and solar projects globally that are expected to generate more than 77,000\n\
    gigawatt-hours of clean energy each year—or enough to power 7.2 million U.S. homes.\n\
    \n•\n\nAnnounced that nearly half of all customer orders fulfilled in India are\
    \ delivered in reduced or original packaging—\nmeaning less packaging is needed\
    \ to ensure the deliveries arrive safely, which is better for customers and the\n\
    environment. Deliveries with reduced or no additional packaging are reaching customers\
    \ in more than 300 cities across\nIndia, up from nine cities in 2019.\n\n•\n\n\
    Invested in Glacier, a women-led AI and robotics company that helps the recycling\
    \ industry reduce waste by\nautomating, sorting, and collecting real-time data\
    \ on recycling streams. The investment is part of Amazon’s Climate\nPledge Fund,\
    \ and is the second woman CEO-led company that The Fund has invested in as part\
    \ of its $53 million\nFemale Founder Initiative, which launched in 2022 to close\
    \ the funding gap for women in climate tech.\n\nFinancial Guidance\nThe following\
    \ forward-looking statements reflect Amazon.com’s expectations as of April 30,\
    \ 2024, and are subject to\nsubstantial uncertainty. Our results are inherently\
    \ unpredictable and may be materially affected by many factors, such as\nfluctuations\
    \ in foreign exchange rates, changes in global economic and geopolitical conditions\
    \ and customer demand and\nspending (including the impact of recessionary fears),\
    \ inflation, interest rates, regional labor market constraints, world events,\n\
    the rate of growth of the internet, online commerce, cloud services, and new and\
    \ emerging technologies, and the various factors\ndetailed below.\nSecond Quarter\
    \ 2024 Guidance\n•\n\n•\n•\n\nNet sales are expected to be between $144.0 billion\
    \ and $149.0 billion, or to grow between 7% and 11% compared\nwith second quarter\
    \ 2023. This guidance anticipates an unfavorable impact of approximately 60 basis\
    \ points from\nforeign exchange rates. In first quarter 2024 the impact from Leap\
    \ Year added approximately 120 basis points to the\nyear-over-year net sales growth\
    \ rate.\nOperating income is expected to be between $10.0 billion and $14.0 billion,\
    \ compared with $7.7 billion in second\nquarter 2023.\nThis guidance assumes,\
    \ among other things, that no additional business acquisitions, restructurings,\
    \ or legal\nsettlements are concluded.\n\nA conference call will be webcast live\
    \ today at 2:30 p.m. PT/5:30 p.m. ET, and will be available for at least three\
    \ months at\namazon.com/ir. This call will contain forward-looking statements\
    \ and other material information regarding the Company’s\nfinancial and operating\
    \ results.\nThese forward-looking statements are inherently difficult to predict.\
    \ Actual results and outcomes could differ materially for a\nvariety of reasons,\
    \ including, in addition to the factors discussed above, the amount that Amazon.com\
    \ invests in new business\nopportunities and the timing of those investments,\
    \ the mix of products and services sold to customers, the mix of net sales\nderived\
    \ from products as compared with services, the extent to which we owe income or\
    \ other taxes, competition, management\nof growth, potential fluctuations in operating\
    \ results, international growth and expansion, the outcomes of claims, litigation,\n\
    government investigations, and other proceedings, fulfillment, sortation, delivery,\
    \ and data center optimization, risks of\ninventory management, variability in\
    \ demand, the degree to which the Company enters into, maintains, and develops\n\
    commercial agreements, proposed and completed acquisitions and strategic transactions,\
    \ payments risks, and risks of\nfulfillment throughput and productivity. Other\
    \ risks and uncertainties include, among others, risks related to new products,\n\
    services, and technologies, security breaches, system interruptions, government\
    \ regulation and taxation, and fraud. In addition,\nglobal economic and geopolitical\
    \ conditions and additional or unforeseen circumstances, developments, or events\
    \ may give\nrise to or amplify many of these risks. More information about factors\
    \ that potentially could affect Amazon.com’s financial\n\n\fresults is included\
    \ in Amazon.com’s filings with the Securities and Exchange Commission (“SEC”),\
    \ including its most recent\nAnnual Report on Form 10-K and subsequent filings.\n\
    Our investor relations website is amazon.com/ir and we encourage investors to\
    \ use it as a way of easily finding information\nabout us. We promptly make available\
    \ on this website, free of charge, the reports that we file or furnish with the\
    \ SEC, corporate\ngovernance information (including our Code of Business Conduct\
    \ and Ethics), and select press releases, which may contain\nmaterial information\
    \ about us, and you may subscribe to be notified of new information posted to\
    \ this site.\nAbout Amazon\nAmazon is guided by four principles: customer obsession\
    \ rather than competitor focus, passion for invention, commitment to\noperational\
    \ excellence, and long-term thinking. Amazon strives to be Earth’s Most Customer-Centric\
    \ Company, Earth’s Best\nEmployer, and Earth’s Safest Place to Work. Customer\
    \ reviews, 1-Click shopping, personalized recommendations, Prime,\nFulfillment\
    \ by Amazon, AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire tablets,\
    \ Fire TV, Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios, and\
    \ The Climate Pledge are some of the things pioneered by Amazon. For more\ninformation,\
    \ visit amazon.com/about and follow @AmazonNews."
