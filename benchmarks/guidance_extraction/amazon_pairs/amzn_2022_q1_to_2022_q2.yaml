  label: Amazon Q2 2022 Earnings Release, July 28, 2022
  text: "AMAZON.COM ANNOUNCES SECOND QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) July\
    \ 28, 2022—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results for\n\
    its second quarter ended June 30, 2022.\n•\n\nOperating cash flow decreased 40%\
    \ to $35.6 billion for the trailing twelve months, compared with $59.3 billion\
    \ for\nthe trailing twelve months ended June 30, 2021.\n\n•\n\nFree cash flow\
    \ decreased to an outflow of $23.5 billion for the trailing twelve months, compared\
    \ with an inflow of\n$12.1 billion for the trailing twelve months ended June 30,\
    \ 2021.\n\n•\n\nFree cash flow less principal repayments of finance leases and\
    \ financing obligations decreased to an outflow of\n$33.5 billion for the trailing\
    \ twelve months, compared with an inflow of $0.6 billion for the trailing twelve\
    \ months\nended June 30, 2021.\n\n•\n\nFree cash flow less equipment finance leases\
    \ and principal repayments of all other finance leases and financing\nobligations\
    \ decreased to an outflow of $26.1 billion for the trailing twelve months, compared\
    \ with an inflow of $4.2\nbillion for the trailing twelve months ended June 30,\
    \ 2021.\n\n•\n\nCommon shares outstanding plus shares underlying stock-based awards\
    \ totaled 10.6 billion on June 30, 2022,\ncompared with 10.4 billion one year\
    \ ago. All share and per share information throughout this release has been\n\
    retroactively adjusted to reflect the 20-for-1 stock split effected on May 27,\
    \ 2022.\n\n•\n\nNet sales increased 7% to $121.2 billion in the second quarter,\
    \ compared with $113.1 billion in second quarter 2021.\nExcluding the $3.6 billion\
    \ unfavorable impact from year-over-year changes in foreign exchange rates throughout\
    \ the\nquarter, net sales increased 10% compared with second quarter 2021.\n\n\
    •\n\nOperating income decreased to $3.3 billion in the second quarter, compared\
    \ with $7.7 billion in second quarter 2021.\n\n•\n\nNet loss was $2.0 billion\
    \ in the second quarter, or $0.20 per diluted share, compared with net income\
    \ of $7.8 billion,\nor $0.76 per diluted share, in second quarter 2021. Second\
    \ quarter 2022 net loss includes a pre-tax valuation loss of\n$3.9 billion included\
    \ in non-operating expense from our common stock investment in Rivian Automotive,\
    \ Inc.\n\n“Despite continued inflationary pressures in fuel, energy, and transportation\
    \ costs, we’re making progress on the more\ncontrollable costs we referenced last\
    \ quarter, particularly improving the productivity of our fulfillment network,”\
    \ said Andy\nJassy, Amazon CEO. “We’re also seeing revenue accelerate as we continue\
    \ to make Prime even better for members, both\ninvesting in faster shipping speeds,\
    \ and adding unique benefits such as free delivery from Grubhub for a year, exclusive\
    \ access\nto NFL Thursday Night Football games starting September 15, and releasing\
    \ the highly anticipated series The Lord of the\nRings: The Rings of Power on\
    \ September 2.”\nHighlights\nShopping Innovation\n•\n\nPrime members worldwide\
    \ shopped more and saved more this Prime Day than any other Prime Day event, purchasing\n\
    more than 300 million items and saving more than $1.7 billion. On July 12 and\
    \ July 13, Prime members worldwide\npurchased more than 100,000 items per minute,\
    \ and some of the best-selling categories were Amazon Devices,\nConsumer Electronics,\
    \ and Home. Amazon Devices had a record-breaking Prime Day, selling more devices\
    \ than any\nother Prime Day event.\n\n•\n\nPrime continued to provide even more\
    \ value to members around the world. In the U.S., Amazon introduced new offers\n\
    for Prime members, including a free one-year Grubhub+ membership, a new year-round\
    \ 20% discount on select\n\n\feveryday essentials at Amazon Fresh stores, and\
    \ exclusive deals on home entertainment items and merchandise to help\nprepare\
    \ for NFL Thursday Night Football. Additionally, Prime Student members get six\
    \ months free of a LinkedIn\nPremium subscription.\n•\n\nAmazon introduced new\
    \ ways for customers to support and discover small businesses selling in Amazon’s\
    \ store,\nincluding the Small Business Badge, which helps customers find and shop\
    \ products from small business brands and\nartisans, and This Is Small Business,\
    \ a new podcast dedicated to sharing stories from small business owners about\n\
    pivotal moments in starting, building, and scaling their businesses. This year\
    \ was also the biggest Prime Day event for\nAmazon’s selling partners, most of\
    \ which are small and medium-sized businesses, whose sales growth in Amazon’s\n\
    store outpaced Amazon’s first-party sales. Customers spent over $3 billion on\
    \ more than 100 million small business\nitems included in the Support Small Businesses\
    \ to Win Big sweepstakes, which offered customers the chance to win\nprizes when\
    \ shopping from small businesses leading up to Prime Day.\n\n•\n\nAmazon continues\
    \ to invent new fashion shopping experiences for customers, launching Virtual\
    \ Try-On for Shoes,\nwhere shoppers can virtually try on thousands of sneaker\
    \ styles, and Luxury Stores at Amazon in France, Germany,\nItaly, Spain, and the\
    \ UK, where customers can shop established and emerging luxury fashion brands\
    \ online. Amazon\nStyle, Amazon’s first-ever physical store for apparel, opened\
    \ in Glendale, California, to help customers discover new\nlooks through a personalized\
    \ shopping experience. Amazon Style uses machine learning algorithms to produce\
    \ tailored\nrecommendations for customers as they shop. In the fitting room, customers\
    \ can use touchscreens to browse more\noptions and request additional styles and\
    \ sizes. Amazon also expanded its selection of size-inclusive fashion to include\n\
    a collection from designer Jonathan Cohen and a new co-brand between Amazon and\
    \ Making The Cut Season Two\nwinner Andrea Pitter called TEREA.\n\n•\n\nAmazon\
    \ announced that later this year, Amazon customers in Lockeford, California, and\
    \ College Station, Texas, will\nbe among the first to receive Prime Air drone\
    \ deliveries in the U.S. Customers will have the option to receive free and\n\
    fast drone delivery on thousands of everyday items—the largest selection of items\
    \ ever to be available for drone\ndelivery.\n\n•\n\nAmazon continues to collaborate\
    \ with leading retailers and stadiums to equip third-party locations with Just\
    \ Walk Out\ntechnology for checkout-free shopping and Amazon One for palm recognition\
    \ and payment service. Recent store\nopenings include the Walk-Off Market food\
    \ and beverage store at T-Mobile Park in Seattle and the Hudson Nonstop\nstore\
    \ in Nashville International Airport. Additionally, three stores will open at\
    \ Texas A&M’s Kyle Field later this year.\nThe combination of technologies gives\
    \ shoppers the option to enter a store by inserting their credit card at the entry\n\
    gate or hovering their palm over an Amazon One device. Once inside, shoppers can\
    \ take what they want and leave\nwithout stopping to check out.\n\n•\n\nAmazon\
    \ continued to expand its grocery store footprint by opening 12 Amazon Fresh stores\
    \ across the U.S. and the\nUK, and introduced new innovations to improve the shopping\
    \ experience for customers, including the next generation\nAmazon Dash Cart. Amazon\
    \ Dash Cart is a smart shopping cart that uses computer vision algorithms and\
    \ sensor\nfusion to help identify items placed in a cart, so customers can skip\
    \ the checkout line when they are done shopping.\nWith the new Dash Cart, which\
    \ is also expanding to its first Whole Foods Market store, shoppers can fit more\
    \ items\ninto their cart, bring the cart to their car, and easily search for specific\
    \ items on the cart’s screen.\n\n•\n\nAmazon announced Store Analytics, a new\
    \ service that provides brands with aggregated and anonymized insights\nabout\
    \ the performance of their products, promotions, and ad campaigns in applicable\
    \ stores. Store Analytics is\navailable at Amazon Go and Amazon Fresh stores in\
    \ the U.S. that are enabled with Just Walk Out technology and\nAmazon Dash Carts.\n\
    \n•\n\nAmazon continues to improve its shopping experience for U.S. customers\
    \ who use SNAP EBT, the federal program\nthat helps families purchase groceries.\
    \ The company expanded the program so that beneficiaries in 48 states and\nWashington,\
    \ D.C.—covering more than 99% of SNAP households—can now use their SNAP benefits\
    \ to shop for\ngroceries at Amazon.com, Amazon Fresh, and Whole Foods Market.\n\
    \n•\n\nAmazon released its second Brand Protection Report, which details how the\
    \ company safeguards customers, brands,\nand selling partners from counterfeit\
    \ products. Amazon identified, seized, and appropriately disposed of more than\
    \ 3\nmillion counterfeit products, preventing them from harming customers or being\
    \ resold elsewhere in the retail supply\nchain. In 2021, the company employed\
    \ more than 12,000 people and invested more than $900 million to protect its\n\
    store from counterfeit, fraud, and other forms of abuse so customers can continue\
    \ to shop with confidence.\n\n•\n\nAmazon filed legal action against the administrators\
    \ of more than 10,000 Facebook groups that attempt to orchestrate\nfake reviews\
    \ on Amazon in exchange for money or free products. These groups are set up to\
    \ recruit individuals willing\nto post incentivized and misleading reviews on\
    \ Amazon’s stores in the U.S., the UK, Germany, France, Italy, Spain,\nand Japan.\
    \ Amazon will use information discovered from this legal action to identify bad\
    \ actors and remove fake\n\n\freviews commissioned by these fraudsters that haven’t\
    \ already been detected by Amazon’s advanced technology,\nexpert investigators,\
    \ and continuous monitoring.\n•\n\nAmazon Ads launched Amazon Marketing Stream\
    \ (Beta), a product that automatically delivers hourly Sponsored\nProducts campaign\
    \ metrics to advertisers or agencies through the Amazon Ads API. The Stream provides\
    \ near realtime performance insights to enable more effective campaign optimization,\
    \ more agility in responding to campaign\nchanges, and increased operational efficiency\
    \ to help drive business growth for advertisers.\n\n•\n\nThe second re:MARS conference\
    \ took place in Las Vegas, and Amazon welcomed nearly 7,000 attendees, in person\n\
    and virtually, to hear from top academics and experts in machine learning, automation,\
    \ robotics, and space. This year’s\nevent featured innovations from across Amazon,\
    \ along with demos of Amazon’s Just Walk Out Experiential Mock\nStore, Boston\
    \ Dynamics’ Spot® agile robot on AWS, Alexa Smart Home featuring the Astro household\
    \ robot, and the\nLunar Outpost lunar surface rover built on AWS.\n\nEntertainment\n\
    •\n\nFormer NFL quarterback Ryan Fitzpatrick and All-Pro cornerback Richard Sherman\
    \ will join Pro Football Hall of\nFamer Tony Gonzalez as analysts for Prime Video’s\
    \ NFL Thursday Night Football pregame, halftime, and postgame\ncoverage. Veteran\
    \ sports anchor Charissa Thompson will host the shows. Legendary sportscaster\
    \ Al Michaels and\nEmmy-winning analyst Kirk Herbstreit will call the live action\
    \ games.\n\n•\n\nPrime Video received 30 Emmy nominations, and MGM received seven\
    \ nominations. Prime Video’s nominations\nincluded The Marvelous Mrs. Maisel,\
    \ Lucy and Desi, Lizzo’s Watch Out for the Big Grrrls, The Academy of Country\n\
    Music Awards, The Boys Presents: Diabolical, Goliath, Savage X Fenty Show, and\
    \ A Very British Scandal. MGM’s\nnominations included Vikings: Valhalla, The Voice,\
    \ Shark Tank, and Survivor.\n\n•\n\nThe Boys continued to grow its audience with\
    \ the debut of Season Three. Over its premiere weekend, the Emmynominated superhero\
    \ drama increased its worldwide audience by 234% from Season One and 17% from\
    \ Season Two.\n\n•\n\nThe Lord of the Rings: The Rings of Power continued to build\
    \ anticipation in the lead-up to premiere. The release of\nnew images, a teaser\
    \ trailer, and a 60-second sneak peek for Prime members on Prime Day all preceded\
    \ the debut of a\nhighly anticipated three-minute trailer at San Diego Comic-Con.\
    \ The long trailer was unveiled to a crowd of 6,500 fans\nduring a panel with\
    \ the show’s cast—moderated by Stephen Colbert—in the convention’s largest venue\
    \ before being\nreleased globally. The Lord of the Rings: The Rings of Power launches\
    \ exclusively on Prime Video in 240 countries\nand territories and 33 different\
    \ languages on September 2.\n\n•\n\nPrime Video debuted five new Original series:\
    \ The Terminal List, starring Chris Pratt; The Summer I Turned Pretty;\nChloe;\
    \ The One That Got Away; and Forever Summer: Hamptons. In addition, adult animated\
    \ series Undone and\nFairfax each returned for second seasons. Prime Video premiered\
    \ three new Original movies: Sundance Film Festival\naward-winner Emergency; Don’t\
    \ Make Me Go, starring John Cho and Mia Isaac; and Anything’s Possible, directed\
    \ by\nBilly Porter.\n\n•\n\nPrime Video’s robust international slate grew with\
    \ the debut of more than 25 local Originals and live sporting events.\nNew global\
    \ programming includes Yosi, the Regretful Spy (Argentina), The Kids in the Hall\
    \ (Canada), Modern Love\nMumbai (India), Bang Bang Baby (Italy), and Lovestruck\
    \ High (UK). Sports programming includes Roland-Garros\nFrench Open tennis in\
    \ France, the Australian Swimming Championships, and live boxing in Japan.\n\n\
    •\n\nThe ad-supported, free streaming content service Amazon Freevee received\
    \ its first major award win for Judy Justice,\nstarring Judge Judy Sheindlin,\
    \ which earned a Daytime Emmy. Freevee also premiered three new Original series—\n\
    Bosch: Legacy, one of the 10 most-streamed shows across all services in May, according\
    \ to streaming hub Reelgood;\ncrime drama Troppo; and home-renovation series Hollywood\
    \ Houselift with Jeff Lewis—and one Original film, Love\nAccidentally.\n\n•\n\n\
    Prime Video Channels expanded its portfolio to offer more premium Spanish-language\
    \ content with the addition of\nVix+, TelevisaUnivisions’ streaming service. Prime\
    \ Video Channels offer customers additional paid subscriptions to\nthird-party\
    \ premium networks and other streaming entertainment channels, such as discovery+,\
    \ Paramount+, AMC+,\nGlobo, BET+, NBA League Pass, MLB.TV, STARZ, and SHOWTIME.\n\
    \n•\n\nAmazon Music brought epic live performances to customers streaming on the\
    \ Amazon Music Twitch channel and on\nPrime Video, including performances from\
    \ global superstars Maluma and Carrie Underwood, as well as Pharrell\nWilliams’\
    \ Something In The Water festival, which featured Tyler The Creator, Jon Batiste,\
    \ Pusha T, and Pharrell\nWilliams.\n\n•\n\nAmazon’s podcast streaming service,\
    \ Wondery, partnered with Dolby Atmos, an audio technology provider, to\nbecome\
    \ the first such service in the U.S. to deliver immersive audio. Dolby Atmos-enabled\
    \ titles will be available to\n\n\fstream exclusively on the Wondery+ subscription\
    \ service in 30 countries. Wondery also brought more original content\nto its\
    \ global audience, including local-language translations of the investigative\
    \ series Harsh Reality: The Story of\nMiriam Rivera; Business Wars in Spain and\
    \ Italy; and original dating show Queen of Hearts worldwide.\n•\n\nAudible signed\
    \ a deal with President Barack Obama and Michelle Obama’s production company,\
    \ Higher Ground, to\ncreate a slate of Audible shows. This new partnership reflects\
    \ the companies’ shared mission to tell meaningful and\nentertaining stories that\
    \ elevate diverse voices and experiences.\n\nDevices and Services\n•\n\nAutomakers\
    \ continue to launch Alexa integrations in new vehicle models, including the 2023\
    \ Acura Integra, 2023 GM\nEquinox, and 2022 Lucid Air. With Alexa Built-in, customers\
    \ can ask Alexa to navigate, play music and audiobooks,\nshare the news, check\
    \ the weather, control smart home devices, pay for gas, and find parking. Customers\
    \ can also\nremotely control their vehicle from home by asking Alexa to lock or\
    \ unlock the car doors, check gas levels or charging\nrange, and start or stop\
    \ the engine. These automakers join other companies with existing integrations\
    \ such as Audi,\nBMW, Chrysler, Ford, GM, Jaguar-Land Rover, Jeep, Mahindra, Rivian,\
    \ and Volkswagen.\n\n•\n\nAmazon added new features to Alexa Together, a service\
    \ that helps aging family members feel more comfortable and\nconfident living\
    \ independently. Up to 10 caregivers can remotely support their aging loved one’s\
    \ Alexa devices from\nafar with the Circle of Support feature, and the Remote\
    \ Assist feature allows caregivers to remotely set up Alexa\nRoutines, such as\
    \ locking the door and turning off the lights at a certain time of night.\n\n\
    •\n\nAmazon launched new features to make Alexa smarter, more proactive, and more\
    \ personal. Customers can now opt in\nto receive proactive notifications from\
    \ Alexa about their favorite sports team, weather updates in their area, and when\n\
    it’s time to refill their prescriptions. Additionally, Call Captioning, which\
    \ shows captions on Echo Show devices\nduring Alexa video calls, now supports\
    \ Spanish, French, and Portuguese.\n\n•\n\nAmazon now has over 1 million registered\
    \ developers, brands, and device makers building with Alexa. The company\ncontinues\
    \ to invent new ways for these builders to increase revenue and customer engagement,\
    \ including the Alexa\nRoutines Kit, which enables developers to configure and\
    \ offer Alexa Routines to customers when they interact with a\nskill. For example,\
    \ developers can integrate their skills into a customer’s morning routine, along\
    \ with other Alexa\nexperiences like smart home controls and music.\n\n•\n\nAmazon\
    \ introduced the next generation of Fire 7 and Fire 7 Kids, bringing more speed,\
    \ performance, and value to the\ncompany’s most popular and affordable tablet.\n\
    \n•\n\nAmazon introduced new smart TVs with Fire TV built-in from Hisense and\
    \ Xiaomi. With Fire TV built-in, customers\nget a content-driven viewing experience,\
    \ a simple and intuitive user interface, Alexa, and hands-free TV control.\n\n\
    •\n\nBlink launched the first Blink Video Doorbell in France, Germany, Italy,\
    \ the Netherlands, Spain, and the UK.\n\nAmazon Web Services\n•\n\nAWS continues\
    \ to be the most broadly adopted set of cloud infrastructure services and announced\
    \ new commitments\nand migrations from customers across many industries and geographies.\n\
    •\n\nTravel and hospitality: Delta Air Lines selected AWS as preferred cloud provider\
    \ to accelerate its digital\nbusiness transformation and reimagine the travel\
    \ experience. Using AWS, Delta will deliver new digital\ntravel services, streamline\
    \ its operations, enhance customer service from the booking process to the flight\n\
    experience, and provide cloud training to employees globally.\n\n•\n\nMedia and\
    \ entertainment: Riot Games and AWS have teamed up to bring AWS’s data analytics\
    \ integration\nto esports broadcasts for the first time, through Riot’s League\
    \ of Legends, VALORANT, and League of\nLegends: Wild Rift esports leagues. AWS\
    \ will also power Riot’s new cloud-first remote broadcast centers,\nwhich will\
    \ support Riot’s current and future ambitions to reimagine entertainment experiences\
    \ for billions of\nfans worldwide.\n\n•\n\nTelecommunications: The UK’s largest\
    \ telecommunications company, BT, selected AWS as preferred cloud\nprovider to\
    \ transform legacy infrastructure and internal applications to a new cloud-first\
    \ architecture. This\nwill simplify BT’s current information technology (IT) footprint,\
    \ enabling it to more rapidly serve customers\nand reducing costs in IT maintenance.\n\
    \n•\n\nFinancial services: Investment banking firm Jefferies will migrate all\
    \ its IT systems to AWS, including\ninternal and customer-facing applications,\
    \ IT resources, and companywide data, as it looks to modernize its\ntechnology\
    \ infrastructure, accelerate new digital services, realize operational efficiencies,\
    \ and increase\nsecurity and reliability.\n\n\f•\n\n•\n\n•\n\n•\n\nHealth care\
    \ and life sciences: Health and wellness organization Geisinger selected AWS as\
    \ its strategic cloud\nprovider. Geisinger will migrate its entire digital portfolio\
    \ of more than 400 applications and numerous\nworkflows to AWS, which will enable\
    \ lifesaving technologies and save Geisinger several million dollars\nannually.\n\
    \n•\n\nManufacturing: Sweden-based SKF, the leading manufacturer of bearings,\
    \ collaborated with AWS to launch\na fully automated, condition-monitoring solution\
    \ for industrial machine reliability and predictive\nmaintenance. This helps manufacturers\
    \ monitor equipment, detect anomalies, and avoid unexpected machine\nfailures\
    \ in their facilities.\n\n•\n\nEnergy: Italian multinational energy company Eni\
    \ worked with AWS to integrate its proprietary data\nplatform XWARE with the built-for-the-cloud\
    \ Open Subsurface Data Universe on AWS to increase\ninteroperability between applications,\
    \ enabling accelerated data exchange, enhanced security, and deeper\ninsights.\
    \ Using AWS’s machine learning, business intelligence, and storage capabilities,\
    \ Australia’s Electric\nMine Consortium built the world’s first mining data platform\
    \ for the creation of a cleaner, more electrified\nfuture in mining. The platform\
    \ will drive decarbonization among mining companies, accelerate the\nelectrification\
    \ of mine sites at scale, and capture real-time information on mine decarbonization\
    \ globally.\n\nAWS added to its more than 200 products and services to help customers\
    \ lower costs, increase agility, and innovate\nfaster.\n•\n\nAWS continues to\
    \ innovate in generalized central processing units (CPUs) and announced the general\n\
    availability of Amazon Elastic Compute Cloud (Amazon EC2) C7g instances, the next\
    \ generation of\ncompute-optimized instances powered by AWS-designed Graviton3\
    \ processors. Graviton3 processors provide\nup to 25% better performance for compute-intensive\
    \ applications than C6g instances powered by AWS\nGraviton2 processors, which\
    \ deliver up to 40% better price performance over comparable current generation\n\
    x86-based instances. Graviton3 processors also use up to 60% less energy for the\
    \ same performance than\ncomparable EC2 instances.\n\n•\n\nAWS continues to transform\
    \ how customers perform analytics by offering serverless options for Amazon\n\
    Redshift, Amazon Managed Streaming for Apache Kafka (Amazon MSK), and Amazon EMR.\
    \ Serverless\noptions take the guesswork out of configuring infrastructure at\
    \ any scale, so enterprises can expand the use of\nanalytics in their organizations\
    \ without needing to configure, scale, or manage the underlying infrastructure.\n\
    \n•\n\nAWS announced the general availability of AWS Mainframe Modernization,\
    \ as it further expands support for\nevery type of workload. AWS Mainframe Modernization\
    \ makes it faster and easier for customers to\nmodernize mainframe-based workloads\
    \ by moving them to the cloud, with no upfront costs or underlying\ninfrastructure\
    \ to manage.\n\n•\n\nAWS announced the general availability of AWS Cloud WAN,\
    \ a managed wide area network service that\nmakes it faster and easier to build,\
    \ manage, and monitor a unified network that spans multiple locations and\nseamlessly\
    \ connects cloud and on-premises environments. AWS Cloud WAN connects data centers,\
    \ branch\noffices, and cloud resources into a single, centrally managed network\
    \ that reduces operational cost and\ncomplexity while improving network health,\
    \ performance, and security, so enterprises can remove the need to\nindividually\
    \ configure and manage multiple networks using different technologies.\n\nAWS\
    \ strengthened its partner network of more than 100,000 systems integrators and\
    \ independent software vendors\nfrom around the world that adapt their technology\
    \ to run on or integrate with AWS.\n•\n\nIBM expanded its relationship with AWS\
    \ and will offer its software catalog as-a-Service (SaaS) on AWS,\nproviding customers\
    \ quick and easy access to IBM’s automation, data and AI, security, and sustainability\n\
    software.\n\n•\n\nAWS was named MongoDB’s 2022 Cloud (Co-Sell) Partner of the\
    \ Year for jointly winning new deals and\nhelping customers modernize around the\
    \ world.\n\n•\n\nAWS was named Splunk’s 2022 Global Cloud Partner of the Year\
    \ and announced a new Customer\nImmersion Experience Center in Splunk’s London\
    \ office to demonstrate the benefit that data and digital\ntransformation can\
    \ have on innovation and cost reduction.\n\nAWS announced that it remotely operated\
    \ an AWS Snowcone, an ultra-portable data transfer and edge computing\ndevice,\
    \ on the International Space Station to process data on orbit for the first time\
    \ as part of a private Axiom Space\nmission. The portable data storage and transfer\
    \ device processed photos from onboard research experiments and\noptimized the\
    \ limited bandwidth available between the space station and Earth. The operation\
    \ showed that it is\n\n\fpossible to extend AWS’s cloud computing hardware to\
    \ space and will allow AWS to better support future customer\nspace missions.\n\
    •\n\nAWS and Amazon Ads launched Amazon Marketing Cloud (AMC) Insights on AWS.\
    \ The new solution helps\nadvertisers and agencies easily use AWS services when\
    \ running Amazon Ads campaigns to analyze and generate\nreporting from the Amazon\
    \ Marketing Cloud API, reducing their development time from weeks to hours. With\
    \ a few\nclicks, AMC users can monitor ongoing ad campaign performance across\
    \ reach, frequency, geography, audience, and\ndevice type to better understand\
    \ how to maximize ad spend.\n\nInvesting in Employees and Our Workplace\n•\n\n\
    In the first six months of 2022, more than 25,000 employees worldwide joined Amazon’s\
    \ Career Choice program—\ntaking advantage of benefits such as fully funded college\
    \ tuition, new industry certifications, courses to improve\nEnglish language proficiency,\
    \ and high school completion programs. Since 2012, more than 80,000 employees\
    \ have\nparticipated in Career Choice, one of nine upskilling programs offered\
    \ by Amazon as part of its $1.2 billion\ncommitment to upskill more than 300,000\
    \ Amazon employees by 2025.\n\n•\n\nMore than 90 companies, including Cummins,\
    \ John Deere, The Boeing Company, and United Airlines, have joined\nAmazon and\
    \ the National Safety Council (NSC) in a first-of-its kind pledge to reduce musculoskeletal\
    \ disorders\n(MSDs), the most common workplace injury, by 25% by 2025. The pledge\
    \ is part of the five-year partnership between\nAmazon and the NSC to reduce MSDs\
    \ and improve workplace safety for millions of workers worldwide.\n\n•\n\nAmazon\
    \ is testing new robotic technologies to create a safer workplace for employees\
    \ and improve the customer\nexperience.\n•\n\nProteus, Amazon’s first fully autonomous\
    \ mobile robot, uses advanced safety, perception, and navigation\ntechnology developed\
    \ by Amazon to move objects through the company’s operation facilities. Proteus\n\
    navigates around employees—meaning it does not need to be confined to restricted\
    \ areas.\n\n•\n\nCardinal is a robotic workcell that uses advanced artificial\
    \ intelligence (AI) and computer vision to handle\nlifting and turning of large\
    \ or heavy packages and complicated packing in a confined space.\n\n•\n\nAmazon\
    \ Robotics Identification is an AI-powered scanning capability that was developed\
    \ based on employee\nfeedback. It uses innovative computer vision and machine\
    \ learning technology to enable easier scanning of\npackages in facilities.\n\n\
    •\n\nContainerized Storage System is a robotic system that delivers products to\
    \ employees in a more\nergonomically friendly manner, reducing the need for employees\
    \ to reach up, bend down, or climb ladders\nwhen retrieving items.\n\n•\n\nAmazon\
    \ was named No. 1 on LinkedIn’s Top Companies in Retail, a new list that ranks\
    \ the industry’s 25 best U.S.\ncompanies to grow a career in, based on LinkedIn’s\
    \ data. LinkedIn highlighted Amazon’s benefits, such as up to 20\nweeks of fully\
    \ paid leave for new and expectant parents, weekly pay, and various apprenticeship\
    \ and certification\nopportunities.\n\n•\n\nFor the fifth year in a row, Amazon\
    \ was included on the Disability Equality Index’s Best Places to Work for Disability\n\
    Inclusion.\n\n•\n\nThroughout the month of June, Amazon celebrated “Pride Out\
    \ Loud” by amplifying the stories and lives of\nLGBTQIA+ employees, customers,\
    \ and communities across the business. From operations to entertainment, the\n\
    company supported more than 95 employee events around the world, sponsored local\
    \ Pride celebrations in cities across\nthe U.S., and donated to organizations\
    \ that impact the lives of LGBTQIA+ youth.\n\n•\n\nIn celebration of Juneteenth,\
    \ Amazon launched a comprehensive inclusive learning campaign for Amazon employees\n\
    worldwide, featuring diversity, equity, and inclusion resources, programs and\
    \ events, and interactive learning\nexperiences, including a sit-down with Dr.\
    \ Russell Wigginton, the president of the National Civil Rights Museum.\n\n•\n\
    \nAmazon launched its latest employee learning and development program, Day 1\
    \ Manager Onboarding, to accelerate\nnew people-managers’ growth and development.\
    \ The personalized learning program helps managers strengthen their\nunderstanding\
    \ of Amazon’s culture, support employee career growth, and build high-performing\
    \ teams through\ncoursework on topics such as how to use leadership principles\
    \ when making decisions and in common management\nscenarios.\n\n\fSupporting Communities,\
    \ Selling Partners, and the Economy\n•\n\nAmazon continues to support individuals\
    \ and organizations impacted by the war in Ukraine. AWS is helping Ukraine\nbuild\
    \ up cybersecurity defenses and has already migrated 10 petabytes (10 million\
    \ gigabytes) of essential data to the\ncloud from 27 Ukrainian ministries, 18\
    \ Ukrainian universities, the country’s largest remote learning K–12 school, and\n\
    dozens of private-sector companies like PrivatBank, which serves 40% of the Ukrainian\
    \ population and worked with\nAWS to securely migrate all its operations to the\
    \ cloud in less than 45 days. President Volodymyr Zelenskyy awarded\nAWS the Ukraine\
    \ Peace Prize for preserving the country’s digital infrastructure by migrating\
    \ state registries and\ncritical databases to AWS. Since the start of the war,\
    \ Amazon has donated more than 2 million products to over 45\norganizations supporting\
    \ refugees, including 200,000 hygiene kits packed by Amazon employees around the\
    \ world.\n\n•\n\nIn partnership with Welcome.US and resettlement agencies across\
    \ the U.S., Amazon created the Welcome Essentials\ninitiative using Amazon’s logistics\
    \ expertise and product selection to offer refugee families free delivery of essential\n\
    products, like furniture and household items, to help more than 1,000 families\
    \ resettling in more than 40 cities in the\nU.S. this year. On top of this logistics\
    \ support, Amazon has committed $2 million in donations of essential products\
    \ to\nsupporting partners.\n\n•\n\nAmazon doubled the capacity of its Humanitarian\
    \ Relief Hub in Atlanta to 1 million critical relief supplies that are\nready\
    \ to ship to communities in the Gulf Coast, the Caribbean, and Central America\
    \ that have been affected by natural\ndisasters. The facility has 20,000 cubic\
    \ feet of storage space dedicated to relief items, and Amazon works with\nhumanitarian\
    \ partners around the world to deploy essential supplies when a disaster strikes,\
    \ using Amazon’s global\nlogistics network. Since 2017, Amazon has provided more\
    \ than 18 million items to support relief partners worldwide\nduring 81 natural\
    \ disasters.\n\n•\n\nWith $96 million in cash donations to more than 180 organizations,\
    \ Amazon was recognized by the Puget Sound\nBusiness Journal as the top corporate\
    \ philanthropist in its home state of Washington. These contributions were part\
    \ of\nAmazon’s total global donations of more than $360 million last year.\n\n\
    •\n\nAmazon was awarded the Defender of Innocence Award by the Mid-Atlantic Innocence\
    \ Project. This award\nrecognized Amazon’s legal department for its pro bono work\
    \ to prevent and correct the conviction of innocent people\nin Maryland, Virginia,\
    \ and Washington, D.C. Over the past few years, 120 Amazon lawyers in more than\
    \ 14 countries\nhave spent hundreds of hours screening, evaluating, and litigating\
    \ cases for the organization—more time, people, and\nresources than any other\
    \ company or law firm.\n\n•\n\nAmazon announced additional investments in affordable\
    \ housing projects in its hometown communities through the\nAmazon Housing Equity\
    \ Fund’s $2 billion commitment. The Fund invested more than $30 million to create\
    \ and\npreserve 705 affordable homes in Nashville, Tennessee, and in Seattle.\
    \ The projects are in neighborhoods facing\nincreasing rents and displacement\
    \ pressures, and five out of the six investments are with local minority-led\n\
    organizations. Since the launch of the Fund in 2021, Amazon has created or preserved\
    \ over 8,000 affordable homes,\nincreasing the affordable housing inventory in\
    \ Bellevue, Washington, and Arlington, Virginia, by at least 20% in one\nyear.\n\
    \n•\n\nIn India, Amazon raised its pledge to now enable $20 billion in cumulative\
    \ exports by 2025. Since launching in 2015,\nAmazon’s Global Selling program has\
    \ grown to more than 100,000 exporters that are showcasing millions of Made in\n\
    India products to customers worldwide through Amazon’s store. Indian exporters\
    \ are on track to surpass $5 billion in\ncumulative exports. In Italy, Amazon\
    \ announced a new pledge to help the more than 18,000 small and medium-sized\n\
    businesses selling on Amazon reach €1.2 billion in annual export sales by 2025.\
    \ This pledge will support the\nobjectives of the Italian government’s National\
    \ Recovery and Resilience Plan while ensuring a wider availability of\noriginal\
    \ Italian products to customers worldwide.\n\n•\n\nIn India, Amazon launched Smart\
    \ Commerce, a new initiative to further digitize local retail stores by enabling\
    \ them to\ncreate customized online storefronts and provide an enhanced in-store\
    \ shopping experience. Stores of any size will\nnow take advantage of Amazon’s\
    \ shopping innovations, logistics, and digital payments to provide a reliable\
    \ and\ntrustworthy experience for customers in store, directly through their dedicated\
    \ online storefronts or on Amazon.in.\nThere are more than 150,000 local stores\
    \ already selling on Amazon.in, and Amazon is committed to digitizing 10\nmillion\
    \ small businesses, including local stores, by 2025.\n\n•\n\nAWS announced that\
    \ it selected 34 startups to receive funding and guidance across three accelerators\
    \ in Sustainable\nCities, Space, and Clean Energy. Each startup is eligible to\
    \ receive technical guidance, business development and\nstrategy support, collaboration\
    \ opportunities with AWS customers and members of the AWS Partner Network, and\
    \ up\nto $100,000 in AWS promotional credits.\n\n\fProtecting the Planet\n•\n\n\
    In the U.S., Amazon started making customer deliveries with its custom Rivian\
    \ electric delivery vehicles (EDVs). This\nrollout is the start of what Amazon\
    \ plans to be thousands of EDVs in more than 100 cities by the end of 2022—and\n\
    100,000 EDVs across the U.S. by 2030. In India, Amazon signed an agreement with\
    \ Tata Motors to include the new\nTata Ace electric vehicle as part of Amazon’s\
    \ delivery fleet. The new EDV was co-developed with Amazon and will\ncontribute\
    \ to the company’s goal of having 10,000 EDVs on the road in India by 2025. In\
    \ the UK, Amazon announced\nthe launch of its first micromobility hub for more\
    \ sustainable deliveries in central London. E-cargo bikes and walkers\nfrom the\
    \ new hub, along with Amazon’s electric fleet already on London’s roads, will\
    \ make over 5 million deliveries a\nyear across more than 10% of London’s Ultra\
    \ Low Emission Zone.\n\n•\n\nAmazon’s Climate Pledge Fund made new investments\
    \ in Electric Hydrogen and Sunfire, two developers of\nelectrolyzer technologies.\
    \ Electrolyzer technology makes green hydrogen using water and renewable electricity.\
    \ The\nFund has announced investments in 18 companies to date as part of its mission\
    \ to invest in visionary companies whose\nproducts and solutions will facilitate\
    \ the transition to a low-carbon economy.\n\n•\n\nThe Climate Pledge announced\
    \ a collaboration with the National Geographic Society to fund 15 National Geographic\n\
    Explorers as they document the global climate crisis as part of the Society’s\
    \ Global Storytellers Fund. The\ncollaboration will advance early career and established\
    \ storytellers—including photographers, writers, and filmmakers\n—with the funding,\
    \ training, and exposure necessary to help inspire global audiences and drive\
    \ urgent action against\nthe climate crisis.\n\nFinancial Guidance\nThe following\
    \ forward-looking statements reflect Amazon.com’s expectations as of July 28,\
    \ 2022, and are subject to substantial\nuncertainty. Our results are inherently\
    \ unpredictable and may be materially affected by many factors, such as uncertainty\n\
    regarding the impacts of the COVID-19 pandemic, fluctuations in foreign exchange\
    \ rates, changes in global economic\nconditions and customer demand and spending,\
    \ inflation, regional labor market and global supply chain constraints, world\n\
    events, the rate of growth of the Internet, online commerce, and cloud services,\
    \ and the various factors detailed below. This\nguidance reflects our estimates\
    \ as of July 28, 2022 regarding the impacts of the COVID-19 pandemic on our operations\
    \ as well\nas the effect of other factors discussed above.\nThird Quarter 2022\
    \ Guidance\n•\n•\n•\n\nNet sales are expected to be between $125.0 billion and\
    \ $130.0 billion, or to grow between 13% and 17% compared\nwith third quarter\
    \ 2021. This guidance anticipates an unfavorable impact of approximately 390 basis\
    \ points from\nforeign exchange rates.\nOperating income is expected to be between\
    \ $0 and $3.5 billion, compared with $4.9 billion in third quarter 2021.\nThis\
    \ guidance assumes, among other things, that no additional business acquisitions,\
    \ restructurings, or legal\nsettlements are concluded.\n\nA conference call will\
    \ be webcast live today at 2:30 p.m. PT/5:30 p.m. ET, and will be available for\
    \ at least three months at\namazon.com/ir. This call will contain forward-looking\
    \ statements and other material information regarding the Company’s\nfinancial\
    \ and operating results.\nThese forward-looking statements are inherently difficult\
    \ to predict. Actual results and outcomes could differ materially for a\nvariety\
    \ of reasons, including, in addition to the factors discussed above, the amount\
    \ that Amazon.com invests in new business\nopportunities and the timing of those\
    \ investments, the mix of products and services sold to customers, the mix of\
    \ net sales\nderived from products as compared with services, the extent to which\
    \ we owe income or other taxes, competition, management\nof growth, potential\
    \ fluctuations in operating results, international growth and expansion, the outcomes\
    \ of claims, litigation,\ngovernment investigations, and other proceedings, fulfillment,\
    \ sortation, delivery, and data center optimization, risks of\ninventory management,\
    \ variability in demand, the degree to which the Company enters into, maintains,\
    \ and develops\ncommercial agreements, proposed and completed acquisitions and\
    \ strategic transactions, payments risks, and risks of\nfulfillment throughput\
    \ and productivity. Other risks and uncertainties include, among others, risks\
    \ related to new products,\nservices, and technologies, system interruptions,\
    \ government regulation and taxation, and fraud. In addition, global economic\n\
    conditions and additional or unforeseen effects from the COVID-19 pandemic amplify\
    \ many of these risks. More information\nabout factors that potentially could\
    \ affect Amazon.com’s financial results is included in Amazon.com’s filings with\
    \ the\nSecurities and Exchange Commission (“SEC”), including its most recent Annual\
    \ Report on Form 10-K and subsequent filings.\n\n\fOur investor relations website\
    \ is amazon.com/ir and we encourage investors to use it as a way of easily finding\
    \ information\nabout us. We promptly make available on this website, free of charge,\
    \ the reports that we file or furnish with the SEC, corporate\ngovernance information\
    \ (including our Code of Business Conduct and Ethics), and select press releases,\
    \ which may contain\nmaterial information about us, and you may subscribe to be\
    \ notified of new information posted to this site.\nAbout Amazon\nAmazon is guided\
    \ by four principles: customer obsession rather than competitor focus, passion\
    \ for invention, commitment to\noperational excellence, and long-term thinking.\
    \ Amazon strives to be Earth’s Most Customer-Centric Company, Earth’s Best\nEmployer,\
    \ and Earth’s Safest Place to Work. Customer reviews, 1-Click shopping, personalized\
    \ recommendations, Prime,\nFulfillment by Amazon, AWS, Kindle Direct Publishing,\
    \ Kindle, Career Choice, Fire tablets, Fire TV, Amazon Echo, Alexa,\nJust Walk\
    \ Out technology, Amazon Studios, and The Climate Pledge are some of the things\
    \ pioneered by Amazon. For more\ninformation, visit amazon.com/about and follow\
    \ @AmazonNews."
