  label: Amazon Q1 2021 Earnings Release, April 29, 2021
  text: "AMAZON.COM ANNOUNCES FIRST QUARTER RESULTS\n\nSEATTLE—(BUSINESS WIRE) April\
    \ 29, 2021—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its first quarter ended March 31, 2021.\n•\n\nOperating cash flow increased\
    \ 69% to $67.2 billion for the trailing twelve months, compared with $39.7 billion\
    \ for\nthe trailing twelve months ended March 31, 2020.\n\n•\n\nFree cash flow\
    \ increased to $26.4 billion for the trailing twelve months, compared with $24.3\
    \ billion for the trailing\ntwelve months ended March 31, 2020.\n\n•\n\nFree cash\
    \ flow less principal repayments of finance leases and financing obligations increased\
    \ to $14.9 billion for\nthe trailing twelve months, compared with $14.3 billion\
    \ for the trailing twelve months ended March 31, 2020.\n\n•\n\nFree cash flow\
    \ less equipment finance leases and principal repayments of all other finance\
    \ leases and financing\nobligations increased to $16.8 billion for the trailing\
    \ twelve months, compared with $11.7 billion for the trailing\ntwelve months ended\
    \ March 31, 2020.\n\n•\n\nCommon shares outstanding plus shares underlying stock-based\
    \ awards totaled 519 million on March 31, 2021,\ncompared with 513 million one\
    \ year ago.\n\n•\n\nNet sales increased 44% to $108.5 billion in the first quarter,\
    \ compared with $75.5 billion in first quarter 2020.\nExcluding the $2.1 billion\
    \ favorable impact from year-over-year changes in foreign exchange rates throughout\
    \ the\nquarter, net sales increased 41% compared with first quarter 2020.\n\n\
    •\n\nOperating income increased to $8.9 billion in the first quarter, compared\
    \ with operating income of $4.0 billion in first\nquarter 2020.\n\n•\n\nNet income\
    \ increased to $8.1 billion in the first quarter, or $15.79 per diluted share,\
    \ compared with net income of $2.5\nbillion, or $5.01 per diluted share, in first\
    \ quarter 2020.\n\n“Two of our kids are now 10 and 15 years old—and after years\
    \ of being nurtured, they’re growing up fast and coming into their\nown,” said\
    \ Jeff Bezos, Amazon founder and CEO. “As Prime Video turns 10, over 175 million\
    \ Prime members have streamed\nshows and movies in the past year, and streaming\
    \ hours are up more than 70% year over year. Amazon Studios received a\nrecord\
    \ 12 Academy Award nominations and two wins. Upcoming originals include Tom Clancy’s\
    \ Without Remorse, The\nTomorrow War, The Underground Railroad, and much more.\
    \ In just 15 years, AWS has become a $54 billion annual sales run\nrate business\
    \ competing against the world’s largest technology companies, and its growth is\
    \ accelerating—up 32% year over\nyear. Companies from Airbnb to McDonald’s to\
    \ Volkswagen come to AWS because we offer what is by far the broadest set of\n\
    tools and services available, and we continue to invent relentlessly on their\
    \ behalf. We love Prime Video and AWS, and we’re\nproud to have them in the family.”\n\
    \n\fHighlights\nOur Vision to be Earth’s Best Employer and Earth’s Safest Place\
    \ to Work\n•\n\nAmazon ranked #1 in the U.S. on LinkedIn’s 2021 Top Companies,\
    \ an annual list identifying the most sought-after\nplaces to work based on their\
    \ ability to attract and retain the best talent, including promotions, opportunities\
    \ for\nemployees to learn new skills, hiring people from all backgrounds and levels\
    \ of education, and gender diversity. In\naddition, Amazon ranked #2 on the Fortune\
    \ World’s Most Admired Companies list and #3 on Boston Consulting\nGroup’s Most\
    \ Innovative Companies list.\n\n•\n\nIn partnership with government and public\
    \ health officials across the globe, Amazon is rapidly expanding on-site\nCOVID-19\
    \ vaccination programs for its front-line employees and contractors. In addition\
    \ to offering COVID-19\ntesting on-site, Amazon has hosted vaccination events\
    \ at fulfillment centers, sort centers, delivery stations, and AWS\ndata centers\
    \ in 29 states, reaching more than 300,000 front-line employees and contractors.\
    \ In some locations, Amazon\nopened the vaccination program to employee household\
    \ members. Given the vaccination program’s progress in the\nU.S., it will soon\
    \ expand to front-line employees in other countries.\n\n•\n\nAmazon is committed\
    \ to leading the way for workplaces around the world to proactively manage—and\
    \ prevent—\nwork-related musculoskeletal disorders (MSDs) by drawing on expertise\
    \ in innovation and technology, and\ncollaborating with proven thought leaders\
    \ and scientists. MSDs are common in the type of work done in warehouse\noperations\
    \ and are more likely to occur during an employee’s first six months. Amazon’s\
    \ increased attention to early\nMSD prevention is already achieving results. From\
    \ 2019 to 2020, overall MSDs decreased by 32% and MSDs\nresulting in time away\
    \ from work decreased by more than half.\n\n•\n\nAmazon is expanding its workplace\
    \ health and safety program WorkingWell with the aim of cutting recordable\nincident\
    \ rates by 50% by 2025. WorkingWell is currently available to 859,000 employees\
    \ at 350 sites across North\nAmerica and Europe. Through the program, small groups\
    \ of employees are coached on body mechanics, proactive\nwellness, and safety.\
    \ In addition to reducing workplace injuries, these concepts have a positive impact\
    \ on regular dayto-day activities and have contributed to reducing MSD recordable\
    \ incident rates.\n\n•\n\nSince 2020, in partnership with Crossover Health, Amazon\
    \ opened 17 neighborhood health centers for employees and\ntheir families in the\
    \ areas around Dallas–Fort Worth, Texas; Detroit, Michigan; Louisville, Kentucky;\
    \ Phoenix,\nArizona; and San Bernardino, California. Centers are located next\
    \ to where employees live and work to provide\naffordable, convenient, and high\
    \ quality health care, and patients report a 90% satisfaction score. Amazon is\
    \ evaluating\nexpansion of the program so that even more employees can access\
    \ quality care whenever, and wherever, they need it.\n\n•\n\nAmazon is fitting\
    \ delivery vehicles with camera safety technology and artificial intelligence\
    \ to capture real-time data\n(such as following safe distance and road conditions)\
    \ to identify at-risk driving events. These technologies are used to\nhelp keep\
    \ drivers and the communities where Amazon delivers safe. When this technology\
    \ was piloted in 2020 on over\ntwo million miles of delivery routes, crashes decreased\
    \ 48%, stop sign violations decreased 20%, driving without a\nseatbelt decreased\
    \ 60%, and distracted driving decreased 45%.\n\n•\n\nAmazon shared comprehensive\
    \ companywide goals related to diversity, equity, and inclusion efforts for 2021.\
    \ Goals\ninclude increasing representation of women in tech and science roles,\
    \ doubling the number of Black directors and VPs\nfor the second year in a row,\
    \ and having 100% of Amazon employees take inclusion training. In addition, to\
    \ evaluate\nprogress over time, Amazon increased the amount and specificity of\
    \ the data shared publicly about its employees. The\nexpanded dataset includes\
    \ representation by job type, such as front-line associates and corporate employees,\
    \ and\nexpands historical data to the past three years.\n\n•\n\nAmazon pulled\
    \ forward its annual fall pay review for its U.S. Customer Fulfillment, Delivery,\
    \ Package Sortation, and\nSpecialty Fulfillment teams, and will be rolling out\
    \ increases from mid-May through early June. More than 500,000\npeople will see\
    \ an increase between at least 50 cents and $3 an hour, which is an investment\
    \ of over $1 billion in\nincremental pay for these employees.\n\n\f•\n\nIn India,\
    \ Amazon announced it has added nearly 300,000 new direct and indirect jobs since\
    \ its last announcement in\nJanuary 2020, putting the company on track to meet\
    \ its pledge to create an additional one million new jobs in India by\n2025.\n\
    \nSupporting Communities\n•\n\nAmazon donated and delivered relief and emergency\
    \ aid supplies—including over one million bottles of water and\nthousands of items\
    \ such as flashlights, tents, and search and rescue equipment—to communities impacted\
    \ by the\nwinter storm crisis in Texas and Mississippi in February and severe\
    \ storms in Tennessee and Alabama in March.\n\n•\n\nAmazon Future Engineer, the\
    \ company’s computer science education program for students from underserved\n\
    communities, launched in France and Canada. With this expansion, the program now\
    \ reaches over one million students\nglobally each year. Amazon Future Engineer\
    \ also donated $15 million to Code.org to develop a new equity-minded\nAdvanced\
    \ Placement computer science curriculum, which aims to increase access, participation,\
    \ and long-term\nsuccess for high school students from communities underrepresented\
    \ in tech.\n\n•\n\nAmazon announced a year-long partnership with The King Memorial\
    \ Foundation, the organization responsible for\nbuilding and maintaining the Martin\
    \ Luther King, Jr. Memorial in Washington, D.C. Over the next year, AWS will\n\
    support the Memorial Foundation’s Social Justice Fellows Program, which aims to\
    \ help program participants develop\ntheir professional skills by providing them\
    \ with mentorship opportunities with Amazon employees, as well as free\ncloud\
    \ and STEM training and certification. For the partnership kick-off, Amazon joined\
    \ the Foundation in a Day of\nService project, delivering essential, personal\
    \ care items to shelters in seven D.C. wards.\n\n•\n\nSince January, Amazon has\
    \ opened its Seattle campus to Virginia Mason Franciscan Health for public COVID-19\n\
    vaccinations. As of April 15, nearly 50,000 immunizations have been administered\
    \ to the public through weekend popup clinics staffed by Amazon and community\
    \ volunteers. Amazon is also providing volunteers and technology to\nsupport the\
    \ Washington State vaccine call center. Since the initiative launched in late\
    \ March, the system has processed\nover 100,000 calls and has eliminated wait\
    \ times.\n\n•\n\nAmazon continued its efforts to support children in need across\
    \ Europe during the COVID-19 pandemic. In the UK,\nAmazon donated 10,000 Fire\
    \ tablets to schools lacking technology and delivered more than four million breakfasts\
    \ to\nchildren in need through charity partner Magic Breakfast. In Italy and Spain,\
    \ Amazon donated millions of euros to\nover 35,000 schools through a program that\
    \ allows customers to choose the schools to which Amazon will donate.\n\n•\n\n\
    Since 2019, Amazon has worked with the U.S. Department of Agriculture and state\
    \ agencies to ensure customers in\nnearly all 50 states can shop for groceries\
    \ on Amazon using Supplemental Nutrition Assistance Program (SNAP)\nbenefits.\
    \ Amazon remains committed to increasing food access in the U.S.—especially in\
    \ healthy food priority areas—\nand is helping raise awareness among residents\
    \ about the convenient, safe, and affordably priced grocery delivery\noptions\
    \ Amazon offers their communities. As part of its ongoing work to increase food\
    \ access, Amazon is establishing\npartnerships with local anti-hunger organizations\
    \ to assist communities in need.\n\n•\n\nAmazon added new Alexa features to help\
    \ provide localized answers to questions on COVID-19 testing and vaccine\neligibility,\
    \ including the ability for customers to find and call nearby vaccine locations\
    \ for booking appointments.\n\n•\n\nRing announced a new community program with\
    \ Kids Off the Block, a Chicago-based nonprofit focused on providing\nlocal at-risk\
    \ youth a care center for personal growth and empowerment. Ring also donated 1,000\
    \ Ring Video Doorbells\nand Ring subscriptions to support families and individuals\
    \ in Chicago neighborhoods.\n\n•\n\nAmazon introduced the Alexa Hörfilm skill\
    \ in Germany, providing blind and visually-impaired customers with access\nto\
    \ more than 3,500 TV series and movies with audio description. The skill was developed\
    \ and built together with\nDBSV, the German association of blind or visually-impaired\
    \ persons, and participating TV stations ARD, ZDF, and\nARTE.\n\nThe Climate Pledge\n\
    •\n\nAmazon continues to make progress toward powering all its businesses with\
    \ 100% renewable energy by 2025—five\nyears ahead of the original target of 2030.\
    \ Amazon has announced a total of 206 renewable energy projects globally,\n\n\f\
    including 71 utility-scale wind and solar projects and 135 rooftop solar installations\
    \ at facilities and stores worldwide.\nAmazon is now the largest corporate purchaser\
    \ of renewable energy globally as well as in Europe, where the company\nis investing\
    \ in more than 2.5 gigawatts of renewable energy capacity—enough to power more\
    \ than two million homes\na year.\n•\n\nAmazon welcomed 52 new signatories to\
    \ The Climate Pledge, a commitment co-founded by Amazon and Global\nOptimism to\
    \ meet the goals of the Paris Agreement 10 years early and achieve net-zero carbon\
    \ by 2040. More than\n100 companies representing over $1.4 trillion in global\
    \ annual revenues and over five million employees have now\njoined the pledge,\
    \ sending an important signal to the market that there will be rapid growth in\
    \ demand for products and\nservices that help reduce carbon emissions. New signatories\
    \ include Alaska Airlines, Colgate-Palmolive, HEINEKEN,\nPepsiCo, Telefónica,\
    \ and Visa.\n\n•\n\nThe Climate Pledge Fund invested in Infinium, a renewable\
    \ electrofuels solution provider, and Turntide Technologies,\nan electric motor\
    \ company. These investments help Amazon and other companies meet the goals of\
    \ The Climate\nPledge as we all work together to protect the planet.\n\n•\n\n\
    Amazon announced a partnership with Mahindra Electric, a manufacturer of electric\
    \ vehicles (EVs), to deploy nearly\n100 Treo Zor electric vehicles in seven Indian\
    \ cities as part of Amazon India’s plan to include 10,000 EVs in its\ndelivery\
    \ fleet by 2025. These EVs are in addition to The Climate Pledge’s commitment\
    \ to have 100,000 EVs in\nAmazon’s delivery fleet by 2030.\n\nEmpowering Small\
    \ and Medium-Sized Businesses\n•\n\nIn recognition of International Women’s Day\
    \ and Women’s History Month, Amazon partnered with Diane von\nFurstenberg to help\
    \ empower more than 100 women-owned businesses by launching dedicated women-owned\
    \ small\nbusiness stores in the U.S. and a dozen other countries around the world,\
    \ making it easy for customers to discover and\nlearn about women-owned sellers\
    \ and shop from their selection of thousands of products. To help raise awareness\
    \ of\nwomen-owned businesses and support their success, von Furstenberg hosted\
    \ a virtual event on Amazon Live and\nshared her own experience and insights on\
    \ being an entrepreneur.\n\n•\n\nAmazon celebrated Black History Month by launching\
    \ a Black-owned small business store with products from thirdparty sellers, enabling\
    \ customers to discover and shop from Black business owners. Amazon also hosted\
    \ an Amazon\nLive event with celebrities and entrepreneurs Tia Mowry and Karamo\
    \ Brown during which Black Amazon sellers\nshared their insights about launching\
    \ and building a small business.\n\n•\n\nAmazon announced the Amazon Launchpad\
    \ Innovation Awards, a free competition designed to support emerging,\ninnovative\
    \ European startups. A judging panel will select five startups to each win a €10,000\
    \ grant and free access to\nAmazon Launchpad for one year. The “Startup of the\
    \ Year” winner will receive an additional €90,000 grant.\n\n•\n\nAmazon India\
    \ announced it has digitized 2.5 million small and medium-sized businesses, enabled\
    \ cumulative exports\nworth $3 billion, and announced the $250 million Amazon\
    \ Smbhav Venture Fund. The fund will encourage the best\nideas to digitize small\
    \ and medium-sized businesses, drive technology-led innovation in agriculture\
    \ to improve farmer\nproductivity, and enable healthcare access.\n\n•\n\nAmazon\
    \ India announced that more than 50,000 offline retailers and neighborhood stores\
    \ joined the Local Shops on\nAmazon program in its first year. It also committed\
    \ to bringing one million Local Shops online by 2025. Launched in\nApril 2020,\
    \ the Local Shops on Amazon program helps sellers sustain their livelihoods and\
    \ jumpstart their businesses.\n\nShopping\n•\n\nThere are now more than 200 million\
    \ paid Prime members worldwide. Members have exclusive access to deals every\n\
    day and especially during Prime Day, which will take place later in the second\
    \ quarter.\n\n•\n\nAmazon continues to innovate and invest in fast, free, and\
    \ convenient delivery for customers. In the U.S., Same-Day\nDelivery in as fast\
    \ as five hours is free on orders over $35 on over three million items in select\
    \ cities. This is in\naddition to Free Same-Day Delivery on millions of items\
    \ in thousands of cities and towns across 47 major U.S. metro\nareas, plus over\
    \ 10 million items available for Free One-Day Delivery coast to coast. These fast\
    \ and efficient deliveries\n\n\fare powered by Amazon’s last mile network of delivery\
    \ driver partners—small businesses creating tens of thousands\nof new jobs across\
    \ the country.\n•\n\nAmazon continues to expand Amazon Scout, a fully electric\
    \ autonomous delivery system. Similar in size to a small\ncooler on wheels, Amazon\
    \ Scout rolls down the sidewalk at walking pace and delivers items right to customers.\
    \ Since\nits launch, Scout has delivered tens of thousands of packages to customers\
    \ in California, Georgia, Tennessee, and\nWashington, and the program is continuing\
    \ to expand to new communities in the U.S.\n\n•\n\nThe new Prime prescription\
    \ savings benefit offers pharmacy savings at more than 60,000 participating pharmacies\
    \ in\nthe U.S., including Amazon Pharmacy. Amazon has helped Prime members save\
    \ millions of dollars on prescription\nmedications so far this year when paying\
    \ without insurance, both at Amazon Pharmacy and other local pharmacies.\n\n•\n\
    \nAmazon expanded Discover Rooms, an immersive shopping experience that helps\
    \ customers browse and shop from\nthousands of home room designs and instantly\
    \ discover home furnishing product inspiration based on visual attributes.\nThe\
    \ experience is now available in nine countries, including Canada, France, Germany,\
    \ India, Italy, Japan, Spain, UK,\nand the U.S.\n\n•\n\nPrime Wardrobe, Amazon’s\
    \ “try before you buy” offering, expanded selection and launched new innovations\
    \ for\ncustomers, including the ability to chat live with Amazon Stylists for\
    \ personalized recommendations and trial items\nrecommended by their favorite\
    \ fashion influencers and websites.\n\n•\n\nIn the U.S., Amazon launched an expanded\
    \ assortment of NFL merchandise, including replica jerseys and hats, at\namazon.com/NFL.\
    \ Customers can now shop thousands of additional products on Amazon from NFL Pro\
    \ Line,\nFanatics, New Era, Outerstuff, '47, and other top brands. Amazon also\
    \ made enhancements to the sports fan shopping\nexperience, including improved\
    \ navigation in Your Fanshop and personalized game celebrations for customers’\n\
    favorite teams.\n\n•\n\nAmazon’s Counterfeit Crimes Unit continues to work aggressively\
    \ with law enforcement, industry associations, brand\nowners, and academics to\
    \ bring counterfeit to zero. Examples this quarter include working with the U.S.\
    \ National\nIntellectual Property Rights Coordination Center to prevent counterfeit\
    \ Super Bowl LV merchandise from reaching\nconsumers and partnering with Pennsylvania-based,\
    \ family-owned card game maker Dutch Blitz and Italian luxury\nbrand Salvatore\
    \ Ferragamo to file lawsuits against multiple counterfeiters and hold them accountable\
    \ to the fullest\nextent of the law.\n\n•\n\nIn March, Amazon launched Amazon.pl,\
    \ offering Polish customers a selection of more than 100 million products\nacross\
    \ more than 30 categories, including products from thousands of European and local\
    \ Polish businesses. Amazon\nhas been operating in Poland since 2014, has created\
    \ over 18,000 permanent jobs, and will open its tenth fulfillment\ncenter in Swiebodzin\
    \ in 2021, adding more than 1,000 new jobs to Amazon’s existing network in Poland.\n\
    \n•\n\nAmazon opened its first international physical retail stores powered by\
    \ Just Walk Out technology with the launch of\nthree Amazon Fresh locations in\
    \ London. These new convenience grocery stores sell a range of products, including\
    \ the\nnew “by Amazon” private brand, and enable shoppers to enter a store, grab\
    \ what they want, and leave without stopping\nto check out. There are now 15 Amazon\
    \ Fresh physical stores around the world.\n\n•\n\nAmazon Fresh grocery stores\
    \ expanded into four new communities in the U.S.: Oak Lawn, Illinois; Bloomingdale,\n\
    Illinois; Fullerton, California; and Long Beach, California, creating hundreds\
    \ of regular full- and part-time jobs in each\ncommunity with starting wages of\
    \ at least $15 per hour and comprehensive benefits.\n\n•\n\nAmazon announced that\
    \ millions of Prime members now have access to Key In-Garage Grocery Delivery\
    \ in more than\n5,000 cities and towns in the U.S., enabling them to enjoy free,\
    \ contactless, and secure in-garage delivery of grocery\norders from Whole Foods\
    \ Market and Amazon Fresh.\n\n•\n\nAmazon One—a fast, convenient, contactless\
    \ way for people to use their palm to enter, identify, and pay—launched as\na\
    \ payment option at Whole Foods Market, starting with the Madison Broadway store\
    \ in Seattle. Amazon One will be\nadded as a payment option at additional Whole\
    \ Foods Market stores in the Seattle area in the coming months.\n\n\f•\n\nDelaware\
    \ North, a global leader in hospitality and food service, announced the opening\
    \ of two checkout-free\nconvenience stores using Amazon’s Just Walk Out technology\
    \ at TD Garden, an entertainment venue in Boston and\nhome of the Boston Celtics\
    \ and Boston Bruins.\n\n•\n\nAmazon Business, the company’s global procurement\
    \ solution, now serves more than five million businesses and\ngenerated $25 billion\
    \ in worldwide annualized sales. More than half of unit sales are from third-party\
    \ sellers, such as\nwomen-, minority-, or veteran-owned businesses that have been\
    \ certified by U.S. diversity-certifying organizations\nsuch as the Department\
    \ of Veterans Affairs and Women’s Business Enterprise National Council. In the\
    \ U.S., Amazon\nBusiness serves 45 states and 80 of the Fortune 100 companies,\
    \ including Citigroup, Intel, Cisco, and ExxonMobil.\n\n•\n\nAmazon continues\
    \ to expand its air cargo network to meet growing customer demand. In January,\
    \ the company\nannounced the purchase of 11 aircraft from Delta and WestJet to\
    \ expand its Amazon Air fleet to more than 85 aircraft\nby the end of 2022. Amazon\
    \ also announced new Amazon Air sites in Toledo, Ohio and Fairbanks, Alaska, and\
    \ plans\nto expand existing operations in Canada this summer.\n\nEntertainment\n\
    •\n\nThis quarter marked Amazon Studios’ most successful awards season to date\
    \ and the first time a streaming service has\nwon a best picture Golden Globe\
    \ award from the Hollywood Foreign Press Association. Original titles earned 10\n\
    Golden Globe nominations and three awards for Small Axe (Supporting Actor John\
    \ Boyega) and Borat Subsequent\nMoviefilm (Best Picture Musical/Comedy and Best\
    \ Actor Musical/Comedy). Amazon Studios also earned 12 Academy\nAward nominations,\
    \ a record for the studio, across four films: One Night in Miami…, Borat Subsequent\
    \ Moviefilm,\nTime, and Sound of Metal, which won two awards (Best Sound and Best\
    \ Film Editing).\n\n•\n\nComing 2 America launched worldwide on Prime Video, becoming\
    \ the #1 streamed movie its opening weekend and\nthe #1 opening weekend for a\
    \ streamed movie this year according to Screen Engine/ASI. Regina King’s feature\n\
    directorial debut One Night in Miami… also launched to critical acclaim, receiving\
    \ numerous accolades, including a\nCritics’ Choice Award as well as Golden Globe,\
    \ SAG, and Oscar nominations. In addition, new Amazon Original\nInvincible premiered\
    \ to praise from TV critics, and Prime Video debuted Local Originals The Stand\
    \ (Canada), Guerra\nde Likes (Mexico), The Great Escapists (UK), La Templanza\
    \ (Spain), and We Children from Bahnhof Zoo (Germany).\n\n•\n\nAmazon Studios\
    \ continues to invest in diverse creators and content. This quarter, Amazon Studios\
    \ announced new\nseries for Prime Video, including a Mr. and Mrs. Smith remake\
    \ created by and starring Phoebe Waller-Bridge and\nDonald Glover, as well as\
    \ a young adult series The Summer I Turned Pretty from writer Jenny Han. The studio\
    \ also\nannounced that the sci-fi action film The Tomorrow War from Skydance Media\
    \ starring Chris Pratt will premiere on\nJuly 2.\n\n•\n\nAmazon announced that\
    \ Prime Video will become the exclusive home for Thursday Night Football beginning\
    \ in\n2023—making Prime Video the first streaming service to secure an exclusive\
    \ national broadcast package from the\nNFL. The 10-year deal gives tens of millions\
    \ of U.S. Prime members exclusive access to must-watch live football on\nPrime\
    \ Video and also expands the Thursday Night Football package from 11 to 15 regular-season\
    \ games.\n\n•\n\nAmazon, the New York Yankees, and YES Network announced 21 regular-season\
    \ games will stream on Prime Video\nin 2021. All games will be available to stream\
    \ throughout New York State, Connecticut, northeast Pennsylvania, and\nnorth and\
    \ central New Jersey at no additional cost to Prime members. All Yankees games\
    \ on Prime Video this season\nwill feature Amazon’s exclusive X-Ray technology,\
    \ which gives real-time access to live in-game stats, team and player\ndetails,\
    \ and real-time play-by-play information. In addition, Prime Video will air a\
    \ new 15-minute pregame show\nahead of the first pitch for every Prime Video broadcast.\n\
    \n•\n\nThe Live Sports offering for Prime Video continues to grow internationally.\
    \ In the first quarter, Prime Video broadcast\nfive additional Premier League\
    \ football matches in the UK. Prime Video also kicked off 2021 coverage of the\
    \ ATP and\nWTA Tour tennis tournaments, including exclusive coverage of the Miami\
    \ Open. In Australia, Prime Video announced\nan exclusive, two-year, live broadcast\
    \ streaming deal to distribute the Australian Swimming championship events\nglobally\
    \ on Prime Video at no additional cost to Prime members.\n\n\f•\n\nAmazon Music\
    \ continues to expand its international reach of podcasts, launching localized\
    \ offerings in France, Italy,\nSpain, and India for customers across all streaming\
    \ tiers, at no additional cost. Amazon Music also announced the\nintegration of\
    \ artist merchandise into the Amazon Music app, providing a new shopping experience\
    \ for music fans.\nCustomers can now shop a curated, Prime-eligible selection\
    \ of artist merchandise while listening to their favorite\nmusic, uninterrupted.\n\
    \nAmazon Devices and Services\n•\n\nAmazon introduced the next generation of Echo\
    \ Buds, featuring an all-new design, premium audio, custom-designed\nActive Noise\
    \ Cancellation technology, wireless charging capabilities, improved microphones,\
    \ and hands-free access to\nAlexa.\n\n•\n\nAmazon announced Build It, a new Day\
    \ 1 Editions program that gives customers a say in the devices Amazon builds\n\
    next. The first wave of concepts included a Smart Sticky Note Printer, a Smart\
    \ Nutrition Scale, and a Smart Cuckoo\nClock. In just three days, the Smart Sticky\
    \ Note Printer hit its pre-order goal and is being built.\n\n•\n\nAmazon announced\
    \ new Alexa features, such as Music Sharing with Alexa, which allows users to\
    \ share songs with\nfriends and family who are Alexa contacts, and Alexa for Xbox,\
    \ which gives U.S. and Canadian customers more ways\nto interact with their consoles\
    \ using their voice—such as asking Alexa to download games remotely through Xbox’s\n\
    Game Pass service.\n\n•\n\nAmazon launched a new Alexa Prize TaskBot Challenge,\
    \ in which university teams will compete to develop\nconversational AI agents\
    \ to help customers complete tasks requiring multiple steps and decisions. It\
    \ is the first\nconversational AI challenge to incorporate multimodal—voice and\
    \ vision—customer experiences.\n\n•\n\nAs part of the Fairness in AI program,\
    \ the National Science Foundation and Amazon announced the next cohort of 37\n\
    researchers focused on 11 projects covering a range of topics, including: theoretical\
    \ and algorithmic foundations;\nprinciples for human interaction with AI systems;\
    \ technologies such as natural language understanding and computer\nvision; and\
    \ applications including hiring decisions, education, criminal justice, and human\
    \ services.\n\n•\n\nRing introduced Ring Video Doorbell Pro 2 and Ring Floodlight\
    \ Cam Wired Pro, both featuring 3D Motion Detection\nand Bird’s Eye View powered\
    \ by radar technology. Ring also announced several other products and features,\
    \ including\nRing Video Doorbell 4, Smart Responses and Geofence for compatible\
    \ devices, and Ring Alarm (2nd Gen) for the UK\nand Europe.\n\n•\n\nAmazon launched\
    \ the Alexa Built-in experience in Lamborghini’s Huracán EVO, the first vehicle\
    \ to offer online car\ncontrol capabilities with Alexa embedded. Amazon also launched\
    \ the first application of the Alexa Connected Vehicle\nSkills API with Nissan,\
    \ and Garmin announced it is the first Tier 1 automotive supplier to integrate\
    \ Alexa Custom\nAssistant in its In-Vehicle Infotainment systems. Jeep announced\
    \ Wagoneer and Grand Wagoneer models will be the\nfirst to launch Fire TV for\
    \ Auto, an on-the-go entertainment experience.\n\nAmazon Web Services\n•\n\nAWS\
    \ announced significant customer momentum, with new commitments and migrations\
    \ from customers spanning\nmany major industries.\n•\n\nIn telecommunications,\
    \ DISH is leveraging AWS’s advanced, reliable, and secure infrastructure to build\
    \ a\ncloud-based, 5G Open Radio Access Network (O-RAN) to deliver consistent,\
    \ cost-effective performance\nfrom the cloud to the edge of the network.\n\n•\n\
    \nThe media and entertainment industry continues to move to AWS at a rapid pace\
    \ with The Walt Disney\nCompany working with AWS on the expansion of Disney+ to\
    \ more than 100 million subscribers around the\nworld.\n\n•\n\nSome of the world’s\
    \ most renowned sports leagues are choosing AWS as their technology provider to\n\
    transform the fan experience. For example, the National Hockey League (NHL) uses\
    \ artificial intelligence,\nmachine learning, and other AWS technologies to create\
    \ new viewing experiences and in-depth stats and\nanalytics, and the PGA TOUR\
    \ (TOUR) uses AWS cloud and machine learning technologies to transform the\n\n\
    \fway golf content is created, distributed, and experienced. The German Bundesliga,\
    \ Germany’s top national\nfootball league, uses AWS to power three new Bundesliga\
    \ Match Facts to give fans deeper insights into action\non the pitch, while Formula\
    \ 1 (F1) uses a range of AWS technologies, including machine learning, for six\n\
    new F1 Insights for the 2021 season that help motor racing fans understand the\
    \ strategy of their favorite\ndriver.\n•\n\nAutomotive companies continue to choose\
    \ AWS to support the development of their next-generation vehicles.\nContinental,\
    \ one of the world’s largest automotive parts manufacturers, announced they are\
    \ collaborating\nwith AWS to develop the Continental Automotive Edge Platform\
    \ (CAEdge), which will allow automakers to\ndevelop, deploy, and manage code to\
    \ run connected and autonomous vehicles. In addition, AWS and Torc\nRobotics,\
    \ a subsidiary of Daimler Truck AG, are collaborating to scale an autonomous truck\
    \ development\nplatform in the cloud so that Torc Robotics can accelerate testing\
    \ and commercialization of autonomous\ndriving technology. And ABB announced a\
    \ collaboration with AWS to create a cloud-based fleet management\nsystem for\
    \ electric vehicles, helping companies accelerate electrification of their fleets\
    \ while maintaining\nbusiness continuity.\n\n•\n\nAWS announced the launch of\
    \ a second full region in Japan—the AWS Asia Pacific (Osaka) Region—which is an\n\
    expansion of the existing AWS Osaka Local Region. The new region consists of three\
    \ Availability Zones (AZs) and\njoins the existing 25 Availability Zones in eight\
    \ AWS Regions across Asia Pacific in Beijing, Hong Kong, Mumbai,\nNingxia, Seoul,\
    \ Singapore, Sydney, and Tokyo. Globally, AWS has 80 Availability Zones across\
    \ 25 geographic\nregions, with plans to launch 15 more Availability Zones and\
    \ five more AWS Regions in Australia, India, Indonesia,\nSpain, and Switzerland.\n\
    \n•\n\nAWS and Red Hat announced the general availability of Red Hat OpenShift\
    \ Service on AWS (ROSA), a new managed\nservice that makes it easier for Red Hat\
    \ OpenShift customers to build, scale, and manage containerized applications on\n\
    AWS. With ROSA, customers can enjoy more simplified Kubernetes cluster creation\
    \ without the burden of manually\nscaling and managing the underlying infrastructure.\
    \ ROSA streamlines moving on-premises Red Hat OpenShift\nworkloads to AWS and\
    \ offers a tighter integration with other AWS technologies.\n\n•\n\nAWS announced\
    \ the general availability of AQUA (Advanced Query Accelerator) for Amazon Redshift,\
    \ an innovative\nnew distributed and hardware-accelerated cache that delivers\
    \ up to ten times better query performance than other cloud\ndata warehouses.\
    \ AQUA brings compute to the storage layer, helping customers avoid networking\
    \ bandwidth\nlimitations by eliminating unnecessary data movement between where\
    \ data is stored and compute clusters. With\nAQUA, customers have more up-to-date\
    \ dashboards, save development time, and their systems are easier to maintain.\n\
    \n•\n\nAWS announced the general availability of Amazon Elastic Compute Cloud\
    \ (EC2) X2gd instances, the next generation\nof advanced, memory-optimized instances\
    \ powered by AWS-designed, Arm-based Graviton2 processors. New X2gd\ninstances\
    \ deliver up to 55% better price/performance compared to current generation x86-based\
    \ X1 instances, while\nalso offering increased memory per vCPU compared to other\
    \ Graviton2-based instances. Together, the higher\nperformance and additional\
    \ memory of X2gd instances make it possible for customers to more efficiently\
    \ run memory\nintensive workloads like in-memory databases, relational databases,\
    \ electronic design automation (EDA) workloads,\nreal-time analytics, and real-time\
    \ caching servers.\n\n•\n\nAWS announced Amazon Lookout for Equipment, a new service\
    \ that uses AWS-developed machine learning models\nto help customers perform predictive\
    \ maintenance on the equipment in their facilities. Amazon Lookout for Equipment\n\
    ingests sensor data from a customer’s industrial equipment (e.g., pressure, flow\
    \ rate, RPMs, temperature, and power),\nand then trains a unique machine learning\
    \ model to accurately predict early warning signs of machine failure or\nsuboptimal\
    \ performance using real-time data streams from the customer’s equipment. With\
    \ Amazon Lookout for\nEquipment, customers can detect abnormalities with speed\
    \ and precision, quickly diagnose issues, reduce false alerts,\nand avoid expensive\
    \ downtime by taking action before machine failures occur.\n\n•\n\nAWS announced\
    \ the general availability of Amazon Lookout for Vision, a service that analyzes\
    \ images using computer\nvision and sophisticated machine learning capabilities\
    \ to spot product or process defects and anomalies. By employing\nadvanced machine\
    \ learning techniques, Amazon Lookout for Vision is able to train a model using\
    \ as few as 30 images,\n\n\fwhich can help detect manufacturing and production\
    \ defects (e.g., cracks, dents, incorrect color, irregular shape, etc.)\nin their\
    \ products and prevent costly errors from progressing down an operational line\
    \ and reaching customers.\n•\n\nAWS announced the general availability of Amazon\
    \ Lookout for Metrics, a new fully managed machine learning\nservice that helps\
    \ customers monitor the most important metrics for their business (e.g., revenue,\
    \ web page views,\nactive users, transaction volume, and mobile app installations)\
    \ with greater speed and accuracy. The service also\nmakes it easier to diagnose\
    \ the root cause of anomalies like unexpected dips in revenue, high rates of abandoned\n\
    shopping carts, spikes in payment transaction failures, increases in new user\
    \ sign-ups, and more.\n\n•\n\nAWS announced new Amazon Elastic File System (EFS)\
    \ One Zone storage classes that reduce storage costs by 47%,\ncompared to existing\
    \ Amazon EFS storage classes, while delivering the same features and benefits.\
    \ One Zone storage\nclasses redundantly store data within a single Availability\
    \ Zone (AZ). These are ideal for customers who want costoptimized file storage\
    \ for workloads and applications (e.g., content management, developer applications,\
    \ etc.) that do\nnot require the level of availability and durability offered\
    \ by regional Amazon EFS storage classes, which redundantly\nstore data across\
    \ multiple geographically separated AZs.\n\n\fFinancial Guidance\nThe following\
    \ forward-looking statements reflect Amazon.com’s expectations as of April 29,\
    \ 2021, and are subject to\nsubstantial uncertainty. Our results are inherently\
    \ unpredictable and may be materially affected by many factors, such as\nfluctuations\
    \ in foreign exchange rates, changes in global economic conditions and customer\
    \ spending, world events, the rate of\ngrowth of the Internet, online commerce,\
    \ and cloud services, and the various factors detailed below. This guidance reflects\
    \ our\nestimates as of April 29, 2021 regarding the impact of the COVID-19 pandemic\
    \ on our operations, including those discussed\nabove, and is highly dependent\
    \ on numerous factors that we may not be able to predict or control, including:\
    \ the duration and\nscope of the pandemic, including any recurrence; actions taken\
    \ by governments, businesses, and individuals in response to the\npandemic; the\
    \ impact of the pandemic on global and regional economies and economic activity,\
    \ workforce staffing and\nproductivity, and our significant and continuing spending\
    \ on employee safety measures; our ability to continue operations in\naffected\
    \ areas; and consumer demand and spending patterns, as well as the effects on\
    \ suppliers, creditors, and third-party\nsellers, all of which are uncertain.\
    \ This guidance also assumes the impacts on consumer demand and spending patterns,\n\
    including impacts due to concerns over the current economic outlook, will be in\
    \ line with those experienced during the second\nquarter of 2021 to date, and\
    \ the additional assumptions set forth below. However, it is not possible to determine\
    \ the ultimate\nimpact on our operations for the second quarter of 2021, or whether\
    \ other currently unanticipated direct or indirect\nconsequences of the pandemic\
    \ are reasonably likely to materially affect our operations.\nSecond Quarter 2021\
    \ Guidance\n•\n\n•\n•\n•\n\nNet sales are expected to be between $110.0 billion\
    \ and $116.0 billion, or to grow between 24% and 30% compared\nwith second quarter\
    \ 2020. This guidance anticipates a favorable impact of approximately 200 basis\
    \ points from foreign\nexchange rates.\nOperating income is expected to be between\
    \ $4.5 billion and $8.0 billion, compared with $5.8 billion in second quarter\n\
    2020. This guidance assumes approximately $1.5 billion of costs related to COVID-19.\n\
    This guidance assumes that Prime Day occurs in second quarter 2021.\nThis guidance\
    \ assumes, among other things, that no additional business acquisitions, investments,\
    \ restructurings, or\nlegal settlements are concluded.\n\nA conference call will\
    \ be webcast live today at 2:30 p.m. PT/5:30 p.m. ET, and will be available for\
    \ at least three months at\namazon.com/ir. This call will contain forward-looking\
    \ statements and other material information regarding the Company’s\nfinancial\
    \ and operating results.\nThese forward-looking statements are inherently difficult\
    \ to predict. Actual results could differ materially for a variety of\nreasons,\
    \ including, in addition to the factors discussed above, the amount that Amazon.com\
    \ invests in new business\nopportunities and the timing of those investments,\
    \ the mix of products and services sold to customers, the mix of net sales\nderived\
    \ from products as compared with services, the extent to which we owe income or\
    \ other taxes, competition, management\nof growth, potential fluctuations in operating\
    \ results, international growth and expansion, the outcomes of claims, litigation,\n\
    government investigations, and other proceedings, fulfillment, sortation, delivery,\
    \ and data center optimization, risks of\ninventory management, variability in\
    \ demand, the degree to which the Company enters into, maintains, and develops\n\
    commercial agreements, proposed and completed acquisitions and strategic transactions,\
    \ payments risks, and risks of\nfulfillment throughput and productivity. Other\
    \ risks and uncertainties include, among others, risks related to new products,\n\
    services, and technologies, system interruptions, government regulation and taxation,\
    \ and fraud. In addition, additional or\nunforeseen effects from the COVID-19\
    \ pandemic and the global economic climate may give rise to or amplify many of\
    \ these\nrisks. More information about factors that potentially could affect Amazon.com’s\
    \ financial results is included in Amazon.com’s\nfilings with the Securities and\
    \ Exchange Commission (“SEC”), including its most recent Annual Report on Form\
    \ 10-K and\nsubsequent filings.\nOur investor relations website is amazon.com/ir\
    \ and we encourage investors to use it as a way of easily finding information\n\
    about us. We promptly make available on this website, free of charge, the reports\
    \ that we file or furnish with the SEC, corporate\ngovernance information (including\
    \ our Code of Business Conduct and Ethics), and select press releases, which may\
    \ contain\nmaterial information about us, and you may subscribe to be notified\
    \ of new information posted to this site.\n\n\fAbout Amazon\nAmazon is guided\
    \ by four principles: customer obsession rather than competitor focus, passion\
    \ for invention, commitment to\noperational excellence, and long-term thinking.\
    \ Amazon strives to be Earth’s Most Customer-Centric Company, Earth’s Best\nEmployer,\
    \ and Earth’s Safest Place to Work. Customer reviews, 1-Click shopping, personalized\
    \ recommendations, Prime,\nFulfillment by Amazon, AWS, Kindle Direct Publishing,\
    \ Kindle, Career Choice, Fire tablets, Fire TV, Amazon Echo, Alexa,\nJust Walk\
    \ Out technology, Amazon Studios, and The Climate Pledge are some of the things\
    \ pioneered by Amazon. For more\ninformation, visit amazon.com/about and follow\
    \ @AmazonNews."
