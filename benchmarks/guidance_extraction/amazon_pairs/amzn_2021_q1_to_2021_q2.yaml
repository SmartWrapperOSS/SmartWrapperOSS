  label: Amazon Q2 2021 Earnings Release, July 29, 2021
  text: "AMAZON.COM ANNOUNCES SECOND QUARTER RESULTS\n\nSEATTLE—(BUSINESS WIRE) July\
    \ 29, 2021—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results for\n\
    its second quarter ended June 30, 2021.\n•\n\nOperating cash flow increased 16%\
    \ to $59.3 billion for the trailing twelve months, compared with $51.2 billion\
    \ for\nthe trailing twelve months ended June 30, 2020.\n\n•\n\nFree cash flow\
    \ decreased to $12.1 billion for the trailing twelve months, compared with $31.9\
    \ billion for the trailing\ntwelve months ended June 30, 2020.\n\n•\n\nFree cash\
    \ flow less principal repayments of finance leases and financing obligations decreased\
    \ to $0.6 billion for\nthe trailing twelve months, compared with $21.3 billion\
    \ for the trailing twelve months ended June 30, 2020.\n\n•\n\nFree cash flow less\
    \ equipment finance leases and principal repayments of all other finance leases\
    \ and financing\nobligations decreased to $4.2 billion for the trailing twelve\
    \ months, compared with $19.4 billion for the trailing twelve\nmonths ended June\
    \ 30, 2020.\n\n•\n\nCommon shares outstanding plus shares underlying stock-based\
    \ awards totaled 522 million on June 30, 2021,\ncompared with 517 million one\
    \ year ago.\n\n•\n\nNet sales increased 27% to $113.1 billion in the second quarter,\
    \ compared with $88.9 billion in second quarter 2020.\nExcluding the $2.5 billion\
    \ favorable impact from year-over-year changes in foreign exchange rates throughout\
    \ the\nquarter, net sales increased 24% compared with second quarter 2020.\n\n\
    •\n\nOperating income increased to $7.7 billion in the second quarter, compared\
    \ with $5.8 billion in second quarter 2020.\n\n•\n\nNet income increased to $7.8\
    \ billion in the second quarter, or $15.12 per diluted share, compared with $5.2\
    \ billion, or\n$10.30 per diluted share, in second quarter 2020.\n\n“Over the\
    \ past 18 months, our consumer business has been called on to deliver an unprecedented\
    \ number of items, including\nPPE, food, and other products that helped communities\
    \ around the world cope with the difficult circumstances of the pandemic.\nAt\
    \ the same time, AWS has helped so many businesses and governments maintain business\
    \ continuity, and we’ve seen AWS\ngrowth reaccelerate as more companies bring\
    \ forward plans to transform their businesses and move to the cloud,” said Andy\n\
    Jassy, Amazon CEO. “Thank you to all of our passionate, innovative, mission-driven\
    \ employees around the world for\ncontinuing to stay focused on delivering for\
    \ customers—I am very excited to work with you as we invent and build for the\n\
    future.”\nHighlights\nInvesting in Employee Safety and Providing Good Jobs\n•\n\
    \nAmazon announced a first-of-its-kind partnership with the National Safety Council,\
    \ a 100-year-old nonprofit that\nprotects workers on and off the job, to invent\
    \ new ways of preventing musculoskeletal disorders (MSDs), the most\ncommon workplace\
    \ injury in the U.S. The five-year effort aims to reduce MSDs across a variety\
    \ of industries by\nengaging key stakeholders, conducting new research, inventing\
    \ technology and processes, and scaling the results.\nAmazon is investing over\
    \ $300 million into safety projects in 2021, including redesigning and retrofitting\n\
    workstations, re-engineering cross-dock operations and powered-industrial-truck\
    \ barriers, and implementing new\nsafety control systems.\n\n\f•\n\nIn the UK,\
    \ Amazon announced that it is creating more than 10,000 new corporate and operations\
    \ jobs and investing\n£10 million over three years to train up to 5,000 employees\
    \ in new skills.\n\n•\n\nAmazon surpassed its commitment to hire 25,000 U.S. veterans\
    \ and military spouses by 2021 and set a new\ncommitment to hire an additional\
    \ 100,000 veterans and military spouses by 2024.\n\n•\n\nAmazon launched the Amazon\
    \ Returnship program, a new initiative to help 1,000 experienced corporate professionals\n\
    outside of Amazon who have been out of work for an extended period of time return\
    \ to the workforce, including\npeople who stopped working due to COVID-19, caregiving\
    \ responsibilities, or medical circumstances. Amazon offers\nparticipants a paid,\
    \ 16-week work opportunity with an abbreviated interview process, dedicated support,\
    \ and\npersonalized coaching and mentoring—as well as the possibility to transition\
    \ into a full-time job at Amazon.\n\n•\n\nAmazon introduced a new mental health\
    \ benefit for all of its 950,000 U.S. employees, their families, and household\n\
    members, which provides free access to personalized support, including one-on-one\
    \ counseling and 24/7 crisis\nsupport.\n\n•\n\nFor the fourth year in a row, Amazon\
    \ was included on the Disability Equality Index’s Best Places to Work for\nDisability\
    \ Inclusion.\n\nEconomic Impact and Small Business Empowerment\n•\n\nFor the second\
    \ year in a row, Amazon placed No. 1 on the Progressive Policy Institute’s Investment\
    \ Heroes list, which\nranks U.S. companies’ investments in America. According\
    \ to the study, Amazon invested more in the U.S. than any\nother company in 2020;\
    \ was key to sustaining the economy during the COVID-19 pandemic; and helped drive\n\
    economic expansion, wage growth, and job creation across the country.\n\n•\n\n\
    Amazon launched the Black Business Accelerator, committing $150 million over four\
    \ years to help Black business\nowners and entrepreneurs succeed as third-party\
    \ selling partners. The program aims to spur growth and advance equity\nfor Black-owned\
    \ businesses by providing financial support, education and mentorship, and marketing\
    \ and promotional\nsupport.\n\n•\n\nIn the two-week lead-up to Prime Day, customers\
    \ spent $1.9 billion on products from third-party sellers during the\nSpend $10,\
    \ Get $10 promotion—more than double compared to the 2020 Prime Day small business\
    \ promotion. Prime\nDay 2021 was the biggest two-day period ever for small and\
    \ medium-sized businesses in Amazon’s stores worldwide.\n\n•\n\nAmazon Advertising\
    \ launched over 40 new features and self-service capabilities, making it easier\
    \ for sellers,\ncompanies, and authors to grow their businesses by helping customers\
    \ discover their brands and products. Recent\nlaunches include regional sponsored\
    \ product campaign creation tools; access to educational, technical, and marketing\n\
    resources via the Partner Network; and a simplified creative asset management\
    \ solution. In addition, Amazon\nAdvertising expanded the services it offers in\
    \ Australia, Europe, India, Japan, and Saudi Arabia, creating more\nopportunities\
    \ for local and global sellers and brands to grow their businesses in these regions.\n\
    \nSupporting Communities\n•\n\nAmazon’s Housing Equity Fund has invested over\
    \ $800 million of its $2 billion total. Its latest commitment of $300\nmillion\
    \ will create 3,000 affordable housing units near public transit centers in the\
    \ Puget Sound region of Washington\nstate; Arlington, Virginia; and Nashville,\
    \ Tennessee.\n\n•\n\nAmazon India sprung into urgent action to help employees,\
    \ partners, sellers, customers, and communities in recent\nmonths as the country\
    \ faced an increase in COVID-19 cases. Amazon helped airlift over 14,000 life-saving\
    \ medical\nitems, including 100 intensive care unit ventilators as well as 10,000\
    \ oxygen and ventilation machines. As part of its\nefforts, Amazon worked with\
    \ partners and nonprofits to deliver items to hospitals in the most urgent need,\
    \ bearing the\ncost of airlifts and managing the urgent movement of medical equipment.\
    \ In addition, Amazon India has vaccinated\nover 100,000 employees and their family\
    \ members and has committed to vaccinate a total of 1 million employees,\nsellers,\
    \ partners, and dependents. Amazon committed $16.5 million in relief efforts,\
    \ including direct donations and\nmedical equipment delivery.\n\n•\n\nIn Nepal,\
    \ Amazon teamed up with the United Nations World Food Programme to donate and\
    \ deliver supplies to\ncommunities affected by COVID-19, including 850,000 personal\
    \ protective items such as medical masks, goggles, and\nfull-face protection for\
    \ medical staff.\n\n•\n\nAmazon’s FDA-authorized at-home COVID-19 test collection\
    \ kit is now available to U.S. customers through\nAmazon.com. The kits are processed\
    \ by Amazon’s in-house laboratory, which has processed millions of tests from\n\
    over 750,000 Amazon front-line employees.\n\n\f•\n\nAmazon opened its first Disaster\
    \ Relief Hub in an Atlanta fulfillment center to help relief organizations respond\
    \ more\nquickly to natural disasters in the U.S., the Caribbean, and Central America.\
    \ The hub will store over 500,000 Amazondonated relief supplies so they can be\
    \ rapidly deployed when needed.\n\n•\n\nAmazon Future Engineer (AFE), the company’s\
    \ computer science education program for students from historically\nunderserved\
    \ communities, announced its most recent round of awards in the U.S., including\
    \ $4 million in college\nscholarships and paid internships for 100 students and\
    \ AFE Teacher of the Year Awards for 10 computer science\neducators who promote\
    \ diversity and inclusion in computer science. Each of the winning teachers received\
    \ a prize\npackage to expand computer science and/or robotics education at their\
    \ respective schools.\n\n•\n\nAmazon celebrated Asian Pacific American Heritage\
    \ Month in the U.S. by signing on as a founding partner of The\nAsian American\
    \ Foundation, a new nonprofit dedicated to accelerating opportunity and prosperity\
    \ for Asian American\nPacific Islander (AAPI) communities. Amazon committed $10\
    \ million over five years as part of the AAPI Giving\nPledge.\n\n•\n\nRing launched\
    \ a community program with the nonprofit Strength Based Community Change to improve\
    \ individual and\nfamily resiliency, and advance community safety. As part of\
    \ the program, Ring donated 1,000 Ring Video Doorbells,\nfree installation, and\
    \ a Ring Protect subscription to eligible residents in Wilmington, California.\n\
    \nProtecting the Planet\n•\n\nAmazon announced 14 new renewable energy projects\
    \ in Canada, Finland, Spain, and the U.S., making Amazon the\nlargest corporate\
    \ purchaser of renewable energy in the U.S., Europe, and the world. The new projects\
    \ bring Amazon’s\ntotal renewable energy investments to date to 10 gigawatts of\
    \ electricity production capacity—enough to power 2.5\nmillion U.S. homes. Amazon\
    \ has reached 65% renewable energy across its business, up from 42% in 2019—putting\n\
    the company on a path to power 100% of company activities with renewable energy\
    \ by 2025—five years ahead of its\n2030 target.\n\n•\n\nAmazon welcomed Interpublic\
    \ Group, Iron Mountain, JLL, Klarna, Macquarie Asset Management, and RELX to The\n\
    Climate Pledge, joining other Pledge signatories such as PepsiCo, Uber, Microsoft,\
    \ Unilever, Visa, and ColgatePalmolive. From deploying clean energy solutions\
    \ such as wind and solar, to implementing vehicle electrification and\nsupporting\
    \ nature-based climate solutions, the 112 Climate Pledge signatories are working\
    \ together to significantly\nreduce corporate carbon emissions.\n\n•\n\nAmazon\
    \ added five new certifications to its Climate Pledge Friendly program to help\
    \ shoppers find more sustainable\nproducts across grocery, household, and beauty.\
    \ Amazon customers can now shop for products that are Animal\nWelfare Approved,\
    \ EWG Verified, and Regenerative Organic Certified, as well as for those certified\
    \ by Higg Index\nMaterials and the U.S. Environmental Protection Agency’s Safer\
    \ Choice program.\n\n•\n\nThe Climate Pledge Fund invested in BETA Technologies\
    \ to help accelerate the development of fully electric, zeroemission aircraft\
    \ and in ION Energy, a technology platform that leverages intelligent battery\
    \ analytics to significantly\nimprove the life and performance of lithium-ion\
    \ batteries. The Climate Pledge Fund also joined Greentown Labs, the\nlargest\
    \ climate tech startup incubator in North America, to further engage with startups\
    \ and help accelerate the\ntransition to a low-carbon economy.\n\n•\n\nAs part\
    \ of its recent debt offering, Amazon issued a $1 billion sustainability bond\
    \ to further investments in tackling\ncritical social and environmental issues.\
    \ The proceeds are being used to fund projects in five areas: renewable energy,\n\
    clean transportation, sustainable buildings, affordable housing, and socioeconomic\
    \ advancement and empowerment.\n\nShopping\n•\n\nPrime members in 20 countries\
    \ shopped more and saved more this Prime Day than any previous Prime Day,\npurchasing\
    \ more than 250 million items. The Fire TV Stick 4K with Alexa Voice Remote was\
    \ the most popular item\npurchased. Prime Day also kicked off the Back-to-School\
    \ shopping season with members worldwide purchasing more\nthan 1 million laptops,\
    \ 1 million headphones, 600,000 backpacks, 240,000 notebooks, 220,000 Crayola\
    \ products, and\n40,000 calculators.\n\n•\n\nPrime is now available in 22 countries\
    \ with the addition of Prime in Portugal, which offers members unlimited, free\n\
    two-day delivery on millions of products, as well as access to Amazon Prime Video\
    \ streaming.\n\n•\n\nBusiness Prime now serves more than 1 million business customers\
    \ of all sizes worldwide, including Chevron, Citi,\nand the State of Utah. Since\
    \ launching in 2017, Business Prime has saved members millions of dollars by shipping\n\
    over 140 million packages free of charge.\n\n\f•\n\nFor the first time, Amazon\
    \ brought Just Walk Out technology to a full-sized grocery store, offering customers\
    \ in\nBellevue, Washington the option to skip the checkout line or use traditional\
    \ checkout. Amazon Fresh now has 15\nstores in the U.S. and five in the UK.\n\n\
    •\n\nAmazon Fashion expanded its head-to-toe outfit recommendations, which use\
    \ machine learning models to inspire\ncustomers and help them find products that\
    \ fit their unique style and complete their look. “Styling Ideas” are now\navailable\
    \ on Fashion product pages in France, Germany, India, Italy, Spain, and the U.S.\n\
    \n•\n\nAmazon Pharmacy introduced a six-month supply option for eligible medications,\
    \ offering customers a new\nconvenient way to purchase many of the most commonly\
    \ prescribed medications. For Prime members, pharmacy\npurchases always include\
    \ free, unlimited two-day delivery, and select medications start at just $1 per\
    \ month when\ncustomers pay without insurance.\n\n•\n\nAmazon launched the “Internet\
    \ Famous” storefront, a curated selection of the top trending products on social\
    \ media.\nThe storefront showcases immersive content that allows customers to\
    \ discover brands across multiple categories while\nengaging with their favorite\
    \ influencers.\n\n•\n\nAmazon launched its first Brand Protection Report, which\
    \ detailed Amazon’s anti-counterfeiting efforts and progress\nin driving counterfeit\
    \ to zero in its store. In 2020, Amazon invested over $700 million and employed\
    \ more than 10,000\npeople to protect customers and sellers in its store and to\
    \ stop bad actors before they list products for sale. Amazon’s\nverification processes\
    \ prevented over 6 million attempts to create selling accounts before bad actors\
    \ listed a single\nproduct for sale and seized over 2 million counterfeit products\
    \ sent to its fulfillment centers before they were sent to a\ncustomer.\n\nEntertainment\n\
    •\n\nPrime Video released new Amazon Original movies for customers worldwide,\
    \ including Tom Clancy’s Without\nRemorse, starring Michael B. Jordan, and The\
    \ Tomorrow War, starring Chris Pratt, both of which were the No. 1\nstreamed movie\
    \ on their opening weekends. Prime members also enjoyed new and returning Amazon\
    \ Original series\nand specials such as THEM, Solos, The Underground Railroad,\
    \ Panic, Flack, Mary J. Blige’s My Life, and the Prime\nDay Show, as well as the\
    \ seventh and final season of Bosch, the longest-running Amazon Original series\
    \ to date.\nAdditionally, Prime Video debuted over 20 local originals internationally,\
    \ including Dom (Brazil), Chivas: El Rebaño\nSagrado (Mexico), Clarkson’s Farm\
    \ (UK), La Leyenda de Sergio Ramos (Spain), Mixte (France), and Head Above\nWater\
    \ (Australia).\n\n•\n\nAmazon earned 20 Emmy Award nominations, including Amazon\
    \ Studios’ first-ever category nominations for a\ndrama series (The Boys) and\
    \ limited series (The Underground Railroad). Amazon also received two nominations\
    \ in the\nTV movie category (Uncle Frank and Sylvie’s Love), along with nominations\
    \ for writing (All In), choreography\n(Savage X Fenty Show Vol. 2), cinematography\
    \ (Small Axe), visual effects (Vikings), interactive program (Welcome to\nthe\
    \ Blumhouse), and commercial (Michael B. Jordan’s Alexa ad).\n\n•\n\nPrime Video\
    \ announced streaming deals with sports leagues around the world, including: the\
    \ National Football League\n(NFL) Thursday Night Football beginning in 2022, a\
    \ year earlier than previously announced; 16 Women’s National\nBasketball Association\
    \ (WNBA) games per season and the Commissioner’s Cup Championship Game; the Premier\n\
    League in the UK; the Premiere channel to watch soccer in Brazil; and 300+ Ligue\
    \ 1 soccer matches per season in\nFrance. Prime Video also streamed the first-ever\
    \ French Open night matches and the Australian Swimming Trials\nglobally.\n\n\
    •\n\nPeacock, NBCUniversal’s streaming service, is now available on Fire TV and\
    \ Fire tablet devices. Customers can use\nAlexa to start watching Peacock by saying\
    \ “Alexa, open Peacock.”\n\n•\n\nPrime Video and IMDb TV announced an exclusive,\
    \ multi-year licensing deal with Universal Filmed Entertainment\nGroup (UFEG).\
    \ Beginning in 2022, Prime Video will be an exclusive subscription video partner\
    \ for UFEG’s slate of\nlive-action films in the U.S., bringing films such as Jurassic\
    \ World: Dominion, The 355, and Ambulance to Prime\nVideo soon after theatrical\
    \ release. With this deal, IMDb TV will be the first advertising-based streaming\
    \ service to\nsecure a major studio network window, which traditionally goes to\
    \ broadcast or cable networks.\n\n•\n\nIMDb TV announced 12 original series and\
    \ development projects including a new half-hour drama from Dick Wolf, a\nhome\
    \ renovation project with Jeff Lewis, a docu-series with country superstar Luke\
    \ Bryan, and a dramedy from Clea\nDuVall and Tegan and Sara Quin.\n\n•\n\nAmazon\
    \ Advertising announced that Amazon Streaming TV ads and Twitch now jointly reach\
    \ an audience of 120\nmillion monthly viewers across the U.S. creating more opportunities\
    \ for brands to create engaging and interactive\nproduct discovery experiences\
    \ across IMDb TV, Twitch, ad-supported apps on Fire TV, and Thursday Night Football\n\
    on Prime Video.\n\n\f•\n\nAmazon Games began a closed preview of multiplayer online\
    \ PC game New World, during which it was one of the\nmost watched games on Twitch,\
    \ with hundreds of thousands of players and millions of total hours played. In\
    \ addition,\nAmazon Games announced Lost Ark, a multiplayer action-role-playing\
    \ game developed by Smilegate RPG that is\nscheduled to launch in North America\
    \ and Europe later this year.\n\nAmazon Devices and Services\n•\n\nAmazon announced\
    \ the all-new Echo Show 8 with a 13-megapixel wide-angle camera that digitally\
    \ pans and zooms\nduring video calls, and Echo Show 5 with an upgraded HD camera\
    \ and more color options at a new lower price. The\nfirst Echo Show 5 Kids offers\
    \ curated kid-friendly content, parental controls, a colorful design, and a one-year\n\
    subscription to Amazon Kids+.\n\n•\n\nAmazon announced a six-year collaboration\
    \ with Ford to bring Alexa to millions of retail and commercial vehicles in\n\
    North America. The deal is the industry’s broadest roll-out of the Built-in Alexa\
    \ hands-free experience, and includes\ncomplimentary access to key Alexa features\
    \ for all new and existing customers for up to three years. Ford and Amazon\n\
    will also work together to deliver new voice AI-enabled features and services,\
    \ including the first custom Alexa skills\nfor Ford commercial vehicles.\n\n•\n\
    \nAlexa added new custom voice options, including celebrity personalities Shaquille\
    \ O’Neal and Melissa McCarthy.\n\n•\n\nUsing machine learning advancements in\
    \ acoustic event detection, Amazon added the ability for Alexa to start a\nRoutine\
    \ after detecting specific sounds like a baby crying, dog barking, or a person\
    \ coughing or snoring. For example,\ncustomers can set up a Routine that enables\
    \ their Echo device to automatically play white noise when snoring is\ndetected.\n\
    \n•\n\nSamsung Appliance Division announced that Alexa will work alongside Bixby,\
    \ Samsung’s personal voice assistant, on\nthe Samsung Family Hub refrigerator.\
    \ This announcement continues Amazon’s commitment to providing customers\nwith\
    \ the choice and flexibility to interact with multiple voice agents on a single\
    \ device, simultaneously.\n\n•\n\nThere are now more than 900,000 registered developers,\
    \ brands, and device makers building with Alexa. At Alexa\nLive, Amazon’s annual\
    \ event for Alexa developers, Amazon introduced new ways for developers to increase\
    \ revenue,\nengagement, and discovery. New innovations for developers include\
    \ Paid Skills, Alexa Shopping Actions, Widgets,\nand the international expansion\
    \ of In-Skill Purchasing.\n\n•\n\nAmazon announced new features that make it easier\
    \ for Alexa developers to build entertaining and useful customer\nexperiences,\
    \ including: Interactive Media Skill Components that shorten the time it takes\
    \ for radio, podcast, and music\nproviders to launch experiences on Alexa; Shared\
    \ Activities Application Programming Interface (API) that enables\ndevelopers\
    \ to build multi-player gaming experiences; and Food Skill API that enables developers\
    \ to quickly create\nhigh quality, food delivery, and pickup experiences.\n\n\
    •\n\nRing announced general availability of the Floodlight Cam Wired Pro, equipped\
    \ with new features like 3D Motion\nDetection, and introduced the Floodlight Cam\
    \ Wired Plus, Ring’s most affordable outdoor floodlight camera.\n\nAmazon Web\
    \ Services\n•\n\nAWS announced significant customer momentum, with new commitments\
    \ and migrations from customers across\nmany major industries.\n•\n\nTelecom:\
    \ Swisscom, Switzerland’s leading telecommunications company and IT services provider,\
    \ selected\nAWS as its preferred public cloud provider to power a wide range of\
    \ core applications including its 5G\nnetwork, enterprise resource planning, operational\
    \ support system, business support system, and\ncommunications provisioning. Bell\
    \ Canada, one of Canada’s largest telecommunications companies, will use\nthe\
    \ breadth and depth of AWS technologies to create and scale new consumer and business\
    \ applications and\nwill bring AWS Wavelength to Canada.\n\n•\n\nFinancial services:\
    \ BMO Financial Group, one of North America’s largest financial institutions,\
    \ selected\nAWS as its preferred, strategic cloud provider to modernize its banking\
    \ platforms and build digital financial\nservices applications as part of the\
    \ company’s ongoing digital transformation. As part of its move to\npersonalize\
    \ services, the bank is using Amazon Connect—AWS’s easy-to-use, scalable cloud\
    \ contact center\n—to provide a seamless and more customer-centric experience\
    \ for its call center, as well as to support remote\nworking capabilities for\
    \ employees. Bancolombia, Colombia’s largest bank, selected AWS as its strategic\n\
    cloud provider and plans to migrate its applications to AWS.\n\n•\n\nAutomotive:\
    \ Ferrari S.p.A., a leading global manufacturer of luxury, high-performance sports\
    \ cars, entered\ninto an agreement with AWS to become its official cloud, machine\
    \ learning, and artificial intelligence\n\n\fprovider. Together, AWS and Ferrari\
    \ will accelerate the pace of innovation across the entire Ferrari\norganization,\
    \ including their road cars department, GT Competitions, the Ferrari Challenge,\
    \ and the Scuderia\nFerrari FORMULA 1 (F1) team.\n•\n\nSports: The National Hockey\
    \ League (NHL), the premier hockey league in the world, debuted two new\nadvanced\
    \ analytics during the 2021 Stanley Cup Playoffs—shot analytics and save analytics.\
    \ These new stats\npowered by AWS appear as on-screen graphics and data visualizations\
    \ during NHL games and give fans a\nbetter understanding and deeper appreciation\
    \ of how their favorite players and teams perform during crucial\nmoments.\n\n\
    •\n\nAWS plans to open infrastructure Regions in the United Arab Emirates (UAE)\
    \ in the first half of 2022 and Israel in the\nfirst half of 2023. The new Regions\
    \ will enable even more developers, startups, and enterprises as well as government,\n\
    education, and nonprofits to run their applications and serve end-users from data\
    \ centers located in the UAE and Israel.\nGlobally, AWS has 81 Availability Zones\
    \ across 25 geographic Regions, with plans to launch 21 more Availability\nZones\
    \ and seven more AWS Regions.\n\n•\n\nAWS and Salesforce announced a significant\
    \ expansion of their global strategic partnership, making it easier for\ncustomers\
    \ to build and launch custom applications. The expanded partnership extends the\
    \ technological capabilities of\nboth providers, connecting Salesforce data and\
    \ workflows natively into their solutions running on AWS, and making it\neasy\
    \ for Salesforce developers to integrate AWS data and workflows into Salesforce\
    \ applications. Salesforce will also\nembed AWS services for voice, video, artificial\
    \ intelligence, and machine learning directly in new applications for\nsales,\
    \ service, and industry vertical use cases. For example, customers can activate\
    \ virtual call centers and empower\nhigh-velocity sales teams with Amazon Connect\
    \ and AWS AI/ML services, pre-integrated into both Sales Cloud and\nService Cloud.\n\
    \n•\n\nAWS announced the general availability of two industry-specific services.\
    \ Amazon HealthLake is a HIPAA-eligible\nservice for healthcare and life sciences\
    \ organizations that uses machine learning to understand and extract meaningful\n\
    medical information from unstructured data such as clinical observations, laboratory\
    \ notes, and medical images.\nAmazon FinSpace is a purpose-built analytics service\
    \ that reduces the time it takes financial services organizations to\nfind, prepare,\
    \ and analyze financial data from months to minutes.\n\n•\n\nAWS announced the\
    \ general availability of Amazon EBS io2 Block Express volumes, delivering storage\
    \ area network\n(SAN) capabilities in the cloud for the first time. EBS Block\
    \ Express is a next-generation storage architecture that\nprovides the highest\
    \ block storage performance without the cost or hassle of having to procure, scale,\
    \ and maintain\nexpensive on-premises SANs. With io2 volumes running on Block\
    \ Express, customers get a 4x increase in\nperformance, throughput, and capacity\
    \ for existing io2 volumes, making it ideal for the most I/O-intensive, missioncritical\
    \ deployments of Oracle, SAP HANA, Microsoft SQL Server, and SAS Analytics.\n\n\
    •\n\nAWS announced the general availability of three new container services. AWS\
    \ App Runner is a fully managed\ncontainer application service that makes it easier\
    \ and faster for customers to build, deploy, and run containerized web\napplications\
    \ and APIs with just a few clicks. AWS Proton is an application delivery service\
    \ that makes it easier for\ncustomers to provision, deploy, and monitor the microservices\
    \ that form the basis of modern container and serverless\napplications. Amazon\
    \ Elastic Container Service (ECS) Anywhere is a new capability for Amazon ECS\
    \ that enables\ncustomers to easily run, scale, secure, and manage container-based\
    \ applications on-premises and at edge environments\nusing the same APIs, cluster\
    \ management, workload scheduling, monitoring, and deployment pipelines they use\
    \ with\nAmazon ECS on AWS.\n\n•\n\nAWS announced the general availability of Amazon\
    \ DevOps Guru, a fully managed operations service that uses\nmachine learning\
    \ to make it easier for developers to improve application availability by automatically\
    \ detecting\noperational issues and recommending specific actions for remediation.\
    \ Informed by years of Amazon.com and AWS\noperational excellence, Amazon DevOps\
    \ Guru applies machine learning to automatically analyze data like application\n\
    metrics, logs, events, and traces for behaviors that deviate from normal operating\
    \ patterns so developers can identify\nand remediate issues long before they impact\
    \ customers.\n\n•\n\nAWS announced the general availability of Amazon Location\
    \ Service, a new service that makes it easier and more\ncost-effective for customers\
    \ to add location functionality to their applications, without compromising on\
    \ user privacy\nor data security. With Amazon Location Service, customers can\
    \ embed location functionality in their applications\nusing data from location-based\
    \ service providers Esri and HERE Technologies to provide maps, points of interest,\n\
    geocoding (converting location information to a point on a map), route planning,\
    \ geofencing (creating virtual\nperimeters), or asset tracking.\n\n\fFinancial\
    \ Guidance\nThe following forward-looking statements reflect Amazon.com’s expectations\
    \ as of July 29, 2021, and are subject to substantial\nuncertainty. Our results\
    \ are inherently unpredictable and may be materially affected by many factors,\
    \ such as fluctuations in\nforeign exchange rates, changes in global economic\
    \ conditions and customer spending, world events, the rate of growth of the\n\
    Internet, online commerce, and cloud services, and the various factors detailed\
    \ below. This guidance reflects our estimates as of\nJuly 29, 2021 regarding the\
    \ impact of the COVID-19 pandemic on our operations, including those discussed\
    \ above, and is\nhighly dependent on numerous factors that we may not be able\
    \ to predict or control, including: the duration and scope of the\npandemic, including\
    \ any recurrence; actions taken by governments, businesses, and individuals in\
    \ response to the pandemic; the\nimpact of the pandemic on global and regional\
    \ economies and economic activity, workforce staffing and productivity, and our\n\
    significant and continuing spending on employee safety measures; our ability to\
    \ continue operations in affected areas; and\nconsumer demand and spending patterns,\
    \ as well as the effects on suppliers, creditors, and third-party sellers, all\
    \ of which are\nuncertain. This guidance also assumes the impacts on consumer\
    \ demand and spending patterns, including impacts due to\nconcerns over the current\
    \ economic outlook, will be in line with those experienced during the third quarter\
    \ of 2021 to date, and\nthe additional assumptions set forth below. However, it\
    \ is not possible to determine the ultimate impact on our operations for\nthe\
    \ third quarter of 2021, or whether other currently unanticipated direct or indirect\
    \ consequences of the pandemic are\nreasonably likely to materially affect our\
    \ operations.\nThird Quarter 2021 Guidance\n•\n•\n•\n\nNet sales are expected\
    \ to be between $106.0 billion and $112.0 billion, or to grow between 10% and\
    \ 16% compared\nwith third quarter 2020. This guidance anticipates a favorable\
    \ impact of approximately 70 basis points from foreign\nexchange rates.\nOperating\
    \ income is expected to be between $2.5 billion and $6.0 billion, compared with\
    \ $6.2 billion in third quarter\n2020. This guidance assumes approximately $1.0\
    \ billion of costs related to COVID-19.\nThis guidance assumes, among other things,\
    \ that no additional business acquisitions, investments, restructurings, or\n\
    legal settlements are concluded.\n\nA conference call will be webcast live today\
    \ at 2:30 p.m. PT/5:30 p.m. ET, and will be available for at least three months\
    \ at\namazon.com/ir. This call will contain forward-looking statements and other\
    \ material information regarding the Company’s\nfinancial and operating results.\n\
    These forward-looking statements are inherently difficult to predict. Actual results\
    \ could differ materially for a variety of\nreasons, including, in addition to\
    \ the factors discussed above, the amount that Amazon.com invests in new business\n\
    opportunities and the timing of those investments, the mix of products and services\
    \ sold to customers, the mix of net sales\nderived from products as compared with\
    \ services, the extent to which we owe income or other taxes, competition, management\n\
    of growth, potential fluctuations in operating results, international growth and\
    \ expansion, the outcomes of claims, litigation,\ngovernment investigations, and\
    \ other proceedings, fulfillment, sortation, delivery, and data center optimization,\
    \ risks of\ninventory management, variability in demand, the degree to which the\
    \ Company enters into, maintains, and develops\ncommercial agreements, proposed\
    \ and completed acquisitions and strategic transactions, payments risks, and risks\
    \ of\nfulfillment throughput and productivity. Other risks and uncertainties include,\
    \ among others, risks related to new products,\nservices, and technologies, system\
    \ interruptions, government regulation and taxation, and fraud. In addition, additional\
    \ or\nunforeseen effects from the COVID-19 pandemic and the global economic climate\
    \ may give rise to or amplify many of these\nrisks. More information about factors\
    \ that potentially could affect Amazon.com’s financial results is included in\
    \ Amazon.com’s\nfilings with the Securities and Exchange Commission (“SEC”), including\
    \ its most recent Annual Report on Form 10-K and\nsubsequent filings.\nOur investor\
    \ relations website is amazon.com/ir and we encourage investors to use it as a\
    \ way of easily finding information\nabout us. We promptly make available on this\
    \ website, free of charge, the reports that we file or furnish with the SEC, corporate\n\
    governance information (including our Code of Business Conduct and Ethics), and\
    \ select press releases, which may contain\nmaterial information about us, and\
    \ you may subscribe to be notified of new information posted to this site.\nAbout\
    \ Amazon\nAmazon is guided by four principles: customer obsession rather than\
    \ competitor focus, passion for invention, commitment to\noperational excellence,\
    \ and long-term thinking. Amazon strives to be Earth’s Most Customer-Centric Company,\
    \ Earth’s Best\nEmployer, and Earth’s Safest Place to Work. Customer reviews,\
    \ 1-Click shopping, personalized recommendations, Prime,\nFulfillment by Amazon,\
    \ AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire tablets, Fire TV,\
    \ Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios, and The Climate\
    \ Pledge are some of the things pioneered by Amazon. For more\ninformation, visit\
    \ amazon.com/about and follow @AmazonNews."
