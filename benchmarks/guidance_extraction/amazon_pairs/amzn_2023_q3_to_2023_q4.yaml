  label: Amazon Q3 2023 Earnings Release, October 26, 2023
  text: "AMAZON.COM ANNOUNCES THIRD QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) October\
    \ 26, 2023—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial\nresults\
    \ for its third quarter ended September 30, 2023.\n•\n\n•\n\n•\n\nNet sales increased\
    \ 13% to $143.1 billion in the third quarter, compared with $127.1 billion in\
    \ third quarter 2022.\nExcluding the $1.4 billion favorable impact from year-over-year\
    \ changes in foreign exchange rates throughout the\nquarter, net sales increased\
    \ 11% compared with third quarter 2022.\n•\n\nNorth America segment sales increased\
    \ 11% year-over-year to $87.9 billion.\n\n•\n\nInternational segment sales increased\
    \ 16% year-over-year to $32.1 billion, or increased 11% excluding\nchanges in\
    \ foreign exchange rates.\n\n•\n\nAWS segment sales increased 12% year-over-year\
    \ to $23.1 billion.\n\nOperating income increased to $11.2 billion in the third\
    \ quarter, compared with $2.5 billion in third quarter 2022.\n•\n\nNorth America\
    \ segment operating income was $4.3 billion, compared with an operating loss of\
    \ $0.4 billion in\nthird quarter 2022.\n\n•\n\nInternational segment operating\
    \ loss was $0.1 billion, compared with an operating loss of $2.5 billion in third\n\
    quarter 2022.\n\n•\n\nAWS segment operating income was $7.0 billion, compared\
    \ with operating income of $5.4 billion in third\nquarter 2022.\n\nNet income\
    \ increased to $9.9 billion in the third quarter, or $0.94 per diluted share,\
    \ compared with $2.9 billion, or\n$0.28 per diluted share, in third quarter 2022.\n\
    •\n\nThird quarter 2023 net income includes a pre-tax valuation gain of $1.2 billion\
    \ included in non-operating\nincome (expense) from the common stock investment\
    \ in Rivian Automotive, Inc., compared to a pre-tax\nvaluation gain of $1.1 billion\
    \ from the investment in third quarter 2022.\n\n•\n\nOperating cash flow increased\
    \ 81% to $71.7 billion for the trailing twelve months, compared with $39.7 billion\
    \ for\nthe trailing twelve months ended September 30, 2022.\n\n•\n\nFree cash\
    \ flow improved to an inflow of $21.4 billion for the trailing twelve months,\
    \ compared with an outflow of\n$19.7 billion for the trailing twelve months ended\
    \ September 30, 2022.\n\n•\n\nFree cash flow less principal repayments of finance\
    \ leases and financing obligations improved to an inflow of\n$15.9 billion for\
    \ the trailing twelve months, compared with an outflow of $28.5 billion for the\
    \ trailing twelve months\nended September 30, 2022.\n\n•\n\nFree cash flow less\
    \ equipment finance leases and principal repayments of all other finance leases\
    \ and financing\nobligations improved to an inflow of $20.2 billion for the trailing\
    \ twelve months, compared with an outflow of $21.5\nbillion for the trailing twelve\
    \ months ended September 30, 2022.\n\n\f“We had a strong third quarter as our\
    \ cost to serve and speed of delivery in our Stores business took another step\
    \ forward, our\nAWS growth continued to stabilize, our Advertising revenue grew\
    \ robustly, and overall operating income and free cash flow\nrose significantly,”\
    \ said Andy Jassy, Amazon CEO. “The benefits of moving from a single national\
    \ fulfillment network in the\nU.S. to eight distinct regions are exceeding our\
    \ optimistic expectations, and perhaps most importantly, putting us on pace to\n\
    deliver the fastest delivery speeds for Prime customers in our 29-year history.\
    \ The AWS team continues to innovate and deliver\nat a rapid clip, particularly\
    \ in generative AI, where the combination of our custom AI chips, Amazon Bedrock\
    \ being the easiest\nand most flexible way to build and deploy generative AI applications,\
    \ and our coding companion (CodeWhisperer) allowing\nenterprises to have the equivalent\
    \ of an experienced engineer who understands all of their proprietary code is\
    \ driving\nmomentum with customers, including adidas, Booking.com, GoDaddy, LexisNexis,\
    \ Merck, Royal Philips, and United Airlines,\nall of whom are starting to run\
    \ generative AI workloads on AWS. Between AWS re:Invent and our 29th holiday shopping\n\
    season, this is a particularly action-packed time of year at Amazon and we’re\
    \ excited for what’s to come.”\nHighlights\nObsessing over the customer experience\n\
    Amazon obsesses over how to make customers’ lives better and easier every day\
    \ with new and improved products and services.\nThis is true for consumers, sellers,\
    \ brands, developers, enterprises, and creators. For example, Amazon:\n•\n\nSold\
    \ hundreds of millions of items worldwide during Prime Big Deal Days, Amazon’s\
    \ largest two-day October\nholiday kick-off event ever. Prime members across 19\
    \ countries saved more than $1 billion on millions of deals. On\nthe first day\
    \ of the event, U.S. Prime members purchased more than 25 million items with Same-Day\
    \ or Next-Day\nDelivery, with hundreds of thousands of items delivered within\
    \ four hours of purchase.\n\n•\n\nAnnounced new Buy with Prime features to help\
    \ merchants grow their businesses on their own websites, such as the\nability\
    \ to integrate Buy with Prime with Shopify. The Buy with Prime app for Shopify\
    \ will make it easier for Shopify\nmerchants to manage their businesses, with\
    \ inventory, pricing, and promotions automatically synced in one place. In\naddition,\
    \ Buy with Prime Assist enables merchants to offer 24/7 post-order customer service\
    \ support at no additional\ncost, and the Buy with Prime cart feature allows customers\
    \ to purchase multiple Buy with Prime products in one\ntransaction from a single\
    \ merchant.\n\n•\n\nAnnounced new offerings to help customers get and stay healthy,\
    \ including an expanded Amazon Clinic virtual health\ncare marketplace now available\
    \ across the U.S. to provide care for more than 35 conditions, and 60-minute delivery\
    \ of\nmedications through Amazon Pharmacy using Prime Air drones in College Station,\
    \ Texas. Additionally, Amazon\nPharmacy partnered with Blue Shield of California\
    \ on a first-of-its-kind model to provide more affordable pharmacy\ncare to its\
    \ members, where Amazon Pharmacy will offer fast, free home delivery of prescription\
    \ medications to more\nthan 4.8 million Blue Shield of California members, starting\
    \ in 2025.\n\n•\n\nPartnered with BuzzFeed, Hearst Newspapers, Pinterest, Raptive,\
    \ and Ziff Davis brands like Lifehacker and Mashable,\namong others, to display\
    \ sponsored product ads on their apps and websites for products sold in Amazon’s\
    \ U.S. store.\nThese third-party ad partnerships will make it easier for customers\
    \ to move from inspiration to buying in one or two\nclicks.\n\n•\n\nAttracted\
    \ 15.1 million viewers for the Thursday Night Football (TNF) season opener, Prime\
    \ Video’s most watched\nTNF game ever, according to Nielsen. Through the first\
    \ six games, TNF averaged 12.9 million viewers, an increase of\n25% from last\
    \ season’s six-game average, according to Nielsen. Season to date, the median\
    \ age for TNF viewers is 47,\nwhich is seven years younger than the median age\
    \ watching the NFL on linear networks.\n\n•\n\nDebuted the second season of Amazon\
    \ Original series The Summer I Turned Pretty, which had double the global\naudience\
    \ in the first three days compared to Season One. In addition, for the first seven\
    \ weeks after its debut, it was the\nmost viewed series on Prime Video in over\
    \ 100 countries.\n\n•\n\nReleased Amazon Original films and series A Million Miles\
    \ Away, the real-life story of NASA flight engineer José\nHernández; Red, White\
    \ & Royal Blue, the romantic comedy based on Casey McQuiston’s New York Times\
    \ best-selling\nnovel; The Burial, a true story exposing corporate corruption\
    \ and racial injustice, starring Jamie Foxx and Tommy Lee\nJones; Sitting in Bars\
    \ with Cake, the story of baking and best friends; and Gen V, an expansion of\
    \ The Boys Universe.\nAmazon also premiered the second seasons of the hit young-adult\
    \ drama The Summer I Turned Pretty and the fantasy\nseries The Wheel of Time,\
    \ and rebooted the globally beloved soap opera Neighbours.\n\n•\n\nPremiered new\
    \ films from Amazon MGM Studios, including American Fiction, which won the People’s\
    \ Choice\nAward at the Toronto International Film Festival. The film will begin\
    \ its theatrical release in December. Amazon\nMGM Studios also released the indie\
    \ film Bottoms, which opened in select U.S. markets on August 25.\n\n\f•\n\nLaunched\
    \ Prime Video Channels and the Prime Video Store in Chile and Colombia, and grew\
    \ Prime Video’s\ninternational slate of content with more than 40 local Amazon\
    \ Originals and live sporting events. This includes: The\nLost Flowers of Alice\
    \ Hart (Australia), Cangaço Novo (Brazil), Los Iniciados (Colombia), All or Nothing:\
    \ The\nGerman National Team in Qatar (Germany), Made in Heaven (India), The Ferragnez\
    \ - The Series (Italy), Sanremo\nSpecial (Italy), and Wilderness (UK).\n\n•\n\n\
    Entered a strategic collaboration to advance generative AI with Anthropic. As\
    \ part of the expanded collaboration,\nAnthropic selected AWS as its primary cloud\
    \ provider and will build and deploy future generations of its foundation\nmodels\
    \ on AWS Trainium and AWS Inferentia chips. Anthropic plans to run the majority\
    \ of its workloads on AWS\nand will also provide AWS customers with access to\
    \ future generations of its foundation models via Amazon Bedrock.\nAmazon developers\
    \ and engineers will have the opportunity to build with Anthropic models to enhance\
    \ existing\napplications and create new customer experiences.\n\n•\n\nAnnounced\
    \ new AI-driven commitments and expansions from AWS customers.\n\n•\n\n•\n\nBMW\
    \ Group selected AWS to power its next-generation of automated driving platform,\
    \ which will use\nBMW's preexisting Cloud Data Hub on AWS, and will use AWS compute,\
    \ generative AI, Internet of Things\n(IoT), machine learning (ML), and storage\
    \ capabilities to help accelerate the delivery of highly automated\nBMW vehicles.\n\
    \n•\n\nUK-based bank NatWest expanded its partnership with AWS to accelerate the\
    \ responsible use of AI and cocreate AI products on foundation models available\
    \ through Amazon Bedrock to enhance the financial wellbeing of its 10 million\
    \ customers.\n\n•\n\nOccidental, an international energy company and carbon management\
    \ leader, selected AWS as its preferred\ncloud provider to improve operational\
    \ efficiencies, reduce IT infrastructure costs, and develop systems for\ncarbon\
    \ removal plants, which are expected to capture 1 million metric tons per year.\
    \ Occidental is leveraging\nAWS analytics and ML services like Amazon Elastic\
    \ Compute Cloud (Amazon EC2), Amazon Elastic Block\nStore (Amazon EBS) to scale\
    \ IT resources, and AWS Lake Formation to increase efficiencies and extract\n\
    greater value from operational data.\n\n•\n\nPwC announced a collaboration with\
    \ AWS to deliver a goal of $800 million in business value to clients and\nstrengthen\
    \ PwC’s offerings, including cloud migration and modernization, data and analytics,\
    \ cybersecurity\nand risk, customer experience, managed services, generative AI,\
    \ and climate reporting and transition to netzero carbon emissions.\n\n•\n\nEVERSANA,\
    \ provider of commercial services to the global life sciences industry, teamed\
    \ up with AWS to\nuse Amazon Bedrock to accelerate generative AI use cases to\
    \ help pharmaceutical and life science\nmanufacturers drive efficiencies and business\
    \ value while improving patient outcomes.\n\n•\n\nDS Smith, a sustainable packaging\
    \ provider, will leverage AWS’s global infrastructure, advanced analytics,\nIoT,\
    \ AI, and ML to derive deeper business intelligence, deliver new digital customer\
    \ experiences, and drive\nautomation at scale across its supply chain, including\
    \ real-time monitoring of manufacturing capacity and\nsupply chain management\
    \ to support sustainability targets.\n\n•\n\nAbdul Latif Jameel, an internationally\
    \ diversified business, selected AWS as its preferred cloud provider to\nuse AWS\
    \ analytics, ML, and Amazon Bedrock to develop generative AI applications that\
    \ will help car\nmanufacturers offer digital showroom experiences for customers\
    \ and enhance in-car experiences, while\nreducing development costs.\n\n•\n\n\
    South Korean game developer NCSOFT launched seven large language models (LLMs)\
    \ on Amazon\nSageMaker JumpStart to democratize generative AI in Korea and accelerate\
    \ development of new gaming and\ncreative applications.\n\n•\n\nGenpact, a global\
    \ professional services firm, expanded its relationship with AWS to transform\
    \ its financial\ncrime risk operations by leveraging generative AI and LLMs. Genpact\
    \ is accelerating efficiencies and impact\nfor their clients by integrating their\
    \ proprietary cloud-based financial crime suite with Amazon Bedrock.\n\nContinued\
    \ to expand AWS’s infrastructure footprint to support customers by launching the\
    \ AWS Israel (Tel Aviv)\nRegion and a new AWS Local Zone in Phoenix, Arizona.\
    \ The AWS Israel (Tel Aviv) Region is estimated to support\nan average of 7,700\
    \ full-time equivalent jobs annually through a planned investment of $7.2 billion\
    \ through 2037.\n\n\fInventing on behalf of customers\nAmazon is driven by a passion\
    \ for invention across all of its business areas. The company builds new products\
    \ and services that\ncustomers ask for, and also invents new ones that customers\
    \ didn’t know they wanted but make their lives or businesses better\nin some meaningful\
    \ way. For example, Amazon:\n•\n\nLaunched product review highlights, a new generative\
    \ AI–powered feature that lets shoppers in Amazon’s U.S. store\nquickly determine\
    \ what other customers are saying about a product before reading through reviews.\
    \ Review highlights\nprovide a short paragraph on the product detail page with\
    \ features and customer sentiment frequently mentioned across\nreviews.\n\n•\n\
    \nIntroduced generative AI capabilities to help sellers create product listings\
    \ as part of numerous innovations at\nAccelerate 2023, Amazon’s annual seller\
    \ conference. Other announcements included an end-to-end, fully automated\nset\
    \ of supply chain services called Supply Chain by Amazon that allows sellers to\
    \ quickly and reliably move products\ndirectly from their manufacturers to customers.\
    \ In India, Amazon also announced a generative AI–based digital\nassistant to\
    \ help small businesses establish an ecommerce presence. The tool will help sellers\
    \ with registration, listing,\nand advertising.\n\n•\n\nPreviewed a smarter and\
    \ more conversational Alexa, powered by generative AI and an LLM custom-built\
    \ for voice\ninteractions. New conversational AI capabilities include the ability\
    \ to make multiple requests at once, make more\nambiguous smart home requests,\
    \ set up an Alexa Routine entirely by voice instead of the app, and make more\
    \ natural\nand conversational requests without having to use specific phrases\
    \ or device names.\n\n•\n\nAnnounced new LLM tools that will make it easier for\
    \ developers to create more conversational and intuitive Alexa\nexperiences for\
    \ their customers. Brands using these new tools include BMW, Character.AI, iRobot,\
    \ Philips Hue,\nSplash, and Volley.\n\n•\n\nIntroduced the next-generation Echo\
    \ Show 8 built-in smart home hub that can process common smart home requests\n\
    40% faster than previous generations, Echo Hub smart home control panel to manage\
    \ smart home devices, and nextgeneration Echo Frames smart audio glasses with\
    \ hands-free access to Alexa, extended battery life, and improved\naudio.\n\n\
    •\n\nAnnounced updates to the Fire TV experience, including an enhanced AI-powered\
    \ Fire TV voice search, so customers\ncan ask Alexa open-ended questions about\
    \ TV shows and movies using conversational language; a “Continue\nWatching” row\
    \ that aggregates content from streaming entertainment providers, including Amazon\
    \ Freevee, Disney+,\nHulu, MGM+, Peacock, and STARZ; and an AI Art feature, so\
    \ customers can create artwork on their Fire TV devices\nusing their voice.\n\n\
    •\n\nUnveiled the Fire TV Stick 4K Max, which comes with the Fire TV Ambient Experience\
    \ that turns the TV into an\nalways-smart display so customers can see Calendars\
    \ and Reminders, control smart devices, or play audio. Amazon\nalso introduced\
    \ the Fire TV Stick 4K with support for Wi-Fi 6, and the Fire TV Soundbar that\
    \ provides room-filling\nsound with support for DTS Virtual:X and Dolby Audio.\n\
    \n•\n\nExpanded home security offerings with the Ring Stick Up Cam Pro, giving\
    \ customers an aerial perspective to pinpoint\nand send more accurate alerts;\
    \ Blink Outdoor 4, with improved image quality for person detection; and Blink\
    \ Sync\nModule Pro with extended range, giving customers options in where they\
    \ install their cameras.\n\n•\n\nIntroduced eero Max 7, which combines patented\
    \ TrueMesh networking technology with the latest Wi-Fi 7 standard to\ndramatically\
    \ increase speeds, avoid interference, and improve latency.\n\n•\n\nKicked off\
    \ Project Kuiper’s Protoflight mission with the launch of two prototype satellites\
    \ aboard an Atlas V rocket\nfrom United Launch Alliance. Project Kuiper, Amazon’s\
    \ low Earth orbit satellite broadband initiative, will use this\nmultimonth mission\
    \ to test its satellites and network from space, and collect data ahead of the\
    \ planned start of satellite\nproduction later this year. Project Kuiper also\
    \ announced a partnership with Vodafone and Vodacom to extend the\nreach of their\
    \ 4G/5G networks in Africa and Europe, provide backup to businesses, scale for\
    \ major events, and quickly\nrecover after disasters.\n\n•\n\nEnhanced the viewing\
    \ experience for Thursday Night Football with AI-driven features powered by AWS,\
    \ such as\nPrime Targets and Defensive Alerts. Prime Targets uses ML to highlight\
    \ which receivers are in position to convert a\nfirst down. Defensive Alerts uses\
    \ a generative AI model that grows more accurate over time to identify players\
    \ that are\nlikely to rush the quarterback.\n\n•\n\nAnnounced new AWS technologies\
    \ and capabilities that help customers of all sizes take advantage of generative\
    \ AI,\nimprove productivity, and enhance their security posture. Customers are\
    \ using Amazon Bedrock to bring generative AI\nto their businesses, including\
    \ adidas, Booking.com, Bridgewater Associates, Clariant, Coda, GoDaddy, LexisNexis\n\
    \n\fLegal & Professional, Lonely Planet, Merck, Royal Philips, Showpad, Travelers,\
    \ and United Airlines. New offerings\ninclude:\n•\n\nGeneral availability of Amazon\
    \ Bedrock, a fully managed service that offers leading foundation models as a\n\
    single application programming interface (API), along with capabilities that help\
    \ customers build generative\nAI applications, simplifying development while maintaining\
    \ privacy and security.\n\n•\n\nMore choice for Amazon Bedrock customers with\
    \ the addition of Meta as a model provider. Amazon Bedrock\nis the first service\
    \ to offer Meta’s Llama 2 model as a fully managed service available through a\
    \ single API.\n\n•\n\nNew model customization capability for Amazon CodeWhisperer,\
    \ an AI-powered coding companion,\nallowing organizations to securely customize\
    \ CodeWhisperer suggestions to include their internal code base.\n\n•\n\nAWS Entity\
    \ Resolution, an ML-powered analytics service that helps organizations improve\
    \ the quality of\ntheir data by analyzing, matching, and linking related consumer,\
    \ business, and product records stored across\nmultiple applications, channels,\
    \ and data stores.\n\n•\n\nNew business intelligence authoring capabilities for\
    \ Amazon QuickSight, so data analysts can use natural\nlanguage queries to ask\
    \ forecast and “why” questions, receive accurate answers, and create compelling\n\
    visualizations in seconds.\n\nEmpowering employees and delivery service partners\n\
    In addition to its focus on customers, Amazon strives to make every day better\
    \ for its employees and delivery service partners.\nFor example, the company:\n\
    •\n\nAnnounced that Amazon will hire 250,000 full-time, part-time, and seasonal\
    \ employees in the U.S. this holiday\nseason. Amazon also announced its largest-ever\
    \ annual investment in U.S. hourly employee pay—$1.3 billion—\nbringing the new\
    \ average hourly wage for customer fulfillment and delivery roles to more than\
    \ $20.50 per hour. Over\nthe last five years, Amazon has invested $10 billion\
    \ in hourly employee wages.\n\n•\n\nAdded 14 benefits to Amazon’s FamilyFlex program,\
    \ which provides operations employees and their family members\nwith tools to\
    \ help them achieve personal and professional growth. New benefits include financial\
    \ wellness resources,\nmental health offerings, and temporary schedule adjustment\
    \ policies for flexibility. Amazon also extended its familybuilding and fertility\
    \ benefits to support more than 1 million employees and their partners across\
    \ Africa, Asia-Pacific,\nEurope, Latin America, and the Middle East.\n\n•\n\n\
    Announced an $840 million investment in the Delivery Service Partner (DSP) program\
    \ in the U.S. to support DSPs in\nproviding higher wages and more benefits to\
    \ drivers, including childcare-support services and tuition reimbursement\nfor\
    \ coursework at accredited universities as part of the Next Mile education program,\
    \ which already offers access to\nmore than 2,000 academic programs and up to\
    \ $5,250 in annual tuition coverage.\n\nSupporting communities and protecting\
    \ the environment\nAmazon believes that success and scale bring broad responsibility\
    \ to help the planet, future generations, and communities.\nAmazon employees have\
    \ passion for investing in these areas, and a sampling of the efforts from this\
    \ past quarter are that\nAmazon:\n•\n\nSupporting humanitarian aid efforts amid\
    \ the Israel-Hamas war. Amazon is focused on ensuring that employees in the\n\
    area are safe and have access to resources such as My HR Live Support, where employees\
    \ can discuss their specific\nsituations with advisers, and the Employee Assistance\
    \ Program, which provides resources to support employees and\ntheir families.\
    \ Amazon’s disaster relief team has been in close contact with international humanitarian\
    \ relief partners\nand is making financial contributions to these organizations.\
    \ Amazon is making it easy for employees to contribute to\nthem through Amazon\
    \ GIVEhub, an internal tool to support volunteerism, donations, and community\
    \ engagement.\n\n•\n\nActivated Amazon’s disaster relief teams to provide support\
    \ in response to the Maui wildfires, Hurricane Idalia in\nFlorida, and the earthquake\
    \ in Morocco. Amazon mobilized its global logistics infrastructure and inventory,\
    \ and\nquickly donated more than 300,000 relief items. Additionally, AWS helped\
    \ set up temporary communications\ninfrastructure to provide internet and phone\
    \ connectivity in Maui in collaboration with the Information Technology\nDisaster\
    \ Resource Center, and funded mappers to assess the earthquake-affected areas\
    \ in Morocco.\n\n•\n\nCommitted to promoting the safe, secure, and transparent\
    \ development of AI technology in collaboration with the\nWhite House, policymakers,\
    \ technology organizations, and the AI community. The commitment builds on Amazon’s\n\
    approach to responsible AI development and lays the groundwork for enhancing the\
    \ benefits of AI and minimizing its\nrisks.\n\n\f•\n\nPublished the company’s\
    \ latest Economic Impact Study, which estimates that Amazon generated more than\
    \ $240\nbillion in investment in the U.S. in 2022 and supported more than 2 million\
    \ indirect jobs across industries such as\nlogistics, construction, hospitality,\
    \ and professional services, among others.\n\n•\n\nAnnounced a $40 million program\
    \ to help moderate-income residents in Amazon’s hometown communities become\n\
    homeowners. As part of the Amazon Housing Equity Fund, this is the first program\
    \ aimed at homeownership—helping\nmembers in these communities purchase homes\
    \ and build generational wealth.\n\n•\n\nCelebrated its annual Global Month of\
    \ Volunteering in September, when tens of thousands of Amazon employees in\nmore\
    \ than 50 countries volunteered with over 400 community organizations around the\
    \ world.\n\n•\n\nAnnounced that 90% of electricity consumed by Amazon in 2022\
    \ was powered by renewable energy sources—up\nfrom 85% in 2021. From 2014 through\
    \ 2022, Amazon’s wind and solar farms helped generate $12.6 billion in\ninvestments\
    \ for communities around the world, and contributed more than $5.4 billion in\
    \ global gross domestic\nproduct (GDP). Amazon now has more than 400 wind and\
    \ solar projects globally.\n\n•\n\nAnnounced that the company will require suppliers\
    \ to share their carbon emissions data with Amazon and set carbon\ngoals beginning\
    \ in 2024, and that Amazon will provide tools and resources to help suppliers\
    \ reach their goals. Amazon\nalso announced the Sustainability Solutions Hub,\
    \ a new resource to help independent sellers in France, Germany, Italy,\nSpain,\
    \ UK, and U.S. with product and packaging sustainability efforts.\n\n•\n\nInvested\
    \ in direct air capture, a technology that chemically scrubs carbon dioxide from\
    \ the air before storing it deep\nunderground or in applications like building\
    \ materials and low-carbon fuels, from 1PointFive and CarbonCapture Inc.\n\n•\n\
    \nAnnounced that in 2022 Amazon decreased single-use plastic by 11.6% across its\
    \ global operations by expanding\npaper-based packaging, continuing to use lighter\
    \ and more flexible packaging, and eliminating packaging altogether\nwhere possible.\n\
    \nFinancial Guidance\nThe following forward-looking statements reflect Amazon.com’s\
    \ expectations as of October 26, 2023, and are subject to\nsubstantial uncertainty.\
    \ Our results are inherently unpredictable and may be materially affected by many\
    \ factors, such as\nfluctuations in foreign exchange rates, changes in global\
    \ economic and geopolitical conditions and customer demand and\nspending (including\
    \ the impact of recessionary fears), inflation, interest rates, regional labor\
    \ market constraints, world events,\nthe rate of growth of the Internet, online\
    \ commerce, cloud services, and new and emerging technologies, and the various\
    \ factors\ndetailed below.\nFourth Quarter 2023 Guidance\n•\n•\n•\n\nNet sales\
    \ are expected to be between $160.0 billion and $167.0 billion, or to grow between\
    \ 7% and 12% compared\nwith fourth quarter 2022. This guidance anticipates a favorable\
    \ impact of approximately 40 basis points from foreign\nexchange rates.\nOperating\
    \ income is expected to be between $7.0 billion and $11.0 billion, compared with\
    \ $2.7 billion in fourth\nquarter 2022.\nThis guidance assumes, among other things,\
    \ that no additional business acquisitions, restructurings, or legal\nsettlements\
    \ are concluded.\n\nA conference call will be webcast live today at 2:30 p.m.\
    \ PT/5:30 p.m. ET, and will be available for at least three months at\namazon.com/ir.\
    \ This call will contain forward-looking statements and other material information\
    \ regarding the Company’s\nfinancial and operating results.\nThese forward-looking\
    \ statements are inherently difficult to predict. Actual results and outcomes\
    \ could differ materially for a\nvariety of reasons, including, in addition to\
    \ the factors discussed above, the amount that Amazon.com invests in new business\n\
    opportunities and the timing of those investments, the mix of products and services\
    \ sold to customers, the mix of net sales\nderived from products as compared with\
    \ services, the extent to which we owe income or other taxes, competition, management\n\
    of growth, potential fluctuations in operating results, international growth and\
    \ expansion, the outcomes of claims, litigation,\ngovernment investigations, and\
    \ other proceedings, fulfillment, sortation, delivery, and data center optimization,\
    \ risks of\ninventory management, variability in demand, the degree to which the\
    \ Company enters into, maintains, and develops\ncommercial agreements, proposed\
    \ and completed acquisitions and strategic transactions, payments risks, and risks\
    \ of\nfulfillment throughput and productivity. Other risks and uncertainties include,\
    \ among others, risks related to new products,\nservices, and technologies, system\
    \ interruptions, government regulation and taxation, and fraud. In addition, global\
    \ economic\nand geopolitical conditions and additional or unforeseen circumstances,\
    \ developments, or events may give rise to or amplify\nmany of these risks. More\
    \ information about factors that potentially could affect Amazon.com’s financial\
    \ results is included in\n\n\fAmazon.com’s filings with the Securities and Exchange\
    \ Commission (“SEC”), including its most recent Annual Report on\nForm 10-K and\
    \ subsequent filings.\nOur investor relations website is amazon.com/ir and we\
    \ encourage investors to use it as a way of easily finding information\nabout\
    \ us. We promptly make available on this website, free of charge, the reports\
    \ that we file or furnish with the SEC, corporate\ngovernance information (including\
    \ our Code of Business Conduct and Ethics), and select press releases, which may\
    \ contain\nmaterial information about us, and you may subscribe to be notified\
    \ of new information posted to this site.\nAbout Amazon\nAmazon is guided by four\
    \ principles: customer obsession rather than competitor focus, passion for invention,\
    \ commitment to\noperational excellence, and long-term thinking. Amazon strives\
    \ to be Earth’s Most Customer-Centric Company, Earth’s Best\nEmployer, and Earth’s\
    \ Safest Place to Work. Customer reviews, 1-Click shopping, personalized recommendations,\
    \ Prime,\nFulfillment by Amazon, AWS, Kindle Direct Publishing, Kindle, Career\
    \ Choice, Fire tablets, Fire TV, Amazon Echo, Alexa,\nJust Walk Out technology,\
    \ Amazon Studios, and The Climate Pledge are some of the things pioneered by Amazon.\
    \ For more\ninformation, visit amazon.com/about and follow @AmazonNews."
- id: q4_2023
  label: Amazon Q4 2023 Earnings Release, February 1, 2024
  text: "AMAZON.COM ANNOUNCES FOURTH QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) February\
    \ 1, 2024—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its fourth quarter ended December 31, 2023.\nFourth Quarter 2023\n•\n\n•\n\
    \n•\n\nNet sales increased 14% to $170.0 billion in the fourth quarter, compared\
    \ with $149.2 billion in fourth quarter 2022.\nExcluding the $1.3 billion favorable\
    \ impact from year-over-year changes in foreign exchange rates throughout the\n\
    quarter, net sales increased 13% compared with fourth quarter 2022.\n•\n\nNorth\
    \ America segment sales increased 13% year-over-year to $105.5 billion.\n\n•\n\
    \nInternational segment sales increased 17% year-over-year to $40.2 billion, or\
    \ increased 13% excluding\nchanges in foreign exchange rates.\n\n•\n\nAWS segment\
    \ sales increased 13% year-over-year to $24.2 billion.\n\nOperating income increased\
    \ to $13.2 billion in the fourth quarter, compared with $2.7 billion in fourth\
    \ quarter 2022.\n•\n\nNorth America segment operating income was $6.5 billion,\
    \ compared with an operating loss of $0.2 billion in\nfourth quarter 2022.\n\n\
    •\n\nInternational segment operating loss was $0.4 billion, compared with an operating\
    \ loss of $2.2 billion in\nfourth quarter 2022.\n\n•\n\nAWS segment operating\
    \ income was $7.2 billion, compared with operating income of $5.2 billion in fourth\n\
    quarter 2022.\n\nNet income increased to $10.6 billion in the fourth quarter,\
    \ or $1.00 per diluted share, compared with $0.3 billion, or\n$0.03 per diluted\
    \ share, in fourth quarter 2022.\n•\n\nFourth quarter 2023 net income includes\
    \ a pre-tax valuation loss of $0.1 billion included in non-operating\nincome (expense)\
    \ from the common stock investment in Rivian Automotive, Inc., compared to a pre-tax\n\
    valuation loss of $2.3 billion from the investment in fourth quarter 2022.\n\n\
    Full Year 2023\n•\n\n•\n\nNet sales increased 12% to $574.8 billion in 2023, compared\
    \ with $514.0 billion in 2022. Excluding the $0.1 billion\nunfavorable impact\
    \ from year-over-year changes in foreign exchange rates throughout the year, net\
    \ sales increased\n12% compared with 2022.\n•\n\nNorth America segment sales increased\
    \ 12% year-over-year to $352.8 billion.\n\n•\n\nInternational segment sales increased\
    \ 11% year-over-year to $131.2 billion.\n\n•\n\nAWS segment sales increased 13%\
    \ year-over-year to $90.8 billion.\n\nOperating income increased to $36.9 billion\
    \ in 2023, compared with $12.2 billion in 2022.\n•\n\nNorth America segment operating\
    \ income was $14.9 billion, compared with an operating loss of $2.8 billion\n\
    in 2022.\n\n•\n\nInternational segment operating loss was $2.7 billion, compared\
    \ with an operating loss of $7.7 billion in\n2022.\n\n•\n\nAWS segment operating\
    \ income was $24.6 billion, compared with operating income of $22.8 billion in\
    \ 2022.\n\n\f•\n\nNet income was $30.4 billion in 2023, or $2.90 per diluted share,\
    \ compared with a net loss of $2.7 billion, or $0.27\nper diluted share, in 2022.\n\
    •\n\n2023 net income includes a pre-tax valuation gain of $0.8 billion included\
    \ in non-operating income (expense)\nfrom the common stock investment in Rivian\
    \ Automotive, Inc., compared to a pre-tax valuation loss of $12.7\nbillion from\
    \ the investment in 2022.\n\n•\n\nOperating cash flow increased 82% to $84.9 billion\
    \ for the trailing twelve months, compared with $46.8 billion for\nthe trailing\
    \ twelve months ended December 31, 2022.\n\n•\n\nFree cash flow improved to an\
    \ inflow of $36.8 billion for the trailing twelve months, compared with an outflow\
    \ of\n$11.6 billion for the trailing twelve months ended December 31, 2022.\n\n\
    •\n\nFree cash flow less principal repayments of finance leases and financing\
    \ obligations improved to an inflow of\n$32.2 billion for the trailing twelve\
    \ months, compared with an outflow of $19.8 billion for the trailing twelve months\n\
    ended December 31, 2022.\n\n•\n\nFree cash flow less equipment finance leases\
    \ and principal repayments of all other finance leases and financing\nobligations\
    \ improved to an inflow of $35.5 billion for the trailing twelve months, compared\
    \ with an outflow of $12.8\nbillion for the trailing twelve months ended December\
    \ 31, 2022.\n\n“This Q4 was a record-breaking Holiday shopping season and closed\
    \ out a robust 2023 for Amazon,” said Andy Jassy, Amazon\nCEO. “While we made\
    \ meaningful revenue, operating income, and free cash flow progress, what we’re\
    \ most pleased with is the\ncontinued invention and customer experience improvements\
    \ across our businesses. The regionalization of our U.S. fulfillment\nnetwork\
    \ led to our fastest-ever delivery speeds for Prime members while also lowering\
    \ our cost to serve; AWS’s continued\nlong-term focus on customers and feature\
    \ delivery, coupled with new genAI capabilities like Bedrock, Q, and Trainium\
    \ have\nresonated with customers and are starting to be reflected in our overall\
    \ results; our Advertising services continue to improve\nand drive positive results;\
    \ our newer businesses are progressing nicely, and along with our more established\
    \ businesses,\ncollectively making customers’ lives easier and better every day.\
    \ As we enter 2024, our teams are delivering at a rapid clip, and\nwe have a lot\
    \ in front of us to be excited about.”\nHighlights\nObsessing over the customer\
    \ experience\nAmazon obsesses over how to make customers’ lives better and easier\
    \ every day with new and improved products and services.\nThis is true for consumers,\
    \ sellers, brands, developers, enterprises, and creators. For example, Amazon:\n\
    •\n\nHeld a record-breaking Black Friday and Cyber Monday holiday shopping event.\
    \ Customers worldwide purchased\nmore than 1 billion items on Amazon and saved\
    \ nearly 70% more during the 11 days of deals compared to the same\nperiod in\
    \ 2022. In the U.S., customers ordered more than 500 million items from independent\
    \ sellers, most of which\nare small and medium-sized businesses, and millions\
    \ of customers signed up for a Prime membership. Through the\nentire holiday season,\
    \ customers purchased more items on Amazon than during any previous holiday season.\n\
    \n•\n\nContinued to delight customers with fast and convenient delivery. In 2023,\
    \ Amazon delivered to Prime members at the\nfastest speeds ever globally, with\
    \ more than 7 billion units arriving the same or next day, including more than\
    \ 4 billion\nin the U.S. and more than 2 billion in Europe. Amazon now offers\
    \ Same-Day Delivery in more than 110 U.S. metro\nareas and operates more than\
    \ 55 dedicated Same-Day sites across the U.S. The company increased the number\
    \ of items\ndelivered through these sites the same day or overnight by more than\
    \ 65% year-over-year in the fourth quarter and\ncelebrated the delivery of its\
    \ billionth package from a Same-Day site in December 2023.\n\n•\n\nEntered a strategic\
    \ partnership with Hyundai to bring innovative new experiences to customers. In\
    \ 2024, Amazon will\nlaunch online vehicle sales in the U.S., starting with Hyundai.\
    \ In addition, Hyundai selected AWS as its preferred\ncloud provider to accelerate\
    \ its digital transformation, and starting in 2025, customers who purchase Hyundai’s\
    \ nextgeneration vehicles will have access in their vehicles to the same hands-free\
    \ Alexa experience that they have at home.\n\n•\n\nAnnounced that Prime members\
    \ in the U.S. can now add health care from One Medical to their Prime membership\
    \ for\n$9 per month (or $99 annually) and include up to five additional family\
    \ members for $6 per month each, making it\neasier for Prime members to get high-quality\
    \ primary care in the U.S. This represents savings of up to $100 off the\nstandard\
    \ One Medical membership fee for individuals and up to $133 for families.\n\n\
    •\n\nExpanded Amazon Fresh grocery delivery and free pickup to customers without\
    \ a Prime membership in the U.S. The\ncompany also redesigned multiple Amazon\
    \ Fresh stores in the UK and U.S. and opened several new Whole Foods\n\n\fMarket\
    \ stores in the U.S. It also expanded third-party grocery delivery with additional\
    \ Weis Markets supermarkets in\nthe U.S. and ARCS Supermarket in Japan.\n•\n\n\
    Added three Buy with Prime shopping benefits for Prime members, including the\
    \ ability for customers to view, track,\nand manage orders from participating\
    \ retailers in their Amazon account; access 24/7 to live-chat support managed\
    \ by\nAmazon; and access to an expanded number of return locations, as well as\
    \ box and label-free returns.\n\n•\n\nHad approximately 1 billion customer visits\
    \ to Amazon.in during Amazon India’s month-long Great Indian Festival\nsales event.\
    \ During the event, more than 4 million customers made a purchase on Amazon.in\
    \ for the first time.\n\n•\n\nAnnounced that Prime Air drone deliveries will expand\
    \ to Italy, the UK, and an additional location in the U.S. in late\n2024. Amazon\
    \ will also integrate drone deliveries into the company’s Same-Day sites, which\
    \ will provide customers\nwith faster delivery on a greater selection of items.\
    \ Prime Air uses drones to safely deliver packages weighing up to\nfive pounds\
    \ in one hour or less.\n\n•\n\nExpanded tools and resources for Amazon sellers\
    \ in China, including announcing an Innovation Center dedicated to\nsellers, introducing\
    \ Supply Chain by Amazon for sellers in China, and establishing five regional\
    \ global selling centers,\nall with the goal to expand opportunities for sellers\
    \ to help them grow their businesses.\n\n•\n\nIncreased total viewership for the\
    \ second season of Thursday Night Football (TNF) on Prime Video by 24% year over\n\
    year, and had double-digit growth (14%) for the second consecutive season in the\
    \ hard-to-reach 18–34-year-old\ndemographic, according to Nielsen. The November\
    \ 30 Seahawks-Cowboys game attracted 15.3 million viewers,\nbecoming Prime Video’s\
    \ most watched TNF game ever, according to Nielsen.\n\n•\n\nReleased 16 films\
    \ and series from Amazon MGM Studios, including the second season of Reacher,\
    \ which was the No.\n1 title on Nielsen’s Top 10 Originals Streaming chart for\
    \ the week it debuted and had the highest number of minutes\nviewed for any Prime\
    \ Video title during a single week in 2023 according to Nielsen; second season\
    \ of Invincible, the\nmost-viewed animated series ever on Prime Video globally;\
    \ holiday comedy Candy Cane Lane, one of the top 10\nmost-watched worldwide film\
    \ debuts ever on Prime Video; thriller Saltburn, which had the highest week-over-week\n\
    audience growth of any film on Prime Video in 2023; dramedy American Fiction;\
    \ and sports drama The Boys in the\nBoat. This awards season, Amazon MGM Studios\
    \ earned 16 Golden Globe nominations, 68 Emmy nominations and\nnine wins, and\
    \ 21 Critics Choice Award nominations for content such as American Fiction, Saltburn,\
    \ Daisy Jones &\nThe Six, The Marvelous Mrs. Maisel, and The Boys. For the upcoming\
    \ Oscars, the studio earned five nominations for\nAmerican Fiction, including\
    \ for Best Picture.\n\n•\n\nGrew Prime Video’s international slate of content\
    \ with more than 60 local Amazon Originals, including Mr. Dressup:\nThe Magic\
    \ of Make-Believe (Canada), which was winner of the 2023 People’s Choice Award\
    \ for Documentary at the\nToronto International Film Festival; Sayen: La Ruta\
    \ Seca (Chile), the action-packed sequel to the most watched Latin\nAmerican Original\
    \ movie ever on Prime Video; Operación Triunfo (Spain), Prime Video’s first weekly\
    \ live\nentertainment show; and 007: Road To A Million (UK), the world’s first\
    \ James Bond television format, which was No.\n1 on Prime Video in 27 countries\
    \ worldwide on its launch weekend.\n\n•\n\nExpanded Prime Video’s global sports\
    \ programming with the debut of the Amazon Original sports documentaries\nKelce,\
    \ chronicling Philadelphia Eagles captain Jason Kelce’s 2022 season, and Bye Bye\
    \ Barry, the story of Barry\nSanders’ decision to retire at the height of his\
    \ NFL career. In live sports, Prime Video added new broadcast rights for\nNASCAR,\
    \ the National Women’s Soccer League, and Premier Boxing Champions in the U.S.;\
    \ ICC Cricket in\nAustralia; and Wimbledon tennis in Austria and Germany.\n\n\
    •\n\nAnnounced AWS European Sovereign Cloud, an independent cloud for Europe,\
    \ to give public sector customers and\nthose in highly regulated industries more\
    \ choice to meet stringent compliance mandates in the EU and achieve the\noperational\
    \ independence they require without compromising on the broadest and deepest cloud\
    \ services.\n\n•\n\nExpanded AWS’s infrastructure footprint by launching the AWS\
    \ Canada West (Calgary) Region, the second\ninfrastructure Region in Canada. AWS\
    \ is the first major cloud services provider to have an infrastructure Region\
    \ in\nWestern Canada. As of the end of 2023, AWS had 105 Availability Zones within\
    \ 33 geographic Regions globally,\nwith announced plans for 12 more Availability\
    \ Zones and four more Regions.\n\n•\n\nAnnounced new commitments, partnerships,\
    \ and expansions to support AWS customers.\n•\n\nAmgen expanded its work with\
    \ AWS to create generative artificial intelligence (generative AI)–based\nsolutions,\
    \ using Amazon SageMaker to help discover, develop, and accelerate the manufacturing\
    \ of\nmedicines for patients suffering from serious illnesses. Amgen will also\
    \ use AWS’s global infrastructure and\nadvanced services to power a new digital\
    \ data and analytics platform.\n\n•\n\nSalesforce, which runs the vast majority\
    \ of its cloud computing workloads on AWS, significantly expanded\nits global\
    \ partnership with AWS. For the first time, Salesforce products are now available\
    \ in the AWS\n\n\fMarketplace, giving customers streamlined purchasing options.\
    \ This expansive partnership makes it easier for\ncustomers to bring AWS data\
    \ into Salesforce products and deepens data and AI integrations between AWS’s\n\
    and Salesforce’s products. Salesforce will support Amazon Bedrock as part of Salesforce’s\
    \ open model\necosystem strategy and will expand its use of AWS, including compute,\
    \ storage, data, and AI technologies.\n•\n\nHospitality company Accor S.A. expanded\
    \ its relationship with AWS to launch a generative AI Travel\nAssistant using\
    \ Amazon Bedrock and Amazon SageMaker. The Travel Assistant aims to reinvent the\
    \ guest\nexperience by enhancing travel planning and booking, while reducing call\
    \ volumes at Accor’s contact center.\n\n•\n\nFinancial services provider Mitsubishi\
    \ UFJ Financial Group (MUFG) signed a multiyear global agreement\nwith AWS as\
    \ its preferred cloud provider to innovate personalized financial services and\
    \ use Amazon\nBedrock to experiment with more than 100 potential generative AI\
    \ use cases. By moving from on-premises\ndata centers to AWS, MUFG reduced the\
    \ cost of operating its standard IT infrastructure by 20%. Using\nAmazon QuickSight,\
    \ MUFG lowered operational costs by approximately 70% compared to legacy\ntechnology.\n\
    \n•\n\nMerck will work with AWS and Accenture to move a substantial portion of\
    \ Merck’s IT infrastructure to AWS\nas its preferred cloud services provider.\
    \ Merck is using services, including high-performance computing on\nAWS and AWS\
    \ HealthOmics to speed drug discovery and accelerate therapeutic discovery and\
    \ Amazon\nSageMaker for generative AI and machine learning (ML) to improve product\
    \ manufacturing and availability.\n\n•\n\nEcommerce retailer The Very Group expanded\
    \ its collaboration with AWS, which included the launch of a\nGen AI Innovation\
    \ Lab. The lab will trial new generative AI retail solutions built on Amazon Bedrock\
    \ to\ndeliver interactive and personalized digital shopping experiences.\n\n•\n\
    \nAutomaker SAIC MOTOR selected AWS as its strategic cloud provider for its i-SMART\
    \ connected vehicle\nplatform. SAIC MOTOR is using AWS’s global infrastructure\
    \ services to enhance the driving experience and\nbuild an elastic and agile connected\
    \ vehicle architecture that can scale globally. SAIC MOTOR will use\nAmazon Bedrock\
    \ to personalize the in-vehicle experience and to automatically diagnose vehicle\
    \ issues.\n\n•\n\nMultinational telecom Axiata Group Berhad selected AWS as its\
    \ primary cloud provider to accelerate its\ndigital transformation across its\
    \ operating companies by using AWS’s generative AI and ML capabilities,\nincluding\
    \ Amazon Bedrock and Amazon SageMaker. By the end of 2024, Axiata will migrate\
    \ more than 650\nservices spanning customer service, enterprise resource planning,\
    \ and human resources, along with 80 ML\napplications.\n\n•\n\nEnergy company\
    \ HD Hyundai Oilbank will transform its refining and petrochemical business into\
    \ a platform\nfor eco-friendly energy by going all-in on AWS, forecasting to reduce\
    \ IT cost by 20%. The company will\nlaunch an electric vehicle charging business\
    \ on AWS, optimize the refinery process using ML and generative\nAI with Amazon\
    \ Bedrock, deliver data-driven insights such as energy-demand forecasting, and\
    \ improve\noperations like inventory management.\n\n•\n\nLG AI Research, the research\
    \ hub of LG Group, launched an AI image-to-text captioning solution on AWS at\n\
    66% lower cost and with 83% faster data processing than on-premises infrastructure.\
    \ The new captioning\nsolution uses a multimodal foundation model (FM) built using\
    \ Amazon Elastic Compute Cloud (Amazon\nEC2) and Amazon SageMaker that creates\
    \ more accurate content than previous solutions.\n\n•\n\nTravel lifestyle brand\
    \ Cathay selected AWS as its cloud provider and migrated more than 50% of its\
    \ legacy\nand critical enterprise workloads to AWS, reducing IT infrastructure\
    \ costs by 40%. The new Cathay Machine\nLearning Innovation Hub will help automate\
    \ operations, train employees on ML, and enhance air travel\nexperiences. Cathay’s\
    \ cargo business is using Amazon SageMaker, Amazon OpenSearch Service, and\nAmazon\
    \ Redshift to build a revenue management model to increase profitability and customer\
    \ loyalty.\n\n•\n\nBYD, a manufacturer of new energy vehicles, selected AWS as\
    \ its preferred cloud provider to support the\nautomaker’s global business, innovate\
    \ new services to enhance the driving experience, and lower vehicle\ndevelopment\
    \ costs.\n\nInventing on behalf of customers\nAmazon is driven by a passion for\
    \ invention across all of its business areas. The company builds new products\
    \ and services that\ncustomers ask for, and also invents new ones that customers\
    \ didn’t know they wanted but make their lives or businesses better\nin some meaningful\
    \ way. For example, Amazon:\n•\n\nLaunched several new AI-powered innovations\
    \ to help customers shop for fashion with more confidence in Amazon’s\nstore,\
    \ including personalized size recommendations using AI and ML to help customers\
    \ find what size fits them best,\n\n\fFit Review Highlights with personalized\
    \ feedback from customers who wear the same size, and improved size charts\nthat\
    \ make it easier for customers to find relevant information in a more visually\
    \ engaging way. Amazon also developed\na Fit Insights Tool to help brands and\
    \ selling partners better understand customer fit issues and incorporate feedback\n\
    into future designs and manufacturing.\n•\n\nAnnounced Rufus, a new generative\
    \ AI-powered conversational shopping experience. Rufus is an expert shopping\n\
    assistant trained on Amazon’s product catalog and information from across the\
    \ web to answer customer questions on\nshopping needs, products, and comparisons,\
    \ make recommendations based on this context, and facilitate product\ndiscovery.\
    \ Customers can simply start typing or speaking their questions into the search\
    \ bar in the Amazon Shopping\napp, or choose from a set of pre-populated questions,\
    \ and Amazon will provide answers via a chat dialog box to help\ncustomers make\
    \ more informed purchase decisions. Rufus launched in beta to a small subset of\
    \ customers and will\nprogressively roll out to the rest of Amazon’s U.S. customers\
    \ in the coming weeks.\n\n•\n\nIntroduced new advertising tools to help brands\
    \ connect with customers and grow their businesses, including:\n•\n\nA generative\
    \ AI solution to help brands produce lifestyle imagery that can improve the performance\
    \ of their\nads while also making them more engaging.\n\n•\n\nA sponsored TV offering\
    \ to enable brands that sell in Amazon’s U.S. store to run streaming TV ad campaigns\n\
    with no minimum spend on Amazon Freevee, Twitch, and third-party streaming services\
    \ through Fire TV\napps.\n\n•\n\nMore than 15 new advertising capabilities, including\
    \ enhanced audience insights and advanced campaign\nplanning, activation, and\
    \ optimization controls that help advertisers more efficiently reach relevant\
    \ audiences\nand drive meaningful business outcomes.\n\n•\n\nAmazon Publisher\
    \ Cloud, a tool built on AWS Clean Rooms’ secure data collaboration environment,\
    \ that\nenables publishers to analyze first-party data together with Amazon Ads\
    \ insights and offer custom media buys\nfor advertisers that improve campaign\
    \ performance.\n\n•\n\nAchieved a 100% success rate for Project Kuiper’s Protoflight\
    \ mission. The mission validated key technologies that\nunderpin the satellite\
    \ broadband network, allowing Project Kuiper to scale satellite production ahead\
    \ of full-scale\ndeployment beginning this year. Project Kuiper also announced\
    \ a private connectivity service with AWS, which will\nallow customers to send\
    \ data from remote locations directly to the cloud without relying on public internet,\
    \ as well as a\ncollaboration with Japan’s leading mobile network provider, Nippon\
    \ Telegraph and Telephone Corporation, and\nAsia’s largest satellite operator,\
    \ SKY Perfect JSAT Corporation.\n\n•\n\nHeld the 12th AWS re:Invent conference,\
    \ which welcomed over 50,000 in-person attendees and more than 300,000\nvirtually,\
    \ where AWS announced new technologies and capabilities that help customers of\
    \ all sizes take advantage of\ngenerative AI, improve productivity, and enhance\
    \ their security posture. These include:\n•\n\nAmazon Q, the coding companion\
    \ from AWS. Q is an expert on AWS—it writes code, debugs code, tests\ncode, and\
    \ does translations, such as moving from an old version of Java to a new one.\
    \ It can also query AWS\ncustomers’ various data repositories (e.g. intranets,\
    \ wikis, and from over 40 different popular connectors to\ndata stored using Salesforce,\
    \ Amazon S3, ServiceNow, Slack, Atlassian, or Zendesk) to answer questions,\n\
    summarize data, carry on a conversation, and take action. Like all AWS services,\
    \ Q was designed with\nsecurity and privacy in mind from the start, making it\
    \ easier for organizations to use generative AI safely. Q is\nthe most capable\
    \ work assistant available and keeps getting better.\n\n•\n\nExpanded model choice\
    \ and added new capabilities for Amazon Bedrock, AWS’s fully-managed service for\n\
    leveraging existing large language models (LLMs) and customizing them with their\
    \ own data—all without\nsacrificing the leading security, reliability, and operational\
    \ performance that is synonymous with AWS. AWS\nis continuing to rapidly iterate\
    \ on Bedrock, recently delivering capabilities including Guardrails to safeguard\n\
    what questions applications will answer, Knowledge Bases to expand models’ knowledge\
    \ base with Retrieval\nAugmented Generation, Agents to complete multi-step tasks,\
    \ and Fine-Tuning to keep teaching and refining\nmodels, all to help customers’\
    \ applications be higher quality and offer better customer experiences. With\n\
    Bedrock, AWS offers a choice of high-performing FMs from leading AI companies\
    \ and added the latest new\nmodels from Anthropic, Cohere, Meta, Stability AI,\
    \ and its own Amazon Titan family of FMs, expanding\ncustomers’ choice of industry-leading\
    \ models to support a variety of use cases. Customers want a service that\nmakes\
    \ this experimenting and iterating simple, and this is what Bedrock does, which\
    \ is why customers are so\nexcited about it.\n\n•\n\nNew capabilities in Amazon\
    \ SageMaker to accelerate building, training, and deploying LLMs and other FMs.\n\
    Amazon SageMaker HyperPod reduces time to train FMs by up to 40% by providing\
    \ purpose-built\n\n\finfrastructure for distributed training at scale. Amazon\
    \ SageMaker Inference reduces FM deployment costs by\n50% on average and latency\
    \ by 20% on average by optimizing the use of accelerators.\n•\n\nThe next generation\
    \ of AWS chips optimized for the cloud, which deliver advancements in price performance\n\
    with each successive generation. AWS Graviton4 chips provide up to 30% better\
    \ compute performance, 50%\nmore cores, and 75% more memory bandwidth than current\
    \ generation AWS Graviton3 processors for a\nbroad range of customer workloads\
    \ running in Amazon EC2.\n\n•\n\nAWS Trainium2 chips, which are designed to deliver\
    \ up to four times faster ML training for generative AI\napplications and three\
    \ times more memory capacity compared to first generation AWS Trainium chips.\n\
    \n•\n\nAn expanded collaboration between AWS and NVIDIA to deliver the most advanced\
    \ infrastructure, software,\nand services to power customers’ generative AI innovations.\
    \ AWS will be the first cloud provider to bring\nNVIDIA GH200 Grace Hopper Superchips\
    \ with multi-node NVLink technology to the cloud. NVIDIA and\nAWS are also collaborating\
    \ on Project Ceiba to design the world’s fastest GPU-powered AI supercomputer,\n\
    hosted by AWS for NVIDIA’s own research and development team.\n\n•\n\nThe general\
    \ availability of Amazon EC2 Capacity Blocks for ML, a first-of-its-kind consumption\
    \ model that\nenables customers to reserve the amount of GPU capacity they need\
    \ for short durations to run their ML\nworkloads, eliminating the need to hold\
    \ onto GPUs when not in use.\n\n•\n\nThe general availability of Amazon S3 Express\
    \ One Zone, a high-performance, single-zone Amazon S3\nstorage class and the lowest\
    \ latency cloud object storage available, delivering single-digit millisecond\
    \ data\naccess for customers’ most latency-sensitive applications, such as ML\
    \ training and inference, and media\ncontent creation.\n\n•\n\nFour integrations\
    \ that enable customers to make data access and analysis faster, without building\
    \ and\nmanaging complex extract, transform, and load (ETL) data pipelines. Amazon\
    \ Aurora PostgreSQL, Amazon\nDynamoDB, and Amazon Relational Database Service\
    \ (Amazon RDS) for MySQL zero-ETL integrations\nwith Amazon Redshift enable customers\
    \ to analyze data from multiple sources without building and\nmaintaining custom\
    \ data pipelines. Amazon DynamoDB zero-ETL integration with Amazon OpenSearch\n\
    Service enables full-text and vector search on operational data in near real time.\n\
    \n•\n\nAmazon Aurora Limitless Database, Amazon ElastiCache Serverless, and AI-driven\
    \ scaling and\noptimizations for Amazon Redshift Serverless, which make it faster\
    \ and easier for customers to scale their\ndata infrastructure to support their\
    \ most demanding use cases. These innovations build on AWS’s serverless\ntechnologies\
    \ to help customers manage data at any scale and simplify their operations, so\
    \ they can focus on\ninnovating for their end users without spending time and\
    \ effort provisioning, managing, and scaling their data\ninfrastructure.\n\n•\n\
    \nGenerative AI capabilities in Amazon Connect, AWS’s cloud contact center that\
    \ enables organizations to\nboost productivity, save costs, and improve customer\
    \ service experiences, such as Amazon Q in Connect to\nassist agents with real-time\
    \ responses and recommended actions to help improve customer satisfaction, and\n\
    Amazon Connect Contact Lens to add AI-generated summaries from customer conversations.\n\
    \nEmpowering employees and delivery service partners\nIn addition to its focus\
    \ on customers, Amazon strives to make every day better for its employees and\
    \ delivery service partners.\nFor example, the company:\n•\n\nLaunched Sequoia,\
    \ a new robotics system that allows Amazon to identify and store inventory up\
    \ to 75% faster and,\nwhen integrated with other technologies, will reduce order\
    \ process time by up to 25%. Sequoia supports employee\nsafety by collecting inventory\
    \ into totes and bringing the totes to newly designed ergonomic workstations.\
    \ From there,\nemployees can lift the totes using their power zone—mid-thigh to\
    \ mid-chest—reducing how often they have to reach\nor squat down to pick customer\
    \ orders.\n\n•\n\nIntroduced Automated Vehicle Inspection (AVI), an AI-powered\
    \ technology that performs a full-vehicle inspection in\nseconds. The system runs\
    \ on AWS and can spot anomalies in Amazon delivery vans—from tire deformities\
    \ and\nundercarriage wear to bent or warped body pieces—before they become on-road\
    \ problems. AVI is available in\nCanada, Germany, the UK, and the U.S.\n\n•\n\n\
    Announced a £170 million investment in UK hourly employees—increasing the minimum\
    \ starting pay by £1 per hour\nand bringing the minimum starting hourly wage for\
    \ frontline operations employees in the UK to between £12.30 and\n£13.00 by April\
    \ 2024. The increase means Amazon’s minimum starting pay in the UK will have increased\
    \ 20% over\ntwo years, and 50% since 2018.\n\n\f•\n\nGave Amazon customers a way\
    \ to show appreciation for delivery drivers during the holiday season with the\
    \ “Alexa,\nThank My Driver” promotion. Over a two-day period, customers thanked\
    \ their drivers 2 million times, with drivers\nreceiving $5 per thank you at no\
    \ cost to the customer.\n\nSupporting communities and protecting the environment\n\
    Amazon believes that success and scale bring broad responsibility to help the\
    \ planet, future generations, and communities.\nAmazon employees have passion\
    \ for investing in these areas, and a sampling of the efforts from this past quarter\
    \ are that\nAmazon:\n•\n\nReleased the company’s U.S. Community Impact Report,\
    \ which shows Amazon has delivered more than 33 million\nmeals directly to underserved\
    \ families from 2020 to 2023; donated over 88 million pounds of food from 2020\
    \ to 2023;\nprovided STEM education, literacy, and career exploration courses\
    \ to 6,000 schools and 560,000 students during the\n2022-2023 academic year; and\
    \ provided free training in cloud computing and technology to more than 13 million\n\
    adults in the last year.\n\n•\n\nProvided more than 75,000 relief items to communities\
    \ impacted by Hurricane Otis near Acapulco, Mexico, using\nAmazon’s global logistics\
    \ capabilities. AWS also supported nonprofit Help.NGO to build an emergency connectivity\n\
    network in Mexico to allow first responders to map the impacted area, and offered\
    \ cloud computing resources to\nprocess mapping data collected on-site to assess\
    \ storm damage.\n\n•\n\nAnnounced new renewable energy projects, including Amazon’s\
    \ first brownfield solar project, which will repurpose a\npreviously polluted\
    \ Maryland coal mine site into a solar farm; 11 renewable energy projects across\
    \ Texas; Amazon’s\nfirst renewable energy project in South Korea; and a 198-megawatt\
    \ wind farm in India. In 2023, Amazon added 100\nnew solar and wind projects.\n\
    \n•\n\nAnnounced Amazon’s first U.S. fulfillment center to eliminate plastic delivery\
    \ packaging and replace it with paper\npackaging that is curbside recyclable,\
    \ part of a multi-year plan to convert U.S. fulfillment centers to paper packaging.\n\
    In addition, Amazon announced that delivery packaging is now fully recyclable\
    \ in Europe.\n\n•\n\nAnnounced that AWS more than doubled the amount of lower-carbon\
    \ concrete and steel used to build its data centers\nin 2023 compared to 2022.\
    \ AWS collaborates with local suppliers to increase the availability of these\
    \ materials across\nthe construction industry. Emissions released during building\
    \ materials’ life cycle accounts for around 11% of global\ncarbon emissions.\n\
    \n•\n\nPublished the AWS Economic Impact Study, which highlights that AWS invested\
    \ more than $108 billion in U.S. cloud\ninfrastructure from 2011 through 2022,\
    \ contributed nearly $38 billion in estimated gross domestic product to the U.S.\n\
    economy, and supported an estimated annual average of nearly 30,000 jobs in local\
    \ communities where AWS operates.\n\n•\n\nLaunched AI Ready to provide free AI\
    \ skills training to 2 million people globally by 2025. The program includes eight\n\
    free AWS-designed AI courses and a new generative AI scholarship program to help\
    \ more than 50,000 high school\nand university students from underserved and underrepresented\
    \ communities gain AI skills.\n\nFinancial Guidance\nThe following forward-looking\
    \ statements reflect Amazon.com’s expectations as of February 1, 2024, and are\
    \ subject to\nsubstantial uncertainty. Our results are inherently unpredictable\
    \ and may be materially affected by many factors, such as\nfluctuations in foreign\
    \ exchange rates, changes in global economic and geopolitical conditions and customer\
    \ demand and\nspending (including the impact of recessionary fears), inflation,\
    \ interest rates, regional labor market constraints, world events,\nthe rate of\
    \ growth of the internet, online commerce, cloud services, and new and emerging\
    \ technologies, and the various factors\ndetailed below.\nFirst Quarter 2024 Guidance\n\
    •\n•\n•\n\nNet sales are expected to be between $138.0 billion and $143.5 billion,\
    \ or to grow between 8% and 13% compared\nwith first quarter 2023. This guidance\
    \ anticipates a favorable impact of approximately 40 basis points from foreign\n\
    exchange rates.\nOperating income is expected to be between $8.0 billion and $12.0\
    \ billion, compared with $4.8 billion in first quarter\n2023. This guidance includes\
    \ approximately $0.9 billion lower depreciation expense due to an increase in\
    \ the\nestimated useful life of our servers beginning on January 1, 2024.\nThis\
    \ guidance assumes, among other things, that no additional business acquisitions,\
    \ restructurings, or legal\nsettlements are concluded.\n\n\fA conference call\
    \ will be webcast live today at 2:30 p.m. PT/5:30 p.m. ET, and will be available\
    \ for at least three months at\namazon.com/ir. This call will contain forward-looking\
    \ statements and other material information regarding the Company’s\nfinancial\
    \ and operating results.\nThese forward-looking statements are inherently difficult\
    \ to predict. Actual results and outcomes could differ materially for a\nvariety\
    \ of reasons, including, in addition to the factors discussed above, the amount\
    \ that Amazon.com invests in new business\nopportunities and the timing of those\
    \ investments, the mix of products and services sold to customers, the mix of\
    \ net sales\nderived from products as compared with services, the extent to which\
    \ we owe income or other taxes, competition, management\nof growth, potential\
    \ fluctuations in operating results, international growth and expansion, the outcomes\
    \ of claims, litigation,\ngovernment investigations, and other proceedings, fulfillment,\
    \ sortation, delivery, and data center optimization, risks of\ninventory management,\
    \ variability in demand, the degree to which the Company enters into, maintains,\
    \ and develops\ncommercial agreements, proposed and completed acquisitions and\
    \ strategic transactions, payments risks, and risks of\nfulfillment throughput\
    \ and productivity. Other risks and uncertainties include, among others, risks\
    \ related to new products,\nservices, and technologies, security breaches, system\
    \ interruptions, government regulation and taxation, and fraud. In addition,\n\
    global economic and geopolitical conditions and additional or unforeseen circumstances,\
    \ developments, or events may give\nrise to or amplify many of these risks. More\
    \ information about factors that potentially could affect Amazon.com’s financial\n\
    results is included in Amazon.com’s filings with the Securities and Exchange Commission\
    \ (“SEC”), including its most recent\nAnnual Report on Form 10-K and subsequent\
    \ filings.\nOur investor relations website is amazon.com/ir and we encourage investors\
    \ to use it as a way of easily finding information\nabout us. We promptly make\
    \ available on this website, free of charge, the reports that we file or furnish\
    \ with the SEC, corporate\ngovernance information (including our Code of Business\
    \ Conduct and Ethics), and select press releases, which may contain\nmaterial\
    \ information about us, and you may subscribe to be notified of new information\
    \ posted to this site.\nAbout Amazon\nAmazon is guided by four principles: customer\
    \ obsession rather than competitor focus, passion for invention, commitment to\n\
    operational excellence, and long-term thinking. Amazon strives to be Earth’s Most\
    \ Customer-Centric Company, Earth’s Best\nEmployer, and Earth’s Safest Place to\
    \ Work. Customer reviews, 1-Click shopping, personalized recommendations, Prime,\n\
    Fulfillment by Amazon, AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire\
    \ tablets, Fire TV, Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios,\
    \ and The Climate Pledge are some of the things pioneered by Amazon. For more\n\
    information, visit amazon.com/about and follow @AmazonNews."
