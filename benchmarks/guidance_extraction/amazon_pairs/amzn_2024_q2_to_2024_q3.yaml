- id: q2_2024
  label: Amazon Q2 2024 Earnings Release, August 1, 2024
  text: "AMAZON.COM ANNOUNCES SECOND QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) August\
    \ 1, 2024—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial results\n\
    for its second quarter ended June 30, 2024.\n•\n\n•\n\n•\n\nNet sales increased\
    \ 10% to $148.0 billion in the second quarter, compared with $134.4 billion in\
    \ second quarter 2023.\nExcluding the $1.0 billion unfavorable impact from year-over-year\
    \ changes in foreign exchange rates throughout the\nquarter, net sales increased\
    \ 11% compared with second quarter 2023.\n•\n\nNorth America segment sales increased\
    \ 9% year-over-year to $90.0 billion.\n\n•\n\nInternational segment sales increased\
    \ 7% year-over-year to $31.7 billion, or increased 10% excluding changes\nin foreign\
    \ exchange rates.\n\n•\n\nAWS segment sales increased 19% year-over-year to $26.3\
    \ billion.\n\nOperating income increased to $14.7 billion in the second quarter,\
    \ compared with $7.7 billion in second quarter 2023.\n•\n\nNorth America segment\
    \ operating income was $5.1 billion, compared with operating income of $3.2 billion\n\
    in second quarter 2023.\n\n•\n\nInternational segment operating income was $0.3\
    \ billion, compared with an operating loss of $0.9 billion in\nsecond quarter\
    \ 2023.\n\n•\n\nAWS segment operating income was $9.3 billion, compared with operating\
    \ income of $5.4 billion in second\nquarter 2023.\n\nNet income increased to $13.5\
    \ billion in the second quarter, or $1.26 per diluted share, compared with $6.7\
    \ billion, or\n$0.65 per diluted share, in second quarter 2023.\n•\n\nSecond quarter\
    \ 2024 net income includes a pre-tax valuation gain of $0.4 billion included in\
    \ non-operating\nincome (expense) from the common stock investment in Rivian Automotive,\
    \ Inc., compared to a pre-tax\nvaluation gain of $0.2 billion from the investment\
    \ in second quarter 2023.\n\n•\n\nOperating cash flow increased 75% to $108.0\
    \ billion for the trailing twelve months, compared with $61.8 billion for\nthe\
    \ trailing twelve months ended June 30, 2023.\n\n•\n\nFree cash flow increased\
    \ to $53.0 billion for the trailing twelve months, compared with $7.9 billion\
    \ for the trailing\ntwelve months ended June 30, 2023.\n\n•\n\nFree cash flow\
    \ less principal repayments of finance leases and financing obligations increased\
    \ to $49.6 billion for\nthe trailing twelve months, compared with $1.9 billion\
    \ for the trailing twelve months ended June 30, 2023.\n\n•\n\nFree cash flow less\
    \ equipment finance leases and principal repayments of all other finance leases\
    \ and financing\nobligations increased to $51.4 billion for the trailing twelve\
    \ months, compared with $6.7 billion for the trailing twelve\nmonths ended June\
    \ 30, 2023.\n\n“We’re continuing to make progress on a number of dimensions, but\
    \ perhaps none more so than the continued reacceleration in\nAWS growth,” said\
    \ Andy Jassy, Amazon President & CEO. “As companies continue to modernize their\
    \ infrastructure and\nmove to the cloud, while also leveraging new Generative\
    \ AI opportunities, AWS continues to be customers’ top choice as we\nhave much\
    \ broader functionality, superior security and operational performance, a larger\
    \ partner ecosystem, and AI capabilities\nlike SageMaker for model builders, Bedrock\
    \ for those leveraging frontier models, Trainium for those where the cost of compute\n\
    for training and inference matters, and Q for those wanting the most capable GenAI\
    \ assistant for not just coding, but also\nsoftware development and business integration.”\n\
    \n\fSome other highlights since the company’s last earnings announcement include\
    \ that Amazon:\n•\n\nHeld its 10th Prime Day, the biggest Prime Day shopping event\
    \ yet.\n\n•\n\nDelivered to Prime members at its fastest speeds ever in the first\
    \ half of the year.\n\n•\n\nExpanded selection, including brands like Aéropostale,\
    \ Bumble and bumble, and Kiehl’s.\n\n•\n\nAnnounced that U.S. Prime members can\
    \ enjoy a Grubhub+ membership worth $120 a year.\n\n•\n\nLaunched multiple AI-powered\
    \ features for consumers, including shopping assistant Rufus for all U.S. mobile\n\
    customers, playlist generator Maestro for Amazon Music, and a new search experience\
    \ for Fire TV.\n\n•\n\nLaunched Amazon’s Stores business in South Africa with\
    \ same and next-day delivery.\n\n•\n\nExpanded Amazon Pharmacy’s RxPass program,\
    \ which now offers Prime members on Medicare unlimited\nconsumption of 60 broadly-used\
    \ prescription medications for just $5 a month.\n\n•\n\nReleased 19 films and\
    \ series from Amazon MGM Studios, including:\n•\n\nFallout, the second most watched\
    \ Original title worldwide ever on Prime Video during its launch.\n\n•\n\nSeason\
    \ 4 of The Boys, reaching No. 1 on Prime Video in over 165 countries in its first\
    \ two weeks.\n\n•\n\nThe Idea of You, attracting ~50 million viewers in its first\
    \ two weeks on Prime Video.\n\n•\n\nEarned 62 Primetime Emmy Award nominations,\
    \ including 17 for Fallout and 16 for Mr. and Mrs. Smith.\n\n•\n\nSecured expansive\
    \ streaming rights for the NBA for 11 seasons, starting in 2025-26.\n\n•\n\nBecame\
    \ the exclusive home of Monday Night National Hockey League games in Canada.\n\
    \n•\n\nLaunched Anthropic Claude 3.5 Sonnet, Meta Llama 3.1, and Mistral Large\
    \ 2 models in Amazon Bedrock.\n\n•\n\nShared that companies like AXA, DoorDash,\
    \ Nasdaq, Rocket Insurance, SAP, Thomson Reuters, Workday, WPP, and\nZendesk announced\
    \ new applications built on Bedrock.\n\n•\n\nDelivered new AWS Graviton4-based\
    \ compute instances, providing up to 30% better price-performance than the\nindustry-leading\
    \ AWS Graviton3 instances.\n\n•\n\nSigned new AWS agreements with Commonwealth\
    \ Bank of Australia, Databricks, Discover Financial Services, Eli\nLilly and Company,\
    \ Experian, GE HealthCare, NetApp, Scopely, ServiceNow, Shutterfly, and many others—as\
    \ well\nas AI startups Perplexity, H Company, and Observea.\n\n•\n\nAnnounced\
    \ an AUD $2 billion strategic partnership with the Australian Government to provide\
    \ a “Top Secret” AWS\nCloud to enhance the nation’s defense and intelligence capabilities.\n\
    \n•\n\nAdded Austin and Miami to where self-driving robotaxi Zoox is deploying\
    \ its test fleet on public roads.\n\n•\n\nRanked No. 2 on LinkedIn’s Top Companies\
    \ list and No. 1 in the technology sector.\n\n•\n\nAnnounced that all electricity\
    \ consumed by Amazon’s operations, including its data centers, was matched with\
    \ 100%\nrenewable energy in 2023.\n\n•\n\nReplaced 95% of plastic air pillows\
    \ in Amazon’s delivery packaging in North America with paper filler.\n\n•\n\n\
    Announced an additional $1.4 billion commitment to Amazon’s Housing Equity Fund\
    \ for affordable homes.\n\nFor additional highlights from the quarter, visit aboutamazon.com/q2-2024-earnings.\n\
    Financial Guidance\nThe following forward-looking statements reflect Amazon.com’s\
    \ expectations as of August 1, 2024, and are subject to\nsubstantial uncertainty.\
    \ Our results are inherently unpredictable and may be materially affected by many\
    \ factors, such as\nfluctuations in foreign exchange rates, changes in global\
    \ economic and geopolitical conditions and customer demand and\nspending (including\
    \ the impact of recessionary fears), inflation, interest rates, regional labor\
    \ market constraints, world events,\nthe rate of growth of the internet, online\
    \ commerce, cloud services, and new and emerging technologies, and the various\
    \ factors\ndetailed below.\n\n\fThird Quarter 2024 Guidance\n•\n•\n•\n\nNet sales\
    \ are expected to be between $154.0 billion and $158.5 billion, or to grow between\
    \ 8% and 11% compared\nwith third quarter 2023. This guidance anticipates an unfavorable\
    \ impact of approximately 90 basis points from foreign\nexchange rates.\nOperating\
    \ income is expected to be between $11.5 billion and $15.0 billion, compared with\
    \ $11.2 billion in third\nquarter 2023.\nThis guidance assumes, among other things,\
    \ that no additional business acquisitions, restructurings, or legal\nsettlements\
    \ are concluded.\n\nConference Call Information\nA conference call will be webcast\
    \ live today at 2:30 p.m. PT/5:30 p.m. ET, and will be available for at least\
    \ three months at\namazon.com/ir. This call will contain forward-looking statements\
    \ and other material information regarding the Company’s\nfinancial and operating\
    \ results.\nForward-Looking Statements\nThese forward-looking statements are inherently\
    \ difficult to predict. Actual results and outcomes could differ materially for\
    \ a\nvariety of reasons, including, in addition to the factors discussed above,\
    \ the amount that Amazon.com invests in new business\nopportunities and the timing\
    \ of those investments, the mix of products and services sold to customers, the\
    \ mix of net sales\nderived from products as compared with services, the extent\
    \ to which we owe income or other taxes, competition, management\nof growth, potential\
    \ fluctuations in operating results, international growth and expansion, the outcomes\
    \ of claims, litigation,\ngovernment investigations, and other proceedings, fulfillment,\
    \ sortation, delivery, and data center optimization, risks of\ninventory management,\
    \ variability in demand, the degree to which the Company enters into, maintains,\
    \ and develops\ncommercial agreements, proposed and completed acquisitions and\
    \ strategic transactions, payments risks, and risks of\nfulfillment throughput\
    \ and productivity. Other risks and uncertainties include, among others, risks\
    \ related to new products,\nservices, and technologies, security breaches, system\
    \ interruptions, government regulation and taxation, and fraud. In addition,\n\
    global economic and geopolitical conditions and additional or unforeseen circumstances,\
    \ developments, or events may give\nrise to or amplify many of these risks. More\
    \ information about factors that potentially could affect Amazon.com’s financial\n\
    results is included in Amazon.com’s filings with the Securities and Exchange Commission\
    \ (“SEC”), including its most recent\nAnnual Report on Form 10-K and subsequent\
    \ filings.\nAdditional Information\nOur investor relations website is amazon.com/ir\
    \ and we encourage investors to use it as a way of easily finding information\n\
    about us. We promptly make available on this website, free of charge, the reports\
    \ that we file or furnish with the SEC, corporate\ngovernance information (including\
    \ our Code of Business Conduct and Ethics), and select press releases, which may\
    \ contain\nmaterial information about us, and you may subscribe to be notified\
    \ of new information posted to this site.\nAbout Amazon\nAmazon is guided by four\
    \ principles: customer obsession rather than competitor focus, passion for invention,\
    \ commitment to\noperational excellence, and long-term thinking. Amazon strives\
    \ to be Earth’s Most Customer-Centric Company, Earth’s Best\nEmployer, and Earth’s\
    \ Safest Place to Work. Customer reviews, 1-Click shopping, personalized recommendations,\
    \ Prime,\nFulfillment by Amazon, AWS, Kindle Direct Publishing, Kindle, Career\
    \ Choice, Fire tablets, Fire TV, Amazon Echo, Alexa,\nJust Walk Out technology,\
    \ Amazon Studios, and The Climate Pledge are some of the things pioneered by Amazon.\
    \ For more\ninformation, visit amazon.com/about and follow @AmazonNews."
- id: q3_2024
  label: Amazon Q3 2024 Earnings Release, October 31, 2024
  text: "AMAZON.COM ANNOUNCES THIRD QUARTER RESULTS\nSEATTLE—(BUSINESS WIRE) October\
    \ 31, 2024—Amazon.com, Inc. (NASDAQ: AMZN) today announced financial\nresults\
    \ for its third quarter ended September 30, 2024.\n•\n\n•\n\nNet sales increased\
    \ 11% to $158.9 billion in the third quarter, compared with $143.1 billion in\
    \ third quarter 2023.\nExcluding the $0.2 billion unfavorable impact from year-over-year\
    \ changes in foreign exchange rates throughout the\nquarter, net sales increased\
    \ 11% compared with third quarter 2023.\n•\n\nNorth America segment sales increased\
    \ 9% year-over-year to $95.5 billion.\n\n•\n\nInternational segment sales increased\
    \ 12% year-over-year to $35.9 billion.\n\n•\n\nAWS segment sales increased 19%\
    \ year-over-year to $27.5 billion.\n\nOperating income increased to $17.4 billion\
    \ in the third quarter, compared with $11.2 billion in third quarter 2023.\n•\n\
    \nNorth America segment operating income was $5.7 billion, compared with operating\
    \ income of $4.3 billion\nin third quarter 2023.\n\n•\n\nInternational segment\
    \ operating income was $1.3 billion, compared with an operating loss of $0.1 billion\
    \ in\nthird quarter 2023.\n\n•\n\nAWS segment operating income was $10.4 billion,\
    \ compared with operating income of $7.0 billion in third\nquarter 2023.\n\n•\n\
    \nNet income increased to $15.3 billion in the third quarter, or $1.43 per diluted\
    \ share, compared with $9.9 billion, or\n$0.94 per diluted share, in third quarter\
    \ 2023.\n\n•\n\nOperating cash flow increased 57% to $112.7 billion for the trailing\
    \ twelve months, compared with $71.7 billion for\nthe trailing twelve months ended\
    \ September 30, 2023.\n\n•\n\nFree cash flow increased to $47.7 billion for the\
    \ trailing twelve months, compared with $21.4 billion for the trailing\ntwelve\
    \ months ended September 30, 2023.\n\n•\n\nFree cash flow less principal repayments\
    \ of finance leases and financing obligations increased to $44.9 billion for\n\
    the trailing twelve months, compared with $15.9 billion for the trailing twelve\
    \ months ended September 30, 2023.\n\n•\n\nFree cash flow less equipment finance\
    \ leases and principal repayments of all other finance leases and financing\n\
    obligations increased to $46.1 billion for the trailing twelve months, compared\
    \ with $20.2 billion for the trailing\ntwelve months ended September 30, 2023.\n\
    \n“As we get into the holiday season, we’re excited about what we have in store\
    \ for customers,” said Andy Jassy, Amazon\nPresident & CEO. “We kicked off the\
    \ holiday season with our biggest-ever Prime Big Deal Days and the launch of an\
    \ all-new\nKindle lineup that is significantly outperforming our expectations;\
    \ and there’s so much more coming, from tens of millions of\ndeals, to our NFL\
    \ Black Friday game and Election Day coverage with Brian Williams on Prime Video,\
    \ to over 100 new cloud\ninfrastructure and AI capabilities that we’ll share at\
    \ AWS re:Invent the week after Thanksgiving.”\nSome other highlights since the\
    \ company’s last earnings announcement include that Amazon:\n•\n\nHeld its annual\
    \ Prime Big Deal Days shopping event, with record sales, number of items sold,\
    \ and Prime member\nparticipation, saving Prime members more than $1 billion with\
    \ deals across its Store.\n\n•\n\nAnnounced its first-ever fuel savings offer\
    \ for Prime, saving U.S. members 10 cents a gallon on fuel at approximately\n\
    7,000 bp, Amoco, and ampm locations.\n\n\f•\n\nExpanded its selection of brands\
    \ with AllSaints, Beats x Kim, Estée Lauder, kate spade new york, and more.\n\n\
    •\n\nAnnounced plans to expand Amazon Pharmacy Same-Day Delivery of medications\
    \ to nearly half the U.S. in 2025 by\naccelerating the roll out of new pharmacies\
    \ in 20 more U.S. cities by the end of next year.\n\n•\n\nLaunched new generative\
    \ AI-powered features, including:\n•\n\nRufus, a generative AI expert shopping\
    \ assistant, becoming available in Canada, France, Germany, India,\nItaly, Spain,\
    \ and the UK.\n\n•\n\nAI Shopping Guides, which simplifies product research by\
    \ using generative AI to pair information about a\nproduct category with Amazon’s\
    \ wide selection, making it easier for customers to find the right product for\n\
    their needs.\n\n•\n\nProject Amelia, an AI assistant for sellers that offers tailored\
    \ business insights to boost productivity and drive\nseller growth.\n\n•\n\nVideo\
    \ generation and live image capabilities for advertisers that makes it fast and\
    \ easy for brands to deliver\ncompelling creative for customers through short,\
    \ animated campaign images.\n\n•\n\nLaunched new foundation models in Amazon Bedrock\
    \ and Amazon SageMaker, including AI21 Labs’ Jamba 1.5\nfamily, Anthropic’s upgraded\
    \ Claude 3.5 Sonnet, Meta’s Llama 3.2, Mistral Large 2, and multiple Stability\
    \ AI models.\n\n•\n\nLaunched new memory-optimized, compute-optimized, and general\
    \ purpose Amazon EC2 instances based on AWS’s\nlatest generation Graviton4 processor,\
    \ which delivers 75% more memory bandwidth and 30% better compute\nperformance\
    \ than the previous generation Graviton chips.\n\n•\n\nLaunched Oracle Database@AWS\
    \ for customers to easily and quickly migrate Oracle workloads to dedicated\n\
    infrastructure on AWS with minimal to no database or application changes.\n\n\
    •\n\nEntered a strategic collaboration with Databricks to accelerate the development\
    \ of custom models built with\nDatabricks Mosaic AI on AWS, and for Databricks\
    \ to leverage AWS Trainium chips as the preferred AI chip to help\ncustomers improve\
    \ price-performance when building generative AI applications.\n\n•\n\nSigned AWS\
    \ agreements with several large enterprise companies such as The Australia and\
    \ New Zealand Banking\nGroup Limited, Booking.com, Capital One, Datadog, Epic\
    \ Games, Fast Retailing, Itaú Unibanco, Luma AI, National\nAustralia Bank, Sony,\
    \ T-Mobile, Toyota, and Veeva.\n\n•\n\nLaunched Season 2 of The Lord of the Rings:\
    \ The Rings of Power to positive reviews from customers and critics alike,\nranking\
    \ as Prime Video’s most watched returning season ever by hours watched.\n\n•\n\
    \nDrew more than 17 million viewers to the Cowboys-Giants Thursday Night Football\
    \ game, the most-streamed NFL\nregular season game ever.\n\n•\n\nAdded Apple TV+\
    \ to Prime Video’s collection of over 100 add-on subscription channels in the\
    \ U.S.\n\n•\n\nAnnounced a new Kindle lineup, including a reimagined Kindle Scribe\
    \ with generative AI, the Kindle Colorsoft with a\ncolor display, and the fastest\
    \ Kindle Paperwhite ever.\n\n•\n\nAnnounced investments in the Delivery Service\
    \ Partner program of $2.1 billion in North America to support safety\nprograms,\
    \ training, incentives, and more, as well as 25 billion yen in Japan to support\
    \ last mile delivery innovation,\nand safety and technology for drivers.\n\n•\n\
    \nAnnounced plans to hire 250,000 people across its U.S. operations ahead of the\
    \ holiday season. All seasonal\nemployees earn at least $18 per hour and have\
    \ access to comprehensive benefits like health care.\n\n•\n\nAnnounced plans for\
    \ AWS to invest £8 billion over five years in the UK, supporting 14,000 jobs annually.\n\
    \n•\n\nRemoved plastic air pillows from all delivery packaging at fulfillment\
    \ centers globally, including expanding its use of\npaper filler made from 100%\
    \ recycled content across North America to replace plastic air pillows.\n\n•\n\
    \nMobilized Disaster Relief by Amazon to support communities around the world\
    \ impacted by natural disasters. In the\nU.S., Amazon leveraged its Disaster Relief\
    \ Hub in Atlanta to support communities impacted by Hurricanes Helene and\nMilton\
    \ with donated goods, logistics support, and technology. In Europe, Amazon mobilized\
    \ its global logistics\ninfrastructure, inventory, teams, and technology to provide\
    \ rapid assistance for flooding across the region.\n\nFor additional highlights\
    \ from the quarter, visit aboutamazon.com/news/company-news/amazon-earnings-q3-2024-highlights.\n\
    \n\fFinancial Guidance\nThe following forward-looking statements reflect Amazon.com’s\
    \ expectations as of October 31, 2024, and are subject to\nsubstantial uncertainty.\
    \ Our results are inherently unpredictable and may be materially affected by many\
    \ factors, such as\nfluctuations in foreign exchange rates, changes in global\
    \ economic and geopolitical conditions and customer demand and\nspending (including\
    \ the impact of recessionary fears), inflation, interest rates, regional labor\
    \ market constraints, world events,\nthe rate of growth of the internet, online\
    \ commerce, cloud services, and new and emerging technologies, and the various\
    \ factors\ndetailed below.\nFourth Quarter 2024 Guidance\n•\n•\n•\n\nNet sales\
    \ are expected to be between $181.5 billion and $188.5 billion, or to grow between\
    \ 7% and 11% compared\nwith fourth quarter 2023. This guidance anticipates an\
    \ unfavorable impact of approximately 10 basis points from\nforeign exchange rates.\n\
    Operating income is expected to be between $16.0 billion and $20.0 billion, compared\
    \ with $13.2 billion in fourth\nquarter 2023.\nThis guidance assumes, among other\
    \ things, that no additional business acquisitions, restructurings, or legal\n\
    settlements are concluded.\n\nConference Call Information\nA conference call will\
    \ be webcast live today at 2:00 p.m. PT/5:00 p.m. ET, and will be available for\
    \ at least three months at\namazon.com/ir. This call will contain forward-looking\
    \ statements and other material information regarding the Company’s\nfinancial\
    \ and operating results.\nForward-Looking Statements\nThese forward-looking statements\
    \ are inherently difficult to predict. Actual results and outcomes could differ\
    \ materially for a\nvariety of reasons, including, in addition to the factors\
    \ discussed above, the amount that Amazon.com invests in new business\nopportunities\
    \ and the timing of those investments, the mix of products and services sold to\
    \ customers, the mix of net sales\nderived from products as compared with services,\
    \ the extent to which we owe income or other taxes, competition, management\n\
    of growth, potential fluctuations in operating results, international growth and\
    \ expansion, the outcomes of claims, litigation,\ngovernment investigations, and\
    \ other proceedings, fulfillment, sortation, delivery, and data center optimization,\
    \ risks of\ninventory management, variability in demand, the degree to which the\
    \ Company enters into, maintains, and develops\ncommercial agreements, proposed\
    \ and completed acquisitions and strategic transactions, payments risks, and risks\
    \ of\nfulfillment throughput and productivity. Other risks and uncertainties include,\
    \ among others, risks related to new products,\nservices, and technologies, security\
    \ breaches, system interruptions, government regulation and taxation, and fraud.\
    \ In addition,\nglobal economic and geopolitical conditions and additional or\
    \ unforeseen circumstances, developments, or events may give\nrise to or amplify\
    \ many of these risks. More information about factors that potentially could affect\
    \ Amazon.com’s financial\nresults is included in Amazon.com’s filings with the\
    \ Securities and Exchange Commission (“SEC”), including its most recent\nAnnual\
    \ Report on Form 10-K and subsequent filings.\nAdditional Information\nOur investor\
    \ relations website is amazon.com/ir and we encourage investors to use it as a\
    \ way of easily finding information\nabout us. We promptly make available on this\
    \ website, free of charge, the reports that we file or furnish with the SEC, corporate\n\
    governance information (including our Code of Business Conduct and Ethics), and\
    \ select press releases, which may contain\nmaterial information about us, and\
    \ you may subscribe to be notified of new information posted to this site.\nAbout\
    \ Amazon\nAmazon is guided by four principles: customer obsession rather than\
    \ competitor focus, passion for invention, commitment to\noperational excellence,\
    \ and long-term thinking. Amazon strives to be Earth’s Most Customer-Centric Company,\
    \ Earth’s Best\nEmployer, and Earth’s Safest Place to Work. Customer reviews,\
    \ 1-Click shopping, personalized recommendations, Prime,\nFulfillment by Amazon,\
    \ AWS, Kindle Direct Publishing, Kindle, Career Choice, Fire tablets, Fire TV,\
    \ Amazon Echo, Alexa,\nJust Walk Out technology, Amazon Studios, and The Climate\
    \ Pledge are some of the things pioneered by Amazon. For more\ninformation, visit\
    \ amazon.com/about and follow @AmazonNews."
